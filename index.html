function cellKey(cx, cy) { return cx + ',' + cy; }
function roomBlocks(room = state.room) {
    if (!worldBlocks[room]) worldBlocks[room] = makeWorldBlocks(room);
    return worldBlocks[room];
}
function blockAtCell(cx, cy) { return roomBlocks()[cellKey(cx, cy)]; }
function blockAtCellIn(room, x, y) { return roomBlocks(room)[cellKey(Math.floor(x / CELL), Math.floor(y / CELL))]; }
function solidAt(x, y) { return !!blockAtCell(Math.floor(x / CELL), Math.floor(y / CELL)); }

// Your body touches a block? (feet-and-body box, a bit smaller than you look)
function playerHitsBlock(px, py) {
    for (const [ox, oy] of [[-8, -6], [8, -6], [-8, 16], [8, 16], [0, 5]]) if (solidAt(px + ox, py + oy)) return true;
    return false;
}

// The starting blocks in each room: trees in Paradise, ores in Hell and the Underground
function makeWorldBlocks(room) {
    const b = {};
    const put = (cx, cy, type) => { b[cellKey(cx, cy)] = { type, hits: 0 }; };
    const R = Math.random;
    const clear = (x, y) => (PORTALS[room] || []).every(p => Math.hypot(p.x - x, p.y - y) > PORTAL_R + 30)
        && Math.hypot(x - 100, y - 300) > 70 && Math.hypot(x - 400, y - 300) > 70;
    if (room === 'paradise') {
        for (const [tx, ty] of [[13, 15], [29, 16]]) {   // block trees: a log with leaves all around
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) put(tx + dx, ty + dy, dx || dy ? 'leaves' : 'log');
            put(tx, ty + 2, 'log');                      // the trunk you can reach
        }
        put(22, 19, 'stone'); put(23, 19, 'stone'); put(22, 20, 'stone');
    } else if (room === 'hell') {
        let n = 0;
        while (n < 26) {
            const cx = Math.floor(R() * 33), cy = 3 + Math.floor(R() * 22), x = cx * CELL + 12, y = cy * CELL + 12;
            if (!clear(x, y) || inAnyCave(x, y, 10) || b[cellKey(cx, cy)]) continue;
            put(cx, cy, n < 4 ? 'goldOre' : 'netherrack'); n++;
        }
    } else if (room === 'underground') {
        let n = 0;
        while (n < 44) {
            const cx = Math.floor(R() * 33), cy = 3 + Math.floor(R() * 22), x = cx * CELL + 12, y = cy * CELL + 12;
            if (!clear(x, y) || b[cellKey(cx, cy)] || Math.abs(x - 640) < 70) continue;   // leave the dragon room open
            if ([[180, 130], [620, 140], [560, 470]].some(([gx, gy]) => Math.hypot(gx - x, gy - y) < 44)) continue;   // not on the gems
            put(cx, cy, n < 8 ? 'ironOre' : n < 12 ? 'diamondOre' : 'stone'); n++;
        }
    }
    return b;
}

function isCreative() { return state.room === ROOM.HEAVEN; }   // unlimited blocks in Heaven!
function invCount(type) { return state.inv[type] || 0; }

// Is it OK to put a block here? (not on you, portals, people, doors, chests or dig spots)
function canPlaceAt(cx, cy) {
    const x = cx * CELL + CELL / 2, y = cy * CELL + CELL / 2;
    if (x < 0 || x > 800 || y < 56 || y > 600) return false;
    if (sceneryAt(x, y)) return false;
    if (Math.abs(x - player.x) < CELL / 2 + 8 && y + CELL / 2 > player.y - 6 && y - CELL / 2 < player.y + 16) return false;   // not on top of you
    for (const p of PORTALS[state.room] || []) if (Math.hypot(p.x - x, p.y - y) < PORTAL_R + 16) return false;
    if (goldenPortal && Math.hypot(goldenPortal.x - x, goldenPortal.y - y) < PORTAL_R + 16) return false;
    if (state.room === ROOM.PARADISE) {
        for (const n of townNpcs()) if (Math.hypot(n.x - x, n.y - y) < 28) return false;
        for (const c of paradise.chests) if (Math.hypot(c.x - x, c.y - y) < 30) return false;
        if (Math.hypot(CRAFTING_TABLE.x - x, CRAFTING_TABLE.y - y) < 30) return false;
    }
    if (state.room === ROOM.HELL) for (const d of hell.digSpots) if (Math.hypot(d.x - x, d.y - y) < 30) return false;
    if (state.room === ROOM.HEAVEN && Math.hypot(WISH_ANGEL.x - x, WISH_ANGEL.y - y) < 34) return false;
    return true;
}

// The block you're aiming at: one step in front of you
function buildTargetCell() {
    return { cx: Math.floor((player.x + state.faceX * 30) / CELL), cy: Math.floor((player.y + 5 + state.faceY * 30) / CELL) };
}

// Hit the block there (mine it), or place your block if it's empty
function buildAt(cx, cy, aimX, aimY) {
    const blocks = roomBlocks(), key = cellKey(cx, cy), b = blocks[key];
    const x = cx * CELL + CELL / 2, y = cy * CELL + CELL / 2;
    state.digAnim = 14;
    if (!b && mineScenery(aimX !== undefined ? aimX : x, aimY !== undefined ? aimY : y)) return;   // chop trees, mine rocks
    if (b) {
        b.hits++;
        const need = state.diamondPickaxe || isCreative() ? 1 : BLOCKS[b.type].hits;
        spawnParticles(x, y, blockColor(b.type), 4);
        sfx('dig');
        if (b.hits < need) return;
        delete blocks[key];
        worldDirty = true;
        const drop = BLOCKS[b.type].drop;
        if (!isCreative() && drop) {
            state.inv[drop] = invCount(drop) + 1;
            spawnFloatText(x, y - 10, `+1 ${drop === 'iron' || drop === 'diamond' ? MATERIALS[drop] : BLOCKS[drop].name}`, '#FFFFFF', 50);
            if (drop === 'diamond') { sfx('found'); giveAward('diamond'); }
        }
        if (b.type === 'leaves' && Math.random() < 0.2 && state.playerHp < fullHearts()) {   // an apple fell out!
            state.playerHp++;
            spawnFloatText(x, y - 24, '🍎 +1 ❤', '#FF6666', 60);
        }
        litTnt = litTnt.filter(t => !(t.room === state.room && t.cx === cx && t.cy === cy));
        return;
    }
    const type = HOTBAR[state.hotbar];
    if (!canPlaceAt(cx, cy)) { spawnFloatText(x, y, '✖', '#FF8888', 30); return; }
    if (!isCreative()) {
        if (invCount(type) <= 0) { showToast(`You don't have any ${BLOCKS[type].name} — mine or craft some!`, '#FF9988', 120); return; }
        state.inv[type]--;
    }
    blocks[key] = { type, hits: 0 };
    worldDirty = true;
    sfx('place');
    if (type === 'tnt') { litTnt.push({ room: state.room, cx, cy, t: TNT_FUSE }); sfx('hiss'); }
    giveAward('builder');
}

// ── SCENERY you can mine: the big trees, boulders and rocks ──
const TREE_SPOTS    = [[30, 205, 26], [775, 330, 28], [520, 272, 18], [280, 300, 18], [760, 440, 26], [30, 395, 22], [260, 90, 18], [540, 95, 18]];
const TREE_REGROW_MS = 60000;   // chopped trees grow back after a minute
let scenery = {
    paradise: TREE_SPOTS.map(([x, y, r]) => ({ kind: 'tree', x, y, r, hits: 0, gone: 0, shake: 0 })),
    hell: [], underground: [],
};

function makeRocks(n, kind, avoid) {
    const list = [];
    let tries = 0;
    while (list.length < n && tries++ < 500) {
        const x = 60 + Math.random() * 680, y = 90 + Math.random() * 460, r = 12 + Math.random() * 12;
        if (avoid(x, y)) continue;
        list.push({ kind, x, y, r, hits: 0, gone: 0, shake: 0 });
    }
    return list;
}

function sceneryAt(px, py) {
    return (scenery[state.room] || []).find(o => !o.gone && Math.hypot(o.x - px, (o.kind === 'tree' ? o.y - o.r * 0.2 : o.y) - py) < o.r + 12);
}

// Chop a tree / mine a rock. Returns true if there was something there.
function mineScenery(px, py) {
    const o = sceneryAt(px, py);
    if (!o) return false;
    const need = state.diamondPickaxe || isCreative() ? 1 : o.kind === 'tree' ? 5 : 4;
    o.hits++; o.shake = 10;
    spawnParticles(o.x, o.y - (o.kind === 'tree' ? o.r * 0.4 : 0), o.kind === 'tree' ? '#4CAF50' : '#777', 5);
    sfx('dig');
    if (o.hits < need) return true;
    o.hits = 0;
    o.gone = Date.now();
    const give = (k, n) => { state.inv[k] = invCount(k) + n; };
    let text;
    if (o.kind === 'tree') {
        give('log', 3); give('leaves', 2);
        text = '🪵 +3 Wood Log  🍃 +2 Leaves';
        if (Math.random() < 0.3 && state.playerHp < fullHearts()) { state.playerHp++; text += '  🍎 +1 ❤'; }
        sfx('whoosh');
    } else {
        give('stone', 2);
        text = '🪨 +2 Stone';
        if (o.kind === 'lavaRock' && Math.random() < 0.3) { give('gold', 1); text += '  ✨ +1 Gold Block'; }
        if (o.kind === 'boulder' && Math.random() < 0.25) { give('iron', 1); text += '  ⛓ +1 Iron'; }
    }
    spawnFloatText(o.x, o.y - o.r - 10, text, '#FFFFFF', 80);
    spawnParticles(o.x, o.y, o.kind === 'tree' ? '#7A5230' : '#888', 14);
    return true;
}

function updateScenery() {
    for (const o of scenery.paradise) {
        if (o.shake > 0) o.shake--;
        if (o.gone && Date.now() - o.gone > TREE_REGROW_MS) { o.gone = 0; o.hits = 0; }   // it grew back!
    }
    for (const o of [...scenery.hell, ...scenery.underground]) if (o.shake > 0) o.shake--;
}

function drawTree(o) {
    const { x, y, r } = o;
    if (o.gone) {   // just a stump (growing back)
        ctx.fillStyle = '#6B4A2A'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.7, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#A07A4A'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y + r * 0.7, 3.5, 2, 0, 0, Math.PI * 2); ctx.stroke();
        const grow = Math.min(1, (Date.now() - o.gone) / TREE_REGROW_MS);
        if (grow > 0.3) { ctx.fillStyle = '#4CAF50'; ctx.beginPath(); ctx.arc(x, y + r * 0.55, 3 + grow * 5, 0, Math.PI * 2); ctx.fill(); }   // little sapling
        return;
    }
    const wob = o.shake > 0 ? Math.sin(o.shake * 2) * 3 : 0;
    drawGroundShadow(x + 8, y + r * 0.9, r * 0.9, r * 0.35, 0.25);
    ctx.fillStyle = '#5A3A1E'; ctx.fillRect(x - 4, y, 8, r * 0.8);
    for (const [ox, oy, rr] of [[-r * 0.45, -r * 0.1, r * 0.7], [r * 0.45, -r * 0.1, r * 0.7], [0, -r * 0.55, r * 0.75]]) {
        const gr = ctx.createRadialGradient(x + ox + wob - rr * 0.3, y + oy - rr * 0.3, rr * 0.1, x + ox + wob, y + oy, rr);
        gr.addColorStop(0, '#6FCB55'); gr.addColorStop(1, '#1F5E1C');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x + ox + wob, y + oy, rr, 0, Math.PI * 2); ctx.fill();
    }
    if (o.hits > 0) { ctx.strokeStyle = 'rgba(40,20,10,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 4, y + r * 0.4); ctx.lineTo(x + o.hits, y + r * 0.35); ctx.stroke(); }   // axe notch
}

function drawRock(o) {
    if (o.gone) return;
    const wob = o.shake > 0 ? Math.sin(o.shake * 2) * 2 : 0, x = o.x + wob, { y, r } = o;
    drawGroundShadow(x + 4, y + r * 0.6, r, r * 0.3, 0.3);
    const st = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, 2, x, y, r);
    if (o.kind === 'lavaRock') { st.addColorStop(0, '#5A4A48'); st.addColorStop(1, '#1A0E0C'); }
    else                       { st.addColorStop(0, '#7A6656'); st.addColorStop(1, '#2A1C12'); }
    ctx.fillStyle = st; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    if (o.kind === 'lavaRock') {   // glowing cracks
        ctx.strokeStyle = 'rgba(255,110,20,0.85)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x - r * 0.5, y); ctx.lineTo(x - r * 0.1, y - r * 0.2); ctx.lineTo(x + r * 0.3, y + r * 0.1); ctx.stroke();
    }
    if (o.hits > 0) {
        ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x - r * 0.3, y - r * 0.4); ctx.lineTo(x, y); ctx.lineTo(x - r * 0.1, y + r * 0.4); ctx.stroke();
    }
}

function drawScenery() {
    for (const o of scenery[state.room] || []) (o.kind === 'tree' ? drawTree : drawRock)(o);
}

// TNT and creepers blow up nearby blocks
function blastBlocks(x, y, radius) {
    const blocks = roomBlocks(), ccx = Math.floor(x / CELL), ccy = Math.floor(y / CELL);
    for (let dx = -radius; dx <= radius; dx++) for (let dy = -radius; dy <= radius; dy++) {
        if (dx * dx + dy * dy > radius * radius) continue;
        const k = cellKey(ccx + dx, ccy + dy), b = blocks[k];
        if (!b) continue;
        if (b.type === 'tnt' && !litTnt.some(t => t.cx === ccx + dx && t.cy === ccy + dy)) {
            litTnt.push({ room: state.room, cx: ccx + dx, cy: ccy + dy, t: 12 });   // chain reaction!
            continue;
        }
        if (b.type !== 'tnt') delete blocks[k];
    }
    worldDirty = true;
}

function updateBlocks() {
    for (let i = litTnt.length - 1; i >= 0; i--) {
        const t = litTnt[i];
        if (t.room !== state.room) continue;
        if (--t.t > 0) continue;
        litTnt.splice(i, 1);
        const blocks = roomBlocks();
        delete blocks[cellKey(t.cx, t.cy)];
        const x = t.cx * CELL + CELL / 2, y = t.cy * CELL + CELL / 2;
        blastBlocks(x, y, 2);
        for (const e of targetableEnemies()) if (Math.hypot(e.x - x, e.y - y) < 85) damageEnemy(e, POWER.NONE, false, 2);
        for (let k = 0; k < 3; k++) spawnParticles(x, y, ['#FFEE66', '#FF7700', '#555555'][k], 18);
        triggerShake(20);
        sfx('boom');
    }
}

// ── Block pictures (tiny pixel-art, made once and reused) ──
const blockArt = {};
function blockColor(type) {
    return { grass: '#5DA84A', dirt: '#8A5A34', stone: '#8A8A8A', log: '#7A5230', leaves: '#3F8F2F', planks: '#B88A50', brick: '#A0442E',
             glass: '#BFE8FF', gold: '#F2C82E', cloud: '#FFFFFF', tnt: '#D23A2A', netherrack: '#7A2A26', ironOre: '#8A8A8A',
             goldOre: '#7A2A26', diamondOre: '#8A8A8A' }[type];
}
function blockCanvas(type) {
    if (blockArt[type]) return blockArt[type];
    const c = document.createElement('canvas');
    c.width = CELL; c.height = CELL;
    const g = c.getContext('2d');
    const R = seededRandom(type.length * 131 + type.charCodeAt(0));
    const px = 3;   // chunky Minecraft pixels
    const shade = (hex, amt) => {
        const n = parseInt(hex.slice(1), 16);
        const f = v => Math.max(0, Math.min(255, Math.round(v + amt)));
        return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
    };
    const base = blockColor(type);
    for (let yy = 0; yy < CELL; yy += px) for (let xx = 0; xx < CELL; xx += px) {
        g.fillStyle = shade(base, (R() - 0.5) * 40);
        g.fillRect(xx, yy, px, px);
    }
    const spots = (col, n) => { for (let i = 0; i < n; i++) { g.fillStyle = col; g.fillRect(Math.floor(R() * 7) * px, Math.floor(R() * 7) * px, px * 2, px); } };
    if (type === 'grass') { g.fillStyle = '#4A8F3A'; for (let i = 0; i < 10; i++) g.fillRect(Math.floor(R() * 8) * px, Math.floor(R() * 8) * px, px, px * 2); }
    if (type === 'log')   { g.fillStyle = '#5A3A1E'; for (let xx = 2; xx < CELL; xx += 6) g.fillRect(xx, 0, 2, CELL); g.fillStyle = '#C8A070'; g.fillRect(8, 8, 8, 8); g.fillStyle = '#9A7040'; g.fillRect(10, 10, 4, 4); }
    if (type === 'planks'){ g.fillStyle = '#8A6030'; for (let yy = 5; yy < CELL; yy += 6) g.fillRect(0, yy, CELL, 1); g.fillRect(11, 0, 1, 6); g.fillRect(4, 6, 1, 6); g.fillRect(16, 12, 1, 6); }
    if (type === 'brick') { g.fillStyle = '#D8D0C0'; for (let yy = 5; yy < CELL; yy += 6) g.fillRect(0, yy, CELL, 1); for (let yy = 0; yy < CELL; yy += 6) for (let xx = (yy / 6) % 2 ? 6 : 0; xx < CELL; xx += 12) g.fillRect(xx, yy, 1, 6); }
    if (type === 'glass') { g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(0, 0, CELL, 2); g.fillRect(0, 0, 2, CELL); g.fillRect(5, 5, 2, 7); g.fillRect(8, 5, 2, 3); }
    if (type === 'gold')  { g.fillStyle = '#FFF0A0'; g.fillRect(3, 3, 6, 3); g.fillStyle = '#C89A10'; g.fillRect(0, CELL - 3, CELL, 3); }
    if (type === 'cloud') { g.fillStyle = '#E8F4FF'; g.fillRect(0, CELL - 4, CELL, 4); }
    if (type === 'leaves'){ g.fillStyle = 'rgba(0,40,0,0.5)'; for (let i = 0; i < 8; i++) g.fillRect(Math.floor(R() * 8) * px, Math.floor(R() * 8) * px, px, px); }
    if (type === 'tnt')   { g.fillStyle = '#F2F2F2'; g.fillRect(0, 8, CELL, 8); g.fillStyle = '#222'; g.font = 'bold 8px Arial'; g.textAlign = 'center'; g.fillText('TNT', CELL / 2, 15); }
    if (type === 'ironOre')    spots('#D8B890', 6);
    if (type === 'goldOre')    spots('#FFD84A', 6);
    if (type === 'diamondOre') spots('#5AF0F0', 6);
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; g.strokeRect(0.5, 0.5, CELL - 1, CELL - 1);
    blockArt[type] = c;
    return c;
}

function drawBlocks() {
    const blocks = roomBlocks();
    for (const key in blocks) {
        const [cx, cy] = key.split(',').map(Number), b = blocks[key];
        const x = cx * CELL, y = cy * CELL;
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 3, y + 3, CELL, CELL);   // little shadow
        ctx.drawImage(blockCanvas(b.type), x, y);
        if (b.hits > 0) {   // cracks as you mine it
            ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(x + 4, y + 5); ctx.lineTo(x + 11, y + 12); ctx.lineTo(x + 9, y + 19);
            if (b.hits > 1) { ctx.moveTo(x + 11, y + 12); ctx.lineTo(x + 19, y + 9); }
            if (b.hits > 2) { ctx.moveTo(x + 11, y + 12); ctx.lineTo(x + 18, y + 20); }
            ctx.stroke();
        }
    }
    for (const t of litTnt) {   // lit TNT flashes white
        if (t.room !== state.room || Math.floor(t.t / 6) % 2) continue;
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(t.cx * CELL, t.cy * CELL, CELL, CELL);
    }
    if (state.buildMode && state.gamePhase === 'playing') {   // which block you're aiming at
        const { cx, cy } = buildTargetCell();
        const sc = !blockAtCell(cx, cy) && sceneryAt(player.x + state.faceX * 30, player.y + 5 + state.faceY * 30);
        ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
        if (sc) {   // aiming at a tree or rock
            ctx.strokeStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(sc.x, sc.kind === 'tree' ? sc.y - sc.r * 0.2 : sc.y, sc.r + 6, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#FFF'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
            ctx.fillText(sc.kind === 'tree' ? '🪓 Chop!' : '⛏ Mine!', sc.x, sc.y - sc.r - 14);
        } else {
            ctx.strokeStyle = blockAtCell(cx, cy) ? '#FFFFFF' : canPlaceAt(cx, cy) ? '#FFE066' : '#FF6666';
            ctx.strokeRect(cx * CELL + 1, cy * CELL + 1, CELL - 2, CELL - 2);
        }
        ctx.setLineDash([]);
    }
}

// Minecraft-style hotbar along the bottom while building
function drawHotbar() {
    if (!state.buildMode) return;
    const n = HOTBAR.length, W = 34, x0 = 400 - (n * W) / 2, y0 = 548;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(x0 - 6, y0 - 26, n * W + 12, W + 32);
    ctx.fillStyle = '#FFE066'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    const verb = lastInput === 'pad' ? 'A' : lastInput === 'touch' ? 'Tap BUILD' : 'SPACE / click';
    const cyc  = lastInput === 'pad' ? 'B' : lastInput === 'touch' ? '🔄' : 'Q or 1-9';
    ctx.fillText(`🧱 BUILD MODE${isCreative() ? ' — ∞ UNLIMITED BLOCKS!' : ''}   ${verb}: place / mine / chop trees   ${cyc}: pick block`, 400, y0 - 12);
    HOTBAR.forEach((type, i) => {
        const x = x0 + i * W, count = invCount(type);
        ctx.fillStyle = i === state.hotbar ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(x, y0, W - 2, W - 2);
        ctx.globalAlpha = isCreative() || count > 0 ? 1 : 0.3;
        ctx.drawImage(blockCanvas(type), x + 4, y0 + 4, W - 10, W - 10);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = i === state.hotbar ? '#FFFFFF' : '#555'; ctx.lineWidth = i === state.hotbar ? 2.5 : 1;
        ctx.strokeRect(x, y0, W - 2, W - 2);
        ctx.fillStyle = '#FFF'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'right';
        ctx.fillText(isCreative() ? '∞' : String(count), x + W - 5, y0 + W - 5);
    });
    const mats = Object.keys(MATERIALS).filter(m => invCount(m) > 0).map(m => `${MATERIALS[m]} ${invCount(m)}`).join('   ');
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '10px Arial';
    ctx.fillText(`${BLOCKS[HOTBAR[state.hotbar]].name}${mats ? '   ·   ' + mats : ''}${state.diamondPickaxe ? '   ·   ⛏ Diamond Pickaxe' : ''}`, 400, y0 + W + 6);
    ctx.restore();
}

function toggleBuild() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return;
    state.buildMode = !state.buildMode;
    showToast(state.buildMode ? '🧱 Build mode ON — mine and place blocks!' : '⚔ Build mode OFF — back to fighting!', '#FFE066', 110);
}
function nextBlock(step = 1) { state.hotbar = (state.hotbar + step + HOTBAR.length) % HOTBAR.length; }

// ── HELPERS ───────────────────────────────────────────────────
// Your most hearts: the level's hearts plus any armor you've crafted
function fullHearts() { return LEVEL_CONFIGS[state.level - 1].playerMaxHp + (state.armor || 0); }

function triggerShake(amount = 12) { state.screenShake = amount; }

function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        particles.push({
            x, y,
            dx: Math.cos(a) * (2 + Math.random() * 3),
            dy: Math.sin(a) * (2 + Math.random() * 3),
            life: 35, maxLife: 35,
            color, r: 4 + Math.random() * 4,
        });
    }
}

function spawnFloatText(x, y, text, color, life = 45) {
    floatTexts.push({ x, y, text, color, life });
}

function spawnConfettiAt(x, y) {
    const colors = ['#FF4444', '#FFFF00', '#44FF44', '#4488FF', '#FF44CC'];
    for (let i = 0; i < 30; i++) {
        particles.push({ x, y, dx: (Math.random() - 0.5) * 8, dy: -Math.random() * 7, life: 70, maxLife: 70,
            color: colors[i % colors.length], r: 0, confetti: true, rotation: Math.random() * 6,
            rotSpeed: (Math.random() - 0.5) * 0.2, cw: 6, ch: 4 });
    }
}

function spawnConfetti() {
    const colors = ['#FF4444','#FF8800','#FFFF00','#44FF44','#4488FF','#CC44FF','#FF44CC','#FFFFFF','#FF88AA'];
    for (let i = 0; i < 130; i++) {
        const a   = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 9;
        particles.push({
            x: 400, y: 300,
            dx: Math.cos(a) * spd,
            dy: Math.sin(a) * spd - 2,
            life: 90 + Math.random() * 70, maxLife: 160,
            color: colors[Math.floor(Math.random() * colors.length)],
            r: 0,
            confetti: true,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.18,
            cw: 7 + Math.random() * 6,
            ch: 4 + Math.random() * 4,
        });
    }
}

function isPlayerInCave() {
    if (state.room !== ROOM.HELL) return false;
    if (state.caveProtectionExpired) return false;
    return HELL_CAVES.some(c =>
        player.x >= c.x && player.x <= c.x + c.w &&
        player.y >= c.y && player.y <= c.y + c.h
    );
}

function isPlayerPhysicallyInCave() {
    if (state.room !== ROOM.HELL) return false;
    return HELL_CAVES.some(c =>
        player.x >= c.x && player.x <= c.x + c.w &&
        player.y >= c.y && player.y <= c.y + c.h
    );
}

function allMonstersDefeated() {
    return paradise.enemies.every(e => !e.alive);
}

function getPlayerColor() {
    if (state.playerFlash > 0) return '#FFFF00';
    if (state.power === POWER.RAINBOW)   return `hsl(${(Date.now() / 5) % 360}, 100%, 60%)`;
    if (state.power !== POWER.NONE)      return WEAPON_INFO[state.power].color;
    return AVATAR_COLORS[state.activeSkin];
}

function damagePlayer() {
    if (state.playerInvincible > 0) return;
    if (state.bubble) {
        // Shield Bubble pops instead of losing a heart
        state.bubble = false;
        state.playerInvincible = 60;
        spawnParticles(player.x, player.y, '#AEE8FF', 12);
        spawnFloatText(player.x, player.y - 30, 'POP!', '#AEE8FF');
        sfx('pop');
        return;
    }
    sfx('hurt');
    state.playerHp--;
    state.playerInvincible = state.lessons.shield ? 150 : 90;
    triggerShake(14);
    spawnParticles(player.x, player.y, '#FF4444', 8);
    if (state.playerHp <= 0) respawnPlayer();
}

function respawnPlayer() {
    const maxHp = fullHearts();
    state.power           = POWER.NONE;
    state.powerTier       = 1;
    state.playerHp        = maxHp;
    state.playerInvincible = 120;
    changeRoom(ROOM.VOID);
}

function resetGame() {
    const cfg = LEVEL_CONFIGS[0];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'intro', playerHp: cfg.playerMaxHp, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        level: 1,
        ammo: cfg.ammoMax, ammoMax: cfg.ammoMax, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        coins: 0, shopOpen: false,
        unlockedSkins: [true, ...Array(AVATAR_COLORS.length - 1).fill(false)], activeSkin: 0,
        bubble: false, score: 0, newBest: false,
        job: null, housesOwned: {}, ammoBonus: 0,
        ownedPets: PETS.map(() => false), activePet: -1,
        ownedGadgets: {}, gadget: null, gadgetCooldown: 0, hasDash: false, dashTimer: 0, dashCooldown: 0, weaponLevel: 1,
        buildMode: false, hotbar: 0, inv: {}, armor: 0, diamondPickaxe: false,
        furniture: { bed: true }, garden: [0, 0, 0, 0], lessons: {}, hats: {}, hat: null, houseFrom: null,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

function advanceLevel() {
    if (state.level >= MAX_LEVELS) {
        giveAward('hero');
        clearSave();
        // True final win — game complete
        state.won = true;
        state.levelComplete = false;
        if (!state.confettiSpawned) { state.confettiSpawned = true; spawnConfetti(); }
        return;
    }
    state.level++;
    const cfg = LEVEL_CONFIGS[state.level - 1];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'playing', playerHp: cfg.playerMaxHp + state.armor, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        ammo: cfg.ammoMax + state.ammoBonus, ammoMax: cfg.ammoMax + state.ammoBonus, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        shopOpen: false, job: null,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

// ── ROOM CHANGE ───────────────────────────────────────────────
// A random spot on the map, not too close to the player
function randomSpawnSpot(minDist = 150) {
    for (let tries = 0; tries < 50; tries++) {
        const x = 80 + Math.random() * 640, y = 100 + Math.random() * 420;
        if (Math.hypot(x - player.x, y - player.y) >= minDist) return { x, y };
    }
    return { x: 80, y: 100 };
}

function respawnParadiseWave() {
    const night = state.paradiseClearCount + 1;
    paradise.enemies = paradise.enemies.filter(e => !e.temp);   // King Slime's little slimes
    for (const e of paradise.enemies) {
        // Monsters climb out of the ground in random places
        // (bosses and the robot army keep their places — robots march in a line)
        const spot = e.type === 'king' || e.type === 'ghostking' || e.march ? { x: e.home.x, y: e.home.y } : randomSpawnSpot();
        const alive = (e.minNight || 1) <= night && (!e.onlyNight || e.onlyNight === night);
        Object.assign(e, { alive, hp: e.maxHp, hitFlash: 0, hopTimer: 0, frozen: 0, hidden: false, phase: 0,
                           x: spot.x, y: spot.y, dx: e.home.dx, dy: e.home.dy, emerge: 30 + Math.random() * 60 });
    }
}

// Daytime surprise: a few monsters pop out of the ground somewhere
function spawnAmbush() {
    const n = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
        const type = AMBUSH_TYPES[Math.floor(Math.random() * AMBUSH_TYPES.length)];
        const spot = randomSpawnSpot(180);
        const e = makeEnemy(type, spot.x, spot.y, (Math.random() - 0.5) * 2.4, (Math.random() - 0.5) * 2.4);
        e.emerge = 45 + i * 15;
        paradise.ambushers.push(e);
    }
    showToast('⚠ Monsters popped up out of the ground!', '#FF8866');
    sfx('worm');
}

function changeRoom(dest) {
    if (state.gamePhase === 'playing') sfx('portal');
    state.room = dest;
    state.shopOpen = false;   // close shop when changing rooms
    state.awardsOpen = false;
    menu = null;
    gadgetObjs = [];
    if (dest === ROOM.UNDERGROUND) {   // a fresh cave every time
        worldBlocks.underground = makeWorldBlocks('underground');
        scenery.underground = makeRocks(14, 'boulder', (x, y) => Math.hypot(x - 100, y - 300) < 80 || Math.abs(x - 640) < 70
            || !!blockAtCellIn('underground', x, y));
    }
    if (dest === ROOM.HELL) {
        scenery.hell = makeRocks(8, 'lavaRock', (x, y) => inAnyCave(x, y, 20) || Math.hypot(x - 100, y - 300) < 80
            || (PORTALS.hell).some(p => Math.hypot(p.x - x, p.y - y) < PORTAL_R + 30) || !!blockAtCellIn('hell', x, y));
    }
    if (dest === ROOM.SECRET)      worldBlocks.secret = {};
    if (worldDirty) saveWorld();
    projectiles      = [];
    enemyProjectiles = [];
    heartPickups     = [];
    bolts            = [];
    if (dest === ROOM.VOID)     { player.x = 400; player.y = 300; }
    if (dest === ROOM.HELL)     {
        player.x = 100; player.y = 300;
        // Weapons are buried again (in new places) each visit
        hell.digSpots = makeDigSpots();
        hell.foundMsg = null;
        hell.enemies  = makeWorms();
        if (Math.random() < SHADOW_CHANCE) {
            hell.enemies.push({ type: 'shadow', x: 700, y: 300, r: 15, hp: 6, maxHp: 6, alive: true, hitFlash: 0, frozen: 0,
                                coinDrop: 8, emerge: 60, dx: 0, dy: 0 });
        }
        hell.summonTimer = IMP_SUMMON_FRAMES;
    }
    if (dest === ROOM.PARADISE) {
        player.x = 400; player.y = 290;   // the town square
        paradise.fishing.stage = 'idle';
    }
    if (dest === ROOM.SECRET)      { player.x = 400; player.y = 420; secretRoom = makeSecretRoom(); giveAward('secret'); }
    if (dest === ROOM.UNDERGROUND) { player.x = 100; player.y = 300; underground = makeUnderground(); giveAward('underground'); }
    if (dest === ROOM.HEAVEN)      { player.x = 400; player.y = 330; heaven = makeHeaven(); giveAward('heaven'); }
    if (dest === ROOM.HOUSE)       { player.x = HOUSE_DOOR.x; player.y = 520; }
    if (state.gamePhase === 'playing') saveGame();
    goldenPortal = MAIN_ROOMS.includes(dest) && Math.random() < SECRET_PORTAL_CHANCE
        ? { ...GOLDEN_PORTAL_SPOTS[dest] } : null;
    placePetBesidePlayer();
}

// ── UPDATE: PLAYER ────────────────────────────────────────────
function updatePlayer() {
    if (state.won || state.levelComplete || state.gamePhase !== 'playing') return;

    const spd = (state.room === ROOM.PARADISE ? BASE_SPEED * 1.2 : BASE_SPEED) * (state.lessons.running ? 1.2 : 1);
    let dx = 0, dy = 0;
    if (!state.shopOpen && !state.awardsOpen && !menu) {
        if (keys['ArrowLeft']  || keys['KeyA']) dx -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
        if (keys['ArrowUp']    || keys['KeyW']) dy -= 1;
        if (keys['ArrowDown']  || keys['KeyS']) dy += 1;
        // Virtual joystick
        const deadzone = VJOY.maxDist * JOYSTICK_DEADZONE_RATIO;
        if (vTouch.joyDX < -deadzone) dx -= 1;
        if (vTouch.joyDX >  deadzone) dx += 1;
        if (vTouch.joyDY < -deadzone) dy -= 1;
        if (vTouch.joyDY >  deadzone) dy += 1;
        // Controller stick (analog — push a little to walk slowly)
        dx += padMove.x; dy += padMove.y;
    }
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }   // diagonals aren't faster
    if (len > 0.2) { const l = Math.hypot(dx, dy); state.faceX = dx / l; state.faceY = dy / l; state.walkPhase += 0.32; }   // remember which way you're going
    dx *= spd; dy *= spd;
    if (state.dashTimer > 0) {   // ZOOM!
        state.dashTimer--;
        dx = state.faceX * 15; dy = state.faceY * 15;
        particles.push({ x: player.x, y: player.y, dx: 0, dy: 0, life: 12, maxLife: 12, color: 'rgba(255,255,255,0.6)', r: 12 });
    }

    // Move, but blocks are solid (try each direction separately so you slide along walls)
    const nx = Math.max(18, Math.min(canvas.width  - 18, player.x + dx));
    const ny = Math.max(52, Math.min(canvas.height - 18, player.y + dy));
    if (!playerHitsBlock(nx, player.y)) player.x = nx;
    if (!playerHitsBlock(player.x, ny)) player.y = ny;

    for (const p of PORTALS[state.room]) {
        if (Math.hypot(player.x - p.x, player.y - p.y) < PORTAL_R * 0.75) {
            changeRoom(randomDoorDestination());
            return;
        }
    }
    // Out through your front door, back to the house you came in by
    if (state.room === ROOM.HOUSE && player.y > 560 && Math.abs(player.x - HOUSE_DOOR.x) < 24) {
        const door = houseDoors().find(d => d.id === state.houseFrom) || houseDoors()[0];
        changeRoom(ROOM.PARADISE);
        player.x = door.x; player.y = door.y + 22;
        return;
    }
    if (goldenPortal && Math.hypot(player.x - goldenPortal.x, player.y - goldenPortal.y) < PORTAL_R * 0.75) {
        sfx('win');
        changeRoom(ROOM.SECRET);
        return;
    }
    // A dig spot dug to the bottom becomes a tunnel (step off it first, then jump in)
    if (state.room === ROOM.HELL) {
        for (const s of hell.digSpots) {
            if (s.depth < DIG_MAX_DEPTH || !s.tunnel) continue;
            const d = Math.hypot(player.x - s.x, player.y - s.y);
            if (d > 30) s.tunnelReady = true;
            else if (s.tunnelReady && d < 14) { changeRoom(ROOM.UNDERGROUND); return; }
        }
    }

    if (state.playerFlash     > 0) state.playerFlash--;
    if (state.playerInvincible > 0) state.playerInvincible--;
    if (state.digAnim > 0) state.digAnim--;

    // ── CAVE TIMER ─────────────────────────────────────────────
    if (isPlayerPhysicallyInCave()) {
        state.caveTimer++;
        if (state.caveTimer >= CAVE_MAX_FRAMES) {
            state.caveProtectionExpired = true;
        }
    } else {
        // Reset when player leaves the cave
        if (state.caveTimer > 0) {
            state.caveTimer = 0;
            state.caveProtectionExpired = false;
        }
    }

    // Brimstone spark trail
    if (state.power === POWER.BRIMSTONE && Math.random() < 0.5) {
        particles.push({
            x: player.x + (Math.random() - 0.5) * 14,
            y: player.y + (Math.random() - 0.5) * 14,
            dx: (Math.random() - 0.5) * 1.5,
            dy: (Math.random() - 0.5) * 1.5,
            life: 14, maxLife: 14,
            color: Math.random() < 0.5 ? '#FF4422' : '#FF8800',
            r: 2 + Math.random() * 2,
        });
    }
}

// ── UPDATE: ENEMIES ───────────────────────────────────────────
function weaponDamage(power, enemyType) {
    if (power === POWER.RAINBOW || ENEMY_TYPES[enemyType].weakTo === power) return DAMAGE_STRONG;
    return DAMAGE_WEAK;
}

// Your weapon shields you from the bad guys it's strong against (never the Devil)
function isShieldedAgainst(enemyType) {
    if (state.dashTimer > 0) return true;   // dashing through things
    if (state.power === POWER.NONE || !ENEMY_TYPES[enemyType]) return false;
    return weaponDamage(state.power, enemyType) === DAMAGE_STRONG;
}

// Hurts a bad guy; returns true if it was defeated
function hitEnemy(e, power, bonus = 0) {
    const dmg = weaponDamage(power, e.type) + bonus;
    e.hp -= dmg;
    e.hitFlash = 8;
    const strong = dmg >= DAMAGE_STRONG;
    spawnFloatText(e.x, e.y - e.r - 8, strong ? `-${dmg} SUPER HIT!` : `-${dmg}`, strong ? '#FFEE44' : '#FFFFFF');
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, strong ? 10 : 4);
    if (e.hp > 0) { sfx(strong ? 'superHit' : 'hit'); return false; }
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 16);
    triggerShake();
    sfx('defeat');
    addScore(e.type === 'mole' ? 15 : 10);
    return true;
}

// The bad guys in the room you're in
function roomEnemies() {
    if (state.room === ROOM.PARADISE) {
        const P = paradise;
        return P.phase === 'night' && !P.quiet && state.lightCrystals < 3 ? [...P.enemies, ...P.ambushers] : P.ambushers;
    }
    if (state.room === ROOM.HELL)        return hell.enemies;
    if (state.room === ROOM.UNDERGROUND) return underground.enemies;
    return [];
}

// Bad guys you can shoot right now (not defeated, not still climbing out of the ground)
function targetableEnemies() {
    return roomEnemies().filter(e => e.alive && !(e.emerge > 0) && !e.hidden);
}

function roomCoins() {
    if (state.room === ROOM.PARADISE) return paradise.coins;
    if (state.room === ROOM.HELL)        return hell.coins;
    if (state.room === ROOM.UNDERGROUND) return underground.coins;
    return voidRoom.coins;
}

// Reward for beating a bad guy: a coin, and sometimes a heart
function dropLoot(e) {
    const count = e.coinDrop || COINS_PER_KILL;
    for (let i = 0; i < count; i++) {
        roomCoins().push({
            x: Math.max(30, Math.min(770, e.x + (Math.random() - 0.5) * 16 * count)),
            y: Math.max(70, Math.min(570, e.y + (Math.random() - 0.5) * 16 * count)),
            picked: false,
        });
    }
    if (Math.random() < HEART_DROP_CHANCE) heartPickups.push({ x: e.x + 12, y: e.y, life: 600 });
}

// Some mornings it's somebody's birthday!
function maybeBirthday() {
    paradise.birthday = null;
    if (Math.random() > 0.4) return;
    const who = [...WORKERS, ...VILLAGERS][Math.floor(Math.random() * (WORKERS.length + VILLAGERS.length))];
    paradise.birthday = { id: who.id, wished: false };
    setTimeout(() => showToast(`🎂 It's ${who.name}'s BIRTHDAY! Go and say Happy Birthday!`, '#FF88CC', 260), 1500);
}

// Every hit knocks little slimes off the King Slime
function kingSplit(k, count) {
    for (let i = 0; i < count; i++) {
        if (paradise.enemies.filter(e => e.temp && e.alive).length >= KING_MAX_MINIS) return;
        const a = Math.random() * Math.PI * 2;
        const m = makeEnemy('slime', k.x + Math.cos(a) * k.r, k.y + Math.sin(a) * k.r, Math.cos(a) * 4, Math.sin(a) * 4);
        Object.assign(m, { r: 10, hp: 1, maxHp: 1, temp: true, hopTimer: 40, coinDrop: 1 });
        paradise.enemies.push(m);
    }
}

// Hit a bad guy with a weapon: damage, freeze (ICE), chain (LIGHTNING), loot when defeated
function damageEnemy(e, power, chained = false, bonus = 0) {
    // Pick the lightning jump targets before anything dies
    const jumps = power === POWER.LIGHTNING && !chained
        ? targetableEnemies()
            .filter(o => o !== e && Math.hypot(o.x - e.x, o.y - e.y) < CHAIN_RANGE)
            .sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))
            .slice(0, CHAIN_JUMPS)
        : [];

    if (hitEnemy(e, power, bonus)) {
        e.alive = false;
        dropLoot(e);
        countStat('kills');
        if (e.type === 'king') giveAward('king');
        if (e.type === 'ghostking' || e.type === 'dragon' || e.type === 'shadow') giveAward(e.type);
        if (e.type === 'dragon') showToast('🐉 You beat the CAVE DRAGON!', '#FFD700', 200);
    } else if (power === POWER.ICE && !e.frog) {
        if (!e.frozen) sfx('freeze');
        e.frozen = FREEZE_FRAMES;
    }

    if (e.type === 'king') kingSplit(e, e.alive ? 1 : 3);

    let from = e;
    for (const o of jumps) {
        bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, life: 12 });
        from = o;
        damageEnemy(o, power, true, bonus);
    }
    if (jumps.length) sfx('zap');
}

// The Devil calls in Mini-Devils to help him
function updateDevilMinions() {
    const d = hell.devil;
    if (state.room !== ROOM.HELL || !d.alive || d.frozen > 0) return;
    if (--hell.summonTimer > 0) return;
    hell.summonTimer = IMP_SUMMON_FRAMES;
    const imps = hell.enemies.filter(e => e.type === 'imp' && e.alive).length;
    if (imps >= LEVEL_CONFIGS[state.level - 1].maxImps) return;
    hell.enemies.push({ type: 'imp', x: d.x + (Math.random() - 0.5) * 60, y: d.y + d.r + 10, r: 11, hp: 3, maxHp: 3,
                        alive: true, hitFlash: 0, frozen: 0, emerge: 30, dx: 0, dy: 0 });
    spawnParticles(d.x, d.y + d.r, '#FF2200', 12);
    spawnFloatText(d.x, d.y - d.r - 20, 'COME, MY MINIONS!', '#FF4444', 80);
    if (Date.now() - lastDevilLaugh > 3000) { lastDevilLaugh = Date.now(); sfx('laugh'); }
}

// A creeper explodes: hurts you if you're close and blows up blocks
function creeperBoom(e) {
    e.alive = false;
    for (let k = 0; k < 3; k++) spawnParticles(e.x, e.y, ['#FFFFFF', '#888888', '#4CAF50'][k], 16);
    triggerShake(20);
    sfx('boom');
    blastBlocks(e.x, e.y, 2);
    if (Math.hypot(player.x - e.x, player.y - e.y) < 75) damagePlayer();
}

// Moves every bad guy in the room and hurts the player on touch
function updateRoomEnemies() {
    for (const e of roomEnemies()) {
        if (!e.alive) continue;
        if (e.emerge > 0) {
            e.emerge--;
            if (Math.random() < 0.4) spawnParticles(e.x, e.y + 8, '#6B3E1E', 1);
            continue;
        }
        if (e.hitFlash > 0) e.hitFlash--;
        if (e.frozen > 0) { e.frozen--; continue; }   // frozen solid: can't move or hurt you
        if (e.frog) { moveFrog(e); continue; }   // frogs are harmless
        moveEnemy(e);
        if ((!e.hidden || e.type === 'ghostking') && e.type !== 'creeper' && state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
            Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
            damagePlayer();
        }
    }
    // Defeated bad guys in Hell and the Underground don't come back
    hell.enemies        = hell.enemies.filter(e => e.alive);
    underground.enemies = underground.enemies.filter(e => e.alive);
    paradise.ambushers  = paradise.ambushers.filter(e => e.alive);
}

function moveFrog(e) {
    if (--e.hopTimer <= 0) {
        e.hopTimer = 50 + Math.random() * 40;
        const a = Math.random() * Math.PI * 2;
        e.dx = Math.cos(a) * 3; e.dy = Math.sin(a) * 3;
        if (Math.random() < 0.3) sfx('ribbit');
    }
    e.x = Math.max(40, Math.min(760, e.x + e.dx)); e.y = Math.max(70, Math.min(560, e.y + e.dy));
    e.dx *= 0.9; e.dy *= 0.9;
}

function moveEnemy(e) {
    if (e.type === 'zombie') {   // shuffles slowly toward you… "Uuurgh…"
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 0.75; e.y += Math.sin(a) * 0.75;
        e.walk = (e.walk || 0) + 0.12;
        if (Math.random() < 0.003) sfx('groan');
        return;
    }
    if (e.type === 'creeper') {
        const d = Math.hypot(player.x - e.x, player.y - e.y);
        if (e.fuse > 0) {   // hissing!
            if (d > 110) { e.fuse = 0; return; }   // you got away
            if (--e.fuse <= 0) creeperBoom(e);
            return;
        }
        if (d < 42) { e.fuse = CREEPER_FUSE; sfx('hiss'); return; }
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 1.1; e.y += Math.sin(a) * 1.1;
        e.walk = (e.walk || 0) + 0.2;
        return;
    }
    if (e.type === 'spider') {
        if (e.hidden) {   // waiting on the ceiling…
            if (--e.dropTimer <= 0) { e.hidden = false; e.dropping = true; e.x = Math.max(60, Math.min(740, player.x + (Math.random() - 0.5) * 120)); sfx('whoosh'); }
            return;
        }
        if (e.dropping) { e.y += 5; if (e.y >= e.ty) { e.y = e.ty; e.dropping = false; } return; }
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 1.5 + Math.sin(Date.now() / 90 + e.ty) * 0.6; e.y += Math.sin(a) * 1.5;
        return;
    }
    if (e.type === 'robot') {
        // March, march, march — reach the edge, step down a row, turn around
        e.x += e.dx;
        if (e.x < 60 || e.x > 740) { e.dx *= -1; e.y += 36; if (e.y > 520) e.y = 140; }
        e.walk = (e.walk || 0) + 0.25;
        return;
    }
    if (e.type === 'ghostking') {
        // Floats after you; every few seconds he vanishes and calls in little ghosts
        e.phase++;
        if (!e.hidden && e.phase > 240) {
            e.hidden = true; e.phase = 0;
            for (let i = 0; i < 2; i++) {
                const g = makeEnemy('ghost', e.x + (i ? 40 : -40), e.y, 0, 0);
                Object.assign(g, { temp: true, emerge: 20, coinDrop: 1 });
                paradise.enemies.push(g);
            }
            spawnParticles(e.x, e.y, '#DDAAFF', 16);
            sfx('magic');
        } else if (e.hidden && e.phase > 120) {
            e.hidden = false; e.phase = 0;
            spawnParticles(e.x, e.y, '#DDAAFF', 16);
        }
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 0.7; e.y += Math.sin(a) * 0.7;
        return;
    }
    if (e.type === 'dragon') {
        // Hovers up and down, then breathes a big spray of fire
        e.y += e.dy; if (e.y < 140 || e.y > 460) e.dy *= -1;
        e.breath--;
        if (e.breath === 40) sfx('dragonRoar');
        if (e.breath <= 0) {
            e.breath = 170;
            const a = Math.atan2(player.y - e.y, player.x - (e.x - 30));
            for (let k = -3; k <= 3; k++) {
                enemyProjectiles.push({ x: e.x - 30, y: e.y - 10, dx: Math.cos(a + k * 0.14) * 5, dy: Math.sin(a + k * 0.14) * 5,
                                        color: '#FF6A00', life: 150, r: 8, enemyType: 'dragon' });
            }
            triggerShake(8);
        }
        return;
    }
    if (e.type === 'shadow') {
        // Copies you like a mirror (flipped left ↔ right)
        const tx = 800 - player.x, ty = player.y;
        e.x += (tx - e.x) * 0.12; e.y += (ty - e.y) * 0.12;
        e.walk = state.walkPhase;
        return;
    }
    if (e.type === 'worm') {
        if (--e.wTimer <= 0) {
            if (e.wState === 'under')      { e.wState = 'rising'; e.wTimer = WORM_RISE_FRAMES; }
            else if (e.wState === 'rising') { e.wState = 'up'; e.wTimer = WORM_UP_FRAMES; e.hidden = false; e.spit = 30;
                                              spawnParticles(e.x, e.y, '#FF6600', 12); sfx('worm'); }
            else                            { e.wState = 'under'; e.wTimer = WORM_UNDER_FRAMES; e.hidden = true;
                                              spawnParticles(e.x, e.y, '#6B3E1E', 8); }
        }
        if (e.wState === 'under') {
            // Tunnels toward the player — but never into the caves
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            const nx = e.x + Math.cos(a) * 1.2, ny = e.y + Math.sin(a) * 1.2;
            if (state.room !== ROOM.HELL || !inAnyCave(nx, ny, 20)) { e.x = nx; e.y = ny; }
            if (Math.random() < 0.3) spawnParticles(e.x, e.y + 6, '#6B3E1E', 1);
        } else if (e.wState === 'up' && --e.spit <= 0) {
            e.spit = WORM_SPIT_FRAMES;
            if (!isPlayerInCave()) {
                const a = Math.atan2(player.y - e.y, player.x - e.x);
                enemyProjectiles.push({ x: e.x, y: e.y - 14, dx: Math.cos(a) * 4, dy: Math.sin(a) * 4,
                                        color: '#FF5500', life: 120, r: 6, enemyType: 'worm' });
            }
        }
        return;   // worms don't bounce around
    }
    if (e.type === 'imp') {
        if (isPlayerInCave()) {
            // Can't see you in the cave — flutters about
            e.x += e.dx; e.y += e.dy;
            if (Math.random() < 0.02) { const a = Math.random() * Math.PI * 2; e.dx = Math.cos(a) * 1.2; e.dy = Math.sin(a) * 1.2; }
        } else {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(a) * 1.8; e.y += Math.sin(a) * 1.8;
        }
    } else if (e.type === 'mole') {
        // Chases the player — even inside caves (they live underground!)
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed;
        e.y += Math.sin(a) * e.speed;
    } else if (e.type === 'fire') {
        e.x += e.dx; e.y += e.dy;
    } else if (e.type === 'ghost') {
        // Drifts slowly toward the player
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 0.5 + e.dx * 0.25;
        e.y += Math.sin(a) * 0.5 + e.dy * 0.25;
    } else if (e.type === 'bat') {
        // Fast and flappy — zig-zags up and down
        e.x += e.dx;
        e.y += e.dy + Math.sin(Date.now() / 120 + e.home.x) * 1.8;
    } else if (e.type === 'slime' || e.type === 'king') {
        // Sits still, then hops toward the player (the King is slower and heavier)
        if (--e.hopTimer <= 0) {
            const king = e.type === 'king';
            e.hopTimer = king ? 100 : 70;
            sfx(king ? 'bigBoing' : 'boing');
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.dx = Math.cos(a) * (king ? 3 : 4); e.dy = Math.sin(a) * (king ? 3 : 4);
        }
        e.x += e.dx; e.y += e.dy;
        e.dx *= 0.92; e.dy *= 0.92;
    }
    if (e.x < 60 || e.x > 740) e.dx *= -1;
    if (e.y < 60 || e.y > 540) e.dy *= -1;
    e.x = Math.max(40, Math.min(760, e.x));
    e.y = Math.max(60, Math.min(560, e.y));
}

function updateEnemies() {
    if (state.won || state.levelComplete) return;

    // ── VOID enemies ──────────────────────────────────────────
    if (state.room === ROOM.VOID) {
        for (const e of voidRoom.enemies) {
            e.x += e.dx; e.y += e.dy;
            if (e.x < 60 || e.x > 740) e.dx *= -1;
            if (e.y < 60 || e.y > 540) e.dy *= -1;
            // Contact damage (shielded by matching power)
            if (state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
                Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
                damagePlayer();
            }
            // Shoot at player periodically
            e.shootTimer--;
            if (e.shootTimer <= 0) {
                e.shootTimer = 100 + Math.floor(Math.random() * 60);
                const a = Math.atan2(player.y - e.y, player.x - e.x);
                enemyProjectiles.push({
                    x: e.x, y: e.y,
                    dx: Math.cos(a) * 3.5, dy: Math.sin(a) * 3.5,
                    color: e.type === 'fire' ? '#FF6600' : '#CC88FF',
                    life: 140, r: 6,
                    enemyType: e.type,
                });
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        // After all 3 crystals are collected paradise is peaceful — no more enemies
        if (state.lightCrystals >= 3) return;

        // Show only the current night's chest once all the monsters are beaten
        if (paradise.phase === 'night' && !paradise.quiet && allMonstersDefeated() && state.paradiseClearCount < 3) {
            paradise.chests[state.paradiseClearCount].visible = true;
        }
    }

    if (state.room === ROOM.HELL) {
        const d = hell.devil;
        if (!d.alive) return;
        if (d.shieldFlash > 0) d.shieldFlash--;
        if (d.frozen > 0) { d.frozen--; return; }   // frozen by ICE

        const cfg = LEVEL_CONFIGS[state.level - 1];

        if (d.telegraphTimer > 0) {
            // Frozen while telegraphing
            d.telegraphTimer--;
            if (d.telegraphTimer === 0 && d.isAboutToShoot) {
                // Only fire if the player is still visible (not hiding in a cave)
                if (!isPlayerInCave()) {
                    const a = Math.atan2(player.y - d.y, player.x - d.x);
                    const shotsPerFire = cfg.devilShotsPerFire;
                    const spreadAngle = shotsPerFire > 1 ? 0.25 : 0;
                    for (let s = 0; s < shotsPerFire; s++) {
                        const offset = shotsPerFire > 1 ? (s - (shotsPerFire - 1) / 2) * spreadAngle : 0;
                        enemyProjectiles.push({
                            x: d.x, y: d.y,
                            dx: Math.cos(a + offset) * DEVIL_BULLET_SPEED, dy: Math.sin(a + offset) * DEVIL_BULLET_SPEED,
                            color: '#FF6600', life: 130, r: cfg.isBoss ? 9 : 7,
                        });
                    }
                    // Scary laugh — not every shot, or it gets annoying
                    if (Date.now() - lastDevilLaugh > 6000) { lastDevilLaugh = Date.now(); sfx('laugh'); }
                }
                d.isAboutToShoot = false;
            }
        } else {
            const inCave = isPlayerInCave();

            if (inCave) {
                d.aiState = 'WANDER';
                if (d.wanderWaitTimer > 0) {
                    d.wanderWaitTimer--;
                } else {
                    const dist = Math.hypot(d.wanderTarget.x - d.x, d.wanderTarget.y - d.y);
                    if (dist < 14) {
                        // Arrived — telegraph, then pick new spot after wait
                        d.telegraphTimer  = 30;
                        d.wanderWaitTimer = 120; // 2 s
                        d.wanderTarget = {
                            x: 80 + Math.random() * 640,
                            y: 80 + Math.random() * 440,
                        };
                    } else {
                        const a = Math.atan2(d.wanderTarget.y - d.y, d.wanderTarget.x - d.x);
                        d.x = Math.max(50, Math.min(750, d.x + Math.cos(a) * 1.6));
                        d.y = Math.max(50, Math.min(550, d.y + Math.sin(a) * 1.6));
                    }
                }
            } else {
                d.aiState = 'CHASE';
                const a = Math.atan2(player.y - d.y, player.x - d.x);
                d.x = Math.max(60, Math.min(740, d.x + Math.cos(a) * cfg.devilSpeed));
                d.y = Math.max(60, Math.min(540, d.y + Math.sin(a) * cfg.devilSpeed));
                if (state.playerInvincible === 0 &&
                    Math.hypot(d.x - player.x, d.y - player.y) < d.r + 16) {
                    damagePlayer();
                }

                // Periodic shooting — only while player is visible (CHASE mode)
                d.shootTimer--;
                if (d.shootTimer <= 0) {
                    d.shootTimer     = cfg.devilShootRate;
                    d.telegraphTimer = 30;
                    d.isAboutToShoot = true;
                }
            }
        }
    }
}

// ── UPDATE: ENEMY PROJECTILES ─────────────────────────────────
function updateEnemyProjectiles() {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const p = enemyProjectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            enemyProjectiles.splice(i, 1); continue;
        }
        if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + 16) {
            if (!isShieldedAgainst(p.enemyType)) {
                if (state.playerInvincible === 0) damagePlayer();
            }
            // Blocked projectiles vanish with a small spark
            spawnParticles(p.x, p.y, p.color, 4);
            enemyProjectiles.splice(i, 1);
        }
    }
}

// ── UPDATE: SHOOTING ──────────────────────────────────────────
function shoot() {
    if (state.won || state.levelComplete || state.power === POWER.NONE || state.room === ROOM.VOID) return;
    if (state.ammoReloading || state.ammo <= 0) return;

    const enemies = [];
    enemies.push(...targetableEnemies());
    if (state.room === ROOM.HELL && hell.devil.alive) enemies.push(hell.devil);
    if (!enemies.length) return;

    const target = enemies.reduce((best, e) => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        return d < best.dist ? { en: e, dist: d } : best;
    }, { en: null, dist: Infinity }).en;

    if (!target) return;
    const a = Math.atan2(target.y - player.y, target.x - player.x);
    const w     = WEAPON_INFO[state.power];
    const color = state.power === POWER.RAINBOW ? `hsl(${Math.random() * 360}, 100%, 60%)` : w.color;
    // SUPER and RAINBOW weapons fire 3 shots in a spread for the same ammo
    const spread = state.powerTier >= 2 ? [-0.2, 0, 0.2] : state.lessons.double ? [-0.08, 0.08] : [0];
    for (const off of spread) {
        projectiles.push({ x: player.x, y: player.y, dx: Math.cos(a + off) * w.speed, dy: Math.sin(a + off) * w.speed,
            color, power: state.power, life: 90, r: w.size });
    }

    sfx('shoot');
    // Shadow You copies that too!
    for (const sh of targetableEnemies().filter(e => e.type === 'shadow')) {
        const sa = Math.atan2(player.y - sh.y, player.x - sh.x);
        enemyProjectiles.push({ x: sh.x, y: sh.y, dx: Math.cos(sa) * 6, dy: Math.sin(sa) * 6, color: '#8844CC', life: 100, r: 6, enemyType: 'shadow' });
    }
    state.ammo--;
    if (state.ammo <= 0) {
        state.ammoReloading = true;
        state.ammoReloadTimer = LEVEL_CONFIGS[state.level - 1].reloadFrames;
    }
}

// ── UPDATE: AMMO RELOAD ───────────────────────────────────────
function updateAmmo() {
    if (!state.ammoReloading) return;
    state.ammoReloadTimer--;
    if (state.ammoReloadTimer <= 0) {
        state.ammoReloading  = false;
        state.ammo           = state.ammoMax;
    }
}

// ── UPDATE: PROJECTILES & HITS ────────────────────────────────
function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        spawnShotTrail(p);
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            projectiles.splice(i, 1); continue;
        }

        let hit = false;

        for (const e of targetableEnemies()) {
            if (Math.hypot(p.x - e.x, p.y - e.y) >= e.r + p.r) continue;
            damageEnemy(e, p.power, false, p.fromPet ? 0 : state.weaponLevel - 1);
            hit = true; break;
        }

        if (!hit && state.room === ROOM.HELL) {
            const d = hell.devil;
            if (d.alive && Math.hypot(p.x - d.x, p.y - d.y) < d.r + p.r) {
                if (p.power === POWER.ICE) d.frozen = DEVIL_FREEZE_FRAMES;
                if (state.lightCrystals >= 3) {
                    d.hp--;
                    sfx('hit');
                    addScore(5);
                    d.shieldFlash = 15;
                    spawnParticles(d.x, d.y, '#FF4400', 8);
                    triggerShake(8);
                    if (d.hp <= 0) {
                        d.alive = false;
                        giveAward('devil');
                        sfx('defeat');
                        addScore(100);
                        spawnParticles(d.x, d.y, '#880000', 20);
                        triggerShake(20);
                        if (state.level < MAX_LEVELS) {
                            state.levelComplete = true;
                        } else {
                            state.won = true;
                        }
                    }
                } else {
                    d.shieldFlash = 25;
                    sfx('hit');
                    spawnParticles(d.x, d.y, '#FFFFFF', 6);
                    triggerShake(6);
                }
                hit = true;
            }
        }

        if (hit) projectiles.splice(i, 1);
    }
}

// ── UPDATE: DIGGING ───────────────────────────────────────────
// Returns the dig spot the player is standing on (if it still has layers left)
function nearbyDigSpot() {
    if (state.room !== ROOM.HELL) return null;
    return hell.digSpots.find(s =>
        s.depth < DIG_MAX_DEPTH && Math.hypot(player.x - s.x, player.y - s.y) < DIG_RANGE
    ) || null;
}

// You can't dig while a mole monster is out — Space / the button shoots it instead
function canDig() {
    return !hell.enemies.some(e => e.alive && e.type === 'mole');
}

function powerName(power = state.power, tier = state.powerTier) {
    if (power === POWER.NONE)    return 'None';
    if (power === POWER.RAINBOW) return 'Rainbow';
    return tier >= 2 ? `Super ${power}` : power;
}

function spawnMole(s) {
    // Pops out a little way from the player so it doesn't hit them straight away
    const a = Math.random() * Math.PI * 2;
    hell.enemies.push({
        type: 'mole', x: s.x + Math.cos(a) * 45, y: s.y + Math.sin(a) * 45, alive: true,
        r: 13 + s.depth * 2, hp: s.depth * 2 + 1, maxHp: s.depth * 2 + 1, hitFlash: 0, frozen: 0,
        speed: 0.8 + s.depth * 0.25,
        emerge: 45,   // frames spent climbing out (harmless while emerging)
    });
}

function nearbyGem() {
    if (state.room !== ROOM.UNDERGROUND) return null;
    return underground.gems.find(g => !g.mined && Math.hypot(player.x - g.x, player.y - g.y) < 30) || null;
}

// Mining a gem in the Underground Caves: a few hits, then +1 heart and points
function tryMine() {
    const gem = nearbyGem();
    if (!gem) return false;
    gem.hits++;
    sfx('dig');
    spawnParticles(gem.x, gem.y, gem.color, 5);
    if (gem.hits >= GEM_HITS) {
        gem.mined = true;
        const maxHp = fullHearts();
        if (state.playerHp < maxHp) state.playerHp++;
        addScore(50);
        spawnFloatText(gem.x, gem.y - 26, '💎 +50  +1 ❤', gem.color, 90);
        spawnParticles(gem.x, gem.y, gem.color, 16);
        sfx('found');
    }
    return true;
}

// Returns true if the player dug (so Space / the button doesn't also shoot)
function tryDig() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    if (tryMine()) return true;
    const s = nearbyDigSpot();
    if (!s || !canDig()) return false;
    s.hits++;
    state.digAnim = 14;
    sfx('dig');
    spawnParticles(s.x, s.y, '#8B5A2B', 6);
    triggerShake(3);
    if (s.hits < DIG_HITS_PER_LAYER[s.depth]) return true;

    // Broke through a layer!
    s.hits = 0;
    s.depth++;
    // The bottom layer only SOMETIMES has Rainbow Power — otherwise it's another Super weapon
    const rainbow = s.depth === 3 && Math.random() < RAINBOW_CHANCE;
    const tier   = rainbow ? 3 : Math.min(s.depth, 2);
    const weapon = rainbow ? POWER.RAINBOW : s.weapon;
    const color  = WEAPON_INFO[weapon].color;
    const name   = (tier === 2 ? 'SUPER ' : '') + WEAPON_INFO[weapon].label;
    let text;
    if (state.power !== POWER.NONE && tier < state.powerTier) {
        text = `Found ${name} — yours is better!`;
    } else {
        state.power     = weapon;
        state.powerTier = tier;
        state.playerFlash = 25;
        if (weapon === POWER.RAINBOW) giveAward('rainbow');
        text = tier === 3 ? `LEGENDARY! ${name}!` : tier === 2 ? `RARE! ${name}!` : `You found ${name}!`;
    }
    spawnParticles(s.x, s.y, color, 10 + tier * 6);
    triggerShake(6 + tier * 2);
    sfx('found');
    addScore(5 * tier);

    let sub = s.depth < DIG_MAX_DEPTH ? 'Keep digging for something rarer…'
            : rainbow ? '' : 'No Rainbow down here this time…';
    if (s.depth === DIG_MAX_DEPTH && s.tunnel) sub = 'What\'s that? A secret TUNNEL!';
    if (Math.random() < DIG_MOLE_CHANCE[s.depth - 1]) {
        spawnMole(s);
        sub = 'Look out — a MOLE MONSTER!';
    }
    hell.foundMsg = { text, sub, color, timer: 120 };
    return true;
}

function updateDigging() {
    if (hell.foundMsg && --hell.foundMsg.timer <= 0) hell.foundMsg = null;
}

// ── UPDATE: PET ───────────────────────────────────────────────
const pet = { x: 370, y: 320, cooldown: 0, healTimer: 0, face: 1 };

function placePetBesidePlayer() {
    pet.x = player.x - 28; pet.y = player.y + 16; pet.cooldown = 30;
}

// School lessons that work all the time
function updateLessons() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return;
    if (state.lessons.magnet) {   // coins fly to you
        for (const c of roomCoins()) {
            if (c.picked) continue;
            const d = Math.hypot(player.x - c.x, player.y - c.y);
            if (d < 260 && d > 1) { c.x += (player.x - c.x) / d * 4; c.y += (player.y - c.y) / d * 4; }
        }
    }
    if (state.lessons.healing && state.playerHp < fullHearts() && ++state.lessonHealTimer >= 1800) {
        state.lessonHealTimer = 0; state.playerHp++;
        spawnFloatText(player.x, player.y - 30, '💖 +1', '#FF88AA', 60);
    }
    if (state.lessons.reload && state.ammoReloading) state.ammoReloadTimer--;   // counts down twice as fast
}

function updatePet() {
    if (state.activePet < 0 || state.gamePhase !== 'playing' || state.won || state.levelComplete) return;
    const info = PETS[state.activePet];
    if (pet.cooldown > 0) pet.cooldown--;

    // Nearest bad guy close to YOU (pets don't wander off across the map)
    let target = null, best = info.range;
    for (const e of targetableEnemies()) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < best) { best = d; target = e; }
    }

    // Where the pet wants to be: next to you, or chasing something
    let goal = { x: player.x - 28 * pet.face, y: player.y + 16 };
    if (info.id === 'puppy') {
        // Fetch! Runs to coins near you and picks them up
        const coin = roomCoins().find(c => !c.picked && Math.hypot(c.x - player.x, c.y - player.y) < 220);
        if (coin) {
            goal = coin;
            if (Math.hypot(coin.x - pet.x, coin.y - pet.y) < 16) { coin.picked = true; collectCoin(); }
        } else if (target) goal = target;
    } else if (info.id === 'kitten' && target) {
        goal = target;
    }

    const dx = goal.x - pet.x, dy = goal.y - pet.y, dist = Math.hypot(dx, dy);
    if (dist > 4) {
        const spd = Math.min(info.speed * (dist > 150 ? 2 : 1), dist);   // hurries to catch up
        pet.x += dx / dist * spd; pet.y += dy / dist * spd;
        if (Math.abs(dx) > 1) pet.face = dx > 0 ? -1 : 1;
    }
    pet.x = Math.max(12, Math.min(788, pet.x));
    pet.y = Math.max(56, Math.min(588, pet.y));

    // Attacks — every pet does a little damage (1), except its own element's strong hits
    if (target && pet.cooldown === 0) {
        if (info.id === 'puppy' || info.id === 'kitten') {
            if (Math.hypot(target.x - pet.x, target.y - pet.y) < target.r + 12) {
                pet.cooldown = info.cooldown;
                spawnParticles(target.x, target.y, '#FFFFFF', 4);
                sfx(info.id === 'puppy' ? 'bark' : 'meow');
                damageEnemy(target, POWER.NONE);
            }
        } else {
            // Owl zaps with lightning feathers, Dragon breathes fireballs
            pet.cooldown = info.cooldown;
            const power = info.id === 'owl' ? POWER.LIGHTNING : POWER.BRIMSTONE;
            const a = Math.atan2(target.y - pet.y, target.x - pet.x);
            projectiles.push({ x: pet.x, y: pet.y, dx: Math.cos(a) * 8, dy: Math.sin(a) * 8,
                               color: WEAPON_INFO[power].color, power, life: 60, r: 5, fromPet: true });
            sfx(info.id === 'owl' ? 'hoot' : 'shoot');
        }
    }

    // The Owl heals you now and then
    if (info.id === 'owl') {
        const maxHp = fullHearts();
        if (state.playerHp < maxHp && ++pet.healTimer >= OWL_HEAL_FRAMES) {
            pet.healTimer = 0;
            state.playerHp++;
            spawnFloatText(player.x, player.y - 30, '+1 ❤ from Owl!', '#FF88AA', 70);
            spawnParticles(player.x, player.y, '#FF88AA', 10);
            sfx('buy');
        }
    }
}

// ── GADGETS & DASH ────────────────────────────────────────────
const VGADGET = { x: 600, y: 540, r: 22 };   // touch buttons
const VBUILD  = { x: 530, y: 560, r: 20 };
const VDASH   = { x: 700, y: 385, r: 20 };
let gadgetObjs = [];   // boomerangs, bombs and tornadoes flying about

function nearestTarget(range = 400) {
    let best = null, bestD = range;
    for (const e of targetableEnemies()) {
        if (e.frog) continue;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < bestD) { best = e; bestD = d; }
    }
    return best;
}

// Where to aim: the nearest monster, or straight ahead
function aimPoint(dist = 140) {
    const t = nearestTarget();
    return t ? { x: t.x, y: t.y } : { x: player.x + state.faceX * dist, y: player.y + state.faceY * dist };
}

function useGadget() {
    if (!playing() || !state.gadget || state.gadgetCooldown > 0 || state.room === ROOM.VOID) return;
    const g = GADGETS.find(g => g.id === state.gadget);
    const aim = aimPoint();
    const a = Math.atan2(aim.y - player.y, aim.x - player.x);
    if (g.id === 'boomerang') {
        gadgetObjs.push({ kind: 'boomerang', x: player.x, y: player.y, vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, t: 0, hits: new Set() });
        sfx('whoosh');
    } else if (g.id === 'bomb') {
        gadgetObjs.push({ kind: 'bomb', x: player.x, y: player.y, sx: player.x, sy: player.y, tx: aim.x, ty: aim.y, t: 0, dur: 36 });
        sfx('whoosh');
    } else if (g.id === 'wand') {
        const e = nearestTarget(320);
        if (!e) { showToast('🪄 No monster close enough to zap!', '#CC99FF', 90); return; }
        bolts.push({ x1: player.x, y1: player.y, x2: e.x, y2: e.y, life: 14 });
        if (e.type === 'king') {
            spawnFloatText(e.x, e.y - e.r - 10, 'Too big to be a frog!', '#CC99FF', 70);
        } else {
            Object.assign(e, { frog: true, hp: 1, maxHp: 1, frozen: 0, hopTimer: 20, dx: 0, dy: 0, r: 12 });
            spawnParticles(e.x, e.y, '#CC99FF', 16);
            spawnFloatText(e.x, e.y - 24, 'RIBBIT! 🐸', '#88FF88', 70);
        }
        sfx('magic');
    } else if (g.id === 'tornado') {
        gadgetObjs.push({ kind: 'tornado', x: aim.x, y: aim.y, t: 0, dur: 180 });
        sfx('whoosh');
    }
    state.gadgetCooldown = g.cooldown;
}

function dash() {
    if (!playing() || !state.hasDash || state.dashCooldown > 0) return;
    state.dashTimer = 8;
    state.dashCooldown = DASH_COOLDOWN;
    sfx('whoosh');
}

function updateGadgets() {
    if (state.gadgetCooldown > 0) state.gadgetCooldown--;
    if (state.dashCooldown > 0)   state.dashCooldown--;
    for (let i = gadgetObjs.length - 1; i >= 0; i--) {
        const o = gadgetObjs[i];
        o.t++;
        if (o.kind === 'boomerang') {
            if (o.t > 28) {   // curve back to you
                const a = Math.atan2(player.y - o.y, player.x - o.x);
                o.vx += Math.cos(a) * 1.1; o.vy += Math.sin(a) * 1.1;
                const sp = Math.hypot(o.vx, o.vy); if (sp > 11) { o.vx *= 11 / sp; o.vy *= 11 / sp; }
                if (Math.hypot(player.x - o.x, player.y - o.y) < 18) { gadgetObjs.splice(i, 1); continue; }
            }
            o.x += o.vx; o.y += o.vy;
            for (const e of targetableEnemies()) {
                if (o.hits.has(e) || Math.hypot(e.x - o.x, e.y - o.y) > e.r + 12) continue;
                o.hits.add(e);
                damageEnemy(e, POWER.NONE, false, 1 + state.weaponLevel - 1);
            }
            if (o.t > 150) gadgetObjs.splice(i, 1);
        } else if (o.kind === 'bomb') {
            const k = o.t / o.dur;
            o.x = o.sx + (o.tx - o.sx) * k; o.y = o.sy + (o.ty - o.sy) * k - Math.sin(k * Math.PI) * 60;   // arcs through the air
            if (o.t >= o.dur) {
                for (const e of targetableEnemies()) {
                    if (Math.hypot(e.x - o.tx, e.y - o.ty) < 95) damageEnemy(e, POWER.NONE, false, 2 + state.weaponLevel - 1);
                }
                for (let k2 = 0; k2 < 3; k2++) spawnParticles(o.tx, o.ty, ['#FFEE66', '#FF8800', '#555555'][k2], 16);
                triggerShake(18);
                sfx('boom');
                gadgetObjs.splice(i, 1);
            }
        } else if (o.kind === 'tornado') {
            const tgt = nearestTarget(600);
            if (tgt) { o.x += Math.sign(tgt.x - o.x) * 1.2; o.y += Math.sign(tgt.y - o.y) * 1.2; }
            for (const e of targetableEnemies()) {
                const d = Math.hypot(e.x - o.x, e.y - o.y);
                if (d < 140 && d > 4) {   // pulled in and spun around
                    const a = Math.atan2(e.y - o.y, e.x - o.x) + 0.12;
                    const nd = Math.max(8, d - 1.6);
                    e.x = o.x + Math.cos(a) * nd; e.y = o.y + Math.sin(a) * nd;
                }
                if (d < 40 && o.t % 30 === 0) damageEnemy(e, POWER.NONE, false, state.weaponLevel - 1);
            }
            if (o.t >= o.dur) gadgetObjs.splice(i, 1);
        }
    }
}

function drawGadgets() {
    const t = Date.now() / 1000;
    for (const o of gadgetObjs) {
        ctx.save();
        if (o.kind === 'boomerang') {
            ctx.translate(o.x, o.y); ctx.rotate(o.t * 0.5);
            ctx.strokeStyle = '#C8843A'; ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(0, -6); ctx.lineTo(10, 6); ctx.stroke();
        } else if (o.kind === 'bomb') {
            drawGroundShadow(o.x, o.ty + 8, 8, 3);
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(o.x - 3, o.y - 3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = Math.random() < 0.5 ? '#FFEE66' : '#FF6600';   // fizzing fuse
            ctx.beginPath(); ctx.arc(o.x + 6, o.y - 9, 3, 0, Math.PI * 2); ctx.fill();
        } else if (o.kind === 'tornado') {
            ctx.globalAlpha = Math.min(1, (o.dur - o.t) / 30);
            for (let k = 0; k < 9; k++) {
                const y = o.y + 20 - k * 7, w = 8 + k * 4;
                ctx.strokeStyle = `rgba(200,210,220,${0.7 - k * 0.05})`; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.ellipse(o.x + Math.sin(t * 8 + k) * 4, y, w, w * 0.3, 0, t * 10 + k, t * 10 + k + Math.PI * 1.5); ctx.stroke();
            }
        }
        ctx.restore();
    }
}

// Little gadget + dash icons in the bottom-left corner
function drawGadgetHud() {
    const slots = [];
    if (state.gadget) {
        const g = GADGETS.find(g => g.id === state.gadget);
        slots.push({ icon: g.icon, key: lastInput === 'pad' ? 'B' : 'Q', cd: state.gadgetCooldown / g.cooldown });
    }
    if (state.hasDash) slots.push({ icon: '💨', key: lastInput === 'pad' ? 'LT' : '⇧', cd: state.dashCooldown / DASH_COOLDOWN });
    slots.forEach((sl, i) => {
        const x = 70 + i * 40, y = 574;
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
        if (sl.cd > 0) {   // cooldown sweep
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sl.cd); ctx.closePath(); ctx.fill();
        }
        ctx.strokeStyle = sl.cd > 0 ? '#777' : '#FFD700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();
        ctx.font = '15px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FFF';
        ctx.fillText(sl.icon, x, y + 1);
        if (lastInput !== 'touch') { ctx.font = 'bold 8px Arial'; ctx.fillText(sl.key, x + 12, y - 12); }
        ctx.restore();
    });
}

// ── UPDATE: WEATHER ───────────────────────────────────────────
function updateWeather() {
    const P = paradise;
    if (P.rainbowTimer > 0) P.rainbowTimer--;
    if (--P.weatherTimer <= 0) {
        P.weatherTimer = WEATHER_FRAMES;
        const was = P.weather, r = Math.random();
        P.weather = r < 0.5 ? 'sun' : r < 0.8 ? 'rain' : 'snow';
        if (was === 'rain' && P.weather !== 'rain') P.rainbowTimer = RAINBOW_FRAMES;   // 🌈 after the rain!
    }
    // Rain waters the thirsty crops for you
    if (P.weather === 'rain' && P.weatherTimer % 150 === 0) {
        const crop = P.crops.find(c => c.thirsty);
        if (crop) {
            crop.thirsty = false;
            if (state.job && state.job.kind === 'water') state.job.got++;
            spawnFloatText(crop.x, crop.y - 26, '🌧 The rain watered a crop!', '#88DDFF', 70);
        }
    }
}

// Rain / snow falling, and a rainbow in the sky (drawn over the town, under the HUD)
function drawWeather() {
    const P = paradise, t = Date.now() / 1000;
    if (P.phase !== 'day') return;
    if (P.weather === 'rain') {
        ctx.fillStyle = 'rgba(40,50,80,0.18)'; ctx.fillRect(0, 0, 800, 600);
        ctx.strokeStyle = 'rgba(180,210,255,0.55)'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < 140; i++) {
            const x = (i * 57.3 + t * 90) % 820 - 10, y = (i * 91.7 + t * 620) % 620 - 10;
            ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 12);
        }
        ctx.stroke();
    } else if (P.weather === 'snow') {
        ctx.fillStyle = 'rgba(220,230,255,0.12)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        for (let i = 0; i < 110; i++) {
            const x = (i * 71.3 + Math.sin(t + i) * 20 + t * 15) % 800, y = (i * 53.1 + t * 45) % 600;
            ctx.beginPath(); ctx.arc(x, y, 1.5 + (i % 3) * 0.7, 0, Math.PI * 2); ctx.fill();
        }
    }
}

function drawRainbowArc() {
    const P = paradise;
    if (P.phase !== 'day' || P.rainbowTimer <= 0) return;
    const fade = Math.min(1, P.rainbowTimer / 120, (RAINBOW_FRAMES - P.rainbowTimer) / 60);
    ctx.save();
    ctx.globalAlpha = 0.45 * fade; ctx.lineWidth = 7;
    ['#FF3B3B', '#FF9A2E', '#FFE83B', '#4CD964', '#3BA7FF', '#6A5BFF', '#B45BFF'].forEach((c, i) => {
        ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(400, 420, 330 - i * 7, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    });
    ctx.restore();
}
