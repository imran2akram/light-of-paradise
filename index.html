}

// ── DRAW: AWARDS ──────────────────────────────────────────────
function drawAwards() {
    if (!state.awardsOpen) return;
    const X = 90, Y = 56, W = 620, H = 500;
    ctx.save();
    ctx.fillStyle = 'rgba(10,5,25,0.97)'; ctx.fillRect(X, Y, W, H);
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2; ctx.strokeRect(X, Y, W, H);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    const got = AWARDS.filter(a => awards.got[a.id]).length;
    ctx.fillText(`🏅 AWARDS  ${got}/${AWARDS.length}`, 400, Y + 30);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px Arial';
    ctx.fillText(`Monsters beaten: ${awards.kills}   ·   Fish caught: ${awards.fish}   ·   Tap, H or B to close`, 400, Y + 50);
    AWARDS.forEach((a, i) => {
        const col = i % 3, row = Math.floor(i / 3);
        const x = X + 16 + col * 200, y = Y + 58 + row * 37;
        const has = awards.got[a.id];
        ctx.fillStyle = has ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.05)';
        ctx.fillRect(x, y, 188, 34);
        ctx.strokeStyle = has ? '#FFD700' : '#444'; ctx.lineWidth = 1; ctx.strokeRect(x, y, 188, 34);
        ctx.globalAlpha = has ? 1 : 0.35;
        ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#FFF';
        ctx.fillText(a.icon, x + 22, y + 25);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
        ctx.fillStyle = has ? '#FFE680' : '#888'; ctx.font = 'bold 12px Arial';
        ctx.fillText(a.name, x + 44, y + 15);
        ctx.fillStyle = has ? 'rgba(255,255,255,0.75)' : '#666'; ctx.font = '10px Arial';
        ctx.fillText(has ? '✓ ' + a.desc : a.desc, x + 44, y + 28);
    });
    ctx.restore();
}

// ── DRAW: SHOP ────────────────────────────────────────────────
function drawShop() {
    if (!state.shopOpen) return;

    const W = SHOP.W, H = SHOP.H, SX = SHOP.X, SY = SHOP.Y;
    ctx.save();
    ctx.fillStyle   = 'rgba(10,5,25,0.98)';
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth   = 2;
    ctx.fillRect(SX, SY, W, H);
    ctx.strokeRect(SX, SY, W, H);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('✦ SHOP ✦', 400, SY + 30);

    ctx.fillStyle = 'rgba(255,215,0,0.8)';
    ctx.font = '14px Arial';
    ctx.fillText(`Your coins: 🪙 ${state.coins}`, 400, SY + 52);

    ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(lastInput === 'pad'   ? 'D-pad to choose  |  A to buy / wear  |  B to close'
               : lastInput === 'touch' ? 'Tap an item to buy or wear it  |  ✕ to close'
               : 'Arrows to choose, SPACE to buy / wear (or click)  |  1-8 skins, 9 bubble  |  E to close', 400, SY + 68);

    // Close button
    ctx.beginPath(); ctx.arc(SHOP_CLOSE.x, SHOP_CLOSE.y, SHOP_CLOSE.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Arial'; ctx.textBaseline = 'middle';
    ctx.fillText('✕', SHOP_CLOSE.x, SHOP_CLOSE.y + 1);
    ctx.textBaseline = 'alphabetic';

    // Controller cursor
    if (lastInput !== 'touch') {
        const r = shopSlotRect(state.shopCursor);
        ctx.save();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
        ctx.strokeRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
        ctx.restore();
    }

    for (let i = 0; i < SHOP_SKINS; i++) {
        const col = AVATAR_COLORS[i];
        const name = AVATAR_NAMES[i];
        const cost = AVATAR_UNLOCK_COST[i];
        const unlocked = state.unlockedSkins[i];
        const active   = state.activeSkin === i;

        const { cx: ix, cy: iy } = shopSlotRect(i);

        // Slot background
        ctx.fillStyle = active ? 'rgba(255,215,0,0.25)' : 'rgba(255,255,255,0.06)';
        ctx.strokeStyle = active ? '#FFD700' : (unlocked ? '#666' : '#333');
        ctx.lineWidth = active ? 2 : 1;
        ctx.fillRect(ix - 26, iy - 26, 52, 70);
        ctx.strokeRect(ix - 26, iy - 26, 52, 70);

        // Avatar preview (locked skins still show their shape, greyed out)
        ctx.save();
        ctx.globalAlpha = unlocked ? 1 : 0.35;
        drawAvatar(ix, iy - 2, 18, col, AVATAR_STYLES[i]);
        ctx.restore();

        // Key hint
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        if (lastInput === 'keyboard') ctx.fillText(`[${i + 1}]`, ix, iy + 16);

        // Name
        ctx.fillStyle = unlocked ? (col === '#2A2A2A' ? '#BBB' : col) : '#555';
        ctx.font = '10px Arial';
        ctx.fillText(name, ix, iy + 27);

        // Cost or ✓
        if (!unlocked) {
            ctx.fillStyle = state.coins >= cost ? '#FFD700' : '#886';
            ctx.font = 'bold 9px Arial';
            ctx.fillText(`🪙${cost}`, ix, iy + 39);
        } else if (active) {
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('✓', ix, iy + 39);
        }
    }

    // Bottom row: Shield Bubble, then pets
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left';
    ctx.fillText('ITEMS & PETS — pets follow you and fight with their own powers!', SX + 22, SY + 174);
    for (let i = 8; i < SHOP_SLOTS; i++) {
        const r = shopSlotRect(i);
        const isPet = i >= 9, j = i - 9;
        const owned  = isPet ? state.ownedPets[j] : state.bubble;
        const active = isPet && state.activePet === j;
        ctx.fillStyle = active ? 'rgba(255,215,0,0.22)' : owned ? 'rgba(170,230,255,0.14)' : 'rgba(255,255,255,0.06)';
        ctx.strokeStyle = active ? '#FFD700' : owned ? '#AEE8FF' : '#555'; ctx.lineWidth = active ? 2 : 1;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        if (isPet) {
            drawPetShape(PETS[j].id, r.cx, r.cy, 1.6, 1);
        } else {
            ctx.beginPath(); ctx.arc(r.cx, r.cy, 16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(170,230,255,0.25)'; ctx.fill();
            ctx.strokeStyle = '#CCF0FF'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.textAlign = 'center';
        ctx.fillStyle = isPet ? '#FFE8B0' : '#AEE8FF'; ctx.font = 'bold 11px Arial';
        ctx.fillText(isPet ? PETS[j].name : 'Shield Bubble', r.cx, r.y + 66);
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '9px Arial';
        ctx.fillText(isPet ? PETS[j].power : (lastInput === 'keyboard' ? 'Blocks 1 hit (key 9)' : 'Blocks 1 hit'), r.cx, r.y + 80);
        const cost = isPet ? PETS[j].cost : BUBBLE_COST;
        ctx.font = 'bold 10px Arial';
        ctx.fillStyle = active ? '#FFD700' : owned ? '#AEE8FF' : state.coins >= cost ? '#FFD700' : '#886';
        ctx.fillText(active ? '✓ WITH YOU' : owned ? (isPet ? 'OWNED — choose' : '✓ HAVE ONE') : `🪙${cost}`, r.cx, r.y + 97);
    }
    ctx.restore();
}

// ── DRAW: CONTROLS ────────────────────────────────────────────
function drawControls() {
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = '11px Arial'; ctx.textAlign = 'right';
    const hint = lastInput === 'pad'   ? 'Move: stick / D-pad  |  Shoot / Dig: A  |  Shop: Y  |  Sound: Back'
               : lastInput === 'touch' ? 'Move: joystick  |  Shoot / Dig: button'
               : 'Move: WASD  |  Shoot / Dig: Space  |  Build: B  |  Gadget: Q  |  Dash: Shift  |  Shop: E  |  Sound: M';
    ctx.fillText(hint, 792, 592);
}

function drawVirtualControls() {
    if (!isTouchDevice || state.gamePhase === 'intro' || state.won || state.levelComplete) return;
    ctx.save();

    // Joystick base
    ctx.beginPath();
    ctx.arc(VJOY.x, VJOY.y, VJOY.baseR, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Joystick stick
    ctx.beginPath();
    ctx.arc(VJOY.x + vTouch.joyDX, VJOY.y + vTouch.joyDY, 22, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.28)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.60)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Shoot button
    ctx.beginPath();
    ctx.arc(VSHOOT.x, VSHOOT.y, VSHOOT.r, 0, Math.PI * 2);
    ctx.fillStyle   = vTouch.shootId !== null ? 'rgba(255,220,50,0.40)' : 'rgba(255,220,50,0.15)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,50,0.70)';
    ctx.lineWidth   = 2;
    ctx.stroke();
    ctx.fillStyle   = 'rgba(255,255,255,0.80)';
    ctx.font        = 'bold 13px Arial';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    const touchBtns = [[VDANCE, '💃'], [VFART, '💨']];
    touchBtns.push([VBUILD, state.buildMode ? '⚔' : '🧱']);
    if (state.buildMode) touchBtns.push([VGADGET, '🔄']);
    else if (state.gadget) touchBtns.push([VGADGET, GADGETS.find(g => g.id === state.gadget).icon]);
    if (state.hasDash) touchBtns.push([VDASH, '⚡']);
    for (const [b, icon] of touchBtns) {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#FFF'; ctx.font = '16px Arial'; ctx.fillText(icon, b.x, b.y + 1);
    }
    ctx.font = 'bold 13px Arial';
    ctx.fillText(state.buildMode ? 'BUILD' : (nearbyDigSpot() && canDig()) || nearbyGem() ? 'DIG' : nearbyNpc() ? 'TALK'
                 : nearbyCrop() ? 'WATER' : atFishingSpot() ? 'FISH' : 'SHOOT', VSHOOT.x, VSHOOT.y);

    ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function update() {
    if (state.gamePhase === 'intro') return;

    updatePlayer();
    if (!state.won && !state.levelComplete) {
        updateEnemies();
        updateRoomEnemies();
        updateDevilMinions();
        updateProjectiles();
        updateEnemyProjectiles();
        checkPickups();
        updateDigging();
        updateTown();
        updatePet();
        updateLessons();
        updateDanceAndFart();
        updateGadgets();
        updateBlocks();
        updateScenery();
        updateHeaven();
        updateVoidHealing();
        updateAmmo();
    }
    updateParticles();
    if (state.screenShake > 0) state.screenShake--;

    // Fire confetti once on win or level complete
    if ((state.won || state.levelComplete) && !state.confettiSpawned) {
        state.confettiSpawned = true;
        spawnConfetti();
        sfx('win');
        if (state.won) { giveAward('hero'); clearSave(); }
    }
    // Save now and then
    if (state.gamePhase === 'playing' && !state.won && Date.now() - lastSave > 5000) { lastSave = Date.now(); saveGame(); if (worldDirty) saveWorld(); }
}
let lastSave = 0;

function draw() {
    ctx.save();
    if (state.screenShake > 0) {
        const s = state.screenShake * 0.8;
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    if (state.gamePhase === 'intro') {
        drawIntro();
        ctx.restore();
        return;
    }

    // Background
    if (state.won || state.levelComplete) {
        drawRainbowBg();
    } else {
        drawRoomBackground();
    }

    if (state.room === ROOM.PARADISE && !state.won && !state.levelComplete) drawParadiseSky();
    if (!state.won && !state.levelComplete && state.room === ROOM.HEAVEN) drawHeavenBack();
    if (!state.won && !state.levelComplete) { drawScenery(); drawBlocks(); }
    if (!state.won && !state.levelComplete) drawPortals();
    if (state.room === ROOM.VOID)     drawVoid();
    if (state.room === ROOM.HELL)     drawHell();
    if (state.room === ROOM.PARADISE) drawParadise();
    if (state.room === ROOM.SECRET)   drawSecretRoom();
    if (state.room === ROOM.UNDERGROUND) drawUnderground();
    if (state.room === ROOM.HEAVEN)   drawHeaven();
    if (state.room === ROOM.HOUSE)    drawHouse();
    drawPlayer();
    drawHeartPickups();
    drawGadgets();
    drawPet();
    drawProjectiles();
    drawBolts();
    drawEnemyProjectiles();
    drawParticles();
    if (state.room === ROOM.PARADISE && !state.won && !state.levelComplete) drawWeather();
    if (state.room === ROOM.UNDERGROUND) drawCaveDarkness();
    else if (state.room === ROOM.HELL && isPlayerPhysicallyInCave() && !state.won && !state.levelComplete) drawInsideCave();
    else if (!state.won && !state.levelComplete) drawVignette();
    drawFloatTexts();
    drawHUD();
    drawControls();
    drawVirtualControls();
    drawHotbar();
    drawShop();
    drawAwards();
    drawMenu();
    drawToast();
    if (state.levelComplete) drawLevelComplete();
    if (state.won)           drawWin();

    ctx.restore();
}

function loop() {
    pollGamepad();
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
