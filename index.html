<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>The Light of Paradise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* The black bars around the game must not pull-to-refresh, zoom, select text or pop up a callout on a phone.
           (touch-action: none still delivers touch events, so the intro's tap-to-skip keeps working.) */
        html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
                     -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh;
               position: fixed; top: 0; left: 0; width: 100%; font-family: Arial, sans-serif; overflow: hidden;
               /* notches and home bars: the game is fitted inside the safe area (fitCanvas reads this padding) */
               padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
        canvas { display: block; cursor: pointer; touch-action: none; }

        /* Phone held upright: a big "turn me" message instead of a tiny game */
        #turnPhone {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
            background: #080018; color: #FFE066; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
            font-weight: bold; font-size: 7vw; padding: 24px;
        }
        #turnPhone svg { width: 34vw; max-width: 180px; margin-bottom: 20px; animation: turn 2.4s ease-in-out infinite; }
        @keyframes turn { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }

        #videoOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            transition: opacity 0.9s ease;
        }
        #introVideo {
            max-width: 100%; max-height: 90vh;
            display: block;
        }
        #skipHint {
            position: absolute; bottom: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px; font-family: Arial, sans-serif;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 0.5; }
            50%      { opacity: 1;   }
        }
    </style>
</head>
<body>
<div id="videoOverlay">
    <video id="introVideo" src="Light of paradise opening.mp4" autoplay muted playsinline></video>
    <div id="skipHint">Tap, click, or press SPACE, ENTER or any button to skip</div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="turnPhone">
    <svg viewBox="0 0 60 100" aria-hidden="true"><rect x="6" y="4" width="48" height="92" rx="9" fill="none" stroke="#FFE066" stroke-width="5"/><circle cx="30" cy="85" r="4" fill="#FFE066"/></svg>
    Turn your phone sideways
</div>
<script src="js/01-constants.js"></script>
<script src="js/02-powers-and-town.js"></script>
<script src="js/03-state-and-input.js"></script>
<script src="js/04-world-extras.js"></script>
<script src="js/05-minigames-and-home.js"></script>
<script src="js/06-places.js"></script>
<script src="js/07-portals-audio-saving.js"></script>
<script src="js/08-blocks-and-helpers.js"></script>
<script src="js/09-room-change-player-enemies.js"></script>
<script src="js/10-combat-pet-gadgets.js"></script>
<script src="js/11-schools-town-pickups.js"></script>
<script src="js/12-draw-rooms-and-monsters.js"></script>
<script src="js/13-draw-town-and-player.js"></script>
<script src="js/14-screens-and-main-loop.js"></script>
</body>
</html>
