<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>The Light of Paradise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; font-family: Arial, sans-serif; overflow: hidden; }
        canvas { display: block; cursor: pointer; touch-action: none; }

        #videoOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            transition: opacity 0.9s ease;
        }
        #introVideo {
            max-width: 100%; max-height: 90vh;
            display: block;
        }
        #skipHint {
            position: absolute; bottom: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px; font-family: Arial, sans-serif;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 0.5; }
            50%      { opacity: 1;   }
        }
    </style>
</head>
<body>
<div id="videoOverlay">
    <video id="introVideo" src="Light of paradise opening.mp4" autoplay muted playsinline></video>
    <div id="skipHint">Press SPACE, click, or tap to skip</div>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── SCREEN SIZE ───────────────────────────────────────────────
// The game always thinks in 800×600. The canvas is stretched to fill the
// window (keeping its shape), and drawn with more real pixels on big or
// sharp screens so it stays crisp instead of blurry.
const GAME_W = 800, GAME_H = 600;
const MAX_RENDER_SCALE = 3;   // more than this gets slow on big 4K screens
let renderScale = 1;

function fitCanvas() {
    const fit = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
    canvas.style.width  = Math.floor(GAME_W * fit) + 'px';
    canvas.style.height = Math.floor(GAME_H * fit) + 'px';
    renderScale = Math.max(1, Math.min(MAX_RENDER_SCALE, fit * (window.devicePixelRatio || 1)));
    canvas.width  = Math.round(GAME_W * renderScale);
    canvas.height = Math.round(GAME_H * renderScale);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ── VIDEO INTRO ───────────────────────────────────────────────
let voidBgColor = '#a0a0a0'; // light grey, darker than the white player

(function setupVideoIntro() {
    const overlay = document.getElementById('videoOverlay');
    const video   = document.getElementById('introVideo');
    let dismissed = false;

    function captureLastFrameColor() {
        try {
            const oc   = document.createElement('canvas');
            oc.width   = video.videoWidth  || 640;
            oc.height  = video.videoHeight || 360;
            const octx = oc.getContext('2d');
            octx.drawImage(video, 0, 0, oc.width, oc.height);
            // Sample a 5×5 grid across the frame
            let r = 0, g = 0, b = 0, n = 0;
            for (let sx = 0.1; sx <= 0.95; sx += 0.2) {
                for (let sy = 0.1; sy <= 0.95; sy += 0.2) {
                    const d = octx.getImageData(
                        Math.floor(sx * oc.width),
                        Math.floor(sy * oc.height), 1, 1).data;
                    r += d[0]; g += d[1]; b += d[2]; n++;
                }
            }
            // Darken the average so it works as a subtle game background
            r = Math.floor(r / n * 0.32);
            g = Math.floor(g / n * 0.32);
            b = Math.floor(b / n * 0.32);
            voidBgColor = `rgb(${r},${g},${b})`;
        } catch (e) { /* keep default if CORS/decode fails */ }
    }

    function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.style.opacity = '0';
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    }

    video.addEventListener('ended',   dismiss);
    overlay.addEventListener('click',      dismiss);
    overlay.addEventListener('touchstart', e => { e.preventDefault(); dismiss(); }, { passive: false });
    document.addEventListener('keydown', function onKey(e) {
        if (e.code === 'Space') { e.preventDefault(); dismiss(); document.removeEventListener('keydown', onKey); }
    });

    // Fallback: if video fails to load/play, still dismiss after a short wait
    video.addEventListener('error', () => setTimeout(dismiss, 100));
})();

// ── FIGHTING MOVES ────────────────────────────────────────────
// J / RB / 👊 : tap = punch, punch, KICK! combo · hold = SPIN ATTACK · while moving up = UPPERCUT
//               while dashing = SLIDING KICK · in the air = GROUND POUND · next to a stunned monster = GRAB, again = THROW
// X / LB / 🛡 : hold to BLOCK (block right as you get hit = PARRY / COUNTER)
// C / 🦘      : SUPER JUMP (you can't be hurt in the air)
// Hold SPACE / A / SHOOT : CHARGE SHOT (a giant shot that goes through monsters)
const COMBO_WINDOW   = 26;    // frames to press again to keep the combo going
const SPIN_HOLD      = 30;    // hold the punch button this long for a spin attack
const PARRY_WINDOW   = 12;    // frames after you start blocking when a hit gets parried
const CHARGE_FRAMES  = 45;    // hold the shoot button this long for a charge shot
const JUMP_FRAMES    = 40;
let fight = { combo: 0, since: 99, cooldown: 0, hold: 0, holding: false, blocking: false, blockFrames: 0,
              jump: 0, pound: false, slide: 0, slideHits: null, charge: 0, fx: [] };
let grabbed  = null;   // a monster you're carrying
let slowMo   = 0;      // perfect-dodge slow motion
let frameNo  = 0;

function canFight() { return playing() && !state.buildMode && !(state.chicken > 0); }

// Hit every monster in reach. arc = only in front of you
function meleeHit(radius, dmg, knock, stun, arc = true, air = 0) {
    let hits = 0;
    for (const e of targetableEnemies()) {
        const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
        if (d > radius + e.r) continue;
        if (arc && d > 12 && (dx * state.faceX + dy * state.faceY) / d < 0.1) continue;
        damageEnemy(e, POWER.NONE, false, dmg - 1 + state.weaponLevel - 1);
        hits++;
        if (!e.alive) continue;
        if (knock && d > 0 && !BOSS_TYPES.includes(e.type)) { e.x += dx / d * knock; e.y += dy / d * knock; }
        if (stun) e.stun = Math.max(e.stun || 0, BOSS_TYPES.includes(e.type) ? stun / 3 : stun);
        if (air && !BOSS_TYPES.includes(e.type)) e.air = air;
    }
    // The Devil can be punched too (once you have the crystals)
    const d = hell.devil;
    if (state.room === ROOM.HELL && d.alive && Math.hypot(d.x - player.x, d.y - player.y) < radius + d.r) {
        if (state.lightCrystals >= 3) { d.hp = Math.max(1, d.hp - 1); d.shieldFlash = 15; hits++; } else d.shieldFlash = 20;
    }
    if (hits) { triggerShake(4 + dmg); addComboHits(hits); }
    return hits;
}

function meleeFx(kind, r) { fight.fx.push({ kind, x: player.x, y: player.y, a: Math.atan2(state.faceY, state.faceX), r, life: 12 }); }

function meleePress() {
    if (!canFight() || fight.cooldown > 0) return;
    fight.holding = true; fight.hold = 0;
    // Carrying a monster? THROW it!
    if (grabbed) {
        const g = grabbed; grabbed = null;
        g.x = player.x + state.faceX * 20; g.y = player.y + state.faceY * 20;   // throw from in front of you
        g.thrown = { vx: state.faceX * 9, vy: state.faceY * 9, t: 40, hits: new Set() };
        sfx('whoosh'); fight.cooldown = 12; return;
    }
    // Next to a stunned / frozen / tiny monster? GRAB it!
    const grab = targetableEnemies().find(e => !BOSS_TYPES.includes(e.type) && (e.stun > 0 || e.frozen > 0 || e.shrunk > 0 || e.air > 0)
                                          && Math.hypot(e.x - player.x, e.y - player.y) < e.r + 22);
    if (grab) { grabbed = grab; grab.stun = 999; spawnFloatText(grab.x, grab.y - 24, 'GRABBED!', '#FFE066', 40); sfx('bite'); return; }
    if (fight.jump > 0) { fight.pound = true; fight.jump = Math.min(fight.jump, 8); return; }           // ground pound on landing
    if (state.dashTimer > 0) { fight.slide = state.dashTimer + 4; fight.slideHits = new Set(); meleeFx('slide', 30); sfx('whoosh'); return; }   // sliding kick
    const movingUp = keys['KeyW'] || (!p2.active && keys['ArrowUp']) || padMove.y < -0.6 || vTouch.joyDY < -VJOY.maxDist * 0.5;
    if (movingUp) {   // UPPERCUT!
        meleeFx('upper', 44);
        if (meleeHit(44, 3, 20, 45, true, 45)) spawnFloatText(player.x, player.y - 40, 'UPPERCUT!', '#FF8844', 45);
        fight.cooldown = 22; sfx('superHit'); return;
    }
    if (state.melee) { weaponSwing(); return; }   // holding a sword, hammer…
    // Punch, punch, KICK!
    fight.combo = fight.since < COMBO_WINDOW ? fight.combo % 3 + 1 : 1;
    fight.since = 0;
    const kick = fight.combo === 3;
    meleeFx(kick ? 'kick' : 'punch', kick ? 46 : 38);
    meleeHit(kick ? 46 : 38, kick ? 3 : 2, kick ? 60 : 12, kick ? 40 : 0);
    if (kick) { spawnFloatText(player.x, player.y - 40, 'KICK!', '#FFE066', 40); giveAward('combo'); }
    sfx(kick ? 'superHit' : 'hit');
    fight.cooldown = kick ? 16 : 8;
}

// Hit every monster along a straight line in front of you (knock < 0 pulls them in)
function lineHit(len, width, dmg, knock, stun) {
    let hits = 0;
    for (const e of targetableEnemies()) {
        const dx = e.x - player.x, dy = e.y - player.y;
        const along = dx * state.faceX + dy * state.faceY, side = Math.abs(dx * state.faceY - dy * state.faceX);
        if (along < -e.r || along > len + e.r || side > width + e.r) continue;
        damageEnemy(e, POWER.NONE, false, dmg - 1 + state.weaponLevel - 1);
        hits++;
        if (!e.alive) continue;
        if (knock && !BOSS_TYPES.includes(e.type)) {
            const move = knock > 0 ? knock : Math.max(knock, -(along - 30));   // don't pull them right on top of you
            e.x += state.faceX * move; e.y += state.faceY * move;
        }
        if (stun) e.stun = Math.max(e.stun || 0, BOSS_TYPES.includes(e.type) ? stun / 3 : stun);
    }
    if (hits) { triggerShake(3 + dmg); addComboHits(hits); }
    return hits;
}

function weaponSwing() {
    const w = state.melee;
    fight.combo = fight.since < COMBO_WINDOW ? fight.combo + 1 : 1;
    fight.since = 0;
    if (w === 'sword') {
        const big = fight.combo % 3 === 0;
        meleeFx('sword', big ? 64 : 54);
        meleeHit(big ? 64 : 54, big ? 4 : 3, big ? 60 : 18, big ? 30 : 0);
        if (big) spawnFloatText(player.x, player.y - 40, 'MEGA SLASH!', '#DDEEFF', 45);
        sfx(big ? 'superHit' : 'whoosh'); fight.cooldown = big ? 16 : 10;
    } else if (w === 'hammer') {
        meleeFx('hammer', 78);
        if (meleeHit(78, 4, 70, 50, false)) spawnFloatText(player.x, player.y - 40, 'SMASH!', '#C8A070', 45);
        spawnParticles(player.x + state.faceX * 24, player.y + state.faceY * 24 + 10, '#8A6A4A', 14);
        triggerShake(12); sfx('boom'); fight.cooldown = 32;
    } else if (w === 'nunchucks') {
        const flurry = fight.combo % 6 === 0;   // every 6th hit spins all the way round
        meleeFx(flurry ? 'spin' : 'nunchuck', flurry ? 56 : 40);
        meleeHit(flurry ? 56 : 40, flurry ? 2 : 1, flurry ? 30 : 6, flurry ? 25 : 6, !flurry);
        if (flurry) spawnFloatText(player.x, player.y - 40, 'WHA-POW!', '#FFCC44', 40);
        sfx('hit'); fight.cooldown = flurry ? 12 : 5;
    } else if (w === 'spear') {
        meleeFx('spear', 100);
        if (lineHit(100, 10, 3, 30, 10) >= 2) spawnFloatText(player.x, player.y - 40, 'SHISH KEBAB!', '#FFE066', 45);
        sfx('whoosh'); fight.cooldown = 16;
    } else if (w === 'whip') {
        meleeFx('whip', 140);
        if (lineHit(140, 8, 2, -45, 25)) spawnFloatText(player.x, player.y - 40, 'CRACK!', '#FFAA66', 40);
        sfx('zap'); fight.cooldown = 20;
    }
}

function meleeRelease() {
    if (fight.holding && fight.hold >= SPIN_HOLD && canFight()) {   // SPIN ATTACK!
        meleeFx('spin', 70);
        meleeHit(70, 2, 50, 30, false);
        spawnFloatText(player.x, player.y - 40, 'SPIN ATTACK!', '#88DDFF', 50);
        sfx('whoosh'); fight.cooldown = 30;
    }
    fight.holding = false; fight.hold = 0;
}

function superJump() {
    if (!canFight() || fight.jump > 0) return;
    fight.jump = JUMP_FRAMES; fight.pound = false;
    sfx('boing');
}

function startBlock() { if (canFight() && !fight.blocking) { fight.blocking = true; fight.blockFrames = 0; } }
function stopBlock()  { fight.blocking = false; }

// Charge shots (hold the shoot button)
function chargeRelease() {
    if (fight.charge >= CHARGE_FRAMES && canFight() && state.power !== POWER.NONE) {
        const aim = aimPoint(500), a = Math.atan2(aim.y - player.y, aim.x - player.x);
        const w = WEAPON_INFO[state.power];
        projectiles.push({ x: player.x, y: player.y, dx: Math.cos(a) * 7, dy: Math.sin(a) * 7, color: w.color, power: state.power,
                           life: 110, r: 16, pierce: true, hitSet: new Set(), bonus: 4 });
        triggerShake(8); sfx('boom');
        spawnFloatText(player.x, player.y - 36, 'CHARGE SHOT!', w.color, 50);
    }
    fight.charge = 0;
}

function updateFighting() {
    frameNo++;
    if (slowMo > 0) slowMo--;
    if (fight.cooldown > 0) fight.cooldown--;
    fight.since++;
    if (fight.holding) fight.hold++;
    if (fight.blocking) fight.blockFrames++;
    // Charging a shot while the shoot button is held
    const shootHeld = (keys['Space'] && !menu) || (padPrev[PAD.A]) || vTouch.shootId !== null;
    if (shootHeld && state.power !== POWER.NONE && canFight()) fight.charge++;
    else if (fight.charge > 0) chargeRelease();
    // Super jump: can't be hurt in the air
    if (fight.jump > 0) {
        state.playerInvincible = Math.max(state.playerInvincible, 2);
        if (--fight.jump === 0) {
            if (fight.pound) {   // GROUND POUND!
                fight.pound = false;
                meleeFx('pound', 100);
                meleeHit(100, 3, 70, 40, false);
                triggerShake(16); sfx('boom'); giveAward('groundPound');
                spawnParticles(player.x, player.y + 16, '#8A6A4A', 20);
            } else spawnParticles(player.x, player.y + 16, '#CCCCCC', 6);
        }
    }
    // Sliding kick hits everything you slide through
    if (fight.slide > 0) {
        fight.slide--;
        for (const e of targetableEnemies()) {
            if (fight.slideHits.has(e) || Math.hypot(e.x - player.x, e.y - player.y) > e.r + 24) continue;
            fight.slideHits.add(e); damageEnemy(e, POWER.NONE, false, 1 + state.weaponLevel - 1); if (e.alive) e.stun = 30;
        }
    }
    // A grabbed monster is carried over your head
    if (grabbed) {
        if (!grabbed.alive) grabbed = null;
        else { grabbed.x = player.x; grabbed.y = player.y - 34; grabbed.stun = 999; }
    }
    // Thrown monsters fly and smash into others
    for (const e of targetableEnemies()) {
        if (!e.thrown) continue;
        const th = e.thrown;
        e.x += th.vx; e.y += th.vy; e.stun = 20;
        for (const o of targetableEnemies()) {
            if (o === e || th.hits.has(o) || Math.hypot(o.x - e.x, o.y - e.y) > o.r + e.r) continue;
            th.hits.add(o); damageEnemy(o, POWER.NONE, false, 2); triggerShake(8);
        }
        if (--th.t <= 0 || e.x < 20 || e.x > 780 || e.y < 60 || e.y > 590) {
            e.thrown = null; e.x = Math.max(30, Math.min(770, e.x)); e.y = Math.max(70, Math.min(580, e.y));
            damageEnemy(e, POWER.NONE, false, 1); spawnParticles(e.x, e.y, '#FFFFFF', 10);
        }
    }
    for (let i = fight.fx.length - 1; i >= 0; i--) if (--fight.fx[i].life <= 0) fight.fx.splice(i, 1);
}

function drawFighting() {
    for (const f of fight.fx) {
        ctx.save();
        ctx.globalAlpha = f.life / 12;
        ctx.strokeStyle = f.kind === 'spin' ? '#88DDFF' : f.kind === 'pound' ? '#C8A070' : f.kind === 'upper' ? '#FF8844' : '#FFFFFF';
        ctx.lineWidth = f.kind === 'kick' || f.kind === 'upper' ? 6 : 4; ctx.lineCap = 'round';
        ctx.beginPath();
        if (f.kind === 'sword') { ctx.strokeStyle = '#DDEEFF'; ctx.lineWidth = 7; ctx.shadowColor = '#AACCFF'; ctx.shadowBlur = 10; }
        if (f.kind === 'hammer') { ctx.strokeStyle = '#C8A070'; ctx.lineWidth = 8; }
        if (f.kind === 'nunchuck') { ctx.strokeStyle = '#FFCC44'; ctx.lineWidth = 3; }
        if (f.kind === 'spear' || f.kind === 'whip') {   // a straight poke / a wiggly whip crack
            const reach = f.r * Math.min(1, (13 - f.life) / 4);
            ctx.strokeStyle = f.kind === 'spear' ? '#D8D8E0' : '#8A5A2A'; ctx.lineWidth = f.kind === 'spear' ? 5 : 3;
            ctx.moveTo(f.x, f.y);
            for (let k = 1; k <= 10; k++) {
                const d = reach * k / 10, wig = f.kind === 'whip' ? Math.sin(k * 1.3 + f.life) * 6 * (k / 10) : 0;
                ctx.lineTo(f.x + Math.cos(f.a) * d - Math.sin(f.a) * wig, f.y + Math.sin(f.a) * d + Math.cos(f.a) * wig);
            }
        }
        else if (f.kind === 'spin' || f.kind === 'pound' || f.kind === 'hammer') ctx.arc(f.x, f.y, f.r * (1.2 - f.life / 24), 0, Math.PI * 2);
        else ctx.arc(f.x, f.y, f.r, f.a - 0.9, f.a + 0.9);
        ctx.stroke();
        ctx.restore();
    }
    if (state.melee && canFight()) {   // the weapon you're holding
        const w = MELEE_WEAPONS.find(m => m.id === state.melee);
        ctx.save();
        ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.translate(player.x + (state.faceX >= 0 ? 16 : -16), player.y + 4);
        if (state.faceX < 0) ctx.scale(-1, 1);
        ctx.fillText(w.icon, 0, 0);
        ctx.restore();
    }
    if (fight.blocking) {   // shield in front of you
        const a = Math.atan2(state.faceY, state.faceX);
        ctx.save();
        ctx.strokeStyle = fight.blockFrames <= PARRY_WINDOW ? '#FFFFFF' : '#66AAFF'; ctx.lineWidth = 6; ctx.shadowColor = '#66AAFF'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(player.x, player.y, 26, a - 1.1, a + 1.1); ctx.stroke();
        ctx.restore();
    }
    if (fight.charge > 10 && state.power !== POWER.NONE) {   // a glowing ball charging up
        const k = Math.min(1, fight.charge / CHARGE_FRAMES), c = WEAPON_INFO[state.power].color;
        ctx.save(); ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 20 * k; ctx.globalAlpha = 0.5 + k * 0.5;
        ctx.beginPath(); ctx.arc(player.x + state.faceX * 20, player.y + state.faceY * 20, 4 + k * 12, 0, Math.PI * 2); ctx.fill();
        if (k >= 1) { ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(player.x + state.faceX * 20, player.y + state.faceY * 20, 18 + Math.sin(Date.now() / 60) * 3, 0, Math.PI * 2); ctx.stroke(); }
        ctx.restore();
    }
    if (mod('disco')) {   // 🪩 party lights
        const t = Date.now() / 1000;
        for (let k = 0; k < 6; k++) {
            const x = 400 + Math.cos(t * (0.7 + k * 0.2) + k) * 320, y = 320 + Math.sin(t * (0.9 + k * 0.15) + k * 2) * 220;
            const g = ctx.createRadialGradient(x, y, 5, x, y, 120);
            g.addColorStop(0, `hsla(${(k * 60 + t * 90) % 360}, 100%, 60%, 0.35)`); g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
            ctx.fillStyle = g; ctx.fillRect(x - 120, y - 120, 240, 240);
        }
    }
    if (mod('rainbow')) { ctx.fillStyle = `hsla(${(Date.now() / 10) % 360}, 100%, 60%, 0.1)`; ctx.fillRect(0, 0, 800, 600); }
    if (slowMo > 0) {
        ctx.fillStyle = 'rgba(200,200,255,0.12)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText('⏳ PERFECT DODGE — SLOW MOTION!', 400, 110);
    }
}

// A little counter so the combo counter (and later skills) can hear about hits
function addComboHits(n) { state.lastHits = (state.lastHits || 0) + n; }

// ── MAGIC POWERS (Merlin's Magic Shop in the Mall; cast with R / X / the ✨ button) ──
const SPELLS = [
    { id: 'laser',  icon: '🔴', name: 'Mega Laser',       cost: 30, cooldown: 180, desc: 'A laser right across the screen' },
    { id: 'shrink', icon: '🐜', name: 'Shrink Ray',       cost: 20, cooldown: 240, desc: 'Makes a monster tiny and weak' },
    { id: 'clone',  icon: '👥', name: 'Clone Power',      cost: 40, cooldown: 600, desc: '3 copies of you help fight' },
    { id: 'freeze', icon: '⏸', name: 'Time Freeze',      cost: 45, cooldown: 900, desc: 'Everything stops except you!' },
    { id: 'magnet', icon: '🧲', name: 'Magnet Hand',      cost: 20, cooldown: 300, desc: 'Pulls monsters and coins to you' },
    { id: 'quake',  icon: '💥', name: 'Earthquake Stomp', cost: 35, cooldown: 480, desc: 'Shakes and stuns everything' },
    { id: 'field',  icon: '🔵', name: 'Force Field',      cost: 30, cooldown: 600, desc: 'Pushes monsters and bullets away' },
];
let timeFreeze = 0, magnetTimer = 0, clones = [], laserBeam = null;

function spellItems() {
    return SPELLS.map(sp => ({
        icon: sp.icon, name: sp.name, desc: sp.desc, cost: sp.cost,
        status: state.spell === sp.id ? 'HOLDING' : state.spells[sp.id] ? 'OWNED — pick' : null,
        action: () => {
            if (state.spells[sp.id]) { state.spell = sp.id; return; }
            if (spend(sp.cost)) { state.spells[sp.id] = true; state.spell = sp.id; showToast(`${sp.icon} ${sp.name}! Cast it with R / X / ✨`); giveAward('wizard'); }
        },
    }));
}

function castSpell() {
    if (!playing() || !state.spell || state.spellCooldown > 0) return;
    const sp = SPELLS.find(x => x.id === state.spell);
    const foes = targetableEnemies();
    const bonus = state.weaponLevel - 1;
    if (sp.id === 'laser') {
        const aim = aimPoint(800), a = Math.atan2(aim.y - player.y, aim.x - player.x);
        const x2 = player.x + Math.cos(a) * 900, y2 = player.y + Math.sin(a) * 900;
        laserBeam = { x1: player.x, y1: player.y, x2, y2, life: 24 };
        for (const e of foes) {   // everything along the beam gets zapped
            const t = Math.max(0, ((e.x - player.x) * Math.cos(a) + (e.y - player.y) * Math.sin(a)));
            const px = player.x + Math.cos(a) * t, py = player.y + Math.sin(a) * t;
            if (Math.hypot(e.x - px, e.y - py) < e.r + 12) damageEnemy(e, POWER.NONE, false, 2 + bonus);
        }
        const d = hell.devil;
        if (state.room === ROOM.HELL && d.alive && state.lightCrystals >= 3) { d.hp = Math.max(1, d.hp - 2); d.shieldFlash = 15; }
        triggerShake(8); sfx('zap');
    } else if (sp.id === 'shrink') {
        const e = nearestTarget(420);
        if (!e) { showToast('🐜 No monster close enough!', '#CCFFCC', 90); return; }
        e.shrunk = 600; e.hp = Math.max(1, Math.ceil(e.hp / 2));
        bolts.push({ x1: player.x, y1: player.y, x2: e.x, y2: e.y, life: 12 });
        spawnFloatText(e.x, e.y - 20, 'tiny!', '#AAFFAA', 60); sfx('magic');
    } else if (sp.id === 'clone') {
        clones = [0, 1, 2].map(i => ({ a: i * 2.1, cd: 10 + i * 10 }));
        state.cloneTimer = 480;
        spawnParticles(player.x, player.y, '#FFFFFF', 16); sfx('magic');
    } else if (sp.id === 'freeze') {
        timeFreeze = 300;
        showToast('⏸ TIME FREEZE!', '#AACCFF', 120); sfx('freeze');
    } else if (sp.id === 'magnet') {
        magnetTimer = 150; sfx('magic');
    } else if (sp.id === 'field') {
        state.fieldTimer = 300; sfx('magic');
    } else if (sp.id === 'quake') {
        for (const e of foes) { damageEnemy(e, POWER.NONE, false, 1 + bonus); if (e.alive) e.frozen = Math.max(e.frozen || 0, 60); }
        triggerShake(30); sfx('boom');
        for (let k = 0; k < 20; k++) spawnParticles(Math.random() * 800, 80 + Math.random() * 500, '#8A6A4A', 2);
    }
    state.spellCooldown = sp.cooldown;
}

function updateSpells() {
    if (state.spellCooldown > 0) state.spellCooldown--;
    if (timeFreeze > 0) timeFreeze--;
    if (laserBeam && --laserBeam.life <= 0) laserBeam = null;
    if (magnetTimer > 0) {
        magnetTimer--;
        for (const e of targetableEnemies()) {
            const d = Math.hypot(player.x - e.x, player.y - e.y);
            const pull = BOSS_TYPES.includes(e.type) ? 0.8 : 2.6;
            if (d < 340 && d > 40) { e.x += (player.x - e.x) / d * pull; e.y += (player.y - e.y) / d * pull; }
        }
        for (const c of roomCoins()) { if (!c.picked) { const d = Math.hypot(player.x - c.x, player.y - c.y) || 1; c.x += (player.x - c.x) / d * 6; c.y += (player.y - c.y) / d * 6; } }
    }
    if (state.chicken > 0 && --state.chicken === 0) showToast('🧑 Phew, you are a person again!', '#FFFFFF', 120);
    if (state.fieldTimer > 0) {   // 🔵 force field pushes monsters out and pops bullets
        state.fieldTimer--;
        for (const e of targetableEnemies()) {
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < 80 && d > 0) { e.x += (e.x - player.x) / d * 4; e.y += (e.y - player.y) / d * 4; }
        }
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            const q = enemyProjectiles[i];
            if (Math.hypot(q.x - player.x, q.y - player.y) < 80) { spawnParticles(q.x, q.y, '#66AAFF', 4); enemyProjectiles.splice(i, 1); }
        }
    }
    if (state.cloneTimer > 0) {
        state.cloneTimer--;
        for (const c of clones) {
            c.a += 0.04;
            c.x = player.x + Math.cos(c.a) * 44; c.y = player.y + Math.sin(c.a) * 30;
            if (--c.cd <= 0) {
                c.cd = 34;
                let target = null, best = 420;
                for (const e of targetableEnemies()) { const d = Math.hypot(e.x - c.x, e.y - c.y); if (d < best) { best = d; target = e; } }
                if (target) {
                    const a = Math.atan2(target.y - c.y, target.x - c.x), pw = state.power === POWER.NONE ? POWER.ICE : state.power, w = WEAPON_INFO[pw];
                    projectiles.push({ x: c.x, y: c.y, dx: Math.cos(a) * w.speed, dy: Math.sin(a) * w.speed, color: w.color, power: pw, life: 70, r: w.size });
                }
            }
        }
        if (state.cloneTimer === 0) clones = [];
    }
    for (const e of targetableEnemies()) if (e.shrunk > 0) e.shrunk--;
}

function drawSpells() {
    if (laserBeam) {
        ctx.save();
        ctx.globalAlpha = laserBeam.life / 24;
        for (const [w, c] of [[14, 'rgba(255,40,40,0.5)'], [6, '#FF4444'], [2, '#FFFFFF']]) {
            ctx.strokeStyle = c; ctx.lineWidth = w; ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.moveTo(laserBeam.x1, laserBeam.y1); ctx.lineTo(laserBeam.x2, laserBeam.y2); ctx.stroke();
        }
        ctx.restore();
    }
    for (const c of clones) {   // your helper copies
        ctx.save(); ctx.globalAlpha = 0.6;
        drawAvatar(c.x, c.y, player.w, getPlayerColor(), AVATAR_STYLES[state.activeSkin], state.walkPhase);
        ctx.restore();
    }
    if (state.fieldTimer > 0) {
        ctx.save(); ctx.strokeStyle = `rgba(100,170,255,${0.4 + Math.sin(Date.now() / 100) * 0.2})`; ctx.fillStyle = 'rgba(100,170,255,0.12)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, 80, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    if (magnetTimer > 0) {
        ctx.strokeStyle = `rgba(255,80,80,${magnetTimer / 150})`; ctx.lineWidth = 2;
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(player.x, player.y, 40 + ((Date.now() / 5 + k * 40) % 120), 0, Math.PI * 2); ctx.stroke(); }
    }
    if (timeFreeze > 0) {
        ctx.fillStyle = 'rgba(140,170,255,0.18)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`⏸ TIME FROZEN ${Math.ceil(timeFreeze / 60)}s`, 400, 90);
    }
}

// 🐔 The Evil Wizard's chicken spell: cluck cluck for 8 seconds (you can't shoot!)
function turnIntoChicken() {
    state.chicken = 480;
    showToast('🐔 BAWK! The Evil Wizard turned you into a CHICKEN!', '#FFE066', 200);

}

    ctx.fillStyle = '#FFAA22'; ctx.beginPath(); ctx.moveTo(x + 15, y - 13); ctx.lineTo(x + 21, y - 11); ctx.lineTo(x + 15, y - 9); ctx.fill();

}

// ── RIDES (Rita's Stable in the Mall; get on / off with V / the 🐴 button) ──
const MOUNTS = [
    { id: 'horse',  icon: '🐴', name: 'Horse',             cost: 25, speed: 1.7, desc: 'Gallop super fast' },
    { id: 'dragon', icon: '🐉', name: 'Flying Dragon',     cost: 60, speed: 1.5, desc: 'Fly right over walls and blocks!' },
    { id: 'kart',   icon: '🏎', name: 'Go-Kart',           cost: 35, speed: 2.2, desc: 'Zoom zoom! (a bit slidey)' },
    { id: 'duck',   icon: '🦆', name: 'Giant Rubber Duck', cost: 15, speed: 0.9, desc: 'Silly and squeaky. Quack!' },
    { id: 'dino',   icon: '🦕', name: 'Triceratops',       cost: 0,  speed: 1.6, desc: 'Tame one on Dinosaur Island!', hidden: true },
];

function mountItems() {
    const items = MOUNTS.filter(m => !m.hidden || state.mounts[m.id]).map(m => ({
        icon: m.icon, name: m.name, desc: m.desc, cost: m.cost,
        status: state.mount === m.id ? 'RIDING' : state.mounts[m.id] ? 'OWNED — ride' : null,
        action: () => {
            if (state.mounts[m.id]) { state.mount = m.id; state.lastMount = m.id; return; }
            if (spend(m.cost)) { state.mounts[m.id] = true; state.mount = m.id; state.lastMount = m.id; showToast(`${m.icon} Hop on your ${m.name}! (V to get off)`); giveAward('rider'); }
        },
    }));
    if (state.mount) items.push({ icon: '🚶', name: 'Get off', desc: 'Walk on your own feet', cost: 0, status: 'OK', action: () => { state.mount = null; } });
    return items;
}

function toggleMount() {
    if (!playing()) return;
    if (state.mount) { state.mount = null; return; }
    if (state.lastMount && state.mounts[state.lastMount]) { state.mount = state.lastMount; sfx('whoosh'); }
    else showToast('🐴 Buy a ride at the Stable in the Mall!', '#FFCC88', 120);
}

function mountSpeed() { const m = MOUNTS.find(m => m.id === state.mount); return m ? m.speed : 1; }

// Drawn under the player
function drawMount() {
    if (!state.mount) return;
    const t = Date.now(), x = player.x, y = player.y + 12, f = state.faceX < 0 ? -1 : 1;
    ctx.save();
    ctx.translate(x, y); ctx.scale(f, 1);
    if (state.mount === 'horse') {
        const g = Math.sin(state.walkPhase * 1.5) * 4;
        ctx.fillStyle = '#8A5A2A';
        for (const lx of [-14, -8, 8, 14]) ctx.fillRect(lx, 4, 4, 12 + (lx > 0 ? g : -g));
        ctx.beginPath(); ctx.ellipse(0, 2, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(22, -8, 6, 9, 0.5, 0, Math.PI * 2); ctx.fill();          // head
        ctx.fillStyle = '#3A2410'; ctx.fillRect(14, -16, 4, 12); ctx.fillRect(-24, -2, 6, 10);   // mane + tail
        ctx.fillStyle = '#000'; ctx.fillRect(24, -11, 2, 2);
    } else if (state.mount === 'dragon') {
        const flap = Math.sin(t / 90) * 10;
        ctx.fillStyle = '#2E8B3E';
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-10, -26 * s - flap * s); ctx.lineTo(12, -6); ctx.fill(); }
        ctx.fillStyle = '#44BB55'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(24, -6, 8, 6, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA22'; ctx.beginPath(); ctx.moveTo(22, -12); ctx.lineTo(26, -20); ctx.lineTo(28, -11); ctx.fill();
        ctx.strokeStyle = '#44BB55'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-32, 6, -34, -6); ctx.stroke();
    } else if (state.mount === 'kart') {
        ctx.fillStyle = '#222'; for (const wx of [-14, 12]) { ctx.beginPath(); ctx.arc(wx, 10, 5, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#E02A2A'; pathRoundRect(-20, -4, 40, 14, 5); ctx.fill();
        ctx.fillStyle = '#FFF'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.fillText('1', 0, 7);
        if (Math.hypot(state.vx || 0, state.vy || 0) > 1) { ctx.fillStyle = 'rgba(200,200,200,0.6)'; ctx.beginPath(); ctx.arc(-26 - Math.random() * 6, 4, 4, 0, Math.PI * 2); ctx.fill(); }
    } else if (state.mount === 'dino') {
        const g = Math.sin(state.walkPhase * 1.2) * 3;
        ctx.fillStyle = '#5A7ABA'; for (const lx of [-16, -8, 8, 16]) ctx.fillRect(lx, 6, 6, 10 + (lx > 0 ? g : -g));
        ctx.fillStyle = '#6A8ACA'; ctx.beginPath(); ctx.ellipse(0, 2, 26, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8AAAE0'; ctx.beginPath(); ctx.arc(26, -6, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6A8ACA'; ctx.beginPath(); ctx.ellipse(32, 0, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#F4EED8'; ctx.beginPath(); ctx.moveTo(36, -6); ctx.lineTo(46, -12); ctx.lineTo(38, -1); ctx.fill();
    } else if (state.mount === 'duck') {
        const bob = Math.sin(t / 250) * 2;
        ctx.fillStyle = '#FFD83A'; ctx.beginPath(); ctx.ellipse(0, 2 + bob, 24, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, -12 + bob, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF8A1A'; ctx.beginPath(); ctx.ellipse(29, -10 + bob, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(21, -15 + bob, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function shopSlotRect(i) {
    if (i < 8) {
        const cx = SHOP.X + 46 + i * 70, cy = SHOP.Y + 118;
        return { x: cx - 26, y: cy - 26, w: 52, h: 70, cx, cy };
    }
    const j = i - 8, x = SHOP.X + 14 + j * 70;
    return { x, y: SHOP.Y + 180, w: 66, h: 106, cx: x + 33, cy: SHOP.Y + 212 };
}

// Arrow keys / D-pad in the shop: left-right along a row, up-down between rows
function moveShopCursor(dx, dy) {
    let c = state.shopCursor;
    const top = c < 8;
    if (dx) c = top ? (c + dx + 8) % 8 : 8 + ((c - 8 + dx + 8) % 8);   // both rows have 8 things
    if (dy > 0 && top)  c += 8;
    if (dy < 0 && !top) c -= 8;
    state.shopCursor = c;
}

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function canOpenShop() {
    return state.gamePhase === 'playing' && state.room === ROOM.VOID && !state.won && !state.levelComplete;
}
function toggleShop() {
    if (state.shopOpen) state.shopOpen = false;
    else if (canOpenShop()) state.shopOpen = true;
}

// Buy or wear a shop item: 0-7 skins, 8 Shield Bubble, 9-12 pets
function shopSelect(i) {
    state.shopCursor = i;
    if (i >= 9) {
        const j = i - 9;
        if (state.ownedPets[j]) {
            state.activePet = j;
        } else if (state.coins >= PETS[j].cost) {
            state.coins -= PETS[j].cost;
            state.ownedPets[j] = true;
            state.activePet = j;
            giveAward('pet');
            if (state.ownedPets.every(Boolean)) giveAward('allPets');
            placePetBesidePlayer();
            spawnParticles(player.x, player.y, '#FFD700', 10);
            sfx('win');
        }
        return;
    }
    if (i === 8) {
        if (!state.bubble && state.coins >= BUBBLE_COST) {
            state.coins -= BUBBLE_COST;
            state.bubble = true;
            sfx('buy');
        }
        return;
    }
    if (state.unlockedSkins[i]) {
        state.activeSkin = i;
    } else if (state.coins >= AVATAR_UNLOCK_COST[i]) {
        state.coins -= AVATAR_UNLOCK_COST[i];
        state.unlockedSkins[i] = true;
        state.activeSkin = i;
        spawnParticles(player.x, player.y, AVATAR_COLORS[i], 8);
        sfx('buy');
    }
}

// A menu is a title plus a function that returns the items, so prices and ticks are always up to date.
// Each item: { icon, name, desc, cost?, status?, action() }
let menu = null;   // { title, items, cursor }
const MENU = { X: 130, Y: 70, W: 540, H: 430 };

function openMenu(title, items) { menu = { title, items, cursor: 0 }; }
function menuItemRect(i) {
    const col = i % 2, row = Math.floor(i / 2);
    const tall = menu && menu.items().length > 10;   // squeeze rows when there's a lot to show
    return { x: MENU.X + 14 + col * 262, y: MENU.Y + 56 + row * (tall ? 58 : 68), w: 250, h: tall ? 54 : 62 };
}
function menuSelect(i) {
    const list = menu.items();
    if (!list[i]) return;
    menu.cursor = i;
    list[i].action();
}
function moveMenuCursor(dx, dy) {
    const n = menu.items().length;
    menu.cursor = Math.max(0, Math.min(n - 1, menu.cursor + dx + dy * 2));
}

// Buy something from a menu: returns true if you had enough coins
function spend(cost) {
    if (settings.creative) { sfx('buy'); return true; }   // everything is free in Creative Mode
    if (state.coins < cost) { showToast(`Not enough coins — you need 🪙${cost}`, '#FF8888', 120); sfx('hurt'); return false; }
    state.coins -= cost;
    sfx('buy');
    return true;
}

// The main button: Space, A on a controller, or the on-screen SHOOT / DIG button
function pressAction() {
    if (menu) return;
    if (state.chicken > 0 && state.gamePhase === 'playing') {   // chickens can only cluck
        tone(900, 0.08, 'square', 0.12, 700); tone(800, 0.1, 'square', 0.1, 600, 0.1);
        spawnFloatText(player.x, player.y - 30, 'BAWK!', '#FFFFFF', 40);
        return;
    }
    if (race) { raceTap(); return; }
    if (nearRaceMaster() && state.gamePhase === 'playing') { startRace(); return; }
    if (state.buildMode && state.gamePhase === 'playing' && !state.won && !state.levelComplete) {
        const { cx, cy } = buildTargetCell();
        buildAt(cx, cy, player.x + state.faceX * 30, player.y + 5 + state.faceY * 30);
        return;
    }
    if (state.gamePhase === 'intro') startFromIntro();
    else if (state.levelComplete)   advanceLevel();
    else if (!tryTreasureDig() && !tryPlaceAction() && !tryDig() && !tryTalk() && !tryTownAction() && !tryHomeAction() && !tryMineNearby() && !tryDigGround()) shoot();
}

// Enter / Start: begin, next level, or play again
function pressStart() {
    if (state.gamePhase === 'intro') startFromIntro();
    else if (state.levelComplete)   advanceLevel();
    else if (state.won)             resetGame();
    else if (lastInput === 'pad')   openSettings();
}

// A tap or click at canvas position (x, y). Returns true if it hit a button.
function handleTap(x, y) {
    if (Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) < MUTE_BTN.r * 1.5) { toggleMute(); return true; }
    if (state.gamePhase === 'playing' && Math.hypot(x - SETTINGS_BTN.x, y - SETTINGS_BTN.y) < SETTINGS_BTN.r * 1.4) { openSettings(); return true; }
    if (state.gamePhase === 'intro') {
        if (savedGame && inRect(x, y, NEW_GAME_BTN)) startFromIntro(true);
        else startFromIntro();
        return true;
    }
    if (race) { raceTap(); return true; }
    if (lastInput !== 'touch' && state.gamePhase === 'playing' && !menu && !state.shopOpen && inRect(x, y, BUILD_BTN)) { toggleBuild(); return true; }
    if (state.awardsOpen) { state.awardsOpen = false; return true; }
    if (menu) {
        const list = menu.items();
        for (let i = 0; i < list.length; i++) if (inRect(x, y, menuItemRect(i))) { menuSelect(i); return true; }
        if (!inRect(x, y, { x: MENU.X, y: MENU.Y, w: MENU.W, h: MENU.H }) || y < MENU.Y + 40) menu = null;   // tap outside / title bar closes
        return true;
    }
    if (state.gamePhase === 'playing' && lastInput === 'touch' && !state.won && !state.levelComplete) {
        if (Math.hypot(x - VBUILD.x, y - VBUILD.y) < VBUILD.r * 1.3) { toggleBuild(); return true; }
        if (state.spell && Math.hypot(x - VSPELL.x, y - VSPELL.y) < VSPELL.r * 1.3) { castSpell(); return true; }
        if (state.lastMount && Math.hypot(x - VMOUNT.x, y - VMOUNT.y) < VMOUNT.r * 1.3) { toggleMount(); return true; }
        if (state.buildMode && Math.hypot(x - VGADGET.x, y - VGADGET.y) < VGADGET.r * 1.3) { nextBlock(); return true; }
        if (Math.hypot(x - VGADGET.x, y - VGADGET.y) < VGADGET.r * 1.3) { useGadget(); return true; }
        if (Math.hypot(x - VDASH.x,   y - VDASH.y)   < VDASH.r * 1.3)   { dash();      return true; }
    }
    if (!state.shopOpen && canOpenShop() && inRect(x, y, AWARDS_BTN)) { state.awardsOpen = true; return true; }
    if (state.gamePhase === 'playing' && lastInput === 'touch' && !state.won && !state.levelComplete) {
        if (Math.hypot(x - VDANCE.x, y - VDANCE.y) < VDANCE.r * 1.3) { dance(); return true; }
        if (Math.hypot(x - VFART.x,  y - VFART.y)  < VFART.r * 1.3)  { fart();  return true; }
    }
    if ((state.won || state.levelComplete) && inRect(x, y, END_BTN)) { pressStart(); return true; }
    if (state.shopOpen) {
        if (Math.hypot(x - SHOP_CLOSE.x, y - SHOP_CLOSE.y) < SHOP_CLOSE.r * 1.6) { state.shopOpen = false; return true; }
        for (let i = 0; i < SHOP_SLOTS; i++) {
            if (inRect(x, y, shopSlotRect(i))) { shopSelect(i); return true; }
        }
        return inRect(x, y, { x: SHOP.X, y: SHOP.Y, w: SHOP.W, h: SHOP.H });   // taps on the panel do nothing else
    }
    if (canOpenShop() && inRect(x, y, SHOP_BTN)) { state.shopOpen = true; return true; }
    return false;
}

document.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    lastInput = 'keyboard';
    if (e.code === 'KeyM') toggleMute();
    if (menu) {
        const nav = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
                      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] }[e.code];
        if (nav) { e.preventDefault(); moveMenuCursor(nav[0], nav[1]); }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); menuSelect(menu.cursor); }
        const d = /^Digit([1-9])$/.exec(e.code);
        if (d) menuSelect(Number(d[1]) - 1);
        if (e.code === 'Escape' || e.code === 'KeyE' || e.code === 'KeyO') menu = null;
        return;
    }
    if (e.code === 'KeyB') toggleBuild();
    if (e.code === 'KeyP') toggleP2();
    if (e.code === 'KeyJ' && !e.repeat) meleePress();
    if (e.code === 'KeyX' && !e.repeat) startBlock();
    if (e.code === 'KeyC' && !e.repeat) superJump();
    if (e.code === 'KeyO') openSettings();
    if (e.code === 'KeyR') castSpell();
    if (e.code === 'KeyV') toggleMount();
    if (e.code === 'KeyQ') { if (state.buildMode) nextBlock(); else useGadget(); }
    const hb = /^Digit([1-9])$/.exec(e.code);
    if (hb && state.buildMode && !state.shopOpen) state.hotbar = Math.min(HOTBAR.length - 1, Number(hb[1]) - 1);
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
    if (state.shopOpen) {
        const nav = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
                      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] }[e.code];
        if (nav) { e.preventDefault(); moveShopCursor(nav[0], nav[1]); }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); shopSelect(state.shopCursor); }
    } else {
        if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pressAction(); }   // hold for a charge shot
        if (e.code === 'Enter' && !p2.active) pressStart();
        if (e.code === 'Enter' && p2.active && (state.won || state.levelComplete)) pressStart();
    }
    if (e.code === 'KeyE' || (e.code === 'Escape' && state.shopOpen)) toggleShop();
    if (e.code === 'KeyC' && state.room === ROOM.PARADISE && !state.shopOpen) { /* handled by walking up to the table */ }
    if (e.code === 'KeyH' && canOpenShop() && !state.shopOpen) state.awardsOpen = !state.awardsOpen;
    if (e.code === 'Escape') state.awardsOpen = false;
    if (e.code === 'KeyN' && state.gamePhase === 'intro') startFromIntro(true);
    if (e.code === 'KeyG') dance();
    if (e.code === 'KeyF') fart();
    // Number keys in the shop: 1-8 skins, 9 Shield Bubble
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit && state.shopOpen) shopSelect(Number(digit[1]) - 1);
});
document.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'KeyJ') meleeRelease();
    if (e.code === 'KeyX') stopBlock();
});

canvas.addEventListener('click', e => {
    initAudio();
    const p = canvasPos(e.clientX, e.clientY);
    if (handleTap(p.x, p.y)) return;
    if (state.gamePhase !== 'playing' || menu || state.shopOpen || state.won || state.levelComplete) return;
    if (Math.hypot(p.x - player.x, p.y - player.y) > BUILD_REACH) return;
    const cx = Math.floor(p.x / CELL), cy = Math.floor(p.y / CELL);
    if (state.buildMode) { buildAt(cx, cy, p.x, p.y); return; }            // build mode: click to mine or place
    if (blockAtCell(cx, cy) || sceneryAt(p.x, p.y)) buildAt(cx, cy, p.x, p.y);   // otherwise left-click mines, like Minecraft
});
// Right-click places a block, like Minecraft
canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const p = canvasPos(e.clientX, e.clientY);
    if (state.gamePhase !== 'playing' || menu || state.shopOpen || state.won || state.levelComplete) return;
    if (Math.hypot(p.x - player.x, p.y - player.y) > BUILD_REACH) return;
    const cx = Math.floor(p.x / CELL), cy = Math.floor(p.y / CELL);
    if (!blockAtCell(cx, cy)) buildAt(cx, cy, -9999, -9999);   // (far-away aim so it never chops a tree by accident)
});

// ── FRIENDS: Players 2, 3 and 4 on the same screen ──────────
// P2: press P (arrow keys + Enter) or Start on the 2nd controller · P3 / P4: Start on the 3rd / 4th controller
const FRIENDS = [2, 3, 4].map((n, i) => ({ n, pad: i + 1, color: ['#FF8844', '#44CC66', '#AA66FF'][i],
                                           active: false, x: 0, y: 0, hp: 3, inv: 0, down: 0, cooldown: 0, walk: 0, faceX: 1, faceY: 0 }));
const p2 = FRIENDS[0];
const P2_DOWN_FRAMES = 600;   // if a friend runs out of hearts they rest for 10 s, then pop back up
function activeFriends() { return FRIENDS.filter(f => f.active); }

function toggleFriend(f) {
    if (state.gamePhase !== 'playing') return;
    f.active = !f.active;
    if (f.active) {
        Object.assign(f, { x: player.x + 30 * (f.n - 1), y: player.y, hp: 3, inv: 60, down: 0 });
        showToast(f.n === 2 ? '👫 PLAYER 2 JOINED! Arrow keys to move, ENTER to shoot' : `🎮 PLAYER ${f.n} JOINED!`, f.color, 240);
        if (activeFriends().length === 3) giveAward('party4');
    } else showToast(`Player ${f.n} left the game. Bye!`, f.color, 120);
}
function toggleP2() { toggleFriend(p2); }

function hurtFriend(f) {
    if (!f.active || f.down > 0 || f.inv > 0 || settings.creative) return;
    f.hp--; f.inv = 90;
    spawnParticles(f.x, f.y, '#FF4444', 8); sfx('hurt');
    if (f.hp <= 0) { f.down = P2_DOWN_FRAMES; showToast(`Player ${f.n} needs a rest… back in 10 s!`, '#FFAA88', 150); }
}
function hurtP2() { hurtFriend(p2); }

function friendShoot(f) {
    if (!f.active || f.down > 0 || f.cooldown > 0 || state.power === POWER.NONE) return;
    let target = null, best = 500;
    for (const e of targetableEnemies()) { const d = Math.hypot(e.x - f.x, e.y - f.y); if (d < best) { best = d; target = e; } }
    if (!target && state.room === ROOM.HELL && hell.devil.alive) target = hell.devil;
    if (!target) return;
    f.cooldown = 16;
    const a = Math.atan2(target.y - f.y, target.x - f.x), w = WEAPON_INFO[state.power];
    const color = state.power === POWER.RAINBOW ? `hsl(${Math.random() * 360}, 100%, 60%)` : w.color;
    for (const off of (state.powerTier >= 2 ? [-0.2, 0, 0.2] : [0])) {
        projectiles.push({ x: f.x, y: f.y, dx: Math.cos(a + off) * w.speed, dy: Math.sin(a + off) * w.speed, color, power: state.power, life: 90, r: w.size });
    }
    sfx('shoot');
}

function updateFriend(f, pads) {
    if (!f.active) return;
    if (f.cooldown > 0) f.cooldown--;
    if (f.inv > 0) f.inv--;
    if (f.down > 0) {
        if (--f.down === 0) { f.hp = 3; f.inv = 120; f.x = player.x + 30; f.y = player.y; showToast(`Player ${f.n} is back! 💪`, f.color, 120); }
        return;
    }
    let dx = 0, dy = 0;
    if (f.n === 2) {   // Player 2 can use the keyboard
        if (keys['ArrowLeft'])  dx -= 1;
        if (keys['ArrowRight']) dx += 1;
        if (keys['ArrowUp'])    dy -= 1;
        if (keys['ArrowDown'])  dy += 1;
        if (keys['Enter'] || keys['NumpadEnter'] || keys['Numpad0']) friendShoot(f);
    }
    const gp = pads[f.pad];   // their own game controller
    if (gp) {
        if (Math.abs(gp.axes[0] || 0) > PAD_DEADZONE) dx += gp.axes[0];
        if (Math.abs(gp.axes[1] || 0) > PAD_DEADZONE) dy += gp.axes[1];
        const b = i => gp.buttons[i] && gp.buttons[i].pressed;
        if (b(PAD.LEFT)) dx -= 1; if (b(PAD.RIGHT)) dx += 1; if (b(PAD.UP)) dy -= 1; if (b(PAD.DOWN)) dy += 1;
        if (b(PAD.A) || b(PAD.RT)) friendShoot(f);
    }
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    if (len > 0.2) { f.faceX = dx; f.faceY = dy; f.walk += 0.32; }
    const spd = BASE_SPEED * (state.room === ROOM.PARADISE ? 1.2 : 1) * playerSpeedFactor();
    const nx = Math.max(18, Math.min(782, f.x + dx * spd)), ny = Math.max(52, Math.min(582, f.y + dy * spd));
    if (settings.creative || !playerHitsBlock(nx, f.y)) f.x = nx;
    if (settings.creative || !playerHitsBlock(f.x, ny)) f.y = ny;
    // Bad guys hurt friends too
    for (const e of targetableEnemies()) {
        if (e.frog || e.type === 'creeper' || isShieldedAgainst(e.type)) continue;
        if (Math.hypot(e.x - f.x, e.y - f.y) < e.r + 16) hurtFriend(f);
    }
    if (state.room === ROOM.HELL && hell.devil.alive && Math.hypot(hell.devil.x - f.x, hell.devil.y - f.y) < hell.devil.r + 16) hurtFriend(f);
}

function updateP2() {
    const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(p => p && p.connected) : [];
    for (const f of FRIENDS) updateFriend(f, pads);
}

function drawP2() {
    for (const f of activeFriends()) {
        if (f.down > 0) {   // resting
            ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`💤 P${f.n} back in ${Math.ceil(f.down / 60)}s`, f.x, f.y);
            continue;
        }
        if (f.inv > 0 && Math.floor(Date.now() / 80) % 2 === 0) continue;
        drawGroundShadow(f.x + 3, f.y + 19, 16, 5);
        const color = state.power === POWER.NONE ? f.color : getPlayerColor();
        ctx.save(); ctx.shadowColor = f.color; ctx.shadowBlur = 10;
        drawAvatar(f.x, f.y, player.w, color, 'plain', f.walk);
        ctx.restore();
        ctx.fillStyle = f.color; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`P${f.n}`, f.x, f.y - 30);
    }
}

// ── GAME CONTROLLER (Xbox, PlayStation, Switch Pro… anything the browser maps as "standard") ──
const PAD = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, LT: 6, RT: 7, BACK: 8, START: 9, L3: 10, R3: 11, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const PAD_DEADZONE    = 0.3;   // ignore tiny stick wobbles
const PAD_AUTOFIRE    = 10;    // frames between shots while A is held
let   lastInput       = 'keyboard';   // 'keyboard' | 'touch' | 'pad' — picks which hints to show
let   padPrev         = [];
let   pad2StartHeld   = false;
let   padHold         = 0;
const padMove         = { x: 0, y: 0 };

function pollGamepad() {
    padMove.x = padMove.y = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const connected = Array.from(pads).filter(p => p && p.connected);
    const gp = connected[0];
    for (const f of FRIENDS) {   // Start on controller 2, 3 or 4 adds that player
        const pd = connected[f.pad];
        const start = !!(pd && pd.buttons[PAD.START] && pd.buttons[PAD.START].pressed);
        if (start && !f.startHeld && state.gamePhase === 'playing') toggleFriend(f);
        f.startHeld = start;
    }
    if (!gp) { padPrev = []; return; }
    const held = gp.buttons.map(b => b.pressed);
    const was  = padPrev;
    padPrev = held;
    const pressed = i => held[i] && !was[i];
    if (held.some(Boolean) || Math.abs(gp.axes[0] || 0) > 0.5 || Math.abs(gp.axes[1] || 0) > 0.5) {
        lastInput = 'pad';
        initAudio();
    }

    if (pressed(PAD.BACK))  toggleMute();
    if (menu) {
        if (pressed(PAD.START)) { menu = null; return; }
        if (pressed(PAD.LEFT))  moveMenuCursor(-1, 0);
        if (pressed(PAD.RIGHT)) moveMenuCursor(1, 0);
        if (pressed(PAD.UP))    moveMenuCursor(0, -1);
        if (pressed(PAD.DOWN))  moveMenuCursor(0, 1);
        if (pressed(PAD.A))     menuSelect(menu.cursor);
        if (pressed(PAD.B) || pressed(PAD.Y)) menu = null;
        return;
    }
    if (pressed(PAD.B) && !state.shopOpen && !state.awardsOpen) { if (state.buildMode) nextBlock(); else useGadget(); }
    if (pressed(PAD.L3)) toggleBuild();
    if (pressed(PAD.LT)) dash();
    if (pressed(PAD.X) && state.room !== ROOM.VOID) castSpell();
    if (pressed(PAD.R3)) toggleMount();
    if (pressed(PAD.RB)) meleePress();
    if (was[PAD.RB] && !held[PAD.RB]) meleeRelease();
    if (pressed(PAD.LB)) startBlock();
    if (was[PAD.LB] && !held[PAD.LB]) stopBlock();
    if (pressed(PAD.X) && state.gamePhase === 'intro') startFromIntro(true);
    if (pressed(PAD.X) && canOpenShop() && !state.shopOpen) state.awardsOpen = !state.awardsOpen;
    if (state.awardsOpen && pressed(PAD.B)) state.awardsOpen = false;
    if (pressed(PAD.START)) pressStart();
    if (pressed(PAD.Y) || (state.shopOpen && pressed(PAD.B))) toggleShop();

    if (state.shopOpen) {
        // D-pad / stick flicks move the shop cursor; A buys
        if (pressed(PAD.LEFT))  moveShopCursor(-1, 0);
        if (pressed(PAD.RIGHT)) moveShopCursor(1, 0);
        if (pressed(PAD.UP))    moveShopCursor(0, -1);
        if (pressed(PAD.DOWN))  moveShopCursor(0, 1);
        if (pressed(PAD.A))     shopSelect(state.shopCursor);
        return;
    }

    if (pressed(PAD.A) || pressed(PAD.RT)) pressAction();   // hold A for a charge shot
    if (pressed(PAD.Y) && state.room !== ROOM.VOID) superJump();

    let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (Math.abs(x) < PAD_DEADZONE) x = 0;
    if (Math.abs(y) < PAD_DEADZONE) y = 0;
    if (held[PAD.LEFT])  x = -1;
    if (held[PAD.RIGHT]) x = 1;
    if (held[PAD.UP])    y = -1;
    if (held[PAD.DOWN])  y = 1;
    padMove.x = x; padMove.y = y;
}

window.addEventListener('gamepadconnected', () => {
    lastInput = 'pad';
    spawnFloatText(400, 300, '🎮 Controller connected!', '#FFFFFF', 150);
});

// ── VIRTUAL TOUCH CONTROLS ────────────────────────────────────
let isTouchDevice = false;
const VJOY   = { x: 100, y: 490, baseR: 55, maxDist: 40 };
const VSHOOT = { x: 700, y: 490, r: 45 };
const TOUCH_AREA_MULTIPLIER  = 1.5;  // expand tap hit area beyond visible radius
const JOYSTICK_DEADZONE_RATIO = 0.2; // fraction of maxDist before movement starts
const vTouch = { joyId: null, joyDX: 0, joyDY: 0, joyOriX: 0, joyOriY: 0, shootId: null, meleeId: null, blockId: null };
const VMELEE = { x: 620, y: 350, r: 22 };
const VBLOCK = { x: 760, y: 350, r: 20 };
const VJUMP  = { x: 560, y: 405, r: 20 };

function canvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (GAME_W / rect.width);
    const y = (clientY - rect.top)  * (GAME_H / rect.height);
    const flipX = mod('upsideDown') !== mod('mirror'), flipY = mod('upsideDown');   // the picture may be turned or mirrored
    return { x: flipX ? GAME_W - x : x, y: flipY ? GAME_H - y : y };
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    isTouchDevice = true;
    initAudio();
    lastInput = 'touch';
    for (const t of e.changedTouches) {
        const p = canvasPos(t.clientX, t.clientY);
        if (state.gamePhase === 'playing' && !menu && !state.shopOpen) {   // the fighting buttons can be held
            if (Math.hypot(p.x - VMELEE.x, p.y - VMELEE.y) < VMELEE.r * 1.3) { vTouch.meleeId = t.identifier; meleePress(); continue; }
            if (Math.hypot(p.x - VBLOCK.x, p.y - VBLOCK.y) < VBLOCK.r * 1.3) { vTouch.blockId = t.identifier; startBlock(); continue; }
            if (Math.hypot(p.x - VJUMP.x,  p.y - VJUMP.y)  < VJUMP.r * 1.3)  { superJump(); continue; }
        }
        if (handleTap(p.x, p.y)) continue;
        if (vTouch.joyId === null && Math.hypot(p.x - VJOY.x, p.y - VJOY.y) < VJOY.baseR * TOUCH_AREA_MULTIPLIER) {
            vTouch.joyId = t.identifier; vTouch.joyOriX = p.x; vTouch.joyOriY = p.y;
            vTouch.joyDX = 0; vTouch.joyDY = 0;
        } else if (vTouch.shootId === null && Math.hypot(p.x - VSHOOT.x, p.y - VSHOOT.y) < VSHOOT.r * TOUCH_AREA_MULTIPLIER) {
            vTouch.shootId = t.identifier;
            pressAction();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== vTouch.joyId) continue;
        const p = canvasPos(t.clientX, t.clientY);
        const rawDX = p.x - vTouch.joyOriX, rawDY = p.y - vTouch.joyOriY;
        const dist = Math.hypot(rawDX, rawDY);
        const clamped = Math.min(dist, VJOY.maxDist);
        vTouch.joyDX = dist > 0 ? (rawDX / dist) * clamped : 0;
        vTouch.joyDY = dist > 0 ? (rawDY / dist) * clamped : 0;
    }
}, { passive: false });

function clearTouchId(id) {
    if (id === vTouch.joyId)   { vTouch.joyId = null; vTouch.joyDX = 0; vTouch.joyDY = 0; }
    if (id === vTouch.shootId) { vTouch.shootId = null; }
    if (id === vTouch.meleeId) { vTouch.meleeId = null; meleeRelease(); }
    if (id === vTouch.blockId) { vTouch.blockId = null; stopBlock(); }
}
canvas.addEventListener('touchend',    e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });

// ── ENTITY FACTORIES ─────────────────────────────────────────
function makeDigSpots() {
    // One of each weapon, shuffled so every visit is a surprise
    const loot = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER];
    for (let i = loot.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [loot[i], loot[j]] = [loot[j], loot[i]];
    }
    // Only ONE dig spot hides the tunnel to the Underground Caves — nobody knows which
    const tunnel = Math.floor(Math.random() * DIG_SPOTS.length);
    return DIG_SPOTS.map((s, i) => ({ x: s.x, y: s.y, hits: 0, depth: 0, weapon: loot[i], tunnel: i === tunnel }));
}

function inAnyCave(x, y, pad = 0) {
    return HELL_CAVES.some(c => x >= c.x - pad && x <= c.x + c.w + pad && y >= c.y - pad && y <= c.y + c.h + pad);
}

function makeWorms() {
    const list = [];
    const n = LEVEL_CONFIGS[state.level - 1].worms;
    while (list.length < n) {
        const x = 80 + Math.random() * 640, y = 90 + Math.random() * 460;
        if (inAnyCave(x, y, 20) || Math.hypot(x - 100, y - 300) < 180) continue;   // not in caves, not on the entrance
        list.push({ type: 'worm', x, y, r: 15, hp: 3, maxHp: 3, alive: true, hitFlash: 0, frozen: 0,
                    hidden: true, wState: 'under', wTimer: WORM_UNDER_FRAMES * (0.5 + Math.random()), spit: WORM_SPIT_FRAMES });
    }
    return list;
}

function makeHell() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    return {
        digSpots: makeDigSpots(),
        foundMsg: null,   // { text, sub, color, timer } — floats up in the middle after digging
        enemies:  [],     // bad guys in Hell (mole monsters, lava worms, mini-devils)
        summonTimer: IMP_SUMMON_FRAMES,
        devil: {
            x: 660, y: 300, r: cfg.devilR, alive: true, shieldFlash: 0, frozen: 0,

}

function makeEnemy(type, x, y, dx, dy) {

    return { type, x, y, dx, dy, r: 16, hp, maxHp: hp, alive: true, hitFlash: 0, hopTimer: 0, frozen: 0,
             home: { x, y, dx, dy } };   // where to respawn for the next wave
}

function makeParadise() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    const enemies = [
        makeEnemy('fire',  200, 150,  1.2,  0.8),
        makeEnemy('fire',  550, 200, -0.9,  1.1),
        makeEnemy('fire',  350, 400,  1.0, -1.0),
        makeEnemy('ghost', 300, 250, -0.7,  0.9),
        makeEnemy('ghost', 600, 350,  0.8, -0.8),
        makeEnemy('bat',   150, 350,  2.0,  1.4),
        makeEnemy('slime', 450, 150,  0,    0),
    ];
    // Extra enemies for harder levels
    for (let i = 0; i < cfg.extraFireMonsters; i++) {
        enemies.push(makeEnemy('fire', 150 + i * 200, 100 + i * 80, 1.1 + i * 0.2, -0.9 - i * 0.15));
        enemies.push(makeEnemy('bat',  250 + i * 150, 450 - i * 60, -1.8 - i * 0.2, 1.2));

function gardenStage(i) {
    const t = state.garden[i];
    if (!t) return 0;                                    // empty
    return Math.min(3, 1 + Math.floor((Date.now() - t) / (GROW_MS / 2)));   // 1 seed, 2 sprout, 3 ready!
}

function nearHome(obj, r = 34) { return state.room === ROOM.HOUSE && Math.hypot(player.x - obj.x, player.y - obj.y) < r; }
function nearPot() { return state.room === ROOM.HOUSE ? GARDEN_POTS.findIndex(p => Math.hypot(player.x - p.x, player.y - p.y) < 26) : -1; }

// Things you can do at home with the main button
function tryHomeAction() {
    if (state.room !== ROOM.HOUSE) return false;
    if (nearHome(CATALOGUE)) { openMenu('📖 FURNITURE CATALOGUE', furnitureItems); return true; }
    if (nearHome(HOUSE_BED, 40)) {
        state.playerHp = fullHearts();
        spawnParticles(player.x, player.y, '#FF88AA', 12);
        showToast('Zzz… you had a lovely nap. All hearts back! ❤', '#FFB0C8');
        sfx('buy');
        return true;
    }
    const i = nearPot();
    if (i >= 0) {
        const stage = gardenStage(i), p = GARDEN_POTS[i];
        if (stage === 0) { state.garden[i] = Date.now(); spawnFloatText(p.x, p.y - 30, '🌱 Planted! Come back soon', '#88FF88', 70); sfx('dig'); }
        else if (stage < 3) spawnFloatText(p.x, p.y - 30, 'Still growing…', '#CCFFCC', 50);
        else {
            state.garden[i] = 0;
            const veg = ['🥕 Carrot', '🍓 Strawberry', '🍅 Tomato', '🌽 Corn'][i];
            if (state.playerHp < fullHearts()) { state.playerHp++; spawnFloatText(p.x, p.y - 30, `${veg}! +1 ❤`, '#FFAA66', 80); }
            else { addScore(20); spawnFloatText(p.x, p.y - 30, `${veg}! +20`, '#FFAA66', 80); }
            sfx('found'); giveAward('gardener');
        }
        return true;
    }
    return false;
}

function furnitureItems() {
    return FURNITURE.map(f => ({
        icon: f.icon, name: f.name, desc: 'Makes your home look amazing', cost: f.cost,
        status: state.furniture[f.id] ? 'IN YOUR HOME' : null,
        action: () => {
            if (state.furniture[f.id]) return;
            if (spend(f.cost)) {
                state.furniture[f.id] = true;
                showToast(`${f.icon} ${f.name} added to your home!`);
                if (FURNITURE.every(x => state.furniture[x.id])) giveAward('decorator');
            }
        },
    }));
}

function paintHouse(g, R) {
    // Wooden floor
    for (let y = 130; y < 600; y += 20) {
        for (let x = (y / 20) % 2 ? -40 : 0; x < 800; x += 80) {
            g.fillStyle = `hsl(30, ${35 + R() * 10}%, ${38 + R() * 8}%)`;
            g.fillRect(x, y, 79, 19);
        }
    }
    // Wallpaper wall with a skirting board
    g.fillStyle = '#F4E4C8'; g.fillRect(0, 46, 800, 90);
    g.fillStyle = 'rgba(220,160,120,0.35)';
    for (let x = 0; x < 800; x += 24) g.fillRect(x, 46, 10, 90);
    g.fillStyle = '#8A5A34'; g.fillRect(0, 130, 800, 8);
    // Windows
    for (const wx of [90, 690]) {
        const sky = g.createLinearGradient(0, 62, 0, 118);
        sky.addColorStop(0, '#7FC8FF'); sky.addColorStop(1, '#D8F0FF');
        g.fillStyle = sky; g.fillRect(wx - 28, 62, 56, 56);
        g.strokeStyle = '#FFFFFF'; g.lineWidth = 4; g.strokeRect(wx - 28, 62, 56, 56);
        g.beginPath(); g.moveTo(wx, 62); g.lineTo(wx, 118); g.moveTo(wx - 28, 90); g.lineTo(wx + 28, 90); g.stroke();
    }
    // Garden corner (soil)
    g.fillStyle = '#6B8A3A'; g.fillRect(520, 430, 270, 80);
    // Front door mat
    g.fillStyle = '#8A3A2A'; g.fillRect(360, 560, 80, 30);
}

                     const gl = ctx.createRadialGradient(690, 150, 4, 690, 150, 70); gl.addColorStop(0, 'rgba(255,230,150,0.35)'); gl.addColorStop(1, 'rgba(255,230,150,0)'); ctx.fillStyle = gl; ctx.fillRect(620, 80, 140, 140); }

function updateArena() {
    const A = place();
    if (A.done) return;

    if (bossAlive) return;
    if (A.wave >= BOSS_RUSH.length) {   // beat them all!
        A.done = true;
        A.enemies.forEach(e => { e.alive = false; });
        addScore(500); giveAward('bossRush');

    A.enemies.push(boss);

    if (state.playerHp < fullHearts()) state.playerHp++;   // a little heal between bosses

function inRectXY(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function spikesUp() { return place().spikeTimer % 120 < 50; }

function nearVine() {
    if (state.room !== ROOM.JUNGLE || place().swing) return null;
    return VINES.findIndex(v => Math.hypot(player.x - v.x, player.y - v.y) < 30);
}

// The main button in the new places: tame the dinosaur, swing on a vine
function tryPlaceAction() {
    if (state.room === ROOM.DINO && !place().tamed && Math.hypot(player.x - TRICERATOPS.x, player.y - TRICERATOPS.y) < 50) {
        place().tamed = true;
        state.mounts.dino = true; state.mount = 'dino'; state.lastMount = 'dino';
        showToast('🦕 You tamed the Triceratops! RIDE IT! (it stomps monsters)', '#AAFF88', 240);
        sfx('win'); giveAward('dinoRider');
        return true;
    }
    if (state.room === ROOM.CLOUDCITY) {
        const P = place();
        if (Math.hypot(player.x - MAMA_BIRD.x, player.y - MAMA_BIRD.y) < 40) {
            const got = P.eggs.filter(e => e.got).length;
            if (got === 3 && !P.returned) {
                P.returned = true; state.inv.diamond = invCount('diamond') + 3; addScore(200);
                showToast('🐣 Mama Bird: "My eggs! THANK YOU!" (+3 diamonds, +200)', '#FFE066', 240); sfx('win'); giveAward('eggs');
            } else showToast(P.returned ? '🐦 Mama Bird: "My babies are hatching! Thank you!"' : `🐦 Mama Bird: "I lost 3 eggs in the clouds! You found ${got}."`, '#FFFFFF', 200);
            return true;
        }
        const bird = P.birds.find(b => Math.hypot(player.x - b.x, player.y - b.y) < 40);
        if (bird) { showToast(`🐦 ${BIRD_CHAT[Math.floor(Math.random() * BIRD_CHAT.length)]}`, '#FFFFFF', 150); sfx('hoot'); return true; }
    }
    const v = nearVine();
    if (v !== null && v >= 0) {
        place().swing = { from: VINES[v], to: VINES[1 - v], t: 0 };
        sfx('whoosh');
        return true;
    }
    return false;
}

function updateNewPlaces() {
    const P = place();
    if (state.room === ROOM.PYRAMID) {
        PYRAMID_WALLS.forEach((w, i) => {
            if (P.found[i] || Math.hypot(player.x - w.x, player.y - w.y) > 34) return;
            P.found[i] = true;
            const prize = i === 0 ? () => { state.inv.diamond = invCount('diamond') + 2; return '💎 2 diamonds'; } : () => { state.playerHp = fullHearts(); state.bubble = true; addScore(150); return '❤ full hearts, a Shield Bubble and 150 points'; };
            showToast(`🏺 A SECRET TREASURE ROOM! You found ${prize()}!`, '#FFE066', 240);
            spawnParticles(w.x, w.y, '#FFD700', 20); sfx('win'); giveAward('pyramidSecret');
        });
    }
    if (state.room === ROOM.CLOUDCITY) {
        for (const b of P.birds) { b.t += 0.01; b.x += Math.sin(b.t * 2) * 0.8; b.y += Math.cos(b.t * 3) * 0.4; }
        for (const e of P.eggs) {
            if (e.got || Math.hypot(player.x - e.x, player.y - e.y) > 22) continue;
            e.got = true; sfx('coin');
            spawnFloatText(e.x, e.y - 20, `🥚 Found an egg! (${P.eggs.filter(x => x.got).length}/3)`, '#FFFFFF', 80);
        }
    }
    if (state.room === ROOM.VOLCANO) {
        // Hot lava hurts (unless you fly over it on your dragon)
        if (state.mount !== 'dragon' && LAVA_RIVERS.some(r => inRectXY(player.x, player.y + 12, r)) && state.playerInvincible === 0) {
            damagePlayer();
            spawnFloatText(player.x, player.y - 30, 'HOT! 🔥', '#FF6633', 50);
        }
    }
    if (state.room === ROOM.JUNGLE) {
        P.spikeTimer++;
        if (P.swing) {   // swinging across the pit
            P.swing.t += 0.025;
            const k = Math.min(1, P.swing.t);
            player.x = P.swing.from.x + (P.swing.to.x - P.swing.from.x) * k;
            player.y = P.swing.from.y + (P.swing.to.y - P.swing.from.y) * k - Math.sin(k * Math.PI) * 60;
            if (k >= 1) P.swing = null;
            return;
        }
        if (inRectXY(player.x, player.y + 10, JUNGLE_PIT) && state.mount !== 'dragon') {   // fell in!
            damagePlayer();
            [player.x, player.y] = PLACES.jungle.spawn;
            showToast('😵 You fell in the pit! Use the VINE to swing across.', '#FFAA66', 160);
        }
        if (spikesUp() && state.playerInvincible === 0 && SPIKES.some(sp => Math.hypot(player.x - sp.x, player.y + 12 - sp.y) < 16)) damagePlayer();
        if (--P.trapTimer <= 0) {   // arrow traps in the walls
            P.trapTimer = 110;
            for (const y of [150, 460]) {
                enemyProjectiles.push({ x: 10, y, dx: 6, dy: 0, color: '#8A6A3A', life: 140, r: 5, enemyType: 'trap' });
                enemyProjectiles.push({ x: 790, y: y + 40, dx: -6, dy: 0, color: '#8A6A3A', life: 140, r: 5, enemyType: 'trap' });
            }
            sfx('whoosh');
        }
        if (!P.idolTaken && Math.hypot(player.x - JUNGLE_IDOL.x, player.y - JUNGLE_IDOL.y) < 28) {
            P.idolTaken = true;
            state.inv.diamond = invCount('diamond') + 2; addScore(150);
            showToast('🗿 THE GOLDEN IDOL! +2 diamonds and 150 points!', '#FFD700', 240);
            spawnParticles(JUNGLE_IDOL.x, JUNGLE_IDOL.y, '#FFD700', 20); sfx('win'); giveAward('idol');
        }
    }
    // The tamed dinosaur stomps monsters it runs into
    if (state.mount === 'dino' && (updateNewPlaces.stomp = (updateNewPlaces.stomp || 0) + 1) % 30 === 0) {
        for (const e of targetableEnemies()) if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + 26) { damageEnemy(e, POWER.NONE, false, 1); triggerShake(4); }
    }
}

function drawBalloon(x, y, text) {
    const bob = Math.sin(Date.now() / 600) * 4;
    ctx.save();
    ctx.strokeStyle = '#6B3E1E'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 14, y - 26 + bob); ctx.lineTo(x - 9, y - 4 + bob); ctx.moveTo(x + 14, y - 26 + bob); ctx.lineTo(x + 9, y - 4 + bob); ctx.stroke();
    ['#FF4466', '#FFDD33', '#44AAFF', '#FF4466'].forEach((c, i) => {
        ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x - 18 + i * 12, y - 52 + bob, 8, 28, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#A0703A'; ctx.fillRect(x - 10, y - 6 + bob, 20, 14);   // basket
    ctx.fillStyle = '#446'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.fillText(`🎈 ${text}`, x, y + 24);

}

    if (state.room === ROOM.CLOUDCITY && near(BALLOON, 30))  { changeRoom(ROOM.HEAVEN); player.x = BALLOON.x + 60; player.y = BALLOON.y - 20; return true; }
    if (state.room === ROOM.TOY && near(TOY_EXIT, 26))       { changeRoom(ROOM.MALL); player.x = 460; player.y = 300; return true; }
    if (state.room === ROOM.VOID && near(MALL_DOOR, 24))     { changeRoom(ROOM.MALL); showToast('🏬 Welcome to the Mall! Walk up to a shop.', '#FFE066', 160); return true; }
    if (state.room === ROOM.MALL && near(MALL_EXIT, 26))     { changeRoom(ROOM.VOID); player.x = MALL_DOOR.x + 40; player.y = MALL_DOOR.y + 50; return true; }

    if (state.room === ROOM.ARENA && near(ARENA_EXIT, 26))   { changeRoom(ROOM.VOID); player.x = ARENA_GATE.x + 50; player.y = ARENA_GATE.y - 30; return true; }

// 🗺 A treasure map from Captain Salty: follow 3 clues, dig at each spot
const TREASURE_SPOTS = [
    { room: 'paradise', x: 400, y: 400, clue: 'Dig just below the fountain in Paradise' },
    { room: 'paradise', x: 140, y: 420, clue: 'Dig by the gate of the farm in Paradise' },
    { room: 'paradise', x: 480, y: 575, clue: 'Dig on the sandy beach in Paradise' },
    { room: 'void',     x: 180, y: 470, clue: 'Dig next to the rocket in the Void' },
    { room: 'hell',     x: 140, y: 520, clue: 'Dig beside the lava pool in Hell' },
    { room: 'heaven',   x: 330, y: 250, clue: 'Dig by the pearly gates in Heaven' },
    { room: 'candy',    x: 400, y: 370, clue: 'Dig by the chocolate river in Candy Land' },
];
const TREASURE_HITS = 3;

function startTreasureMap() {
    const spots = [...TREASURE_SPOTS].sort(() => Math.random() - 0.5).slice(0, 3);
    state.treasure = { spots, step: 0, hits: 0 };
    showToast(`🗺 CLUE 1: ${spots[0].clue}!`, '#FFE8A0', 300);
}

function treasureSpotHere() {
    const T = state.treasure;
    if (!T || T.step >= T.spots.length) return null;
    const sp = T.spots[T.step];
    return sp.room === state.room ? sp : null;
}

function tryTreasureDig() {
    const sp = treasureSpotHere();
    if (!sp || Math.hypot(player.x - sp.x, player.y - sp.y) > 30) return false;
    const T = state.treasure;
    T.hits++;
    state.digAnim = 14;
    spawnParticles(sp.x, sp.y, '#8B5A2B', 6); sfx('dig');
    if (T.hits < TREASURE_HITS) return true;
    T.hits = 0; T.step++;
    if (T.step < T.spots.length) {
        showToast(`📜 Another clue! CLUE ${T.step + 1}: ${T.spots[T.step].clue}!`, '#FFE8A0', 320);
        sfx('found');
    } else {
        state.inv.diamond = invCount('diamond') + 5;
        state.hats.crown = true;
        addScore(300);
        showToast('💰 YOU FOUND THE TREASURE! 5 diamonds, a golden crown and 300 points!', '#FFD700', 320);
        spawnConfettiAt(sp.x, sp.y); sfx('win'); giveAward('treasure');
        state.treasure = null;
    }
    return true;
}

// A sparkly X when you're close to the spot (the clue tells you roughly where)
function drawTreasureX() {
    const sp = treasureSpotHere();
    if (!sp) return;
    const d = Math.hypot(player.x - sp.x, player.y - sp.y);
    if (d > 130) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (130 - d) / 70);
    ctx.strokeStyle = '#C0302A'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sp.x - 9, sp.y - 9); ctx.lineTo(sp.x + 9, sp.y + 9); ctx.moveTo(sp.x + 9, sp.y - 9); ctx.lineTo(sp.x - 9, sp.y + 9); ctx.stroke();
    if (d < 30) {
        ctx.fillStyle = '#FFF'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`${lastInput === 'pad' ? 'A' : lastInput === 'touch' ? 'Tap' : 'SPACE'}: Dig for treasure!`, sp.x, sp.y - 18);
    }
    ctx.restore();
}

function sailItems() {
    const trip = (room, icon, desc) => ({ icon, name: PLACES[room].name.replace(/^\S+ /, ''), desc, cost: 0, status: 'SAIL!',

    return [
        { icon: '🗺', name: 'Treasure Map', desc: state.treasure ? 'You already have one — follow the clues!' : 'Follow 3 clues to hidden treasure', cost: 0,
          status: state.treasure ? `CLUE ${state.treasure.step + 1}/3` : 'FREE!',
          action: () => { if (!state.treasure) { menu = null; startTreasureMap(); } } },
        trip(ROOM.CANDY,   '🍭', 'Gummy bears and lollipops'),
        trip(ROOM.ICE,     '❄', 'Snowmen and the Frost Giant'),
        trip(ROOM.HAUNTED, '👻', 'Skeletons, ghosts and a secret door'),
        trip(ROOM.DINO,    '🦕', 'Raptors — and a dinosaur you can ride!'),
        trip(ROOM.VOLCANO, '🌋', 'Lava rivers and the Fire Dragon'),
        trip(ROOM.JUNGLE,  '🐒', 'Vines, traps and a golden idol'),
        trip(ROOM.PYRAMID, '🏜', 'Mummies, scarabs and secret rooms'),
        { icon: '🟡', name: 'Submarine Dive', desc: 'Sharks, jellyfish and a Giant Octopus', cost: 0, status: 'DIVE!',
          action: () => { menu = null; changeRoom(ROOM.UNDERWATER); showToast('🟡 Diving down in the yellow submarine! 🌊', '#88DDFF', 180); giveAward('diver'); } },
    ];
}

function updatePlace() {
    const P = place();
    if (!P) return;
    if (state.room === ROOM.ARENA) updateArena();
    updateNewPlaces();
    if (state.room === ROOM.SHIP) {
        // Pirates climb aboard in waves until you reach the island
        if (--P.waveTimer <= 0 && P.voyage > 200) {
            P.waveTimer = 260;
            for (const side of [0, 1]) P.enemies.push(e0('pirate', side ? 700 : 100, 200 + Math.random() * 250));
            showToast('🏴‍☠️ PIRATES are climbing aboard!', '#FF8866', 100);
        }
        if (--P.voyage <= 0) {
            showToast('🏝 LAND HO! We made it!', '#FFE066', 180);
            giveAward('sailor');
            changeRoom(state.voyageTo || ROOM.CANDY);
            return;   // we're on the island now — don't keep running the ship's code
        }
    }
    if (state.room === ROOM.CANDY) {
        for (const l of P.lollipops) {
            if (l.picked || Math.hypot(player.x - l.x, player.y - l.y) > 22) continue;
            l.picked = true;
            if (state.playerHp < fullHearts()) state.playerHp++;
            addScore(15);
            spawnFloatText(l.x, l.y - 20, '🍭 Yum! +1 ❤', '#FF88CC', 70);
            sfx('coin');
        }
    }
    if (state.room === ROOM.HAUNTED) {
        const sh = HAUNTED_SHELVES[P.secret];
        if (!P.secretOpen && Math.hypot(player.x - sh.x, player.y - (sh.y + 30)) < 30) {
            P.secretOpen = true;

const WISH_ANGEL = { id: 'angel', name: 'Angel of Wishes', x: 400, y: 232 };
function makeHeaven() {
    state.heavenWishes = 3;
    return { angels: [0, 1, 2].map(i => ({ x: 150 + i * 250, y: 380 + (i % 2) * 60, t: i * 2 })) };
}
let heaven = makeHeaven();

function updateHeaven() {
    if (state.room !== ROOM.HEAVEN) return;
    for (const a of heaven.angels) { a.t += 0.01; a.x = 400 + Math.sin(a.t + a.y) * 300; a.y += Math.sin(a.t * 3) * 0.3; }
}

function nearWishAngel() {
    return state.room === ROOM.HEAVEN && Math.hypot(player.x - WISH_ANGEL.x, player.y - WISH_ANGEL.y) < 44;
}

function wishItems() {
    const wish = (icon, name, desc, give) => ({
        icon, name, desc, cost: 0, status: state.heavenWishes > 0 ? `${state.heavenWishes} wish${state.heavenWishes > 1 ? 'es' : ''} left` : null,
        action: () => {
            if (state.heavenWishes <= 0) { showToast('No wishes left — come back to Heaven another time!', '#AACCFF', 140); return; }
            state.heavenWishes--; give(); sfx('magic'); spawnParticles(player.x, player.y, '#FFF4B0', 20);
        },
    });
    const petWish = () => {
        const free = PETS.map((p, i) => i).filter(i => !state.ownedPets[i]);
        if (!free.length) { showToast('You already have every pet!'); state.heavenWishes++; return; }
        const j = free[Math.floor(Math.random() * free.length)];
        state.ownedPets[j] = true; state.activePet = j; placePetBesidePlayer();
        showToast(`🐾 A ${PETS[j].name} flew down from the clouds for you!`); giveAward('pet');
        if (state.ownedPets.every(Boolean)) giveAward('allPets');
    };
    const weapon = (pw) => () => { state.power = pw; state.powerTier = 2; showToast(`✨ SUPER ${WEAPON_INFO[pw].label}!`); };
    return [
        wish('❤', 'Full hearts + Bubble', 'All your hearts and a Shield Bubble', () => { state.playerHp = fullHearts(); state.bubble = true; showToast('❤ All better — and a Shield Bubble!'); }),
        wish('🌈', 'Rainbow Power', 'The rarest weapon of all', () => { state.power = POWER.RAINBOW; state.powerTier = 3; giveAward('rainbow'); showToast('🌈 RAINBOW POWER!'); }),

        wish('🔥', 'Super Fire', 'Beats Ghosts, Spiders & Zombies', weapon(POWER.BRIMSTONE)),
        wish('⚡', 'Super Lightning', 'Beats Bats and jumps between monsters', weapon(POWER.LIGHTNING)),
        wish('💧', 'Super Water', 'Beats Slimes, Moles & Robots', weapon(POWER.WATER)),
        wish('🐾', 'A New Pet', 'A pet you don\'t have yet', petWish),
        wish('🧱', 'Stack of Blocks', '+16 of every block to build with', () => { for (const b of HOTBAR) state.inv[b] = invCount(b) + 16; showToast('🧱 +16 of every block!'); }),
    ];
}
