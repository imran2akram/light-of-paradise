<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Light of Paradise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        canvas { display: block; border: 2px solid #333; cursor: pointer; max-width: 100%; max-height: 100vh; height: auto; touch-action: none; }

        #videoOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            transition: opacity 0.9s ease;
        }
        #introVideo {
            max-width: 100%; max-height: 90vh;
            display: block;
        }
        #skipHint {
            position: absolute; bottom: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px; font-family: Arial, sans-serif;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 0.5; }
            50%      { opacity: 1;   }
        }
    </style>
</head>
<body>
<div id="videoOverlay">
    <video id="introVideo" src="Light of paradise opening.mp4" autoplay muted playsinline></video>
    <div id="skipHint">Press SPACE, click, or tap to skip</div>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width  = 800;
canvas.height = 600;

// ── VIDEO INTRO ───────────────────────────────────────────────
let voidBgColor = '#a0a0a0'; // light grey, darker than the white player

(function setupVideoIntro() {
    const overlay = document.getElementById('videoOverlay');
    const video   = document.getElementById('introVideo');
    let dismissed = false;

    function captureLastFrameColor() {
        try {
            const oc   = document.createElement('canvas');
            oc.width   = video.videoWidth  || 640;
            oc.height  = video.videoHeight || 360;
            const octx = oc.getContext('2d');
            octx.drawImage(video, 0, 0, oc.width, oc.height);
            // Sample a 5×5 grid across the frame
            let r = 0, g = 0, b = 0, n = 0;
            for (let sx = 0.1; sx <= 0.95; sx += 0.2) {
                for (let sy = 0.1; sy <= 0.95; sy += 0.2) {
                    const d = octx.getImageData(
                        Math.floor(sx * oc.width),
                        Math.floor(sy * oc.height), 1, 1).data;
                    r += d[0]; g += d[1]; b += d[2]; n++;
                }
            }
            // Darken the average so it works as a subtle game background
            r = Math.floor(r / n * 0.32);
            g = Math.floor(g / n * 0.32);
            b = Math.floor(b / n * 0.32);
            voidBgColor = `rgb(${r},${g},${b})`;
        } catch (e) { /* keep default if CORS/decode fails */ }
    }

    function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.style.opacity = '0';
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    }

    video.addEventListener('ended',   dismiss);
    overlay.addEventListener('click',      dismiss);
    overlay.addEventListener('touchstart', e => { e.preventDefault(); dismiss(); }, { passive: false });
    document.addEventListener('keydown', function onKey(e) {
        if (e.code === 'Space') { e.preventDefault(); dismiss(); document.removeEventListener('keydown', onKey); }
    });

    // Fallback: if video fails to load/play, still dismiss after a short wait
    video.addEventListener('error', () => setTimeout(dismiss, 100));
})();

// ── CONSTANTS ────────────────────────────────────────────────
const ROOM  = { VOID: 'void', HELL: 'hell', PARADISE: 'paradise' };
const POWER = { NONE: 'None', ICE: 'Ice', BRIMSTONE: 'Brimstone', LIGHTNING: 'Lightning', WATER: 'Water', RAINBOW: 'Rainbow' };

// ── WEAPONS ──────────────────────────────────────────────────
const WEAPON_INFO = {
    Ice:       { label: 'ICE',           icon: '❄', color: '#4488FF', speed: 9,  size: 6 },
    Brimstone: { label: 'FIRE',          icon: '🔥', color: '#FF4422', speed: 9,  size: 6 },
    Lightning: { label: 'LIGHTNING',     icon: '⚡', color: '#FFE033', speed: 13, size: 5 },   // fastest shots
    Water:     { label: 'WATER',         icon: '💧', color: '#33CCDD', speed: 8,  size: 8 },   // biggest shots
    Rainbow:   { label: 'RAINBOW POWER', icon: '🌈', color: '#FF66FF', speed: 10, size: 7 },
};

// ── BAD GUYS ─────────────────────────────────────────────────
// Every weapon hurts every bad guy a little; the weapon it's weak to hurts a LOT.
// Your weapon also shields you from the bad guys it's strong against.
const ENEMY_TYPES = {
    fire:  { name: 'Fire Monster', hp: 3, weakTo: POWER.ICE,       color: '#FF6600' },
    ghost: { name: 'Ghost',        hp: 3, weakTo: POWER.BRIMSTONE, color: '#CC88FF' },
    bat:   { name: 'Bat',          hp: 3, weakTo: POWER.LIGHTNING, color: '#9966CC' },
    slime: { name: 'Slime',        hp: 3, weakTo: POWER.WATER,     color: '#66DD44' },
    mole:  { name: 'Mole Monster', hp: 3, weakTo: POWER.WATER,     color: '#C08040' },
};
const DAMAGE_STRONG = 3;   // right weapon for this bad guy
const DAMAGE_WEAK   = 1;   // any other weapon still does a little
const FREEZE_FRAMES       = 120;   // ICE freezes bad guys solid for 2 s
const DEVIL_FREEZE_FRAMES = 30;    // …and the Devil for half a second
const CHAIN_JUMPS         = 2;     // LIGHTNING jumps to this many more bad guys
const CHAIN_RANGE         = 160;   // …if they're this close
const HEART_DROP_CHANCE   = 0.2;   // defeated bad guys sometimes drop a heart
const BASE_SPEED = 4;

// ── LEVEL CONFIGURATIONS ─────────────────────────────────────
const LEVEL_CONFIGS = [
    { // Level 1 – Standard
        ammoMax: 5, reloadFrames: 180,
        devilHp: 5, devilR: 28, devilSpeed: 0.9, devilShootRate: 110, devilShotsPerFire: 1,
        extraFireMonsters: 0, extraGhosts: 0,
        playerMaxHp: 3,
        coinCount: 6, isBoss: false,
    },
    { // Level 2 – Hard
        ammoMax: 4, reloadFrames: 240,
        devilHp: 10, devilR: 28, devilSpeed: 1.2, devilShootRate: 80,  devilShotsPerFire: 1,
        extraFireMonsters: 1, extraGhosts: 1,
        playerMaxHp: 3,
        coinCount: 8, isBoss: false,
    },
    { // Level 3 – BOSS
        ammoMax: 4, reloadFrames: 270,
        devilHp: 20, devilR: 52, devilSpeed: 1.4, devilShootRate: 55,  devilShotsPerFire: 3,
        extraFireMonsters: 2, extraGhosts: 2,
        playerMaxHp: 2,
        coinCount: 10, isBoss: true,
    },
];
const MAX_LEVELS       = 3;
const DEVIL_BULLET_SPEED = 7.5;   // px/frame (player moves 4)
const CAVE_MAX_FRAMES  = 3600;  // 1 minute at 60 fps — same for all levels

// ── AVATAR SKINS ─────────────────────────────────────────────
const AVATAR_COLORS      = ['#FFFFFF', '#4488FF', '#44FF66', '#FF4422', '#FFD700', '#2A2A2A', '#B8C4CC', '#44BB55'];
const AVATAR_NAMES       = ['White', 'Blue', 'Green', 'Red', 'Gold', 'Ninja', 'Robot', 'Dragon'];
const AVATAR_STYLES      = ['plain', 'plain', 'plain', 'plain', 'plain', 'ninja', 'robot', 'dragon'];
const AVATAR_UNLOCK_COST = [0, 5, 10, 15, 20, 25, 30, 40];  // coins needed to unlock each skin
const BUBBLE_COST        = 5;                               // Shield Bubble (shop key 9)

// ── HELL CAVES (player can hide here; devil switches to WANDER) ──
const HELL_CAVES = [
    { x: 55,  y: 55,  w: 175, h: 115 },
    { x: 570, y: 400, w: 175, h: 130 },
];

// ── DIG SPOTS (weapons are buried underground inside the caves) ──
const DIG_SPOTS = [
    { x: 105, y: 125 }, { x: 180, y: 125 },   // top-left cave
    { x: 620, y: 480 }, { x: 695, y: 480 },   // bottom-right cave
];
const DIG_MAX_DEPTH       = 3;                 // layers in each dig spot
const DIG_HITS_PER_LAYER  = [3, 4, 5];         // Space / DIG presses per layer (deeper = harder)
const DIG_MOLE_CHANCE     = [0.3, 0.6, 1.0];   // chance a mole monster pops out of each layer
const DIG_RANGE           = 24;                // how close the player must stand to a dig spot
// Layer 1: Ice / Fire / Lightning / Water · Layer 2: SUPER (3 shots at once) · Layer 3: RAINBOW (strong vs everything)

// ── STATE ────────────────────────────────────────────────────
let state = {
    room:               ROOM.VOID,
    lightCrystals:      0,
    power:              POWER.NONE,
    powerTier:          1,         // 1 normal · 2 super · 3 rainbow (deeper digs = higher tier)
    won:                false,
    levelComplete:      false,     // true when current level beaten (but more levels remain)
    screenShake:        0,
    playerFlash:        0,
    gamePhase:          'intro',   // 'intro' | 'playing'
    playerHp:           3,
    playerInvincible:   0,
    confettiSpawned:    false,
    paradiseClearCount: 0,         // how many crystals collected (0–3)
    voidHealTimer:      0,         // counts frames toward next +1 HP heal in Void
    // Level / progression
    level:              1,
    // Ammo
    ammo:               5,
    ammoMax:            5,
    ammoReloading:      false,
    ammoReloadTimer:    0,
    // Cave timer
    caveTimer:          0,
    caveProtectionExpired: false,
    // Coins & shop
    coins:              0,
    shopOpen:           false,
    unlockedSkins:      [true, ...Array(AVATAR_COLORS.length - 1).fill(false)],
    activeSkin:         0,
    bubble:             false,     // Shield Bubble from the shop — blocks one hit
    // Score
    score:              0,
    newBest:            false,     // beat the high score this game
};

// ── PLAYER ───────────────────────────────────────────────────
const player = { x: 400, y: 300, w: 32, h: 32 };

// ── INPUT ────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if (e.code === 'KeyM') toggleMute();
    if (e.code === 'Space') {
        e.preventDefault();
        if (state.gamePhase === 'intro') {
            state.gamePhase = 'playing';
        } else if (state.levelComplete) {
            advanceLevel();
        } else if (!tryDig()) {
            shoot();
        }
    }
    // Shop toggle (E key, only in Void)
    if (e.code === 'KeyE' && state.gamePhase === 'playing'
        && state.room === ROOM.VOID && !state.won && !state.levelComplete) {
        state.shopOpen = !state.shopOpen;
    }
    // Number keys 1-8: equip / unlock skins in shop · 9: Shield Bubble
    if (e.code === 'Digit9' && state.shopOpen && !state.bubble && state.coins >= BUBBLE_COST) {
        state.coins -= BUBBLE_COST;
        state.bubble = true;
        sfx('buy');
    }
    const skinKey = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Digit5: 4, Digit6: 5, Digit7: 6, Digit8: 7 };
    if (e.code in skinKey && state.shopOpen) {
        const idx = skinKey[e.code];
        if (state.unlockedSkins[idx]) {
            state.activeSkin = idx;
        } else if (state.coins >= AVATAR_UNLOCK_COST[idx]) {
            state.coins -= AVATAR_UNLOCK_COST[idx];
            state.unlockedSkins[idx] = true;
            state.activeSkin = idx;
            spawnParticles(player.x, player.y, AVATAR_COLORS[idx], 8);
            sfx('buy');
        }
    }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Play Again / Next Level click
canvas.addEventListener('click', e => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (800 / rect.width);
    const my = (e.clientY - rect.top)  * (600 / rect.height);
    if (Math.hypot(mx - MUTE_BTN.x, my - MUTE_BTN.y) < MUTE_BTN.r * 1.4) { toggleMute(); return; }
    if (!state.won && !state.levelComplete) return;
    if (mx >= 300 && mx <= 500 && my >= 420 && my <= 475) {
        if (state.levelComplete) advanceLevel();
        else resetGame();
    }
});

// ── VIRTUAL TOUCH CONTROLS ────────────────────────────────────
let isTouchDevice = false;
const VJOY   = { x: 100, y: 490, baseR: 55, maxDist: 40 };
const VSHOOT = { x: 700, y: 490, r: 45 };
const TOUCH_AREA_MULTIPLIER  = 1.5;  // expand tap hit area beyond visible radius
const JOYSTICK_DEADZONE_RATIO = 0.2; // fraction of maxDist before movement starts
const vTouch = { joyId: null, joyDX: 0, joyDY: 0, joyOriX: 0, joyOriY: 0, shootId: null };

function canvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width  / rect.width),
        y: (clientY - rect.top)  * (canvas.height / rect.height),
    };
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    isTouchDevice = true;
    initAudio();
    for (const t of e.changedTouches) {
        const p = canvasPos(t.clientX, t.clientY);
        if (Math.hypot(p.x - MUTE_BTN.x, p.y - MUTE_BTN.y) < MUTE_BTN.r * 1.6) { toggleMute(); continue; }
        if (state.gamePhase === 'intro') {
            state.gamePhase = 'playing';
        }
        if ((state.won || state.levelComplete) && p.x >= 300 && p.x <= 500 && p.y >= 420 && p.y <= 475) {
            if (state.levelComplete) advanceLevel();
            else resetGame();
        }
        if (vTouch.joyId === null && Math.hypot(p.x - VJOY.x, p.y - VJOY.y) < VJOY.baseR * TOUCH_AREA_MULTIPLIER) {
            vTouch.joyId = t.identifier; vTouch.joyOriX = p.x; vTouch.joyOriY = p.y;
            vTouch.joyDX = 0; vTouch.joyDY = 0;
        } else if (vTouch.shootId === null && Math.hypot(p.x - VSHOOT.x, p.y - VSHOOT.y) < VSHOOT.r * TOUCH_AREA_MULTIPLIER) {
            vTouch.shootId = t.identifier;
            if (!tryDig()) shoot();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== vTouch.joyId) continue;
        const p = canvasPos(t.clientX, t.clientY);
        const rawDX = p.x - vTouch.joyOriX, rawDY = p.y - vTouch.joyOriY;
        const dist = Math.hypot(rawDX, rawDY);
        const clamped = Math.min(dist, VJOY.maxDist);
        vTouch.joyDX = dist > 0 ? (rawDX / dist) * clamped : 0;
        vTouch.joyDY = dist > 0 ? (rawDY / dist) * clamped : 0;
    }
}, { passive: false });

function clearTouchId(id) {
    if (id === vTouch.joyId)   { vTouch.joyId = null; vTouch.joyDX = 0; vTouch.joyDY = 0; }
    if (id === vTouch.shootId) { vTouch.shootId = null; }
}
canvas.addEventListener('touchend',    e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });

// ── ENTITY FACTORIES ─────────────────────────────────────────
function makeCoins(count) {
    const list = [];
    for (let i = 0; i < count; i++) {
        list.push({ x: 80 + Math.random() * 640, y: 80 + Math.random() * 440, picked: false });
    }
    return list;
}

function makeDigSpots() {
    // One of each weapon, shuffled so every visit is a surprise
    const loot = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER];
    for (let i = loot.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [loot[i], loot[j]] = [loot[j], loot[i]];
    }
    return DIG_SPOTS.map((s, i) => ({ x: s.x, y: s.y, hits: 0, depth: 0, weapon: loot[i] }));
}

function makeHell() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    return {
        digSpots: makeDigSpots(),
        foundMsg: null,   // { text, sub, color, timer } — floats up in the middle after digging
        enemies:  [],     // bad guys in Hell (mole monsters from dig spots, …)
        devil: {
            x: 660, y: 300, r: cfg.devilR, alive: true, shieldFlash: 0, frozen: 0,
            hp: cfg.devilHp, maxHp: cfg.devilHp,
            aiState: 'CHASE',
            wanderTarget: { x: 400, y: 300 },
            wanderWaitTimer: 0,
            shootTimer: cfg.devilShootRate,
            telegraphTimer: 0,
            isAboutToShoot: false,
        },
        coins: makeCoins(cfg.coinCount),
    };
}

function makeEnemy(type, x, y, dx, dy) {
    const hp = ENEMY_TYPES[type].hp;
    return { type, x, y, dx, dy, r: 16, hp, maxHp: hp, alive: true, hitFlash: 0, hopTimer: 0, frozen: 0,
             home: { x, y, dx, dy } };   // where to respawn for the next wave
}

function makeParadise() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    const enemies = [
        makeEnemy('fire',  200, 150,  1.2,  0.8),
        makeEnemy('fire',  550, 200, -0.9,  1.1),
        makeEnemy('fire',  350, 400,  1.0, -1.0),
        makeEnemy('ghost', 300, 250, -0.7,  0.9),
        makeEnemy('ghost', 600, 350,  0.8, -0.8),
        makeEnemy('bat',   150, 350,  2.0,  1.4),
        makeEnemy('slime', 450, 150,  0,    0),
    ];
    // Extra enemies for harder levels
    for (let i = 0; i < cfg.extraFireMonsters; i++) {
        enemies.push(makeEnemy('fire', 150 + i * 200, 100 + i * 80, 1.1 + i * 0.2, -0.9 - i * 0.15));
        enemies.push(makeEnemy('bat',  250 + i * 150, 450 - i * 60, -1.8 - i * 0.2, 1.2));
    }
    for (let i = 0; i < cfg.extraGhosts; i++) {
        enemies.push(makeEnemy('ghost', 450 + i * 150, 150 + i * 100, -0.8 - i * 0.2, 1.0 + i * 0.2));
        enemies.push(makeEnemy('slime', 200 + i * 250, 300 + i * 50, 0, 0));
    }
    return {
        enemies,
        chests: [
            { x: 200, y: 480, w: 30, h: 24, opened: false },
            { x: 400, y: 480, w: 30, h: 24, opened: false },
            { x: 600, y: 480, w: 30, h: 24, opened: false },
        ],
        waveReset: false,   // true → respawn enemies on next paradise entry
        coins: makeCoins(cfg.coinCount),
    };
}

function makeVoidRoom() {
    return {
        enemies: [],
        coins:   makeCoins(4),
    };
}

let hell      = makeHell();
let paradise  = makeParadise();
let voidRoom  = makeVoidRoom();

// ── PORTALS ───────────────────────────────────────────────────
// Every portal is a mystery: it takes you to a random room (never the one you're in)
// Kept clear of the caves, chests, spawn points and touch controls.
const PORTAL_R = 26;
const PORTALS = {
    void: [
        { x: 60,  y: 300, shape: 'circle'   },
        { x: 740, y: 300, shape: 'diamond'  },
        { x: 400, y: 110, shape: 'star'     },
        { x: 740, y: 110, shape: 'hexagon'  },
    ],
    hell: [
        { x: 740, y: 300, shape: 'star'     },
        { x: 420, y: 95,  shape: 'triangle' },
        { x: 300, y: 545, shape: 'circle'   },
    ],
    paradise: [
        { x: 60,  y: 300, shape: 'hexagon'  },
        { x: 260, y: 95,  shape: 'diamond'  },
        { x: 560, y: 95,  shape: 'triangle' },
    ],
};

function randomDoorDestination() {
    const rooms = Object.values(ROOM).filter(r => r !== state.room);
    return rooms[Math.floor(Math.random() * rooms.length)];
}

// ── DYNAMIC LISTS ─────────────────────────────────────────────
let projectiles      = [];
let enemyProjectiles = [];
let particles        = [];
let floatTexts       = [];   // "-3 SUPER HIT!" numbers that float up
let lastDevilLaugh   = 0;    // Date.now() of the Devil's last laugh
let heartPickups     = [];   // hearts dropped by defeated bad guys
let bolts            = [];   // chain-lightning zaps between bad guys

// ── SOUND & MUSIC ─────────────────────────────────────────────
// Everything is made with the Web Audio API — no sound files needed.
// Browsers only allow sound after a key press / tap, so initAudio() runs on input.
let audioCtx = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('lop_muted') === '1'; } catch (e) {}
const MUTE_BTN = { x: 26, y: 574, r: 16 };

function initAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx   = new AC();
    masterGain = audioCtx.createGain(); masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
    musicGain  = audioCtx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(masterGain);
    sfxGain    = audioCtx.createGain(); sfxGain.gain.value   = 0.6;  sfxGain.connect(masterGain);
    noiseBuf   = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('lop_muted', muted ? '1' : '0'); } catch (e) {}
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

// One beep: frequency (Hz), length (s), wave shape, volume, optional slide to another pitch
function tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0, dest = sfxGain) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + Math.max(0, delay);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.02);
}

// A burst of static (for crunches and explosions)
function noise(dur, vol = 0.2, filterFreq = 1200) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = filterFreq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t0); src.stop(t0 + dur);
}

const SFX = {
    shoot:    () => tone(900, 0.09, 'square', 0.1, 300),
    hit:      () => tone(220, 0.07, 'triangle', 0.25, 110),
    superHit: () => { tone(600, 0.1, 'square', 0.12, 1200); tone(900, 0.12, 'triangle', 0.15, 1800, 0.05); },

                                                   tone(120 - i * 10, 0.14, 'square',   0.08, 80,            i * 0.18); } },
    win:      () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.12, null, i * 0.15)),
};
function sfx(name) { if (audioCtx && !muted) SFX[name](); }

// Background music — one little looping song per room (MIDI note numbers, 0 = rest, 8th notes)
const SONGS = {
    void: { bpm: 84, lead: 'triangle',
        melody: [72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 77, 0, 76, 0, 72, 0,  72, 0, 76, 0, 79, 0, 84, 0, 83, 0, 79, 0, 76, 0, 0, 0],
        bass:   [48, 0, 0, 0, 55, 0, 0, 0, 53, 0, 0, 0, 55, 0, 0, 0,  48, 0, 0, 0, 55, 0, 0, 0, 52, 0, 0, 0, 55, 0, 0, 0] },
    hell: { bpm: 132, lead: 'square',   // spooky minor key with a creepy tritone
        melody: [69, 0, 72, 69, 75, 0, 74, 72, 69, 0, 72, 0, 68, 0, 0, 0,  69, 0, 72, 69, 75, 0, 77, 75, 74, 72, 71, 0, 68, 0, 0, 0],
        bass:   [45, 45, 0, 45, 44, 0, 45, 0, 45, 45, 0, 45, 41, 0, 40, 0,  45, 45, 0, 45, 44, 0, 45, 0, 41, 41, 0, 41, 40, 0, 40, 0] },
    paradise: { bpm: 120, lead: 'square', // happy major key
        melody: [67, 71, 74, 71, 76, 74, 71, 74, 72, 76, 79, 76, 74, 71, 67, 0,  67, 71, 74, 79, 78, 76, 74, 71, 72, 74, 76, 74, 71, 0, 67, 0],
        bass:   [43, 0, 50, 0, 48, 0, 50, 0, 45, 0, 52, 0, 50, 0, 43, 0,  43, 0, 50, 0, 47, 0, 50, 0, 48, 0, 50, 0, 50, 0, 43, 0] },
};
let musicStep = 0, nextNoteTime = 0, musicRoom = null;

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Schedules the next few notes a little ahead of time so the music never stutters
function musicTick() {
    if (!audioCtx || muted) return;
    const playing = state.gamePhase === 'playing' && !state.won && !state.levelComplete;
    const song = playing ? SONGS[state.room] : null;
    if (!song) { musicRoom = null; return; }
    const now = audioCtx.currentTime;
    if (state.room !== musicRoom || nextNoteTime < now - 0.1) {
        musicRoom = state.room; musicStep = 0; nextNoteTime = now + 0.05;
    }
    const stepDur = 60 / song.bpm / 2;
    while (nextNoteTime < now + 0.2) {
        const i = musicStep % song.melody.length, delay = nextNoteTime - now;
        if (song.melody[i]) tone(midiToFreq(song.melody[i]), stepDur * 0.9, song.lead, 0.07, null, delay, musicGain);
        if (song.bass[i])   tone(midiToFreq(song.bass[i]),   stepDur * 1.8, 'triangle', 0.16, null, delay, musicGain);
        nextNoteTime += stepDur; musicStep++;
    }
}
setInterval(musicTick, 50);

// ── SCORE ─────────────────────────────────────────────────────
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('lop_highscore'), 10) || 0; } catch (e) {}

function addScore(points) {
    state.score += points;
    if (state.score > highScore) {
        highScore = state.score;
        state.newBest = true;
        try { localStorage.setItem('lop_highscore', String(highScore)); } catch (e) {}
    }
}

// ── HELPERS ───────────────────────────────────────────────────
function triggerShake(amount = 12) { state.screenShake = amount; }

function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        particles.push({
            x, y,
            dx: Math.cos(a) * (2 + Math.random() * 3),
            dy: Math.sin(a) * (2 + Math.random() * 3),
            life: 35, maxLife: 35,
            color, r: 4 + Math.random() * 4,
        });
    }
}

function spawnFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 45 });
}

function spawnConfetti() {
    const colors = ['#FF4444','#FF8800','#FFFF00','#44FF44','#4488FF','#CC44FF','#FF44CC','#FFFFFF','#FF88AA'];
    for (let i = 0; i < 130; i++) {
        const a   = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 9;
        particles.push({
            x: 400, y: 300,
            dx: Math.cos(a) * spd,
            dy: Math.sin(a) * spd - 2,
            life: 90 + Math.random() * 70, maxLife: 160,
            color: colors[Math.floor(Math.random() * colors.length)],
            r: 0,
            confetti: true,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.18,
            cw: 7 + Math.random() * 6,
            ch: 4 + Math.random() * 4,
        });
    }
}

function isPlayerInCave() {
    if (state.room !== ROOM.HELL) return false;
    if (state.caveProtectionExpired) return false;
    return HELL_CAVES.some(c =>
        player.x >= c.x && player.x <= c.x + c.w &&
        player.y >= c.y && player.y <= c.y + c.h
    );
}

function isPlayerPhysicallyInCave() {
    if (state.room !== ROOM.HELL) return false;
    return HELL_CAVES.some(c =>
        player.x >= c.x && player.x <= c.x + c.w &&
        player.y >= c.y && player.y <= c.y + c.h
    );
}

function allMonstersDefeated() {
    return paradise.enemies.every(e => !e.alive);
}

function getPlayerColor() {
    if (state.playerFlash > 0) return '#FFFF00';
    if (state.power === POWER.RAINBOW)   return `hsl(${(Date.now() / 5) % 360}, 100%, 60%)`;
    if (state.power !== POWER.NONE)      return WEAPON_INFO[state.power].color;
    return AVATAR_COLORS[state.activeSkin];
}

function damagePlayer() {
    if (state.playerInvincible > 0) return;
    if (state.bubble) {
        // Shield Bubble pops instead of losing a heart
        state.bubble = false;
        state.playerInvincible = 60;
        spawnParticles(player.x, player.y, '#AEE8FF', 12);
        spawnFloatText(player.x, player.y - 30, 'POP!', '#AEE8FF');
        sfx('pop');
        return;
    }
    sfx('hurt');
    state.playerHp--;
    state.playerInvincible = 90;
    triggerShake(14);
    spawnParticles(player.x, player.y, '#FF4444', 8);
    if (state.playerHp <= 0) respawnPlayer();
}

function respawnPlayer() {
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    state.power           = POWER.NONE;
    state.powerTier       = 1;
    state.playerHp        = maxHp;
    state.playerInvincible = 120;
    changeRoom(ROOM.VOID);
}

function resetGame() {
    const cfg = LEVEL_CONFIGS[0];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'intro', playerHp: cfg.playerMaxHp, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        level: 1,
        ammo: cfg.ammoMax, ammoMax: cfg.ammoMax, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        coins: 0, shopOpen: false,
        unlockedSkins: [true, ...Array(AVATAR_COLORS.length - 1).fill(false)], activeSkin: 0,
        bubble: false, score: 0, newBest: false,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

function advanceLevel() {
    if (state.level >= MAX_LEVELS) {
        // True final win — game complete
        state.won = true;
        state.levelComplete = false;
        if (!state.confettiSpawned) { state.confettiSpawned = true; spawnConfetti(); }
        return;
    }
    state.level++;
    const cfg = LEVEL_CONFIGS[state.level - 1];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'playing', playerHp: cfg.playerMaxHp, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        ammo: cfg.ammoMax, ammoMax: cfg.ammoMax, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        shopOpen: false,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

// ── ROOM CHANGE ───────────────────────────────────────────────
function respawnParadiseWave() {
    for (const e of paradise.enemies) {
        Object.assign(e, { alive: true, hp: e.maxHp, hitFlash: 0, hopTimer: 0, frozen: 0,
                           x: e.home.x, y: e.home.y, dx: e.home.dx, dy: e.home.dy });
    }
}

function changeRoom(dest) {
    if (state.gamePhase === 'playing') sfx('portal');
    state.room = dest;
    state.shopOpen = false;   // close shop when changing rooms
    projectiles      = [];
    enemyProjectiles = [];
    heartPickups     = [];
    bolts            = [];
    if (dest === ROOM.VOID)     { player.x = 400; player.y = 300; }
    if (dest === ROOM.HELL)     {
        player.x = 100; player.y = 300;
        // Weapons are buried again (in new places) each visit
        hell.digSpots = makeDigSpots();
        hell.foundMsg = null;
        hell.enemies  = [];
    }
    if (dest === ROOM.PARADISE) {
        player.x = 700; player.y = 300;
        if (paradise.waveReset) { respawnParadiseWave(); paradise.waveReset = false; }
    }
}

// ── UPDATE: PLAYER ────────────────────────────────────────────
function updatePlayer() {
    if (state.won || state.levelComplete || state.gamePhase !== 'playing') return;

    const spd = state.room === ROOM.PARADISE ? BASE_SPEED * 1.2 : BASE_SPEED;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']  || keys['KeyA']) dx -= spd;
    if (keys['ArrowRight'] || keys['KeyD']) dx += spd;
    if (keys['ArrowUp']    || keys['KeyW']) dy -= spd;
    if (keys['ArrowDown']  || keys['KeyS']) dy += spd;
    // Virtual joystick
    const deadzone = VJOY.maxDist * JOYSTICK_DEADZONE_RATIO;
    if (vTouch.joyDX < -deadzone) dx -= spd;
    if (vTouch.joyDX >  deadzone) dx += spd;
    if (vTouch.joyDY < -deadzone) dy -= spd;
    if (vTouch.joyDY >  deadzone) dy += spd;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }

    player.x = Math.max(18, Math.min(canvas.width  - 18, player.x + dx));
    player.y = Math.max(52, Math.min(canvas.height - 18, player.y + dy));

    for (const p of PORTALS[state.room]) {
        if (Math.hypot(player.x - p.x, player.y - p.y) < PORTAL_R * 0.75) {
            changeRoom(randomDoorDestination());
            return;
        }
    }

    if (state.playerFlash     > 0) state.playerFlash--;
    if (state.playerInvincible > 0) state.playerInvincible--;

    // ── CAVE TIMER ─────────────────────────────────────────────
    if (isPlayerPhysicallyInCave()) {
        state.caveTimer++;
        if (state.caveTimer >= CAVE_MAX_FRAMES) {
            state.caveProtectionExpired = true;
        }
    } else {
        // Reset when player leaves the cave
        if (state.caveTimer > 0) {
            state.caveTimer = 0;
            state.caveProtectionExpired = false;
        }
    }

    // Brimstone spark trail
    if (state.power === POWER.BRIMSTONE && Math.random() < 0.5) {
        particles.push({
            x: player.x + (Math.random() - 0.5) * 14,
            y: player.y + (Math.random() - 0.5) * 14,
            dx: (Math.random() - 0.5) * 1.5,
            dy: (Math.random() - 0.5) * 1.5,
            life: 14, maxLife: 14,
            color: Math.random() < 0.5 ? '#FF4422' : '#FF8800',
            r: 2 + Math.random() * 2,
        });
    }
}

// ── UPDATE: ENEMIES ───────────────────────────────────────────
function weaponDamage(power, enemyType) {
    if (power === POWER.RAINBOW || ENEMY_TYPES[enemyType].weakTo === power) return DAMAGE_STRONG;
    return DAMAGE_WEAK;
}

// Your weapon shields you from the bad guys it's strong against (never the Devil)
function isShieldedAgainst(enemyType) {
    if (state.power === POWER.NONE || !ENEMY_TYPES[enemyType]) return false;
    return weaponDamage(state.power, enemyType) === DAMAGE_STRONG;
}

// Hurts a bad guy; returns true if it was defeated
function hitEnemy(e, power) {
    const dmg = weaponDamage(power, e.type);
    e.hp -= dmg;
    e.hitFlash = 8;
    spawnFloatText(e.x, e.y - e.r - 8, dmg === DAMAGE_STRONG ? `-${dmg} SUPER HIT!` : `-${dmg}`,
                   dmg === DAMAGE_STRONG ? '#FFEE44' : '#FFFFFF');
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, dmg === DAMAGE_STRONG ? 10 : 4);
    if (e.hp > 0) { sfx(dmg === DAMAGE_STRONG ? 'superHit' : 'hit'); return false; }
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 16);
    triggerShake();
    sfx('defeat');
    addScore(e.type === 'mole' ? 15 : 10);
    return true;
}

// The bad guys in the room you're in
function roomEnemies() {
    if (state.room === ROOM.PARADISE) return state.lightCrystals < 3 ? paradise.enemies : [];
    if (state.room === ROOM.HELL)     return hell.enemies;
    return [];
}

// Bad guys you can shoot right now (not defeated, not still climbing out of the ground)
function targetableEnemies() {
    return roomEnemies().filter(e => e.alive && !(e.emerge > 0));
}

function roomCoins() {
    if (state.room === ROOM.PARADISE) return paradise.coins;
    if (state.room === ROOM.HELL)     return hell.coins;
    return voidRoom.coins;
}

// Reward for beating a bad guy: a coin, and sometimes a heart
function dropLoot(e) {
    const count = e.coinDrop || 1;
    for (let i = 0; i < count; i++) {
        roomCoins().push({
            x: Math.max(30, Math.min(770, e.x + (Math.random() - 0.5) * 16 * count)),
            y: Math.max(70, Math.min(570, e.y + (Math.random() - 0.5) * 16 * count)),
            picked: false,
        });
    }
    if (Math.random() < HEART_DROP_CHANCE) heartPickups.push({ x: e.x + 12, y: e.y, life: 600 });
}

// Hit a bad guy with a weapon: damage, freeze (ICE), chain (LIGHTNING), loot when defeated
function damageEnemy(e, power, chained = false) {
    // Pick the lightning jump targets before anything dies
    const jumps = power === POWER.LIGHTNING && !chained
        ? targetableEnemies()
            .filter(o => o !== e && Math.hypot(o.x - e.x, o.y - e.y) < CHAIN_RANGE)
            .sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))
            .slice(0, CHAIN_JUMPS)
        : [];

    if (hitEnemy(e, power)) {
        e.alive = false;
        dropLoot(e);
    } else if (power === POWER.ICE) {
        if (!e.frozen) sfx('freeze');
        e.frozen = FREEZE_FRAMES;
    }

    let from = e;
    for (const o of jumps) {
        bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, life: 12 });
        from = o;
        damageEnemy(o, power, true);
    }
    if (jumps.length) sfx('zap');
}

// Moves every bad guy in the room and hurts the player on touch
function updateRoomEnemies() {
    for (const e of roomEnemies()) {
        if (!e.alive) continue;
        if (e.emerge > 0) {
            e.emerge--;
            if (Math.random() < 0.4) spawnParticles(e.x, e.y + 8, '#6B3E1E', 1);
            continue;
        }
        if (e.hitFlash > 0) e.hitFlash--;
        if (e.frozen > 0) { e.frozen--; continue; }   // frozen solid: can't move or hurt you
        moveEnemy(e);
        if (state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
            Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
            damagePlayer();
        }
    }
    // Defeated bad guys in Hell don't come back
    hell.enemies = hell.enemies.filter(e => e.alive);
}

function moveEnemy(e) {
    if (e.type === 'mole') {
        // Chases the player — even inside caves (they live underground!)
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed;
        e.y += Math.sin(a) * e.speed;
    } else if (e.type === 'fire') {
        e.x += e.dx; e.y += e.dy;
    } else if (e.type === 'ghost') {
        // Drifts slowly toward the player
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 0.5 + e.dx * 0.25;
        e.y += Math.sin(a) * 0.5 + e.dy * 0.25;
    } else if (e.type === 'bat') {
        // Fast and flappy — zig-zags up and down
        e.x += e.dx;
        e.y += e.dy + Math.sin(Date.now() / 120 + e.home.x) * 1.8;
    } else if (e.type === 'slime') {
        // Sits still, then hops toward the player
        if (--e.hopTimer <= 0) {
            e.hopTimer = 70;
            sfx('boing');
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.dx = Math.cos(a) * 4; e.dy = Math.sin(a) * 4;
        }
        e.x += e.dx; e.y += e.dy;
        e.dx *= 0.92; e.dy *= 0.92;
    }
    if (e.x < 60 || e.x > 740) e.dx *= -1;
    if (e.y < 60 || e.y > 540) e.dy *= -1;
    e.x = Math.max(40, Math.min(760, e.x));
    e.y = Math.max(60, Math.min(560, e.y));
}

function updateEnemies() {
    if (state.won || state.levelComplete) return;

    // ── VOID enemies ──────────────────────────────────────────
    if (state.room === ROOM.VOID) {
        for (const e of voidRoom.enemies) {
            e.x += e.dx; e.y += e.dy;
            if (e.x < 60 || e.x > 740) e.dx *= -1;
            if (e.y < 60 || e.y > 540) e.dy *= -1;
            // Contact damage (shielded by matching power)
            if (state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
                Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
                damagePlayer();
            }
            // Shoot at player periodically
            e.shootTimer--;
            if (e.shootTimer <= 0) {
                e.shootTimer = 100 + Math.floor(Math.random() * 60);
                const a = Math.atan2(player.y - e.y, player.x - e.x);
                enemyProjectiles.push({
                    x: e.x, y: e.y,
                    dx: Math.cos(a) * 3.5, dy: Math.sin(a) * 3.5,
                    color: e.type === 'fire' ? '#FF6600' : '#CC88FF',
                    life: 140, r: 6,
                    enemyType: e.type,
                });
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        // After all 3 crystals are collected paradise is peaceful — no more enemies
        if (state.lightCrystals >= 3) return;

        // Show only the current wave's chest once all enemies are cleared
        if (allMonstersDefeated() && state.paradiseClearCount < 3) {
            paradise.chests[state.paradiseClearCount].visible = true;
        }
    }

    if (state.room === ROOM.HELL) {
        const d = hell.devil;
        if (!d.alive) return;
        if (d.shieldFlash > 0) d.shieldFlash--;
        if (d.frozen > 0) { d.frozen--; return; }   // frozen by ICE

        const cfg = LEVEL_CONFIGS[state.level - 1];

        if (d.telegraphTimer > 0) {
            // Frozen while telegraphing
            d.telegraphTimer--;
            if (d.telegraphTimer === 0 && d.isAboutToShoot) {
                // Only fire if the player is still visible (not hiding in a cave)
                if (!isPlayerInCave()) {
                    const a = Math.atan2(player.y - d.y, player.x - d.x);
                    const shotsPerFire = cfg.devilShotsPerFire;
                    const spreadAngle = shotsPerFire > 1 ? 0.25 : 0;
                    for (let s = 0; s < shotsPerFire; s++) {
                        const offset = shotsPerFire > 1 ? (s - (shotsPerFire - 1) / 2) * spreadAngle : 0;
                        enemyProjectiles.push({
                            x: d.x, y: d.y,
                            dx: Math.cos(a + offset) * DEVIL_BULLET_SPEED, dy: Math.sin(a + offset) * DEVIL_BULLET_SPEED,
                            color: '#FF6600', life: 130, r: cfg.isBoss ? 9 : 7,
                        });
                    }
                    // Scary laugh — not every shot, or it gets annoying
                    if (Date.now() - lastDevilLaugh > 6000) { lastDevilLaugh = Date.now(); sfx('laugh'); }
                }
                d.isAboutToShoot = false;
            }
        } else {
            const inCave = isPlayerInCave();

            if (inCave) {
                d.aiState = 'WANDER';
                if (d.wanderWaitTimer > 0) {
                    d.wanderWaitTimer--;
                } else {
                    const dist = Math.hypot(d.wanderTarget.x - d.x, d.wanderTarget.y - d.y);
                    if (dist < 14) {
                        // Arrived — telegraph, then pick new spot after wait
                        d.telegraphTimer  = 30;
                        d.wanderWaitTimer = 120; // 2 s
                        d.wanderTarget = {
                            x: 80 + Math.random() * 640,
                            y: 80 + Math.random() * 440,
                        };
                    } else {
                        const a = Math.atan2(d.wanderTarget.y - d.y, d.wanderTarget.x - d.x);
                        d.x = Math.max(50, Math.min(750, d.x + Math.cos(a) * 1.6));
                        d.y = Math.max(50, Math.min(550, d.y + Math.sin(a) * 1.6));
                    }
                }
            } else {
                d.aiState = 'CHASE';
                const a = Math.atan2(player.y - d.y, player.x - d.x);
                d.x = Math.max(60, Math.min(740, d.x + Math.cos(a) * cfg.devilSpeed));
                d.y = Math.max(60, Math.min(540, d.y + Math.sin(a) * cfg.devilSpeed));
                if (state.playerInvincible === 0 &&
                    Math.hypot(d.x - player.x, d.y - player.y) < d.r + 16) {
                    damagePlayer();
                }

                // Periodic shooting — only while player is visible (CHASE mode)
                d.shootTimer--;
                if (d.shootTimer <= 0) {
                    d.shootTimer     = cfg.devilShootRate;
                    d.telegraphTimer = 30;
                    d.isAboutToShoot = true;
                }
            }
        }
    }
}

// ── UPDATE: ENEMY PROJECTILES ─────────────────────────────────
function updateEnemyProjectiles() {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const p = enemyProjectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            enemyProjectiles.splice(i, 1); continue;
        }
        if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + 16) {
            if (!isShieldedAgainst(p.enemyType)) {
                if (state.playerInvincible === 0) damagePlayer();
            }
            // Blocked projectiles vanish with a small spark
            spawnParticles(p.x, p.y, p.color, 4);
            enemyProjectiles.splice(i, 1);
        }
    }
}

// ── UPDATE: SHOOTING ──────────────────────────────────────────
function shoot() {
    if (state.won || state.levelComplete || state.power === POWER.NONE || state.room === ROOM.VOID) return;
    if (state.ammoReloading || state.ammo <= 0) return;

    const enemies = [];
    enemies.push(...targetableEnemies());
    if (state.room === ROOM.HELL && hell.devil.alive) enemies.push(hell.devil);
    if (!enemies.length) return;

    const target = enemies.reduce((best, e) => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        return d < best.dist ? { en: e, dist: d } : best;
    }, { en: null, dist: Infinity }).en;

    if (!target) return;
    const a = Math.atan2(target.y - player.y, target.x - player.x);
    const w     = WEAPON_INFO[state.power];
    const color = state.power === POWER.RAINBOW ? `hsl(${Math.random() * 360}, 100%, 60%)` : w.color;
    // SUPER and RAINBOW weapons fire 3 shots in a spread for the same ammo
    const spread = state.powerTier >= 2 ? [-0.2, 0, 0.2] : [0];
    for (const off of spread) {
        projectiles.push({ x: player.x, y: player.y, dx: Math.cos(a + off) * w.speed, dy: Math.sin(a + off) * w.speed,
            color, power: state.power, life: 90, r: w.size });
    }

    sfx('shoot');
    state.ammo--;
    if (state.ammo <= 0) {
        state.ammoReloading = true;
        state.ammoReloadTimer = LEVEL_CONFIGS[state.level - 1].reloadFrames;
    }
}

// ── UPDATE: AMMO RELOAD ───────────────────────────────────────
function updateAmmo() {
    if (!state.ammoReloading) return;
    state.ammoReloadTimer--;
    if (state.ammoReloadTimer <= 0) {
        state.ammoReloading  = false;
        state.ammo           = state.ammoMax;
    }
}

// ── UPDATE: PROJECTILES & HITS ────────────────────────────────
function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            projectiles.splice(i, 1); continue;
        }

        let hit = false;

        for (const e of targetableEnemies()) {
            if (Math.hypot(p.x - e.x, p.y - e.y) >= e.r + p.r) continue;
            damageEnemy(e, p.power);
            hit = true; break;
        }

        if (!hit && state.room === ROOM.HELL) {
            const d = hell.devil;
            if (d.alive && Math.hypot(p.x - d.x, p.y - d.y) < d.r + p.r) {
                if (p.power === POWER.ICE) d.frozen = DEVIL_FREEZE_FRAMES;
                if (state.lightCrystals >= 3) {
                    d.hp--;
                    sfx('hit');
                    addScore(5);
                    d.shieldFlash = 15;
                    spawnParticles(d.x, d.y, '#FF4400', 8);
                    triggerShake(8);
                    if (d.hp <= 0) {
                        d.alive = false;
                        sfx('defeat');
                        addScore(100);
                        spawnParticles(d.x, d.y, '#880000', 20);
                        triggerShake(20);
                        if (state.level < MAX_LEVELS) {
                            state.levelComplete = true;
                        } else {
                            state.won = true;
                        }
                    }
                } else {
                    d.shieldFlash = 25;
                    sfx('hit');
                    spawnParticles(d.x, d.y, '#FFFFFF', 6);
                    triggerShake(6);
                }
                hit = true;
            }
        }

        if (hit) projectiles.splice(i, 1);
    }
}

// ── UPDATE: DIGGING ───────────────────────────────────────────
// Returns the dig spot the player is standing on (if it still has layers left)
function nearbyDigSpot() {
    if (state.room !== ROOM.HELL) return null;
    return hell.digSpots.find(s =>
        s.depth < DIG_MAX_DEPTH && Math.hypot(player.x - s.x, player.y - s.y) < DIG_RANGE
    ) || null;
}

// You can't dig while a mole monster is out — Space / the button shoots it instead
function canDig() {
    return !hell.enemies.some(e => e.alive && e.type === 'mole');
}

function powerName(power = state.power, tier = state.powerTier) {
    if (power === POWER.NONE)    return 'None';
    if (power === POWER.RAINBOW) return 'Rainbow';
    return tier >= 2 ? `Super ${power}` : power;
}

function spawnMole(s) {
    // Pops out a little way from the player so it doesn't hit them straight away
    const a = Math.random() * Math.PI * 2;
    hell.enemies.push({
        type: 'mole', x: s.x + Math.cos(a) * 45, y: s.y + Math.sin(a) * 45, alive: true,
        r: 13 + s.depth * 2, hp: s.depth * 2 + 1, maxHp: s.depth * 2 + 1, hitFlash: 0, frozen: 0,
        speed: 0.8 + s.depth * 0.25,
        emerge: 45,   // frames spent climbing out (harmless while emerging)
    });
}

// Returns true if the player dug (so Space / the button doesn't also shoot)
function tryDig() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    const s = nearbyDigSpot();
    if (!s || !canDig()) return false;
    s.hits++;
    sfx('dig');
    spawnParticles(s.x, s.y, '#8B5A2B', 6);
    triggerShake(3);
    if (s.hits < DIG_HITS_PER_LAYER[s.depth]) return true;

    // Broke through a layer!
    s.hits = 0;
    s.depth++;
    const tier   = s.depth;
    const weapon = tier === 3 ? POWER.RAINBOW : s.weapon;
    const color  = WEAPON_INFO[weapon].color;
    const name   = (tier === 2 ? 'SUPER ' : '') + WEAPON_INFO[weapon].label;
    let text;
    if (state.power !== POWER.NONE && tier < state.powerTier) {
        text = `Found ${name} — yours is better!`;
    } else {
        state.power     = weapon;
        state.powerTier = tier;
        state.playerFlash = 25;
        text = tier === 3 ? `LEGENDARY! ${name}!` : tier === 2 ? `RARE! ${name}!` : `You found ${name}!`;
    }
    spawnParticles(s.x, s.y, color, 10 + tier * 6);
    triggerShake(6 + tier * 2);
    sfx('found');
    addScore(5 * tier);

    let sub = s.depth < DIG_MAX_DEPTH ? 'Keep digging for something rarer…' : '';
    if (Math.random() < DIG_MOLE_CHANCE[s.depth - 1]) {
        spawnMole(s);
        sub = 'Look out — a MOLE MONSTER!';
    }
    hell.foundMsg = { text, sub, color, timer: 120 };
    return true;
}

function updateDigging() {
    if (hell.foundMsg && --hell.foundMsg.timer <= 0) hell.foundMsg = null;
}

// ── UPDATE: PICKUPS ───────────────────────────────────────────
function checkPickups() {
    if (state.won || state.levelComplete) return;

    // Hearts dropped by bad guys
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        const h = heartPickups[i];
        if (Math.hypot(player.x - h.x, player.y - h.y) > 22) continue;
        heartPickups.splice(i, 1);
        const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
        if (state.playerHp < maxHp) { state.playerHp++; spawnFloatText(player.x, player.y - 28, '+1 ❤', '#FF6688'); }
        else                        { addScore(10);     spawnFloatText(player.x, player.y - 28, '+10',   '#FFFFFF'); }
        spawnParticles(h.x, h.y, '#FF6688', 8);
        sfx('buy');
    }

    if (state.room === ROOM.HELL) {
        // Coins in Hell
        for (const coin of hell.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        const idx = state.paradiseClearCount;
        if (idx < 3) {
            const c = paradise.chests[idx];
            if (!c.opened && c.visible &&
                Math.abs(player.x - c.x) < 28 && Math.abs(player.y - c.y) < 28) {
                c.opened = true;
                sfx('found');
                addScore(50);
                state.lightCrystals++;
                state.paradiseClearCount++;
                state.playerFlash = 35;
                triggerShake(14);
                spawnParticles(c.x, c.y, '#FFD700', 14);
                // Queue enemies to respawn next time player enters paradise
                if (state.paradiseClearCount < 3) paradise.waveReset = true;
            }
        }
        // Coins in Paradise
        for (const coin of paradise.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.VOID) {
        // Coins in Void
        for (const coin of voidRoom.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }
}

function collectCoin() {
    state.coins++;
    sfx('coin');
    addScore(1);
    spawnParticles(player.x, player.y, '#FFD700', 5);
}

// ── UPDATE: VOID HEALING ──────────────────────────────────────
function updateVoidHealing() {
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    if (state.room !== ROOM.VOID || state.playerHp >= maxHp) {
        state.voidHealTimer = 0;
        return;
    }
    state.voidHealTimer++;
    if (state.voidHealTimer >= 300) {   // 300 frames ≈ 5 seconds at 60 fps
        state.playerHp = Math.min(maxHp, state.playerHp + 1);
        state.voidHealTimer = 0;
        state.playerFlash = 25;
        spawnParticles(player.x, player.y, '#FFD700', 8);
    }
}

// ── UPDATE: PARTICLES ─────────────────────────────────────────
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x  += p.dx; p.y  += p.dy;
        p.dx *= 0.92; p.dy *= 0.92;
        if (p.confetti) {
            p.dy       += 0.09;
            p.rotation += p.rotSpeed;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
        if (--bolts[i].life <= 0) bolts.splice(i, 1);
    }
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        if (--heartPickups[i].life <= 0) heartPickups.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        floatTexts[i].y -= 0.8;
        if (--floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }
}

// ── DRAW HELPERS ──────────────────────────────────────────────
function drawStar(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const b = ((i * 4 + 2) * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(a) * r,          y + Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(b) * (r * 0.4),  y + Math.sin(b) * (r * 0.4));
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawCoins(coinList) {
    const t = Date.now() / 300;
    for (const c of coinList) {
        if (c.picked) continue;
        ctx.save();
        ctx.fillStyle   = '#FFD700';
        ctx.shadowColor = '#FFAA00';
        ctx.shadowBlur  = 8 + Math.sin(t + c.x) * 4;
        ctx.beginPath();
        ctx.arc(c.x, c.y + Math.sin(t + c.x * 0.1) * 3, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF8';
        ctx.beginPath();
        ctx.arc(c.x - 2, c.y - 2 + Math.sin(t + c.x * 0.1) * 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}
