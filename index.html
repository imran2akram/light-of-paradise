// ── DRAW: PORTALS ─────────────────────────────────────────────
function portalPath(shape, x, y, r, spin) {
    ctx.beginPath();
    if (shape === 'circle') { ctx.arc(x, y, r, 0, Math.PI * 2); return; }
    // Pointy shapes: [number of points, inner radius ratio]
    const [n, inner] = { diamond: [4, 1], triangle: [3, 1], hexagon: [6, 1], star: [5, 0.5] }[shape];
    const pts = inner < 1 ? n * 2 : n;
    for (let i = 0; i < pts; i++) {
        const a  = spin - Math.PI / 2 + (i / pts) * Math.PI * 2;
        const rr = inner < 1 && i % 2 ? r * inner : r;
        ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
}

function drawPortals() {
    const t = Date.now() / 1000;
    for (const p of PORTALS[state.room]) {
        // Colour keeps shifting — you never know where it goes!
        const hue  = (t * 60 + p.x + p.y) % 360;
        const spin = t * 0.6 + p.x;   // the whole shape slowly turns
        const r    = PORTAL_R + Math.sin(t * 3 + p.x) * 2;
        ctx.save();

        // Dark swirling middle
        portalPath(p.shape, p.x, p.y, r, spin);
        const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.35, `hsl(${hue}, 90%, 45%)`);
        grad.addColorStop(1, `hsl(${(hue + 120) % 360}, 90%, 15%)`);
        ctx.fillStyle = grad;
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = 25;
        ctx.fill();

        // Spiral arms spinning into the centre
        ctx.save();
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.clip();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `hsla(${(hue + 60) % 360}, 100%, 80%, 0.7)`;
        ctx.lineWidth = 2;
        for (let arm = 0; arm < 3; arm++) {
            ctx.beginPath();
            for (let k = 0; k <= 20; k++) {
                const a  = -t * 4 + arm * (Math.PI * 2 / 3) + k * 0.3;
                const rr = (k / 20) * r;
                ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
            }
            ctx.stroke();
        }
        ctx.restore();

        // Glowing outline
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Sparkles orbiting the edge
        for (let k = 0; k < 3; k++) {
            const a = t * 2 + k * (Math.PI * 2 / 3) + p.y;
            drawStar(p.x + Math.cos(a) * (r + 7), p.y + Math.sin(a) * (r + 7), 2.5, '#FFFFFF');
        }
        ctx.restore();

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', p.x, p.y);
        ctx.textBaseline = 'alphabetic';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('MYSTERY', p.x, p.y + PORTAL_R + 14);
    }
}

// ── DRAW: VOID ────────────────────────────────────────────────
function drawVoid() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font      = 'bold 26px Arial'; ctx.textAlign = 'center';
    ctx.fillText('~ THE VOID ~', 400, 295);
    ctx.font      = '14px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText('Every portal is a mystery — where will it take you?', 400, 328);

    // Shield hint
    if (state.power !== POWER.NONE) {
        const shielded = state.power === POWER.RAINBOW ? 'EVERY MONSTER (not the Devil!)'
            : Object.keys(ENEMY_TYPES).filter(isShieldedAgainst).map(k => ENEMY_TYPES[k].name.toUpperCase() + 'S').join(' & ');
        ctx.fillStyle = WEAPON_INFO[state.power].color;
        ctx.font = 'bold 12px Arial';
        ctx.fillText(`🛡 ${WEAPON_INFO[state.power].label} SHIELD — protects you from ${shielded}`, 400, 360);
    }

    // Which weapon beats which bad guy
    const chart = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER].map(w => {
        const beats = Object.keys(ENEMY_TYPES).filter(k => ENEMY_TYPES[k].weakTo === w).map(k => ENEMY_TYPES[k].name + 's');
        return `${WEAPON_INFO[w].icon} ${WEAPON_INFO[w].label} beats ${beats.join(' & ')}`;
    });
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.font = 'bold 12px Arial';
    ctx.fillText('WHAT BEATS WHAT (every weapon still does a little damage to everything)', 400, 450);
    ctx.font = '12px Arial';
    chart.forEach((line, i) => ctx.fillText(line, i % 2 === 0 ? 270 : 530, 472 + Math.floor(i / 2) * 18));
    ctx.fillText('🌈 RAINBOW POWER beats everything!', 400, 512);

    // Void enemies
    const t = Date.now() / 400;
    for (const e of voidRoom.enemies) {
        ctx.save();
        if (e.type === 'fire') {
            ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFAA00';
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2 + t;
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(a) * e.r * 0.85, e.y + Math.sin(a) * e.r * 0.85, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r, Math.PI, 0);
            ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
            ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x,             e.y + e.r * 0.7);
            ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
            ctx.closePath(); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#330055';
            ctx.beginPath();
            ctx.arc(e.x - 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.arc(e.x + 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Coins
    drawCoins(voidRoom.coins);

    // Shop hint
    if (state.coins > 0) {
        ctx.fillStyle = 'rgba(255,215,0,0.55)';
        ctx.font = '12px Arial'; ctx.textAlign = 'center';
        ctx.fillText('Press E to open the Shop', 400, 410);
    }
}

// ── DRAW: HELL ────────────────────────────────────────────────
function drawHell() {
    const t = Date.now() / 500;

    // Caves
    for (const c of HELL_CAVES) {
        ctx.save();
        ctx.fillStyle   = 'rgba(15, 8, 4, 0.85)';
        ctx.strokeStyle = '#5a2800';
        ctx.lineWidth   = 3;
        const rad = 18;
        ctx.beginPath();
        ctx.moveTo(c.x + rad, c.y);
        ctx.arcTo(c.x + c.w, c.y,       c.x + c.w, c.y + c.h, rad);
        ctx.arcTo(c.x + c.w, c.y + c.h, c.x,       c.y + c.h, rad);
        ctx.arcTo(c.x,       c.y + c.h, c.x,       c.y,       rad);
        ctx.arcTo(c.x,       c.y,       c.x + c.w, c.y,       rad);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle   = 'rgba(120,70,30,0.55)';
        ctx.font        = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText('CAVE  (hide & dig here!)', c.x + c.w / 2, c.y + 20);
        ctx.restore();
    }

    // Dig spots — dirt piles with weapons buried in layers
    for (const s of hell.digSpots) {
        ctx.save();
        if (s.depth > 0) {
            // Hole gets bigger and darker the deeper you dig
            const holeR = 8 + s.depth * 4;
            ctx.fillStyle = `rgba(0,0,0,${0.45 + s.depth * 0.18})`;
            ctx.beginPath(); ctx.ellipse(s.x, s.y + 6, holeR, holeR * 0.45, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(200,150,90,0.8)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(s.depth >= DIG_MAX_DEPTH ? 'BOTTOM' : `DEPTH ${s.depth}/${DIG_MAX_DEPTH}`, s.x, s.y + 24);
        }
        if (s.depth < DIG_MAX_DEPTH) {
            // Dirt pile beside the hole shrinks a little with each dig
            const size = 1 - (s.hits / DIG_HITS_PER_LAYER[s.depth]) * 0.45;
            const px = s.depth > 0 ? s.x + 16 : s.x;
            ctx.fillStyle = '#6B3E1E';
            ctx.beginPath(); ctx.ellipse(px, s.y + 4, 18 * size, 10 * size, 0, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#8B5A2B';
            ctx.beginPath(); ctx.ellipse(px - 3, s.y + 1, 9 * size, 5 * size, 0, Math.PI, 0); ctx.fill();
            // Twinkle so kids can spot the treasure — rainbow sparkle on the last layer
            const sparkle = s.depth === 2 ? `hsl(${(Date.now() / 5) % 360}, 100%, 70%)` : '#FFFFAA';
            if (Math.sin(t * 2 + s.x) > 0.7) drawStar(px + 8 * size, s.y - 6 * size, 3, sparkle);
        }
        ctx.restore();
    }

    // "Dig here!" prompt when standing on a pile
    const digSpot = nearbyDigSpot();
    if (digSpot) {
        const verb = isTouchDevice ? 'Tap DIG' : 'Press SPACE';
        ctx.fillStyle = canDig() ? '#FFE08A' : '#FF8888';
        ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        ctx.fillText(!canDig() ? 'Beat the mole monster first!'
                   : digSpot.depth === 0 ? `${verb} to dig!` : `${verb} to dig deeper!`,
                   digSpot.x, digSpot.y - 22);
    }

    // Bad guys (mole monsters, …)
    for (const e of hell.enemies) {
        drawEnemy(e, t);
        if (!(e.emerge > 0)) drawEnemyHp(e);
    }

    // "You found …!" message floating up
    if (hell.foundMsg) {
        const m = hell.foundMsg;
        const x = 400, y = 250 - (120 - m.timer) * 0.3;   // big, in the middle of the screen
        ctx.save();
        ctx.globalAlpha = Math.min(1, m.timer / 30);
        ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 12;
        ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText(m.text, x, y);
        if (m.sub) {
            ctx.fillStyle = m.sub.startsWith('Look out') ? '#FF6666' : '#FFE08A';
            ctx.shadowBlur = 6; ctx.font = 'bold 15px Arial';
            ctx.fillText(m.sub, x, y + 24);
        }
        ctx.restore();
    }

    // Devil
    const d = hell.devil;
    if (d.alive) {
        const telegraphing = d.telegraphTimer > 0;
        const flashOn      = telegraphing && Math.floor(Date.now() / 80) % 2 === 0;

        ctx.save();
        ctx.shadowColor = telegraphing ? '#FFFF00' : (d.shieldFlash > 0 ? '#FFFFFF' : '#FF0000');
        ctx.shadowBlur  = telegraphing ? 50 : (d.shieldFlash > 0 ? 40 : 20);

        // Body
        ctx.fillStyle = telegraphing ? (flashOn ? '#FFFF44' : '#FFFFFF')
                      : (d.shieldFlash > 0 ? '#FFFFFF' : '#880000');
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();

        // Horns
        ctx.fillStyle = telegraphing ? '#FFAA00' : (d.shieldFlash > 0 ? '#DDDDDD' : '#550000');
        [[d.x - 14, -1], [d.x + 14, 1]].forEach(([hx, dir]) => {
            ctx.beginPath();
            ctx.moveTo(hx, d.y - d.r + 2);
            ctx.lineTo(hx + dir * 6,  d.y - d.r - 20);
            ctx.lineTo(hx + dir * 14, d.y - d.r);
            ctx.fill();
        });

        // Eyes
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath();
        ctx.arc(d.x - 9, d.y - 4, 6, 0, Math.PI * 2);
        ctx.arc(d.x + 9, d.y - 4, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(d.x - 9, d.y - 4, 3, 0, Math.PI * 2);
        ctx.arc(d.x + 9, d.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (d.frozen > 0) drawIceBlock(d.x, d.y, d.r * 0.85, d.frozen);

        // State label
        ctx.fillStyle = 'rgba(255,120,120,0.65)';
        ctx.font = '10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(d.aiState, d.x, d.y + d.r + 14);

        // HP bar (only shown when player has 3 crystals and can damage devil)
        if (state.lightCrystals >= 3) {
            const bw = 70, bh = 9;
            const bx = d.x - bw / 2, by = d.y - d.r - 30;
            ctx.fillStyle = '#400';
            ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = `hsl(${(d.hp / d.maxHp) * 120}, 100%, 45%)`;
            ctx.fillRect(bx, by, bw * (d.hp / d.maxHp), bh);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`${d.hp}/${d.maxHp}`, d.x, by + bh - 1);
        }

        // Crystal warning
        if (state.lightCrystals < 3 && d.shieldFlash > 0) {
            ctx.fillStyle = '#FFFF00';
            ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
            ctx.fillText('NEED ALL LIGHT CRYSTALS!', d.x, d.y - d.r - 14);
        }
    }

    // Coins
    drawCoins(hell.coins);

    // Cave timer warning
    if (isPlayerPhysicallyInCave() && state.caveTimer > 0) {
        const frac = state.caveTimer / CAVE_MAX_FRAMES;
        const secsLeft = Math.max(0, Math.ceil((CAVE_MAX_FRAMES - state.caveTimer) / 60));
        if (frac >= 0.5) {
            const flash = state.caveProtectionExpired ? (Math.floor(Date.now() / 200) % 2 === 0) : true;
            ctx.fillStyle = state.caveProtectionExpired
                ? `rgba(255,80,0,${flash ? 0.9 : 0.5})`
                : `rgba(255,220,50,${0.5 + frac * 0.5})`;
            ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            ctx.fillText(
                state.caveProtectionExpired ? '⚠ CAVE EXPIRED — LEAVE NOW!' : `Cave protection: ${secsLeft}s left`,
                400, 535
            );
        }
    }
}

// ── DRAW: BAD GUYS ────────────────────────────────────────────
function drawEnemy(e, t) {
    ctx.save();
    if (e.type === 'fire') {
        ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA00';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + t;
            ctx.beginPath();
            ctx.arc(e.x + Math.cos(a) * e.r * 0.9, e.y + Math.sin(a) * e.r * 0.9, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (e.type === 'ghost') {
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, Math.PI, 0);
        ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
        ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x,             e.y + e.r * 0.7);
        ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#330055';
        ctx.beginPath();
        ctx.arc(e.x - 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.arc(e.x + 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'bat') {
        // Flapping wings
        const flap = Math.sin(Date.now() / 60 + e.home.x) * 8;
        ctx.fillStyle = '#5A3A7A'; ctx.shadowColor = '#9966CC'; ctx.shadowBlur = 10;
        for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(e.x + side * 5, e.y - 2);
            ctx.lineTo(e.x + side * 24, e.y - 6 - flap);
            ctx.lineTo(e.x + side * 18, e.y + 4);
            ctx.lineTo(e.x + side * 11, e.y + 1);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#7A4A9A';
        ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();   // ears
        ctx.moveTo(e.x - 7, e.y - 5); ctx.lineTo(e.x - 5, e.y - 14); ctx.lineTo(e.x - 1, e.y - 7);
        ctx.moveTo(e.x + 7, e.y - 5); ctx.lineTo(e.x + 5, e.y - 14); ctx.lineTo(e.x + 1, e.y - 7);
        ctx.fill();
        ctx.fillStyle = '#FFEE00';
        ctx.beginPath();
        ctx.arc(e.x - 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.arc(e.x + 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'mole') {
        const rise = 1 - (e.emerge || 0) / 45;   // 0 → 1 while climbing out
        const r = e.r * (0.4 + 0.6 * rise);
        ctx.globalAlpha = 0.4 + 0.6 * rise;
        ctx.fillStyle = '#5C3A1E';
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#E8A0A0';   // pink nose
        ctx.beginPath(); ctx.arc(e.x, e.y + r * 0.25, r * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF2222';   // angry red eyes
        ctx.beginPath();
        ctx.arc(e.x - r * 0.35, e.y - r * 0.25, r * 0.15, 0, Math.PI * 2);
        ctx.arc(e.x + r * 0.35, e.y - r * 0.25, r * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D8C8A8'; ctx.lineWidth = 2;   // claws
        for (const side of [-1, 1]) {
            for (let k = -1; k <= 1; k++) {
                ctx.beginPath();
                ctx.moveTo(e.x + side * r * 0.8, e.y + r * 0.4 + k * 3);
                ctx.lineTo(e.x + side * r * 1.25, e.y + r * 0.55 + k * 4);
                ctx.stroke();
            }
        }
    } else if (e.type === 'slime') {
        // Squishes flat while resting, stretches tall mid-hop
        const speed   = Math.hypot(e.dx, e.dy);
        const stretch = Math.min(1, speed / 4);
        const w = e.r * (1.2 - stretch * 0.3), h = e.r * (0.8 + stretch * 0.4);
        ctx.fillStyle = 'rgba(100,220,70,0.85)'; ctx.shadowColor = '#66DD44'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r - h, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(200,255,180,0.7)';   // shine
        ctx.beginPath(); ctx.ellipse(e.x - w * 0.4, e.y + e.r - h * 1.5, w * 0.2, h * 0.15, -0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#113311';
        ctx.beginPath();
        ctx.arc(e.x - 5, e.y + e.r - h * 1.1, 3, 0, Math.PI * 2);
        ctx.arc(e.x + 5, e.y + e.r - h * 1.1, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
    if (e.frozen > 0) drawIceBlock(e.x, e.y, e.r, e.frozen);
    // White flash when hit
    if (e.hitFlash > 0 && !(e.emerge > 0)) {
        ctx.save();
        ctx.globalAlpha = e.hitFlash / 12;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// Frozen solid: a see-through ice block (flickers just before melting)
function drawIceBlock(x, y, r, framesLeft) {
    if (framesLeft < 30 && Math.floor(Date.now() / 80) % 2) return;
    ctx.save();
    ctx.fillStyle = 'rgba(160,220,255,0.45)';
    ctx.strokeStyle = 'rgba(230,250,255,0.9)'; ctx.lineWidth = 2;
    const s = r * 1.35;
    ctx.fillRect(x - s, y - s, s * 2, s * 2);
    ctx.strokeRect(x - s, y - s, s * 2, s * 2);
    ctx.beginPath();   // shine
    ctx.moveTo(x - s * 0.7, y - s * 0.2); ctx.lineTo(x - s * 0.2, y - s * 0.7);
    ctx.moveTo(x - s * 0.7, y + s * 0.2); ctx.lineTo(x + s * 0.2, y - s * 0.7);
    ctx.stroke();
    ctx.restore();
}

// Little health bar, only once a bad guy has been hurt
function drawEnemyHp(e) {
    if (e.hp >= e.maxHp) return;
    const bw = 30, bh = 4, bx = e.x - bw / 2, by = e.y - e.r - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = `hsl(${(e.hp / e.maxHp) * 120}, 100%, 45%)`;
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
}

// ── DRAW: PARADISE ────────────────────────────────────────────
function drawParadise() {
    const t = Date.now() / 400;

    // Only draw enemies before all 3 crystals are collected
    if (state.lightCrystals < 3) {
        for (const e of paradise.enemies) {
            if (!e.alive) continue;
            drawEnemy(e, t);
            drawEnemyHp(e);
        }
    }

    for (const c of paradise.chests) {
        if (!c.visible) continue;
        ctx.save();
        if (!c.opened) { ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 16; }
        ctx.fillStyle = c.opened ? '#5a3010' : '#8B4513';
        ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h);
        ctx.fillStyle = c.opened ? '#3a200a' : '#6B3410';
        ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h / 2);
        if (!c.opened) {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(c.x - 3, c.y - 4, 7, 7);
        } else {
            drawStar(c.x, c.y - 22, 11, '#FFD700');
        }
        ctx.restore();
    }

    if (!allMonstersDefeated() && state.lightCrystals < 3) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`Wave ${state.paradiseClearCount + 1}/3 — Defeat all enemies to reveal a chest!`, 400, 544);
    }

    // Coins
    drawCoins(paradise.coins);
}

// ── DRAW: PLAYER ──────────────────────────────────────────────
function drawPlayer() {
    const t = Date.now() / 400;

    // Ice aura
    if (state.power === POWER.ICE) {
        const pulse = 30 + Math.sin(t * 3) * 5;
        const alpha = 0.28 + 0.18 * Math.sin(t * 3);
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(100,180,255,${alpha})`;
        ctx.lineWidth   = 4;
        ctx.shadowColor = '#88CCFF'; ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.restore();
    }

    // Void healing radiance (pulsing golden glow when HP is not full)
    if (state.room === ROOM.VOID && state.playerHp < 3) {
        const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
        const r = 28 + pulse * 10;
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,215,0,${0.35 + pulse * 0.45})`;
        ctx.lineWidth   = 3;
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();
    }

    // Invincibility flicker
    if (state.playerInvincible > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

    const color = getPlayerColor();
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    drawAvatar(player.x, player.y, player.w, color, AVATAR_STYLES[state.activeSkin]);
    ctx.restore();

    // Shield Bubble
    if (state.bubble) {
        const wob = Math.sin(Date.now() / 200) * 2;
        ctx.save();
        ctx.beginPath(); ctx.arc(player.x, player.y, 27 + wob, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170,230,255,0.15)'; ctx.fill();
        ctx.strokeStyle = 'rgba(200,240,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(player.x - 9, player.y - 11, 5, 0, Math.PI * 2);   // shine
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
        ctx.restore();
    }
}

// Draws the player's square with the chosen skin style (also used for shop previews)
function drawAvatar(x, y, size, color, style) {
    const h = size / 2, k = size / 32;
    if (style === 'dragon') {
        // Little wings behind the body
        const flap = Math.sin(Date.now() / 150) * 4 * k;
        ctx.fillStyle = '#2E8B3E';
        for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(x + side * h, y - 6 * k);
            ctx.lineTo(x + side * (h + 12 * k), y - 14 * k - flap);
            ctx.lineTo(x + side * (h + 8 * k), y + 6 * k);
            ctx.closePath(); ctx.fill();
        }
    }
    ctx.fillStyle = color;
    ctx.fillRect(x - h, y - h, size, size);
    ctx.shadowBlur = 0;
    if (style === 'ninja') {
        ctx.fillStyle = '#DD2222';                                   // headband + tails
        ctx.fillRect(x - h, y - 12 * k, size, 5 * k);
        ctx.beginPath();
        ctx.moveTo(x + h, y - 11 * k); ctx.lineTo(x + h + 9 * k, y - 16 * k); ctx.lineTo(x + h + 7 * k, y - 8 * k);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FFFFFF';                                   // eyes through the mask slit
        ctx.fillRect(x - 10 * k, y - 4 * k, 6 * k, 3 * k);
        ctx.fillRect(x + 4 * k,  y - 4 * k, 6 * k, 3 * k);
    } else if (style === 'robot') {
        ctx.strokeStyle = '#666'; ctx.lineWidth = 2 * k;             // antenna
        ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x, y - h - 8 * k); ctx.stroke();
        ctx.fillStyle = Math.floor(Date.now() / 400) % 2 ? '#FF3333' : '#FFAAAA';
        ctx.beginPath(); ctx.arc(x, y - h - 9 * k, 3 * k, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#113';                                      // visor
        ctx.fillRect(x - 12 * k, y - 10 * k, 24 * k, 9 * k);
        ctx.fillStyle = '#33EEFF';
        ctx.fillRect(x - 9 * k, y - 8 * k, 5 * k, 5 * k);
        ctx.fillRect(x + 4 * k, y - 8 * k, 5 * k, 5 * k);
        ctx.fillStyle = '#555';                                      // mouth grill
        for (let i = -1; i <= 1; i++) ctx.fillRect(x + i * 5 * k - 1.5 * k, y + 5 * k, 3 * k, 6 * k);
    } else if (style === 'dragon') {
        ctx.fillStyle = '#FFAA22';                                   // head spikes
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(x + i * 9 * k - 4 * k, y - h); ctx.lineTo(x + i * 9 * k, y - h - 8 * k); ctx.lineTo(x + i * 9 * k + 4 * k, y - h);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#FFEE33';                                   // eyes with slit pupils
        ctx.fillRect(x - 10 * k, y - 8 * k, 6 * k, 6 * k);
        ctx.fillRect(x + 4 * k,  y - 8 * k, 6 * k, 6 * k);
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 8 * k, y - 8 * k, 2 * k, 6 * k);
        ctx.fillRect(x + 6 * k, y - 8 * k, 2 * k, 6 * k);
        ctx.fillRect(x - 5 * k, y + 6 * k, 2 * k, 2 * k);            // nostrils
        ctx.fillRect(x + 3 * k, y + 6 * k, 2 * k, 2 * k);
    } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 9 * k, y - 7 * k, 5 * k, 5 * k);
        ctx.fillRect(x + 4 * k, y - 7 * k, 5 * k, 5 * k);
    }
}

// ── DRAW: PROJECTILES ─────────────────────────────────────────
function drawProjectiles() {
    for (const p of projectiles) {
        ctx.save();
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// Zig-zag chain-lightning bolts
function drawBolts() {
    for (const b of bolts) {
        ctx.save();
        ctx.globalAlpha = b.life / 12;
        ctx.strokeStyle = Math.random() < 0.5 ? '#FFFFFF' : '#FFE033';
        ctx.shadowColor = '#FFE033'; ctx.shadowBlur = 14; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
        const len = Math.hypot(b.x2 - b.x1, b.y2 - b.y1) || 1;
        const nx = -(b.y2 - b.y1) / len, ny = (b.x2 - b.x1) / len;
        for (let k = 1; k < 6; k++) {
            const j = (Math.random() - 0.5) * 18;
            ctx.lineTo(b.x1 + (b.x2 - b.x1) * k / 6 + nx * j, b.y1 + (b.y2 - b.y1) * k / 6 + ny * j);
        }
        ctx.lineTo(b.x2, b.y2); ctx.stroke();
        ctx.restore();
    }
}

function drawHeartPickups() {
    for (const h of heartPickups) {
        if (h.life < 120 && Math.floor(Date.now() / 120) % 2) continue;   // blinks before vanishing
        ctx.save();
        ctx.font = '18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FF3355'; ctx.shadowColor = '#FF3355'; ctx.shadowBlur = 10;
        ctx.fillText('❤', h.x, h.y + Math.sin(Date.now() / 200 + h.x) * 3);
        ctx.restore();
    }
}

function drawEnemyProjectiles() {
    for (const p of enemyProjectiles) {
        ctx.save();
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// ── DRAW: PARTICLES ───────────────────────────────────────────
function drawParticles() {
    for (const p of particles) {
        const a = p.life / p.maxLife;
        ctx.save();
        ctx.globalAlpha = a;
        if (p.confetti) {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.cw / 2, -p.ch / 2, p.cw, p.ch);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.r * a), 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }
}

function drawFloatTexts() {
    for (const f of floatTexts) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, f.life / 20);
        ctx.fillStyle = f.color; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
    }
}

// ── DRAW: HUD ─────────────────────────────────────────────────
function drawHUD() {
    // Taller HUD when ammo bar is shown
    const hudH = (state.power !== POWER.NONE && state.room !== ROOM.VOID) ? 68 : 46;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, 800, hudH);

    // Light Crystals
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 17px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`Crystals: ${state.lightCrystals}/3`, 14, 28);
    for (let i = 0; i < 3; i++) {
        drawStar(210 + i * 28, 23, i < state.lightCrystals ? 11 : 7,
            i < state.lightCrystals ? '#FFD700' : '#333');
    }

    // HP hearts
    ctx.font = '18px Arial'; ctx.textAlign = 'center';
    let hearts = '';
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    for (let i = 0; i < maxHp; i++) hearts += i < state.playerHp ? '❤' : '♡';
    ctx.fillStyle = '#FF4444';
    ctx.fillText(hearts, 400, 20);

    // Room name + Level
    const names = { void: 'THE VOID', hell: 'HELL', paradise: 'PARADISE CITY' };
    const cfg    = LEVEL_CONFIGS[state.level - 1];
    const lvlLabel = cfg.isBoss ? `LEVEL ${state.level} — BOSS!` : `LEVEL ${state.level}`;
    ctx.fillStyle = cfg.isBoss ? 'rgba(255,100,50,0.85)' : 'rgba(255,255,255,0.5)';
    ctx.font = cfg.isBoss ? 'bold 11px Arial' : '11px Arial';
    ctx.fillText(`${names[state.room]} · ${lvlLabel}`, 400, 38);

    // Power
    ctx.fillStyle = state.power === POWER.RAINBOW ? getPlayerColor()
                  : state.power === POWER.NONE    ? '#888' : WEAPON_INFO[state.power].color;
    ctx.font = 'bold 17px Arial'; ctx.textAlign = 'right';
    ctx.fillText(`Power: ${state.power === POWER.NONE ? '' : WEAPON_INFO[state.power].icon + ' '}${powerName()}`, 786, 28);

    // ── AMMO BAR ──────────────────────────────────────────────
    if (state.power !== POWER.NONE && state.room !== ROOM.VOID) {
        const bx = 14, by = 54, bh = 10, bw = 130;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);

        if (state.ammoReloading) {
            const pct = 1 - state.ammoReloadTimer / LEVEL_CONFIGS[state.level - 1].reloadFrames;
            ctx.fillStyle = '#FF8800';
            ctx.fillRect(bx, by, bw * pct, bh);
            ctx.fillStyle = '#FFA500';
            ctx.font = 'bold 9px Arial'; ctx.textAlign = 'left';
            const secsLeft = Math.ceil(state.ammoReloadTimer / 60);
            ctx.fillText(`RELOADING… ${secsLeft}s`, bx + 2, by + bh - 1);
        } else {
            const bulletW = Math.floor(bw / state.ammoMax) - 2;
            for (let i = 0; i < state.ammoMax; i++) {
                ctx.fillStyle = i < state.ammo ? '#4FC3F7' : '#333';
                ctx.fillRect(bx + i * (bulletW + 2), by, bulletW, bh);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '9px Arial'; ctx.textAlign = 'left';
            ctx.fillText(`AMMO ${state.ammo}/${state.ammoMax}`, bx + 2, by + bh - 1);
        }
    }

    // ── COINS ─────────────────────────────────────────────────
    ctx.save();
    ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFAA00'; ctx.shadowBlur = 6;
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`🪙 ${state.coins}`, 14, 46);
    ctx.restore();

    // ── SCORE ─────────────────────────────────────────────────
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = 'bold 12px Arial'; ctx.textAlign = 'right';
    ctx.fillText(`Score ${state.score}   ·   Best 🏆 ${highScore}`, 786, 46);

    // ── MUTE BUTTON (M) ───────────────────────────────────────
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    ctx.font = '15px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFF';
    ctx.fillText(muted ? '🔇' : '🔊', MUTE_BTN.x, MUTE_BTN.y + 1);
    ctx.restore();
}

// ── DRAW: RAINBOW BACKGROUND ──────────────────────────────────
function drawRainbowBg() {
    const t    = Date.now() / 2200;
    const grad = ctx.createLinearGradient(0, 0, 800, 600);
    grad.addColorStop(0,    `hsl(${(t * 60)       % 360}, 85%, 12%)`);
    grad.addColorStop(0.25, `hsl(${(t * 60 + 90)  % 360}, 85%, 12%)`);
    grad.addColorStop(0.5,  `hsl(${(t * 60 + 180) % 360}, 85%, 12%)`);
    grad.addColorStop(0.75, `hsl(${(t * 60 + 270) % 360}, 85%, 12%)`);
    grad.addColorStop(1,    `hsl(${(t * 60 + 360) % 360}, 85%, 12%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 600);
}

function drawScoreLine(y) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 18px Arial';
    ctx.fillText(`Score: ${state.score}    Best: ${highScore}`, 400, y);
    if (state.newBest && Math.floor(Date.now() / 300) % 2 === 0) {
        ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 12;
        ctx.font = 'bold 15px Arial';
        ctx.fillText('🏆 NEW HIGH SCORE! 🏆', 400, y + 20);
    }
    ctx.restore();
}

// ── DRAW: LEVEL COMPLETE ──────────────────────────────────────
function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.60)';
    ctx.fillRect(0, 0, 800, 600);

    const cfg = LEVEL_CONFIGS[state.level - 1];
    ctx.save();
    ctx.shadowColor = '#4FC3F7'; ctx.shadowBlur = 50;
    ctx.fillStyle   = '#4FC3F7';
    ctx.font = 'bold 52px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${state.level} COMPLETE!`, 400, 195);
    ctx.restore();
    drawScoreLine(228);

    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '22px Arial'; ctx.textAlign = 'center';
    const nextCfg = LEVEL_CONFIGS[state.level];   // next level config
    const bossMsg  = nextCfg && nextCfg.isBoss ? '  ⚠ BOSS LEVEL NEXT!' : '';
    ctx.fillText(`Get ready for Level ${state.level + 1}…${bossMsg}`, 400, 282);
    ctx.restore();

    // Difficulty preview
    if (nextCfg) {
        ctx.fillStyle = 'rgba(255,200,100,0.8)';
        ctx.font = '15px Arial'; ctx.textAlign = 'center';
        const hints = [];
        if (nextCfg.ammoMax < cfg.ammoMax)           hints.push(`Ammo: ${nextCfg.ammoMax} bullets`);
        if (nextCfg.reloadFrames > cfg.reloadFrames) hints.push(`Reload: ${(nextCfg.reloadFrames/60).toFixed(0)}s`);
        if (nextCfg.devilHp > cfg.devilHp)           hints.push(`Boss HP: ${nextCfg.devilHp}`);
        if (nextCfg.playerMaxHp < cfg.playerMaxHp)   hints.push(`Lives: ${nextCfg.playerMaxHp}`);
        if (hints.length) ctx.fillText('Next level: ' + hints.join('  |  '), 400, 312);
    }

    // Orbiting stars
    const t = Date.now() / 300;
    for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + t;
        drawStar(400 + Math.cos(a) * 110, 370 + Math.sin(a) * 42,
            14 + Math.sin(t + i) * 4, '#4FC3F7');
    }

    // Next Level button
    ctx.save();
    ctx.shadowColor = '#4FC3F7'; ctx.shadowBlur = 20;
    ctx.fillStyle   = '#0a2840';
    ctx.fillRect(300, 420, 200, 55);
    ctx.strokeStyle = '#4FC3F7'; ctx.lineWidth = 2;
    ctx.strokeRect(300, 420, 200, 55);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Next Level  ▶', 400, 454);
    ctx.restore();
}

// ── DRAW: WIN SCREEN ──────────────────────────────────────────
function drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.52)';
    ctx.fillRect(0, 0, 800, 600);

    ctx.save();
    ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 55;
    ctx.fillStyle   = '#FFD700';
    ctx.font = 'bold 54px Arial'; ctx.textAlign = 'center';
    ctx.fillText('PARADISE IS SAVED!', 400, 185);
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#FFFFFF'; ctx.shadowBlur = 22;
    ctx.fillStyle   = '#FFFFFF';
    ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
    ctx.fillText('YOU ARE A HERO!', 400, 240);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,215,0,0.75)';
    ctx.font = '18px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`Coins collected: 🪙 ${state.coins}`, 400, 272);
    drawScoreLine(298);

    // Orbiting stars
    const t = Date.now() / 300;
    for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + t;
        drawStar(400 + Math.cos(a) * 110, 360 + Math.sin(a) * 42,
            14 + Math.sin(t + i) * 4, '#FFD700');
    }

    // Play Again button
    ctx.save();
    ctx.shadowColor = '#4488FF'; ctx.shadowBlur = 20;
    ctx.fillStyle   = '#1a3488';
    ctx.fillRect(300, 420, 200, 55);
    ctx.strokeStyle = '#6699FF'; ctx.lineWidth = 2;
    ctx.strokeRect(300, 420, 200, 55);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Play Again', 400, 454);
    ctx.restore();
}

// ── DRAW: SHOP ────────────────────────────────────────────────
function drawShop() {
    if (!state.shopOpen) return;

    const W = 580, H = 300, SX = (800 - W) / 2, SY = (600 - H) / 2;
    ctx.save();
    ctx.fillStyle   = 'rgba(10,5,25,0.93)';
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth   = 2;
    ctx.fillRect(SX, SY, W, H);
    ctx.strokeRect(SX, SY, W, H);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('✦ SHOP ✦', 400, SY + 30);

    ctx.fillStyle = 'rgba(255,215,0,0.8)';
    ctx.font = '14px Arial';
    ctx.fillText(`Your coins: 🪙 ${state.coins}`, 400, SY + 52);

    ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('Press 1-8 to equip / unlock a skin  |  9 for a Shield Bubble  |  E to close', 400, SY + 68);

    for (let i = 0; i < AVATAR_COLORS.length; i++) {
        const col = AVATAR_COLORS[i];
        const name = AVATAR_NAMES[i];
        const cost = AVATAR_UNLOCK_COST[i];
        const unlocked = state.unlockedSkins[i];
        const active   = state.activeSkin === i;

        const ix = SX + 46 + i * 70;
        const iy = SY + 118;

        // Slot background
        ctx.fillStyle = active ? 'rgba(255,215,0,0.25)' : 'rgba(255,255,255,0.06)';
        ctx.strokeStyle = active ? '#FFD700' : (unlocked ? '#666' : '#333');
        ctx.lineWidth = active ? 2 : 1;
        ctx.fillRect(ix - 26, iy - 26, 52, 70);
        ctx.strokeRect(ix - 26, iy - 26, 52, 70);

        // Avatar preview (locked skins still show their shape, greyed out)
        ctx.save();
        ctx.globalAlpha = unlocked ? 1 : 0.35;
        drawAvatar(ix, iy - 6, 20, col, AVATAR_STYLES[i]);
        ctx.restore();

        // Key hint
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`[${i + 1}]`, ix, iy + 16);

        // Name
        ctx.fillStyle = unlocked ? (col === '#2A2A2A' ? '#BBB' : col) : '#555';
        ctx.font = '10px Arial';
        ctx.fillText(name, ix, iy + 27);

        // Cost or ✓
        if (!unlocked) {
            ctx.fillStyle = state.coins >= cost ? '#FFD700' : '#886';
            ctx.font = 'bold 9px Arial';
            ctx.fillText(`🪙${cost}`, ix, iy + 39);
        } else if (active) {
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('✓', ix, iy + 39);
        }
    }

    // Items
    const bx = 400, by = SY + 215;
    ctx.fillStyle = state.bubble ? 'rgba(170,230,255,0.2)' : 'rgba(255,255,255,0.06)';
    ctx.strokeStyle = state.bubble ? '#AEE8FF' : '#666'; ctx.lineWidth = 1;
    ctx.fillRect(bx - 120, by - 24, 240, 58);
    ctx.strokeRect(bx - 120, by - 24, 240, 58);
    ctx.beginPath(); ctx.arc(bx - 90, by + 5, 16, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(170,230,255,0.25)'; ctx.fill();
    ctx.strokeStyle = '#CCF0FF'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#AEE8FF'; ctx.font = 'bold 13px Arial';
    ctx.fillText('[9] Shield Bubble', bx - 64, by);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '11px Arial';
    ctx.fillText(state.bubble ? '✓ You have one! It blocks 1 hit.' : `Blocks 1 hit  ·  🪙${BUBBLE_COST}`, bx - 64, by + 18);
    ctx.restore();
}

// ── DRAW: CONTROLS ────────────────────────────────────────────
function drawControls() {
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = '11px Arial'; ctx.textAlign = 'right';
    const hint = isTouchDevice
        ? 'Move: joystick  |  Shoot / Dig: button'
        : 'Move: WASD / Arrows  |  Shoot / Dig: Spacebar  |  Sound: M';
    ctx.fillText(hint, 792, 592);
}

function drawVirtualControls() {
    if (!isTouchDevice || state.gamePhase === 'intro' || state.won || state.levelComplete) return;
    ctx.save();

    // Joystick base
    ctx.beginPath();
    ctx.arc(VJOY.x, VJOY.y, VJOY.baseR, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Joystick stick
    ctx.beginPath();
    ctx.arc(VJOY.x + vTouch.joyDX, VJOY.y + vTouch.joyDY, 22, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.28)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.60)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Shoot button
    ctx.beginPath();
    ctx.arc(VSHOOT.x, VSHOOT.y, VSHOOT.r, 0, Math.PI * 2);
    ctx.fillStyle   = vTouch.shootId !== null ? 'rgba(255,220,50,0.40)' : 'rgba(255,220,50,0.15)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,50,0.70)';
    ctx.lineWidth   = 2;
    ctx.stroke();
    ctx.fillStyle   = 'rgba(255,255,255,0.80)';
    ctx.font        = 'bold 13px Arial';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(nearbyDigSpot() && canDig() ? 'DIG' : 'SHOOT', VSHOOT.x, VSHOOT.y);

    ctx.restore();
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function update() {
    if (state.gamePhase === 'intro') return;

    updatePlayer();
    if (!state.won && !state.levelComplete) {
        updateEnemies();
        updateRoomEnemies();
        updateProjectiles();
        updateEnemyProjectiles();
        checkPickups();
        updateDigging();
        updateVoidHealing();
        updateAmmo();
    }
    updateParticles();
    if (state.screenShake > 0) state.screenShake--;

    // Fire confetti once on win or level complete
    if ((state.won || state.levelComplete) && !state.confettiSpawned) {
        state.confettiSpawned = true;
        spawnConfetti();
        sfx('win');
    }
}

function draw() {
    ctx.save();
    if (state.screenShake > 0) {
        const s = state.screenShake * 0.8;
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    if (state.gamePhase === 'intro') {
        drawIntro();
        ctx.restore();
        return;
    }

    // Background
    if (state.won || state.levelComplete) {
        drawRainbowBg();
    } else {
        const bg = { void: voidBgColor, hell: '#1a0000', paradise: '#001a1a' };
        ctx.fillStyle = bg[state.room];
        ctx.fillRect(0, 0, 800, 600);
    }

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
    for (let x = 0; x <= 800; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 600); ctx.stroke(); }
    for (let y = 0; y <= 600; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }

    if (!state.won && !state.levelComplete) drawPortals();
    if (state.room === ROOM.VOID)     drawVoid();
    if (state.room === ROOM.HELL)     drawHell();
    if (state.room === ROOM.PARADISE) drawParadise();
    drawPlayer();
    drawHeartPickups();
    drawProjectiles();
    drawBolts();
    drawEnemyProjectiles();
    drawParticles();
    drawFloatTexts();
    drawHUD();
    drawControls();
    drawVirtualControls();
    drawShop();
    if (state.levelComplete) drawLevelComplete();
    if (state.won)           drawWin();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
