}

function updateDanceAndFart() {
    if (state.fartCooldown > 0) state.fartCooldown--;
    if (state.danceTimer > 0) {
        state.danceTimer--;
        if (state.danceTimer % 14 === 0) {
            spawnFloatText(player.x + (Math.random() - 0.5) * 40, player.y - 20, Math.random() < 0.5 ? '♪' : '♫',
                           `hsl(${Math.random() * 360}, 100%, 70%)`, 50);
        }
    }
}

// ── GADGETS & DASH ────────────────────────────────────────────
const VGADGET = { x: 600, y: 540, r: 22 };   // touch buttons
const VBUILD  = { x: 530, y: 560, r: 20 };
const VSPELL  = { x: 580, y: 470, r: 20 };
const VMOUNT  = { x: 470, y: 560, r: 20 };
const VDASH   = { x: 700, y: 385, r: 20 };
let gadgetObjs = [];   // boomerangs, bombs and tornadoes flying about

function nearestTarget(range = 400) {
    let best = null, bestD = range;
    for (const e of targetableEnemies()) {
        if (e.frog) continue;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < bestD) { best = e; bestD = d; }
    }
    return best;
}

// Where to aim: the nearest monster, or straight ahead
function aimPoint(dist = 140) {
    const t = nearestTarget();
    return t ? { x: t.x, y: t.y } : { x: player.x + state.faceX * dist, y: player.y + state.faceY * dist };
}

function useGadget() {
    if (!playing() || !state.gadget || state.gadgetCooldown > 0 || state.room === ROOM.VOID) return;
    const g = GADGETS.find(g => g.id === state.gadget);
    const aim = aimPoint();
    const a = Math.atan2(aim.y - player.y, aim.x - player.x);
    if (g.id === 'boomerang') {
        gadgetObjs.push({ kind: 'boomerang', x: player.x, y: player.y, vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, t: 0, hits: new Set() });
        sfx('whoosh');
    } else if (g.id === 'bomb') {
        gadgetObjs.push({ kind: 'bomb', x: player.x, y: player.y, sx: player.x, sy: player.y, tx: aim.x, ty: aim.y, t: 0, dur: 36 });
        sfx('whoosh');
    } else if (g.id === 'wand') {
        const e = nearestTarget(320);
        if (!e) { showToast('🪄 No monster close enough to zap!', '#CC99FF', 90); return; }
        bolts.push({ x1: player.x, y1: player.y, x2: e.x, y2: e.y, life: 14 });
        if (e.type === 'king') {
            spawnFloatText(e.x, e.y - e.r - 10, 'Too big to be a frog!', '#CC99FF', 70);
        } else {
            Object.assign(e, { frog: true, hp: 1, maxHp: 1, frozen: 0, hopTimer: 20, dx: 0, dy: 0, r: 12 });
            spawnParticles(e.x, e.y, '#CC99FF', 16);
            spawnFloatText(e.x, e.y - 24, 'RIBBIT! 🐸', '#88FF88', 70);
        }
        sfx('magic');
    } else if (g.id === 'tornado') {
        gadgetObjs.push({ kind: 'tornado', x: aim.x, y: aim.y, t: 0, dur: 180 });
        sfx('whoosh');
    } else if (g.id === 'bow') {
        const ar = ARROWS[state.arrowKind = ((state.arrowKind || 0) + 1) % ARROWS.length];
        gadgetObjs.push({ kind: 'arrow', arrow: ar, x: player.x, y: player.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, t: 0 });
        spawnFloatText(player.x, player.y - 30, ar.label, ar.color, 30); sfx('whoosh');
    } else if (g.id === 'watergun') {
        const wob = (Math.random() - 0.5) * 0.15;
        gadgetObjs.push({ kind: 'squirt', x: player.x, y: player.y, vx: Math.cos(a + wob) * 10, vy: Math.sin(a + wob) * 10, t: 0 });
        if (Math.random() < 0.3) sfx('splash');
    } else if (g.id === 'snowball') {
        gadgetObjs.push({ kind: 'snowball', x: player.x, y: player.y, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, t: 0 });
        sfx('whoosh');
    } else if (g.id === 'paint') {
        gadgetObjs.push({ kind: 'paint', x: player.x, y: player.y, vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, t: 0, hue: Math.floor(Math.random() * 360) });
        sfx('whoosh');
    } else if (g.id === 'banana') {
        const peels = gadgetObjs.filter(o => o.kind === 'peel');
        if (peels.length >= MAX_PEELS) gadgetObjs.splice(gadgetObjs.indexOf(peels[0]), 1);   // the oldest one goes
        gadgetObjs.push({ kind: 'peel', x: player.x - state.faceX * 16, y: player.y + 12, t: 0, spin: Math.random() * 6 });
        spawnFloatText(player.x, player.y - 30, '🍌 peel dropped!', '#FFE066', 40); sfx('pop');
    }
    state.gadgetCooldown = g.cooldown;
}

function dash() {
    if (!playing() || !state.hasDash || state.dashCooldown > 0) return;
    // Dodged at the very last moment? PERFECT DODGE → slow motion!
    const close = enemyProjectiles.some(q => Math.hypot(q.x - player.x, q.y - player.y) < 60)
               || targetableEnemies().some(e => Math.hypot(e.x - player.x, e.y - player.y) < e.r + 30);
    if (close) { slowMo = 120; sfx('magic'); giveAward('perfectDodge'); }
    state.dashTimer = 8;
    state.dashCooldown = DASH_COOLDOWN;
    sfx('whoosh');
}

function updateGadgets() {
    if (state.gadgetCooldown > 0) state.gadgetCooldown--;
    if (state.dashCooldown > 0)   state.dashCooldown--;
    for (let i = gadgetObjs.length - 1; i >= 0; i--) {
        const o = gadgetObjs[i];
        o.t++;
        if (o.kind === 'boomerang') {
            if (o.t > 28) {   // curve back to you
                const a = Math.atan2(player.y - o.y, player.x - o.x);
                o.vx += Math.cos(a) * 1.1; o.vy += Math.sin(a) * 1.1;
                const sp = Math.hypot(o.vx, o.vy); if (sp > 11) { o.vx *= 11 / sp; o.vy *= 11 / sp; }
                if (Math.hypot(player.x - o.x, player.y - o.y) < 18) { gadgetObjs.splice(i, 1); continue; }
            }
            o.x += o.vx; o.y += o.vy;
            for (const e of targetableEnemies()) {
                if (o.hits.has(e) || Math.hypot(e.x - o.x, e.y - o.y) > e.r + 12) continue;
                o.hits.add(e);
                damageEnemy(e, POWER.NONE, false, 1 + state.weaponLevel - 1);
            }
            if (o.t > 150) gadgetObjs.splice(i, 1);
        } else if (o.kind === 'bomb') {
            const k = o.t / o.dur;
            o.x = o.sx + (o.tx - o.sx) * k; o.y = o.sy + (o.ty - o.sy) * k - Math.sin(k * Math.PI) * 60;   // arcs through the air
            if (o.t >= o.dur) {
                for (const e of targetableEnemies()) {
                    if (Math.hypot(e.x - o.tx, e.y - o.ty) < 95) damageEnemy(e, POWER.NONE, false, 2 + state.weaponLevel - 1);
                }
                for (let k2 = 0; k2 < 3; k2++) spawnParticles(o.tx, o.ty, ['#FFEE66', '#FF8800', '#555555'][k2], 16);
                triggerShake(18);
                sfx('boom');
                gadgetObjs.splice(i, 1);
            }
        } else if (o.kind === 'arrow' || o.kind === 'squirt' || o.kind === 'snowball' || o.kind === 'paint') {
            o.x += o.vx; o.y += o.vy;
            if (o.kind === 'snowball' || o.kind === 'paint') o.vy += 0.05;   // a little bit of an arc
            const e = targetableEnemies().find(e => Math.hypot(e.x - o.x, e.y - o.y) < e.r + 6);
            if (e) { gadgetHit(o, e); gadgetObjs.splice(i, 1); continue; }
            if (o.t > 80 || o.x < 0 || o.x > 800 || o.y < 50 || o.y > 600) {
                if (o.kind === 'arrow' && o.arrow.kind === 'bomb') arrowBoom(o.x, o.y);
                if (o.kind === 'paint') spawnParticles(o.x, o.y, `hsl(${o.hue},90%,55%)`, 6);
                gadgetObjs.splice(i, 1);
            }
        } else if (o.kind === 'peel') {
            const e = targetableEnemies().find(e => !(e.stun > 0) && !(e.air > 0) && Math.hypot(e.x - o.x, e.y - o.y) < e.r + 8);
            if (e && BOSS_TYPES.includes(e.type)) {   // far too big to slip — they just squash it
                spawnFloatText(o.x, o.y - 20, 'squish!', '#FFE066', 40); gadgetObjs.splice(i, 1); continue;
            }
            if (e) {
                e.stun = 90; e.slip = 30;
                damageEnemy(e, POWER.NONE, false, state.weaponLevel - 1);
                spawnFloatText(e.x, e.y - e.r - 14, 'WHOOPS! SLIP!', '#FFE066', 60); sfx('boing'); giveAward('banana');
                gadgetObjs.splice(i, 1); continue;
            }
            if (o.t > 1800) gadgetObjs.splice(i, 1);   // peels rot away after 30 s
        } else if (o.kind === 'tornado') {
            const tgt = nearestTarget(600);
            if (tgt) { o.x += Math.sign(tgt.x - o.x) * 1.2; o.y += Math.sign(tgt.y - o.y) * 1.2; }
            for (const e of targetableEnemies()) {
                const d = Math.hypot(e.x - o.x, e.y - o.y);
                if (d < 140 && d > 4) {   // pulled in and spun around
                    const a = Math.atan2(e.y - o.y, e.x - o.x) + 0.12;
                    const nd = Math.max(8, d - 1.6);
                    e.x = o.x + Math.cos(a) * nd; e.y = o.y + Math.sin(a) * nd;
                }
                if (d < 40 && o.t % 30 === 0) damageEnemy(e, POWER.NONE, false, state.weaponLevel - 1);
            }
            if (o.t >= o.dur) gadgetObjs.splice(i, 1);
        }
    }
}

function arrowBoom(x, y) {
    for (const e of targetableEnemies()) if (Math.hypot(e.x - x, e.y - y) < 70) damageEnemy(e, POWER.NONE, false, 2 + state.weaponLevel - 1);
    for (let k = 0; k < 3; k++) spawnParticles(x, y, ['#FFEE66', '#FF8800', '#555555'][k], 12);
    triggerShake(12); sfx('boom');
}

// One of the new gadget shots hit a monster
function gadgetHit(o, e) {
    const boss = BOSS_TYPES.includes(e.type), bonus = state.weaponLevel - 1;
    if (o.kind === 'arrow') {
        if (o.arrow.kind === 'bomb') arrowBoom(o.x, o.y);
        else damageEnemy(e, o.arrow.power, false, 1 + bonus);
    } else if (o.kind === 'squirt') {   // hardly hurts, but pushes them WAY back
        if (Math.random() < 0.25) damageEnemy(e, POWER.WATER, false, -1 + bonus);
        if (!boss) { e.x = Math.max(30, Math.min(770, e.x + o.vx * 3.5)); e.y = Math.max(70, Math.min(580, e.y + o.vy * 3.5)); e.stun = Math.max(e.stun || 0, 6); }
        spawnParticles(o.x, o.y, '#66CCFF', 4);
    } else if (o.kind === 'snowball') {
        damageEnemy(e, POWER.NONE, false, bonus);
        if (e.alive && !e.frog) { e.frozen = Math.max(e.frozen || 0, boss ? 30 : 80); sfx('freeze'); }
        spawnParticles(o.x, o.y, '#FFFFFF', 10);
    } else if (o.kind === 'paint') {
        e.painted = boss ? PAINT_FRAMES / 3 : PAINT_FRAMES; e.paintHue = o.hue;
        spawnParticles(o.x, o.y, `hsl(${o.hue},90%,55%)`, 14);
        spawnFloatText(e.x, e.y - e.r - 14, "SPLAT! I can't see!", `hsl(${o.hue},90%,65%)`, 60); sfx('pop');
    }
}

// Painted monsters can't see — they stumble about and can't find you
function moveConfused(e) {
    if (--e.hopTimer <= 0 || e.hopTimer === undefined) {
        e.hopTimer = 30 + Math.random() * 30;
        const a = Math.random() * Math.PI * 2;
        e.dx = Math.cos(a) * 1.4; e.dy = Math.sin(a) * 1.4;
    }
    e.x = Math.max(40, Math.min(760, e.x + e.dx)); e.y = Math.max(70, Math.min(560, e.y + e.dy));
}

function drawGadgets() {
    const t = Date.now() / 1000;
    for (const o of gadgetObjs) {
        ctx.save();
        if (o.kind === 'boomerang') {
            ctx.translate(o.x, o.y); ctx.rotate(o.t * 0.5);
            ctx.strokeStyle = '#C8843A'; ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(0, -6); ctx.lineTo(10, 6); ctx.stroke();
        } else if (o.kind === 'bomb') {
            drawGroundShadow(o.x, o.ty + 8, 8, 3);
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(o.x - 3, o.y - 3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = Math.random() < 0.5 ? '#FFEE66' : '#FF6600';   // fizzing fuse
            ctx.beginPath(); ctx.arc(o.x + 6, o.y - 9, 3, 0, Math.PI * 2); ctx.fill();
        } else if (o.kind === 'arrow') {
            ctx.translate(o.x, o.y); ctx.rotate(Math.atan2(o.vy, o.vx));
            ctx.strokeStyle = '#8A5A2A'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(6, 0); ctx.stroke();
            ctx.fillStyle = o.arrow.color; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(4, -4); ctx.lineTo(4, 4); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#EEE'; ctx.fillRect(-15, -3, 4, 2); ctx.fillRect(-15, 1, 4, 2);   // feathers
            if (o.arrow.kind === 'fire') { ctx.fillStyle = Math.random() < 0.5 ? '#FFAA00' : '#FF4400'; ctx.beginPath(); ctx.arc(10, 0, 4, 0, Math.PI * 2); ctx.fill(); }
        } else if (o.kind === 'squirt') {
            ctx.fillStyle = 'rgba(120,200,255,0.85)'; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, Math.PI * 2); ctx.fill();
        } else if (o.kind === 'snowball') {
            drawGroundShadow(o.x, o.y + 14, 6, 2);
            ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#BBD4E8'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(o.x, o.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (o.kind === 'paint') {
            ctx.fillStyle = `hsl(${o.hue},90%,55%)`; ctx.beginPath(); ctx.arc(o.x, o.y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(o.x - 2, o.y - 2, 2, 0, Math.PI * 2); ctx.fill();
        } else if (o.kind === 'peel') {
            ctx.translate(o.x, o.y); ctx.rotate(o.spin);
            ctx.fillStyle = '#FFE135'; ctx.strokeStyle = '#8A7A20'; ctx.lineWidth = 1;
            for (let k = 0; k < 3; k++) {   // three floppy bits of peel
                ctx.save(); ctx.rotate(k * 2.1); ctx.beginPath(); ctx.ellipse(0, -7, 3.5, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
            }
            ctx.fillStyle = '#6A5A10'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
        } else if (o.kind === 'tornado') {
            ctx.globalAlpha = Math.min(1, (o.dur - o.t) / 30);
            for (let k = 0; k < 9; k++) {
                const y = o.y + 20 - k * 7, w = 8 + k * 4;
                ctx.strokeStyle = `rgba(200,210,220,${0.7 - k * 0.05})`; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.ellipse(o.x + Math.sin(t * 8 + k) * 4, y, w, w * 0.3, 0, t * 10 + k, t * 10 + k + Math.PI * 1.5); ctx.stroke();
            }
        }
        ctx.restore();
    }
}

// A clickable BUILD button that also shows which block you're holding
const BUILD_BTN = { x: 272, y: 5, w: 86, h: 22 };   // in the top bar
function drawBuildButton() {
    if (lastInput === 'touch' || state.gamePhase !== 'playing' || state.won || state.levelComplete) return;
    const b = BUILD_BTN, type = HOTBAR[state.hotbar];
    ctx.save();
    ctx.fillStyle = state.buildMode ? 'rgba(255,224,102,0.9)' : 'rgba(0,0,0,0.6)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.drawImage(blockCanvas(type), b.x + 3, b.y + 3, 16, 16);
    ctx.fillStyle = state.buildMode ? '#222' : '#FFE066'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`BUILD (B) ${isCreative() ? '∞' : '×' + invCount(type)}`, b.x + 22, b.y + b.h / 2 + 1);
    ctx.restore();
}

// Little gadget + dash icons in the bottom-left corner
function drawGadgetHud() {
    const slots = [];
    if (state.gadget) {
        const g = GADGETS.find(g => g.id === state.gadget);
        slots.push({ icon: g.icon, key: lastInput === 'pad' ? 'B' : 'Q', cd: state.gadgetCooldown / g.cooldown });
    }
    if (state.hasDash) slots.push({ icon: '💨', key: lastInput === 'pad' ? 'LT' : '⇧', cd: state.dashCooldown / DASH_COOLDOWN });
    if (state.spell) {
        const sp = SPELLS.find(x => x.id === state.spell);
        slots.push({ icon: sp.icon, key: lastInput === 'pad' ? 'X' : 'R', cd: state.spellCooldown / sp.cooldown });
    }
    slots.forEach((sl, i) => {
        const x = 70 + i * 40, y = 574;
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
        if (sl.cd > 0) {   // cooldown sweep
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sl.cd); ctx.closePath(); ctx.fill();
        }
        ctx.strokeStyle = sl.cd > 0 ? '#777' : '#FFD700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();
        ctx.font = '15px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FFF';
        ctx.fillText(sl.icon, x, y + 1);
        if (lastInput !== 'touch') { ctx.font = 'bold 8px Arial'; ctx.fillText(sl.key, x + 12, y - 12); }
        ctx.restore();
    });
}

// ── PET RACES (talk to the Race Master in the Void) ──────────
const RACE_MASTER  = { x: 700, y: 470 };
const RACE_FINISH  = 700;
let race = null;   // { lanes: [{ pet, x, you }], countdown, winner, doneTimer }

function nearRaceMaster() {
    return state.room === ROOM.VOID && !state.shopOpen && Math.hypot(player.x - RACE_MASTER.x, player.y - RACE_MASTER.y) < 44;
}

function startRace() {
    if (state.activePet < 0) { showToast('🏁 You need a pet to race! Buy one in the Shop.', '#FFCC88', 150); return; }
    const others = PETS.map((p, i) => i).filter(i => i !== state.activePet).sort(() => Math.random() - 0.5).slice(0, 3);
    race = { lanes: [{ pet: state.activePet, x: 90, you: true }, ...others.map(i => ({ pet: i, x: 90, speed: 1.2 + Math.random() * 0.6 }))],
             countdown: 180, winner: null, doneTimer: 0, boost: 0 };
    sfx('bite');
}

// Pressing the button during a race makes your pet run faster
function raceTap() {
    if (!race) return;
    if (race.countdown > 0 || race.winner) return;
    race.boost = Math.min(4, race.boost + 0.9);
    spawnParticles(race.lanes[0].x - 10, 170, '#FFE066', 2);
}

function updateRace() {
    if (race.countdown > 0) {
        if (race.countdown % 60 === 0) tone(race.countdown === 60 ? 880 : 440, 0.15, 'square', 0.15);
        race.countdown--;
        return;
    }
    if (race.winner) {
        if (++race.doneTimer > 200) race = null;
        return;
    }
    race.boost *= 0.95;
    for (const l of race.lanes) {
        l.x += l.you ? 0.9 + race.boost : l.speed + Math.sin(Date.now() / 300 + l.pet) * 0.3;
        if (l.x >= RACE_FINISH && !race.winner) race.winner = l;
    }
    if (race.winner) {
        const won = race.winner.you;
        if (won) { petGainXp(50); addScore(100); giveAward('race'); showToast(`🏆 Your ${PETS[state.activePet].name} WON the race!`, '#FFD700', 220); sfx('win'); }
        else     { petGainXp(10); showToast(`The ${PETS[race.winner.pet].name} won… try again!`, '#FFCC88', 180); }
    }
}

function drawRace() {
    if (!race) return;
    ctx.save();
    ctx.fillStyle = 'rgba(10,30,10,0.96)'; ctx.fillRect(40, 90, 720, 420);
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2; ctx.strokeRect(40, 90, 720, 420);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
    ctx.fillText('🏁 PET RACE 🏁', 400, 122);
    race.lanes.forEach((l, i) => {
        const y = 170 + i * 80;
        ctx.fillStyle = i % 2 ? '#3A7A2A' : '#4A8A3A'; ctx.fillRect(60, y - 30, 680, 64);   // grass lanes
        for (let k = 0; k < 8; k++) {                                                            // checkered finish line
            ctx.fillStyle = k % 2 ? '#FFF' : '#111';
            ctx.fillRect(RACE_FINISH + 10, y - 30 + k * 8, 8, 8); ctx.fillStyle = k % 2 ? '#111' : '#FFF'; ctx.fillRect(RACE_FINISH + 18, y - 30 + k * 8, 8, 8);
        }
        const bounce = race.countdown > 0 ? 0 : Math.abs(Math.sin(Date.now() / 90 + i)) * 6;
        drawPetShape(PETS[l.pet].id, l.x, y - bounce, 1.6, -1);
        ctx.fillStyle = l.you ? '#FFE066' : '#FFFFFF'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
        ctx.fillText(l.you ? `⭐ YOUR ${PETS[l.pet].name.toUpperCase()}` : PETS[l.pet].name, 66, y + 28);
    });
    ctx.textAlign = 'center';
    if (race.countdown > 0) {
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 60px Arial';
        ctx.fillText(String(Math.ceil(race.countdown / 60)), 400, 330);
    } else if (!race.winner) {
        const verb = lastInput === 'pad' ? 'A' : lastInput === 'touch' ? 'TAP' : 'SPACE';
        ctx.fillStyle = Math.floor(Date.now() / 200) % 2 ? '#FFE066' : '#FFFFFF'; ctx.font = 'bold 18px Arial';
        ctx.fillText(`Press ${verb} as fast as you can to cheer your pet on!`, 400, 496);
    } else {
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 26px Arial';
        ctx.fillText(race.winner.you ? '🏆 YOU WIN! +50 pet XP' : `${PETS[race.winner.pet].name} wins!`, 400, 496);
    }
    ctx.restore();
}

// ── UPDATE: WEATHER ───────────────────────────────────────────
function updateWeather() {
    const P = paradise;
    if (P.rainbowTimer > 0) P.rainbowTimer--;
    if (--P.weatherTimer <= 0) {
        P.weatherTimer = WEATHER_FRAMES;
        const was = P.weather, r = Math.random();
        P.weather = r < 0.5 ? 'sun' : r < 0.8 ? 'rain' : 'snow';
        if (was === 'rain' && P.weather !== 'rain') P.rainbowTimer = RAINBOW_FRAMES;   // 🌈 after the rain!
    }
    // Rain waters the thirsty crops for you
    if (P.weather === 'rain' && P.weatherTimer % 150 === 0) {
        const crop = P.crops.find(c => c.thirsty);
        if (crop) {
            crop.thirsty = false;
            if (state.job && state.job.kind === 'water') state.job.got++;
            spawnFloatText(crop.x, crop.y - 26, '🌧 The rain watered a crop!', '#88DDFF', 70);
        }
    }
}

// Rain / snow falling, and a rainbow in the sky (drawn over the town, under the HUD)
function drawWeather() {
    const P = paradise, t = Date.now() / 1000;
    if (P.phase !== 'day') return;
    if (P.weather === 'rain') {
        ctx.fillStyle = 'rgba(40,50,80,0.18)'; ctx.fillRect(0, 0, 800, 600);
        ctx.strokeStyle = 'rgba(180,210,255,0.55)'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < 140; i++) {
            const x = (i * 57.3 + t * 90) % 820 - 10, y = (i * 91.7 + t * 620) % 620 - 10;
            ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 12);
        }
        ctx.stroke();
    } else if (P.weather === 'snow') {
        ctx.fillStyle = 'rgba(220,230,255,0.12)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        for (let i = 0; i < 110; i++) {
            const x = (i * 71.3 + Math.sin(t + i) * 20 + t * 15) % 800, y = (i * 53.1 + t * 45) % 600;
            ctx.beginPath(); ctx.arc(x, y, 1.5 + (i % 3) * 0.7, 0, Math.PI * 2); ctx.fill();
        }
    }
}

function drawRainbowArc() {
    const P = paradise;
    if (P.phase !== 'day' || P.rainbowTimer <= 0) return;
    const fade = Math.min(1, P.rainbowTimer / 120, (RAINBOW_FRAMES - P.rainbowTimer) / 60);
    ctx.save();
    ctx.globalAlpha = 0.45 * fade; ctx.lineWidth = 7;
    ['#FF3B3B', '#FF9A2E', '#FFE83B', '#4CD964', '#3BA7FF', '#6A5BFF', '#B45BFF'].forEach((c, i) => {
        ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(400, 420, 330 - i * 7, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    });
    ctx.restore();
}

    return LESSONS.map(l => ({
        icon: l.icon, name: l.name, desc: l.desc, cost: l.cost, status: state.lessons[l.id] ? 'LEARNED' : null,
        action: () => {

            if (spend(l.cost)) { state.lessons[l.id] = true; showToast(`🎓 You learned ${l.name}!`); giveAward('student'); }
        },

function hatItems() {
    return [
        ...HATS.map(h => ({
            icon: h.icon, name: h.name, desc: state.hat === h.id ? 'You are wearing it!' : 'Looks great on you', cost: h.cost,
            status: state.hat === h.id ? 'WEARING' : state.hats[h.id] ? 'OWNED — wear' : null,
            action: () => {
                if (state.hats[h.id]) { state.hat = state.hat === h.id ? null : h.id; return; }
                if (spend(h.cost)) { state.hats[h.id] = true; state.hat = h.id; showToast(`${h.icon} Looking good in your ${h.name}!`); giveAward('hat'); }

}

// Crafting recipes: turn what you've mined into new things
function craftItems() {
    const has = (need) => settings.creative || Object.entries(need).every(([k, v]) => invCount(k) >= v);
    const take = (need) => { if (!settings.creative) for (const [k, v] of Object.entries(need)) state.inv[k] -= v; };
    const needText = (need) => Object.entries(need).map(([k, v]) => `${v} ${MATERIALS[k] || BLOCKS[k].name}`).join(' + ');
    const recipe = (icon, name, need, give, doneIf, extraDesc) => ({
        icon, name, desc: `${needText(need)}${extraDesc ? ' — ' + extraDesc : ''}`,
        cost: 0, status: doneIf && doneIf() ? 'DONE' : has(need) ? 'CRAFT!' : null,
        action: () => {
            if (doneIf && doneIf()) return;
            if (!has(need)) { showToast(`You need ${needText(need)}`, '#FF9988', 120); sfx('hurt'); return; }
            take(need); give(); sfx('found');
            giveAward('crafter');
        },
    });
    const add = (k, n) => () => { state.inv[k] = invCount(k) + n; showToast(`⚒ Crafted ${n} ${BLOCKS[k].name}!`); };
    return [
        recipe('🪵', '4 Planks', { log: 1 }, add('planks', 4)),
        recipe('🧱', '4 Bricks', { stone: 2 }, add('brick', 4)),
        recipe('🪟', '2 Glass', { stone: 1, leaves: 1 }, add('glass', 2)),
        recipe('💥', '2 TNT', { stone: 2, log: 1 }, add('tnt', 2)),
        recipe('⛏', 'Diamond Pickaxe', { diamond: 3, log: 2 }, () => { state.diamondPickaxe = true; showToast('⛏ DIAMOND PICKAXE — mine anything in one hit!'); },
               () => state.diamondPickaxe, 'mine in 1 hit'),
        recipe('🗡', 'Diamond Sword', { diamond: 2, log: 1 }, () => { state.weaponLevel = Math.min(3, state.weaponLevel + 1); showToast(`🗡 Weapon Level ${state.weaponLevel}!`); },
               () => state.weaponLevel >= 3, '+1 weapon level'),
        recipe('🛡', 'Iron Armor', { iron: 5 }, () => { state.armor = Math.max(state.armor, 1); state.playerHp++; showToast('🛡 IRON ARMOR — +1 heart!'); },
               () => state.armor >= 1, '+1 heart'),
        recipe('💠', 'Diamond Armor', { diamond: 5 }, () => { const was = state.armor; state.armor = 2; state.playerHp += 2 - was; showToast('💠 DIAMOND ARMOR — +2 hearts!'); },
               () => state.armor >= 2, '+2 hearts'),
        recipe('🟫', 'Blocky Outfit', { planks: 3, dirt: 2 }, () => { state.unlockedSkins[8] = true; state.activeSkin = 8; showToast('🟫 You look BLOCKY now!'); },
               () => state.unlockedSkins[8], 'a Minecraft look'),
    ];
}

    items.push({ icon: '🌈', name: 'Rainbow Armor', desc: '+4 hearts — the best armor!', cost: 150, status: state.armor >= 4 ? 'OWNED' : null,
                 action: () => { if (state.armor < 4 && spend(150)) { const was = state.armor; state.armor = 4; state.playerHp += 4 - was; showToast('🌈 RAINBOW ARMOR — +4 hearts!'); } } });
    items.push({ icon: '🎾', name: 'Bouncy Shots', desc: 'Your shots bounce off the walls', cost: 20, status: state.bouncy ? 'OWNED' : null,
                 action: () => { if (!state.bouncy && spend(20)) { state.bouncy = true; showToast('🎾 Boing! Your shots bounce now!'); } } });
    items.push({ icon: '💨', name: 'Super Dash', desc: 'Zoom super fast (Shift / LT)', cost: DASH_COST,

                 action: () => { if (!state.hasDash && spend(DASH_COST)) { state.hasDash = true; showToast('💨 You can DASH now!'); } } });
    items.push({ icon: '🗡', name: 'Fighting Weapons →', desc: 'Sword, hammer, nunchucks, spear, whip', cost: 0,

    const items = GADGETS.map(g => {
        const owned = state.ownedGadgets[g.id];
        return { icon: g.icon, name: g.name, desc: g.desc, cost: g.cost,
                 status: state.gadget === g.id ? 'HOLDING' : owned ? 'OWNED — pick' : null,
                 action: () => {
                     if (owned) { state.gadget = g.id; return; }
                     if (spend(g.cost)) { state.ownedGadgets[g.id] = true; state.gadget = g.id; showToast(`${g.icon} ${g.name}! Use it with Q / B / ⚙`); }
                 } };

    items.push({ icon: '⬅', name: 'Back', desc: 'Back to the Forge', cost: 0, status: 'BACK', action: () => openMenu("🔨 THE BLACKSMITH'S FORGE", forgeItems) });

function drawMenu() {
    if (!menu) return;
    const { X, Y, W, H } = MENU;
    ctx.save();
    ctx.fillStyle = 'rgba(12,8,24,0.97)'; ctx.fillRect(X, Y, W, H);
    ctx.strokeStyle = '#FFB347'; ctx.lineWidth = 2; ctx.strokeRect(X, Y, W, H);
    ctx.fillStyle = '#FFB347'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
    ctx.fillText(menu.title, 400, Y + 26);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px Arial';
    ctx.fillText(`Your coins: 🪙${state.coins}   ·   ${lastInput === 'pad' ? 'A to buy, B to close' : lastInput === 'touch' ? 'Tap to buy, tap the title to close' : 'Arrows + SPACE (or click) to buy, E to close'}`, 400, Y + 44);
    menu.items().forEach((it, i) => {
        const r = menuItemRect(i);
        const cursor = i === menu.cursor && lastInput !== 'touch';
        ctx.fillStyle = it.status ? 'rgba(255,215,0,0.14)' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = cursor ? '#FFFFFF' : it.status ? '#C8A040' : '#444'; ctx.lineWidth = cursor ? 2.5 : 1;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#FFF';
        ctx.fillText(it.icon, r.x + 28, r.y + 40);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#FFE8B0'; ctx.font = 'bold 13px Arial'; ctx.fillText(it.name, r.x + 56, r.y + 20);
        ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.font = '10px Arial'; ctx.fillText(it.desc, r.x + 56, r.y + 36);
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = it.status ? '#FFD700' : state.coins >= (it.cost || 0) ? '#FFD700' : '#886';
        ctx.fillText(it.status ? '✓ ' + it.status : it.cost ? `🪙${it.cost}` : 'Need more…', r.x + 56, r.y + 53);
    });
    ctx.restore();
}

// ── UPDATE: PARADISE TOWN ─────────────────────────────────────
function houseDoors() {
    return BUILDINGS.filter(b => b.cost).map(b => ({ id: b.id, door: true, name: b.name, x: b.x, y: b.y + 40, cost: b.cost }));
}

function townNpcs() {
    return [...WORKERS, ...paradise.villagers, ...houseDoors(), CRAFTING_TABLE];
}

function personName(id) {
    const p = [...WORKERS, ...VILLAGERS].find(n => n.id === id);
    return p ? p.name : id;
}

// The townsperson you're standing next to (only in the daytime — at night they hide indoors)
function nearbyNpc() {
    if (state.room !== ROOM.PARADISE || paradise.phase !== 'day') return null;
    let best = null, bestD = TALK_RANGE;
    for (const n of townNpcs()) {
        const d = Math.hypot(player.x - n.x, player.y - n.y);
        if (d < bestD) { best = n; bestD = d; }
    }
    return best;
}

function jobDone(job = state.job) {
    return job && job.count !== undefined && job.got >= job.count;
}

// What the job line at the bottom of the screen says
function jobText() {
    const j = state.job;
    if (!j) return '';
    if (j.kind === 'deliver') return `Deliver ${j.item} to ${personName(j.stops[0])}${j.stops.length > 1 ? ` (+${j.stops.length - 1} more)` : ''}`;
    if (jobDone(j))           return `Done! Go back to the ${personName(j.giver)} to get paid`;
    return `${j.text} (${j.got}/${j.count})`;
}

// Each job giver has their own kind of job — the harder ones pay more
function makeJob(giver) {
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const people = [...WORKERS.map(w => w.id), ...VILLAGERS.map(v => v.id)].filter(id => id !== giver)
        .sort(() => Math.random() - 0.5);
    if (giver === 'baker')  return { giver, kind: 'deliver', stops: people.slice(0, 3), item: '🎂', text: 'Deliver 3 cakes', pay: 15 };
    if (giver === 'farmer') return { giver, kind: 'water', count: 6, got: 0, item: '💧', text: 'Water 6 thirsty crops', pay: 12 };
    if (giver === 'fisher') return { giver, kind: 'fish',  count: 3, got: 0, item: '🎣', text: 'Catch 3 fish at the pier', pay: 15 };
    if (Math.random() < 0.5) {
        return { giver, kind: 'deliver', stops: [people[0]], item: pick(['💌', '📦', '🌷']), text: `Take this to ${personName(people[0])}`, pay: 6 };
    }
    return { giver, kind: 'apples', count: 5, got: 0, item: '🍎', text: 'Pick 5 apples', pay: 10 };
}

function startJob(job) {
    state.job = job;
    if (job.kind === 'apples') {
        paradise.apples = [];
        for (let i = 0; i < job.count; i++) {
            paradise.apples.push({ x: 60 + Math.random() * 680, y: 260 + Math.random() * 170 });
        }
    }
    if (job.kind === 'water') {
        const crops = [...paradise.crops].sort(() => Math.random() - 0.5);
        crops.forEach((c, i) => { c.thirsty = i < job.count; });
    }
}

// What pressing the button will do, shown above the townsperson
function talkLabel(n) {
    const job = state.job, maxHp = fullHearts();
    if (job && job.kind === 'deliver' && job.stops[0] === n.id) return `Deliver ${job.item}`;
    if (n.door)            return state.housesOwned[n.id] ? 'Go inside 🏠' : `Buy ${n.name} (🪙${n.cost})`;
    if (n.table)           return 'Craft things ⚒';
    if (n.id === 'teacher') return 'Go to School 🏫';
    if (n.id === 'hattie')  return 'Buy a hat 🎩';
    if (n.id === 'captain') return 'Set sail! ⛵';
    if (paradise.birthday && paradise.birthday.id === n.id && !paradise.birthday.wished) return 'Say Happy Birthday! 🎂';
    if (n.id === 'doctor') return state.playerHp < maxHp ? `Heal (🪙${HEAL_COST})` : 'Talk';
    if (n.id === 'smith')  return 'Open the Forge 🔨';
    if (WORKERS.some(w => w.id === n.id && w.giver)) {
        if (!job) return 'Get a job';
        if (job.giver === n.id && jobDone(job)) return 'Get paid!';
        return 'Talk';
    }
    return 'Chat';
}

function say(n, text) {
    paradise.speech = { npc: n, text, timer: 170 };
}

function payJob(n) {
    const job = state.job;
    state.coins += job.pay;
    addScore(job.pay * 2);
    spawnFloatText(player.x, player.y - 30, `+🪙${job.pay}`, '#FFD700', 70);
    say(n, `Thank you! Here's 🪙${job.pay}!`);
    state.job = null;
    sfx('buy');
}

function talkTo(n) {
    const job = state.job, maxHp = fullHearts();
    if (job && job.kind === 'deliver' && job.stops[0] === n.id) {
        job.stops.shift();
        if (job.stops.length === 0) { payJob(n); return; }
        addScore(5);
        say(n, `Yum, thank you! ${job.stops.length} more to go!`);
        sfx('coin');
        return;
    }
    const giver = WORKERS.find(w => w.id === n.id && w.giver);

    if (n.table) { openMenu('⚒ CRAFTING TABLE', craftItems); return; }
    if (n.id === 'teacher') { openMenu('🏫 SCHOOL — learn something new!', lessonItems); return; }
    if (n.id === 'hattie')  { openMenu("🎩 HATTIE'S HATS", hatItems); return; }
    if (n.id === 'captain') { openMenu('⚓ WHERE SHALL WE SAIL, MATEY?', sailItems); return; }
    if (paradise.birthday && paradise.birthday.id === n.id && !paradise.birthday.wished) {
        paradise.birthday.wished = true;
        if (state.playerHp < fullHearts()) state.playerHp++;
        addScore(50);
        spawnConfettiAt(n.x, n.y - 20);
        say(n, 'Thank you!! Have some cake! 🎂 (+1 ❤)');
        [523, 523, 587, 523, 698, 659].forEach((f, i) => tone(f, 0.25, 'triangle', 0.14, null, i * 0.28));   // Happy Birthday tune
        giveAward('party');
        return;
    }
    if (n.door) {
        const b = BUILDINGS.find(b => b.id === n.id);
        if (state.housesOwned[n.id]) {
            state.houseFrom = n.id;
            changeRoom(ROOM.HOUSE);
        } else if (state.coins < n.cost) {
            say(n, `This ${n.name.toLowerCase()} costs 🪙${n.cost}. Keep saving!`);
        } else {
            state.coins -= n.cost;
            state.housesOwned[n.id] = true;
            giveAward('house');
            if (BUILDINGS.filter(b => b.cost).every(b => state.housesOwned[b.id])) giveAward('allHouses');
            addScore(n.cost * 2);
            spawnConfettiAt(b.x, b.y);
            say(n, `The ${n.name.toLowerCase()} is YOURS! 🏠 Rest here any time.`);
            sfx('win');
        }
    } else if (n.id === 'doctor') {
        if (state.playerHp >= maxHp)       say(n, 'You look healthy to me!');
        else if (state.coins < HEAL_COST)  say(n, `Healing costs 🪙${HEAL_COST}. Come back soon!`);
        else {
            state.coins -= HEAL_COST;
            state.playerHp = maxHp;
            spawnParticles(player.x, player.y, '#FF6688', 12);
            say(n, 'All better! ❤');
            sfx('buy');
        }
    } else if (n.id === 'smith') {
        openMenu("🔨 THE BLACKSMITH'S FORGE", forgeItems);
    } else if (giver) {
        if (!job) {
            startJob(makeJob(n.id));
            say(n, `${state.job.kind === 'deliver' ? jobText() : state.job.text}! I'll pay 🪙${state.job.pay}.`);
            sfx('coin');
        } else if (job.giver === n.id && jobDone(job)) {
            payJob(n);
        } else if (job.giver === n.id) {
            say(n, `Keep going: ${jobText()}!`);
        } else {
            say(n, 'Finish your other job first, then come back!');
        }
    } else {
        say(n, VILLAGER_CHAT[Math.floor(Math.random() * VILLAGER_CHAT.length)]);
    }
}

// Returns true if the player talked to someone (so the button doesn't also shoot)
function tryTalk() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    const shop = nearMallShop();
    if (shop) { openMenu(shop.title, shop.items); return true; }
    if (nearWishAngel()) { openMenu(`✨ MAKE A WISH — ${state.heavenWishes} left`, wishItems); return true; }
    const n = nearbyNpc();
    if (!n) return false;
    talkTo(n);
    return true;
}

function nearbyCrop() {
    if (state.room !== ROOM.PARADISE || paradise.phase !== 'day' || !state.job || state.job.kind !== 'water') return null;
    return paradise.crops.find(c => c.thirsty && Math.hypot(player.x - c.x, player.y - c.y) < 22) || null;
}

function atFishingSpot() {
    return state.room === ROOM.PARADISE && paradise.phase === 'day' && state.job && state.job.kind === 'fish'
        && !jobDone() && Math.hypot(player.x - FISH_SPOT.x, player.y - FISH_SPOT.y) < 26;
}

// Watering crops and fishing
function tryTownAction() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    const crop = nearbyCrop();
    if (crop) {
        crop.thirsty = false;
        state.job.got++;
        spawnParticles(crop.x, crop.y - 6, '#66CCFF', 10);
        spawnFloatText(crop.x, crop.y - 26, `💧 ${state.job.got}/${state.job.count}`, '#88DDFF');
        sfx('splash');
        return true;
    }
    if (atFishingSpot()) {
        const f = paradise.fishing;
        if (f.stage === 'idle') {
            f.stage = 'waiting'; f.timer = 60 + Math.random() * 150;
            spawnParticles(FISH_SPOT.x, FISH_SPOT.y + 16, '#AADDFF', 5);
            sfx('splash');
        } else if (f.stage === 'waiting') {
            f.stage = 'idle';
            spawnFloatText(FISH_SPOT.x, FISH_SPOT.y - 30, 'Too early! It swam away…', '#FFFFFF', 70);
        } else {
            f.stage = 'idle';
            state.job.got++;
            countStat('fish');
            spawnFloatText(FISH_SPOT.x, FISH_SPOT.y - 30, `🐟 CAUGHT ONE! ${state.job.got}/${state.job.count}`, '#FFE066', 80);
            spawnParticles(FISH_SPOT.x, FISH_SPOT.y + 10, '#88CCFF', 14);
            sfx('found');
        }
        return true;
    }
    return false;
}

function updateTown() {
    const P = paradise;
    if (P.speech && --P.speech.timer <= 0) P.speech = null;
    if (state.room !== ROOM.PARADISE) return;

    if (P.phase === 'day') {
        // Surprise monsters!
        if (state.lightCrystals < 3 && --P.ambushTimer <= 0) {
            P.ambushTimer = AMBUSH_FRAMES[0] + Math.random() * (AMBUSH_FRAMES[1] - AMBUSH_FRAMES[0]);
            if (P.ambushers.length === 0) spawnAmbush();
        }
        updateWeather();
        // Villagers stroll about the town square
        for (const v of P.villagers) {
            const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
            if (d < 3) {
                if (Math.random() < 0.01) { v.tx = 250 + Math.random() * 310; v.ty = 260 + Math.random() * 170; }
            } else if (!(P.speech && P.speech.npc === v)) {   // stands still while talking to you
                const spd = v.small ? 0.8 : 0.5;
                v.x += dx / d * spd; v.y += dy / d * spd;
                v.walk += 0.2; v.face = dx > 0 ? -1 : 1;
            }
        }
        // Apple picking
        if (state.job && state.job.kind === 'apples') {
            for (let i = P.apples.length - 1; i >= 0; i--) {
                const a = P.apples[i];
                if (Math.hypot(player.x - a.x, player.y - a.y) > 22) continue;
                P.apples.splice(i, 1);
                state.job.got++;
                spawnFloatText(a.x, a.y - 16, `🍎 ${state.job.got}/${state.job.count}`, '#FF6666');
                sfx('coin');
            }
        }
        // Fishing: wait for a bite, then be quick!
        const f = P.fishing;
        if (f.stage !== 'idle' && !atFishingSpot()) f.stage = 'idle';
        if (f.stage === 'waiting' && --f.timer <= 0) { f.stage = 'bite'; f.timer = 50; sfx('bite'); }
        else if (f.stage === 'bite' && --f.timer <= 0) {
            f.stage = 'idle';
            spawnFloatText(FISH_SPOT.x, FISH_SPOT.y - 30, 'Too slow! It got away…', '#FFFFFF', 70);
        }
    }

    // Day → dusk → Monster Night (after all 3 crystals, Paradise stays peaceful)
    if (state.lightCrystals >= 3) return;
    if (P.phase === 'day' && --P.timer <= 0) {
        P.phase = 'dusk'; P.timer = DUSK_FRAMES; P.weather = 'sun';
        P.speech = null;
        sfx('nightfall');
    } else if (P.phase === 'dusk' && --P.timer <= 0) {
        P.phase = 'night';
        // Not every night brings monsters — but never two quiet nights in a row
        P.quiet = !P.lastQuiet && Math.random() > NIGHT_MONSTER_CHANCE;
        P.lastQuiet = P.quiet;
        if (P.quiet) { P.timer = QUIET_NIGHT_FRAMES; showToast('🌙 A quiet night… no monsters tonight!', '#AABBFF'); }
        else         { respawnParadiseWave(); sfx('laugh'); }
    } else if (P.phase === 'night' && P.quiet && --P.timer <= 0) {
        P.phase = 'day'; P.timer = dayFrames(); P.quiet = false;
        showToast('☀ Good morning, Paradise Island!', '#FFE066');
        maybeBirthday();
    }
}

// ── UPDATE: PICKUPS ───────────────────────────────────────────
function checkPickups() {
    if (state.won || state.levelComplete) return;

    // Secret Golden Room treasures
    if (state.room === ROOM.SECRET) {
        for (const tr of secretRoom.treasures) {
            if (tr.picked || Math.hypot(player.x - tr.x, player.y - tr.y) > 26) continue;
            tr.picked = true;
            const maxHp = fullHearts();
            let text;
            if (tr.kind === 'rainbow') {
                state.power = POWER.RAINBOW; state.powerTier = 3;
                giveAward('rainbow');
                text = '🌈 RAINBOW POWER!';
            } else if (tr.kind === 'gem') {
                addScore(200);
                text = '💎 +200 points!';
            } else if (tr.kind === 'heart') {
                state.playerHp = maxHp; state.bubble = true;
                text = '❤ Full hearts + a Shield Bubble!';
            } else if (!state.unlockedSkins[4]) {
                state.unlockedSkins[4] = true; state.activeSkin = 4;
                text = '⭐ You unlocked the GOLD skin!';
            } else {
                addScore(300);
                text = '⭐ +300 points!';
            }
            spawnFloatText(tr.x, tr.y - 30, text, '#FFE066', 120);
            spawnParticles(tr.x, tr.y, '#FFD700', 18);
            triggerShake(6);
            sfx('found');
        }
    }

    // Hearts dropped by bad guys
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        const h = heartPickups[i];
        if (Math.hypot(player.x - h.x, player.y - h.y) > 22) continue;
        heartPickups.splice(i, 1);
        const maxHp = fullHearts();
        if (state.playerHp < maxHp) { state.playerHp++; spawnFloatText(player.x, player.y - 28, '+1 ❤', '#FF6688'); }
        else                        { addScore(10);     spawnFloatText(player.x, player.y - 28, '+10',   '#FFFFFF'); }
        spawnParticles(h.x, h.y, '#FF6688', 8);
        sfx('buy');
    }

    if (state.room === ROOM.HELL) {
        // Coins in Hell
        for (const coin of hell.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        const idx = state.paradiseClearCount;
        if (idx < 3) {
            const c = paradise.chests[idx];
            if (!c.opened && c.visible &&
                Math.abs(player.x - c.x) < 28 && Math.abs(player.y - c.y) < 28) {
                c.opened = true;
                sfx('found');
                addScore(50);
                state.lightCrystals++;
                state.paradiseClearCount++;
                state.playerFlash = 35;
                triggerShake(14);
                spawnParticles(c.x, c.y, '#FFD700', 14);
                // Morning comes!
                paradise.phase = 'day';
                paradise.timer = dayFrames();
                maybeBirthday();
            }
        }
        // Coins in Paradise
        for (const coin of paradise.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.VOID) {
        // Coins in Void
        for (const coin of voidRoom.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    // Coins everywhere else (Underground, adventure places…)
    if (![ROOM.VOID, ROOM.HELL, ROOM.PARADISE].includes(state.room)) {
        for (const coin of roomCoins()) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }
}

function collectCoin() {
    state.coins++;
    sfx('coin');
    addScore(1);
    spawnParticles(player.x, player.y, '#FFD700', 5);
}

// ── UPDATE: VOID HEALING ──────────────────────────────────────
function updateVoidHealing() {
    const maxHp = fullHearts();
    if ((state.room !== ROOM.VOID && state.room !== ROOM.HEAVEN) || state.playerHp >= maxHp) {
        state.voidHealTimer = 0;
        return;
    }
    state.voidHealTimer++;
    if (state.voidHealTimer >= (state.room === ROOM.HEAVEN ? 120 : 300)) {   // Void: 5 s, Heaven: 2 s
        state.playerHp = Math.min(maxHp, state.playerHp + 1);
        state.voidHealTimer = 0;
        state.playerFlash = 25;
        spawnParticles(player.x, player.y, '#FFD700', 8);
    }
}

// ── UPDATE: PARTICLES ─────────────────────────────────────────
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x  += p.dx; p.y  += p.dy;
        p.dx *= 0.92; p.dy *= 0.92;
        if (p.confetti) {
            p.dy       += 0.09;
            p.rotation += p.rotSpeed;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
        if (--bolts[i].life <= 0) bolts.splice(i, 1);
    }
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        if (--heartPickups[i].life <= 0) heartPickups.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        floatTexts[i].y -= 0.8;
        if (--floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }
}

// ── DRAW HELPERS ──────────────────────────────────────────────
function drawStar(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const b = ((i * 4 + 2) * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(a) * r,          y + Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(b) * (r * 0.4),  y + Math.sin(b) * (r * 0.4));
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawCoins(coinList) {
    const t = Date.now() / 300;
    for (const c of coinList) {
        if (c.picked) continue;
        ctx.save();
        ctx.fillStyle   = '#FFD700';
        ctx.shadowColor = '#FFAA00';
        ctx.shadowBlur  = 8 + Math.sin(t + c.x) * 4;
        ctx.beginPath();
        ctx.arc(c.x, c.y + Math.sin(t + c.x * 0.1) * 3, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF8';
        ctx.beginPath();
        ctx.arc(c.x - 2, c.y - 2 + Math.sin(t + c.x * 0.1) * 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// ── DRAW: INTRO SCREEN ────────────────────────────────────────

                                       [NEW_GAME_BTN, '✦ NEW GAME', '(N / X)']]) {

// ── DRAW: PORTALS ─────────────────────────────────────────────
function portalPath(shape, x, y, r, spin) {
    ctx.beginPath();
    if (shape === 'circle') { ctx.arc(x, y, r, 0, Math.PI * 2); return; }
    // Pointy shapes: [number of points, inner radius ratio]
    const [n, inner] = { diamond: [4, 1], triangle: [3, 1], hexagon: [6, 1], star: [5, 0.5] }[shape];
    const pts = inner < 1 ? n * 2 : n;
    for (let i = 0; i < pts; i++) {
        const a  = spin - Math.PI / 2 + (i / pts) * Math.PI * 2;
        const rr = inner < 1 && i % 2 ? r * inner : r;
        ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
}

// The super-rare golden portal to the Secret Golden Room
function drawGoldenPortal() {
    if (!goldenPortal) return;
    const t = Date.now() / 1000, { x, y } = goldenPortal, r = PORTAL_R + 4 + Math.sin(t * 4) * 2;
    const d = Math.hypot(player.x - x, player.y - y);
    const seen = Math.max(0.06, Math.min(1, (SECRET_REVEAL_DIST + 60 - d) / 60));   // a faint shimmer from far away
    ctx.save();
    ctx.globalAlpha = seen;
    portalPath('star', x, y, r, t * 1.2);
    const grad = ctx.createRadialGradient(x, y, 2, x, y, r);
    grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(0.4, '#FFE066'); grad.addColorStop(1, '#B8860B');
    ctx.fillStyle = grad; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 35;
    ctx.fill();
    ctx.strokeStyle = '#FFF4B0'; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 5; k++) {
        const a = t * 3 + k * (Math.PI * 2 / 5);
        drawStar(x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10), 3.5, '#FFFFFF');
    }
    ctx.restore();
    if (d < SECRET_REVEAL_DIST) {
        ctx.fillStyle = '#FFE066'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText('✨ SECRET! ✨', x, y + PORTAL_R + 18);
    }
}

function drawPortals() {
    drawGoldenPortal();
    const t = Date.now() / 1000;
    for (const p of PORTALS[state.room]) {
        // Colour keeps shifting — you never know where it goes!
        const hue  = (t * 60 + p.x + p.y) % 360;
        const spin = t * 0.9 + p.x;   // the whole shape slowly turns
        const r    = PORTAL_R + Math.sin(t * 3 + p.x) * 2;
        ctx.save();

        // Dark swirling middle
        portalPath(p.shape, p.x, p.y, r, spin);
        const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.35, `hsl(${hue}, 90%, 45%)`);
        grad.addColorStop(1, `hsl(${(hue + 120) % 360}, 90%, 15%)`);
        ctx.fillStyle = grad;
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = 25;
        ctx.fill();

        // Spiral arms spinning into the centre
        ctx.save();
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.clip();
        ctx.shadowBlur = 0;
        for (let arm = 0; arm < 5; arm++) {
            ctx.strokeStyle = `hsla(${(hue + 40 + arm * 30) % 360}, 100%, ${70 + (arm % 2) * 15}%, 0.75)`;
            ctx.lineWidth = 3 - (arm % 2);
            ctx.beginPath();
            for (let k = 0; k <= 34; k++) {
                const a  = -t * 5 + arm * (Math.PI * 2 / 5) + k * 0.28;
                const rr = (k / 34) * r * 1.1;
                ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
            }
            ctx.stroke();
        }
        // Rings pulsing into the middle, like a whirlpool
        for (let k = 0; k < 3; k++) {
            const rr = r * (1 - ((t * 0.8 + k / 3) % 1));
            ctx.strokeStyle = `rgba(255,255,255,${0.35 * rr / r})`; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();

        // Bits of light getting sucked in from outside
        for (let k = 0; k < 8; k++) {
            const ph = (t * 0.7 + k / 8) % 1;
            const a  = k * 0.785 + t * 1.5 + ph * 3;
            const rr = r * (1.6 - ph);
            ctx.fillStyle = `hsla(${(hue + k * 40) % 360}, 100%, 75%, ${ph})`;
            ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr, 2, 0, Math.PI * 2); ctx.fill();
        }

        // Glowing outline
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Sparkles orbiting the edge
        for (let k = 0; k < 3; k++) {
            const a = t * 2 + k * (Math.PI * 2 / 3) + p.y;
            drawStar(p.x + Math.cos(a) * (r + 7), p.y + Math.sin(a) * (r + 7), 2.5, '#FFFFFF');
        }
        ctx.restore();

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', p.x, p.y);
        ctx.textBaseline = 'alphabetic';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('MYSTERY', p.x, p.y + PORTAL_R + 14);
    }
}

// ── DRAW: VOID ────────────────────────────────────────────────
function drawRaceMaster() {
    const { x, y } = RACE_MASTER;
    drawGroundShadow(x, y + 16, 11, 4);
    drawHuman(x, y, 1, { shirt: '#222', pants: '#DDD', hair: '#AA3322', hairStyle: 'short' });
    ctx.fillStyle = '#6B3E1E'; ctx.fillRect(x + 11, y - 26, 2, 32);                      // flag pole
    for (let k = 0; k < 4; k++) for (let m = 0; m < 3; m++) {                             // checkered flag
        ctx.fillStyle = (k + m) % 2 ? '#FFF' : '#111';
        ctx.fillRect(x + 13 + k * 4, y - 26 + m * 4 + Math.sin(Date.now() / 150 + k) * 1.5, 4, 4);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
    ctx.fillText('🏁 Race Master', x, y + 30);
    if (nearRaceMaster()) {
        const verb = lastInput === 'pad' ? 'A' : lastInput === 'touch' ? 'Tap' : 'SPACE';
        drawSpeech({ x, y }, `${verb}: Start a pet race! 🏁`);
    }
}

function drawArenaGate() {
    const { x, y } = ARENA_GATE, t = Date.now() / 1000;
    ctx.save();
    ctx.fillStyle = '#6A5A4A'; ctx.fillRect(x - 26, y - 34, 52, 44);
    ctx.fillStyle = '#2A1A0A'; ctx.beginPath(); ctx.arc(x, y - 6, 18, Math.PI, 0); ctx.lineTo(x + 18, y + 10); ctx.lineTo(x - 18, y + 10); ctx.fill();
    ctx.fillStyle = `rgba(255,${80 + Math.sin(t * 4) * 40},40,0.6)`; ctx.beginPath(); ctx.arc(x, y - 6, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
    ctx.fillText('⚔ BOSS RUSH', x, y + 24);
    ctx.restore();
}

function drawVoid() {
    drawRaceMaster();
    drawArenaGate();
    drawMallDoor();
    drawRocket(ROCKET.x, ROCKET.y, 'To SPACE!');
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font      = 'bold 26px Arial'; ctx.textAlign = 'center';
    ctx.fillText('~ THE VOID ~', 400, 295);
    ctx.font      = '14px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText('Every portal is a mystery — where will it take you?', 400, 328);

    // Shield hint
    if (state.power !== POWER.NONE) {
        const shielded = state.power === POWER.RAINBOW ? 'EVERY MONSTER (not the Devil!)'
            : Object.keys(ENEMY_TYPES).filter(isShieldedAgainst).map(k => ENEMY_TYPES[k].name.toUpperCase() + 'S').join(' & ');
        ctx.fillStyle = WEAPON_INFO[state.power].color;
        ctx.font = 'bold 12px Arial';
        ctx.fillText(`🛡 ${WEAPON_INFO[state.power].label} SHIELD — protects you from ${shielded}`, 400, 360);
    }

    // Which weapon beats which bad guy
    const chart = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER].map(w => {
        const plural = n => n.endsWith('man') ? n.slice(0, -3) + 'men' : n === 'Shadow You' ? n : n + 's';
        const beats = Object.keys(ENEMY_TYPES).filter(k => ENEMY_TYPES[k].weakTo === w).map(k => plural(ENEMY_TYPES[k].name));
        const list = beats.length > 1 ? beats.slice(0, -1).join(', ') + ' & ' + beats[beats.length - 1] : beats[0];
        return `${WEAPON_INFO[w].icon} ${WEAPON_INFO[w].label} beats ${list}`;
    });
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.font = 'bold 12px Arial';
    ctx.fillText('WHAT BEATS WHAT (every weapon still does a little damage to everything)', 400, 446);
    ctx.font = '10px Arial';
    chart.forEach((line, i) => ctx.fillText(line, 400, 462 + i * 14));
    ctx.fillText('🌈 RAINBOW POWER beats everything!', 400, 462 + chart.length * 14);

    // Void enemies
    const t = Date.now() / 400;
    for (const e of voidRoom.enemies) {
        ctx.save();
        if (e.type === 'fire') {
            ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFAA00';
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2 + t;
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(a) * e.r * 0.85, e.y + Math.sin(a) * e.r * 0.85, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r, Math.PI, 0);
            ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
            ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x,             e.y + e.r * 0.7);
            ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
            ctx.closePath(); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#330055';
            ctx.beginPath();
            ctx.arc(e.x - 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.arc(e.x + 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Coins
    drawCoins(voidRoom.coins);

    // SHOP button (tap / click it, or press E / Y)
    if (!state.shopOpen) {
        const b = SHOP_BTN, pulse = state.coins > 0 ? 0.5 + 0.5 * Math.sin(Date.now() / 300) : 0;
        ctx.save();
        ctx.fillStyle = 'rgba(40,20,70,0.85)';
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 6 + pulse * 10;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const key = lastInput === 'pad' ? 'Y' : lastInput === 'touch' ? '' : 'E';
        ctx.fillText(`🛒 SHOP${key ? '  (' + key + ')' : ''}`, b.x + b.w / 2, b.y + b.h / 2 + 1);
        // AWARDS button
        const a = AWARDS_BTN, akey = lastInput === 'pad' ? 'X' : lastInput === 'touch' ? '' : 'H';
        ctx.fillStyle = 'rgba(40,20,70,0.85)'; ctx.fillRect(a.x, a.y, a.w, a.h);
        ctx.strokeStyle = '#FFD700'; ctx.strokeRect(a.x, a.y, a.w, a.h);
        ctx.fillStyle = '#FFD700';
        const got = AWARDS.filter(w => awards.got[w.id]).length;
        ctx.fillText(`🏅 ${got}/${AWARDS.length}${akey ? '  (' + akey + ')' : ''}`, a.x + a.w / 2, a.y + a.h / 2 + 1);
        ctx.restore();
    }
}

// ── DRAW: HELL ────────────────────────────────────────────────
function drawHell() {
    const t = Date.now() / 500;

    // Caves (the rocks are painted into the background)
    for (const c of HELL_CAVES) {
        ctx.fillStyle   = 'rgba(200,140,90,0.6)';
        ctx.font        = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText('CAVE  (hide & dig here!)', c.x + c.w / 2, c.y + 22);
    }

    // Dig spots — dirt piles with weapons buried in layers
    for (const s of hell.digSpots) {
        ctx.save();
        if (s.depth > 0) {
            // Hole gets bigger and darker the deeper you dig
            const holeR = 8 + s.depth * 4;
            ctx.fillStyle = `rgba(0,0,0,${0.45 + s.depth * 0.18})`;
            ctx.beginPath(); ctx.ellipse(s.x, s.y + 6, holeR, holeR * 0.45, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(200,150,90,0.8)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(s.depth < DIG_MAX_DEPTH ? `DEPTH ${s.depth}/${DIG_MAX_DEPTH}` : s.tunnel ? 'TUNNEL ⬇ jump in!' : 'BOTTOM', s.x, s.y + 24);
            if (s.depth >= DIG_MAX_DEPTH && s.tunnel) {
                // Swirling tunnel down to the Underground Caves
                ctx.strokeStyle = 'rgba(200,150,255,0.7)'; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let k = 0; k <= 16; k++) {
                    const a = -Date.now() / 250 + k * 0.5, rr = (k / 16) * 18;
                    ctx.lineTo(s.x + Math.cos(a) * rr, s.y + 6 + Math.sin(a) * rr * 0.45);
                }
                ctx.stroke();
            }
        }
        if (s.depth < DIG_MAX_DEPTH) {
            // Dirt pile beside the hole shrinks a little with each dig
            const size = 1 - (s.hits / DIG_HITS_PER_LAYER[s.depth]) * 0.45;
            const px = s.depth > 0 ? s.x + 16 : s.x;
            ctx.fillStyle = '#6B3E1E';
            ctx.beginPath(); ctx.ellipse(px, s.y + 4, 18 * size, 10 * size, 0, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#8B5A2B';
            ctx.beginPath(); ctx.ellipse(px - 3, s.y + 1, 9 * size, 5 * size, 0, Math.PI, 0); ctx.fill();
            // Twinkle so kids can spot the treasure — rainbow sparkle on the last layer
            const sparkle = s.depth === 2 ? `hsl(${(Date.now() / 5) % 360}, 100%, 70%)` : '#FFFFAA';
            if (Math.sin(t * 2 + s.x) > 0.7) drawStar(px + 8 * size, s.y - 6 * size, 3, sparkle);
        }
        ctx.restore();
    }

    // "Dig here!" prompt when standing on a pile
    const digSpot = nearbyDigSpot();
    if (digSpot) drawDigView(digSpot);
    if (digSpot) {
        const verb = lastInput === 'pad' ? 'Press A' : lastInput === 'touch' ? 'Tap DIG' : 'Press SPACE';
        ctx.fillStyle = canDig() ? '#FFE08A' : '#FF8888';
        ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        ctx.fillText(!canDig() ? 'Beat the mole monster first!'
                   : digSpot.depth === 0 ? `${verb} to dig!` : `${verb} to dig deeper!`,
                   digSpot.x, digSpot.y - 22);
    }

    // Bad guys (mole monsters, …)
    for (const e of hell.enemies) {
        drawEnemy(e, t);
        if (!(e.emerge > 0) && !e.hidden) drawEnemyHp(e);
    }

    // "You found …!" message floating up
    if (hell.foundMsg) {
        const m = hell.foundMsg;
        const x = 400, y = 250 - (120 - m.timer) * 0.3;   // big, in the middle of the screen
        ctx.save();
        ctx.globalAlpha = Math.min(1, m.timer / 30);
        ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 12;
        ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText(m.text, x, y);
        if (m.sub) {
            ctx.fillStyle = m.sub.startsWith('Look out') ? '#FF6666' : '#FFE08A';
            ctx.shadowBlur = 6; ctx.font = 'bold 15px Arial';
            ctx.fillText(m.sub, x, y + 24);
        }
        ctx.restore();
    }

    // Devil
    const d = hell.devil;
    if (d.alive) {
        drawGroundShadow(d.x + 4, d.y + d.r + 4, d.r * 1.1, d.r * 0.3, 0.4);
        const telegraphing = d.telegraphTimer > 0;
        const flashOn      = telegraphing && Math.floor(Date.now() / 80) % 2 === 0;

        if (mod('chickens')) { ctx.save(); ctx.translate(d.x, d.y); ctx.scale(3, 3); drawChicken(0, 0); ctx.restore(); }
        else drawDevil(d, telegraphing, flashOn);
        if (d.frozen > 0) drawIceBlock(d.x, d.y, d.r * 0.85, d.frozen);

        // State label
        ctx.fillStyle = 'rgba(255,120,120,0.65)';
        ctx.font = '10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(d.aiState, d.x, d.y + d.r + 14);

        // HP bar (only shown when player has 3 crystals and can damage devil)
        if (state.lightCrystals >= 3) {
            const bw = 70, bh = 9;
            const bx = d.x - bw / 2, by = d.y - d.r - 30;
            ctx.fillStyle = '#400';
            ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = `hsl(${(d.hp / d.maxHp) * 120}, 100%, 45%)`;
            ctx.fillRect(bx, by, bw * (d.hp / d.maxHp), bh);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`${d.hp}/${d.maxHp}`, d.x, by + bh - 1);
        }

        // Crystal warning
        if (state.lightCrystals < 3 && d.shieldFlash > 0) {
            ctx.fillStyle = '#FFFF00';
            ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
            ctx.fillText('NEED ALL LIGHT CRYSTALS!', d.x, d.y - d.r - 14);
        }
    }

    // Coins
    drawCoins(hell.coins);

    // Cave timer warning
    if (isPlayerPhysicallyInCave() && state.caveTimer > 0) {
        const frac = state.caveTimer / caveMax();
        const secsLeft = Math.max(0, Math.ceil((caveMax() - state.caveTimer) / 60));
        if (frac >= 0.5) {
            const flash = state.caveProtectionExpired ? (Math.floor(Date.now() / 200) % 2 === 0) : true;
            ctx.fillStyle = state.caveProtectionExpired
                ? `rgba(255,80,0,${flash ? 0.9 : 0.5})`
                : `rgba(255,220,50,${0.5 + frac * 0.5})`;
            ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            ctx.fillText(
                state.caveProtectionExpired ? '⚠ CAVE EXPIRED — LEAVE NOW!' : `Cave protection: ${secsLeft}s left`,
                400, 535
            );
        }
    }
}

// ── DRAW: BAD GUYS ────────────────────────────────────────────
function drawFrog(e) {
    const hop = Math.hypot(e.dx, e.dy) > 0.5 ? 4 : 0;
    ctx.save();
    ctx.translate(e.x, e.y - hop);
    ctx.fillStyle = '#3FB43F';
    ctx.beginPath(); ctx.ellipse(0, 3, 11, 8, 0, 0, Math.PI * 2); ctx.fill();          // body
    ctx.fillStyle = '#2E8F2E';
    ctx.beginPath(); ctx.ellipse(-9, 8, 5, 3, 0, 0, Math.PI * 2); ctx.ellipse(9, 8, 5, 3, 0, 0, Math.PI * 2); ctx.fill();   // legs
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(-5, -5, 4, 0, Math.PI * 2); ctx.arc(5, -5, 4, 0, Math.PI * 2); ctx.fill();   // big eyes
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5, -5, 2, 0, Math.PI * 2); ctx.arc(5, -5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1A5A1A'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 3, 5, 0.2, Math.PI - 0.2); ctx.stroke();               // smile
    ctx.restore();
}

function drawEnemy(e, t) {
    if (mod('chickens') && !e.hidden) {   // 🐔 Chicken Monsters mod
        const k = Math.max(0.8, e.r / 14) * (mod('tinyMonsters') ? 0.5 : 1);
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(k, k); drawChicken(0, 0); ctx.restore();
        return;
    }
    if (mod('tinyMonsters')) {   // 🐜 Tiny Monsters mod
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(0.5, 0.5); ctx.translate(-e.x, -e.y); drawEnemyAir(e, t); ctx.restore();
        return;
    }
    drawEnemyAir(e, t);
}

function drawEnemyAir(e, t) {
    if (e.air > 0) {   // flying up from an uppercut
        ctx.save(); ctx.translate(0, -Math.sin((e.air / 45) * Math.PI) * 40); drawEnemyInner(e, t); ctx.restore();
        return;
    }
    if (e.slip > 0) {   // 🍌 whoops — spinning round and falling over
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate((30 - e.slip) / 30 * Math.PI * 2); ctx.translate(-e.x, -e.y); drawEnemyInner(e, t); ctx.restore();
    } else drawEnemyInner(e, t);
    if (e.painted > 0 && e.alive) {   // 🎨 paint splats over their eyes
        ctx.save(); ctx.fillStyle = `hsla(${e.paintHue},90%,55%,0.85)`;
        for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(e.x + Math.cos(k * 1.7) * e.r * 0.5, e.y - e.r * 0.2 + Math.sin(k * 2.3) * e.r * 0.35, e.r * 0.3, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#FFF'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText('?', e.x, e.y - e.r - 6);
        ctx.restore();
    }
    if (e.stun > 0 && e.stun < 900 && e.alive) {   // dizzy stars
        for (let k = 0; k < 3; k++) { const a = Date.now() / 150 + k * 2.1; drawStar(e.x + Math.cos(a) * 12, e.y - e.r - 10 + Math.sin(a) * 4, 3, '#FFE066'); }
    }
}

function drawEnemyInner(e, t) {
    if (e.shrunk > 0) {
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(0.5, 0.5); ctx.translate(-e.x, -e.y);
        drawEnemyBody(e, t);
        ctx.restore();
        return;
    }
    drawEnemyBody(e, t);
}

function drawEnemyBody(e, t) {
    if (e.frog) { drawGroundShadow(e.x, e.y + 12, 10, 3); drawFrog(e); return; }
    if (!e.hidden && !(e.emerge > 45)) {
        const flying = e.type === 'ghost' || e.type === 'bat' || e.type === 'imp' || e.type === 'ghostking' || e.dropping
                    || e.type === 'thunderbird' || e.type === 'mothership' || state.room === ROOM.SPACE;
        drawGroundShadow(e.x + 2, e.y + e.r + (flying ? 12 : 2), e.r * (flying ? 0.7 : 1), e.r * 0.3, flying ? 0.15 : 0.3);
    }
    ctx.save();
    // Climbing out of the ground: a dirt mound, and the monster fades in
    if (e.emerge > 0 && e.type !== 'mole' && e.type !== 'imp') {
        ctx.fillStyle = '#5C3A1E';
        ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.6, e.r * 1.2, e.r * 0.45, 0, Math.PI, 0); ctx.fill();
        ctx.globalAlpha = Math.max(0.1, 1 - e.emerge / 60);
    }
    if (e.type === 'fire') {
        ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA00';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + t;
            ctx.beginPath();
            ctx.arc(e.x + Math.cos(a) * e.r * 0.9, e.y + Math.sin(a) * e.r * 0.9, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (e.type === 'ghost') {
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, Math.PI, 0);
        ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
        ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x,             e.y + e.r * 0.7);
        ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#330055';
        ctx.beginPath();
        ctx.arc(e.x - 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.arc(e.x + 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'bat') {
        // Flapping wings
        const flap = Math.sin(Date.now() / 60 + e.home.x) * 8;
        ctx.fillStyle = '#5A3A7A'; ctx.shadowColor = '#9966CC'; ctx.shadowBlur = 10;
        for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(e.x + side * 5, e.y - 2);
            ctx.lineTo(e.x + side * 24, e.y - 6 - flap);
            ctx.lineTo(e.x + side * 18, e.y + 4);
            ctx.lineTo(e.x + side * 11, e.y + 1);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#7A4A9A';
        ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();   // ears
        ctx.moveTo(e.x - 7, e.y - 5); ctx.lineTo(e.x - 5, e.y - 14); ctx.lineTo(e.x - 1, e.y - 7);
        ctx.moveTo(e.x + 7, e.y - 5); ctx.lineTo(e.x + 5, e.y - 14); ctx.lineTo(e.x + 1, e.y - 7);
        ctx.fill();
        ctx.fillStyle = '#FFEE00';
        ctx.beginPath();
        ctx.arc(e.x - 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.arc(e.x + 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'windup') {
        ctx.fillStyle = '#AAAAAA'; ctx.beginPath(); ctx.ellipse(e.x, e.y, 14, 9, Math.atan2(e.dy, e.dx), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFB0C0'; ctx.beginPath(); ctx.arc(e.x - 6, e.y - 8, 4, 0, Math.PI * 2); ctx.arc(e.x + 6, e.y - 8, 4, 0, Math.PI * 2); ctx.fill();   // ears
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.x - 3, e.y - 2, 1.5, 0, Math.PI * 2); ctx.arc(e.x + 3, e.y - 2, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.translate(e.x, e.y + 2); ctx.rotate(Date.now() / (e.windTimer > 50 ? 30 : 200));   // wind-up key
        ctx.strokeStyle = '#C8A040'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke(); ctx.restore();
    } else if (e.type === 'toysoldier') {
        drawHuman(e.x, e.y, 1, { shirt: '#CC2222', sleeves: '#CC2222', pants: '#223388', shoes: '#111', skin: '#F2C8A0', hair: '#111', hairStyle: 'short', walk: e.walk });
        ctx.fillStyle = '#111'; ctx.fillRect(e.x - 6, e.y - 36, 12, 14);                 // tall hat
        ctx.fillStyle = '#FFD700'; ctx.fillRect(e.x - 6, e.y - 26, 12, 2); ctx.fillRect(e.x - 1, e.y - 6, 2, 10);   // gold trim & buttons
