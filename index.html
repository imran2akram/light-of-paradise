        }

            font-size: 13px; font-family: Arial, sans-serif;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 0.5; }
            50%      { opacity: 1;   }
        }

let voidBgColor = '#a0a0a0'; // light grey, darker than the white player

(function setupVideoIntro() {
    const overlay = document.getElementById('videoOverlay');
    const video   = document.getElementById('introVideo');
    let dismissed = false;

    function captureLastFrameColor() {
        try {
            const oc   = document.createElement('canvas');
            oc.width   = video.videoWidth  || 640;
            oc.height  = video.videoHeight || 360;
            const octx = oc.getContext('2d');
            octx.drawImage(video, 0, 0, oc.width, oc.height);
            // Sample a 5×5 grid across the frame
            let r = 0, g = 0, b = 0, n = 0;
            for (let sx = 0.1; sx <= 0.95; sx += 0.2) {
                for (let sy = 0.1; sy <= 0.95; sy += 0.2) {
                    const d = octx.getImageData(
                        Math.floor(sx * oc.width),
                        Math.floor(sy * oc.height), 1, 1).data;
                    r += d[0]; g += d[1]; b += d[2]; n++;
                }
            }
            // Darken the average so it works as a subtle game background
            r = Math.floor(r / n * 0.32);
            g = Math.floor(g / n * 0.32);
            b = Math.floor(b / n * 0.32);
            voidBgColor = `rgb(${r},${g},${b})`;
        } catch (e) { /* keep default if CORS/decode fails */ }
    }

    function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.style.opacity = '0';
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    }

    video.addEventListener('ended',   dismiss);
    overlay.addEventListener('click',      dismiss);
    overlay.addEventListener('touchstart', e => { e.preventDefault(); dismiss(); }, { passive: false });
    document.addEventListener('keydown', function onKey(e) {
        if (e.code === 'Space') { e.preventDefault(); dismiss(); document.removeEventListener('keydown', onKey); }
    });

    // Fallback: if video fails to load/play, still dismiss after a short wait
    video.addEventListener('error', () => setTimeout(dismiss, 100));
})();

    if (i < 8) {
        const cx = SHOP.X + 46 + i * 70, cy = SHOP.Y + 118;
        return { x: cx - 26, y: cy - 26, w: 52, h: 70, cx, cy };

    const j = i - 8, x = SHOP.X + 22 + j * 108;
    return { x, y: SHOP.Y + 180, w: 100, h: 106, cx: x + 50, cy: SHOP.Y + 212 };
}

// Arrow keys / D-pad in the shop: left-right along a row, up-down between rows
function moveShopCursor(dx, dy) {
    let c = state.shopCursor;
    const top = c < 8;
    if (dx) c = top ? (c + dx + 8) % 8 : 8 + ((c - 8 + dx + 5) % 5);
    if (dy > 0 && top)  c = 8 + Math.round(c * 4 / 7);
    if (dy < 0 && !top) c = Math.round((c - 8) * 7 / 4);
    state.shopCursor = c;
}

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function canOpenShop() {
    return state.gamePhase === 'playing' && state.room === ROOM.VOID && !state.won && !state.levelComplete;
}
function toggleShop() {
    if (state.shopOpen) state.shopOpen = false;
    else if (canOpenShop()) state.shopOpen = true;
}

// Buy or wear a shop item: 0-7 skins, 8 Shield Bubble, 9-12 pets
function shopSelect(i) {
    state.shopCursor = i;
    if (i >= 9) {
        const j = i - 9;
        if (state.ownedPets[j]) {
            state.activePet = j;
        } else if (state.coins >= PETS[j].cost) {
            state.coins -= PETS[j].cost;
            state.ownedPets[j] = true;
            state.activePet = j;
            giveAward('pet');
            if (state.ownedPets.every(Boolean)) giveAward('allPets');
            placePetBesidePlayer();
            spawnParticles(player.x, player.y, '#FFD700', 10);
            sfx('win');
        }
        return;
    }
    if (i === 8) {
        if (!state.bubble && state.coins >= BUBBLE_COST) {
            state.coins -= BUBBLE_COST;
            state.bubble = true;
            sfx('buy');
        }
        return;
    }
    if (state.unlockedSkins[i]) {
        state.activeSkin = i;
    } else if (state.coins >= AVATAR_UNLOCK_COST[i]) {
        state.coins -= AVATAR_UNLOCK_COST[i];
        state.unlockedSkins[i] = true;
        state.activeSkin = i;
        spawnParticles(player.x, player.y, AVATAR_COLORS[i], 8);
        sfx('buy');
    }
}

// ── POP-UP MENUS (the Blacksmith's Forge, and other town shops) ──
// A menu is a title plus a function that returns the items, so prices and ticks are always up to date.
// Each item: { icon, name, desc, cost?, status?, action() }
let menu = null;   // { title, items, cursor }
const MENU = { X: 130, Y: 80, W: 540, H: 420 };

function openMenu(title, items) { menu = { title, items, cursor: 0 }; }
function menuItemRect(i) {
    const col = i % 2, row = Math.floor(i / 2);
    return { x: MENU.X + 14 + col * 262, y: MENU.Y + 56 + row * 68, w: 250, h: 62 };
}
function menuSelect(i) {
    const list = menu.items();
    if (!list[i]) return;
    menu.cursor = i;
    list[i].action();
}
function moveMenuCursor(dx, dy) {
    const n = menu.items().length;
    menu.cursor = Math.max(0, Math.min(n - 1, menu.cursor + dx + dy * 2));
}

// Buy something from a menu: returns true if you had enough coins
function spend(cost) {
    if (state.coins < cost) { showToast(`Not enough coins — you need 🪙${cost}`, '#FF8888', 120); sfx('hurt'); return false; }
    state.coins -= cost;
    sfx('buy');
    return true;
}

// The main button: Space, A on a controller, or the on-screen SHOOT / DIG button
function pressAction() {
    if (menu) return;
    if (state.buildMode && state.gamePhase === 'playing' && !state.won && !state.levelComplete) {
        const { cx, cy } = buildTargetCell();
        buildAt(cx, cy, player.x + state.faceX * 30, player.y + 5 + state.faceY * 30);
        return;
    }
    if (state.gamePhase === 'intro') startFromIntro();
    else if (state.levelComplete)   advanceLevel();
    else if (!tryDig() && !tryTalk() && !tryTownAction() && !tryHomeAction()) shoot();
}

// Enter / Start: begin, next level, or play again
function pressStart() {
    if (state.gamePhase === 'intro') startFromIntro();
    else if (state.levelComplete)   advanceLevel();
    else if (state.won)             resetGame();
}

// A tap or click at canvas position (x, y). Returns true if it hit a button.
function handleTap(x, y) {
    if (Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) < MUTE_BTN.r * 1.5) { toggleMute(); return true; }
    if (state.gamePhase === 'intro') {
        if (savedGame && inRect(x, y, NEW_GAME_BTN)) startFromIntro(true);
        else startFromIntro();
        return true;
    }
    if (state.awardsOpen) { state.awardsOpen = false; return true; }
    if (menu) {
        const list = menu.items();
        for (let i = 0; i < list.length; i++) if (inRect(x, y, menuItemRect(i))) { menuSelect(i); return true; }
        if (!inRect(x, y, { x: MENU.X, y: MENU.Y, w: MENU.W, h: MENU.H }) || y < MENU.Y + 40) menu = null;   // tap outside / title bar closes
        return true;
    }
    if (state.gamePhase === 'playing' && lastInput === 'touch' && !state.won && !state.levelComplete) {
        if (Math.hypot(x - VBUILD.x, y - VBUILD.y) < VBUILD.r * 1.3) { toggleBuild(); return true; }
        if (state.buildMode && Math.hypot(x - VGADGET.x, y - VGADGET.y) < VGADGET.r * 1.3) { nextBlock(); return true; }
        if (Math.hypot(x - VGADGET.x, y - VGADGET.y) < VGADGET.r * 1.3) { useGadget(); return true; }
        if (Math.hypot(x - VDASH.x,   y - VDASH.y)   < VDASH.r * 1.3)   { dash();      return true; }
    }
    if (!state.shopOpen && canOpenShop() && inRect(x, y, AWARDS_BTN)) { state.awardsOpen = true; return true; }
    if (state.gamePhase === 'playing' && lastInput === 'touch' && !state.won && !state.levelComplete) {
        if (Math.hypot(x - VDANCE.x, y - VDANCE.y) < VDANCE.r * 1.3) { dance(); return true; }
        if (Math.hypot(x - VFART.x,  y - VFART.y)  < VFART.r * 1.3)  { fart();  return true; }
    }
    if ((state.won || state.levelComplete) && inRect(x, y, END_BTN)) { pressStart(); return true; }
    if (state.shopOpen) {
        if (Math.hypot(x - SHOP_CLOSE.x, y - SHOP_CLOSE.y) < SHOP_CLOSE.r * 1.6) { state.shopOpen = false; return true; }
        for (let i = 0; i < SHOP_SLOTS; i++) {
            if (inRect(x, y, shopSlotRect(i))) { shopSelect(i); return true; }
        }
        return inRect(x, y, { x: SHOP.X, y: SHOP.Y, w: SHOP.W, h: SHOP.H });   // taps on the panel do nothing else
    }
    if (canOpenShop() && inRect(x, y, SHOP_BTN)) { state.shopOpen = true; return true; }
    return false;
}

document.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    lastInput = 'keyboard';
    if (e.code === 'KeyM') toggleMute();
    if (menu) {
        const nav = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
                      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] }[e.code];
        if (nav) { e.preventDefault(); moveMenuCursor(nav[0], nav[1]); }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); menuSelect(menu.cursor); }
        const d = /^Digit([1-9])$/.exec(e.code);
        if (d) menuSelect(Number(d[1]) - 1);
        if (e.code === 'Escape' || e.code === 'KeyE') menu = null;
        return;
    }
    if (e.code === 'KeyB') toggleBuild();
    if (e.code === 'KeyQ') { if (state.buildMode) nextBlock(); else useGadget(); }
    const hb = /^Digit([1-9])$/.exec(e.code);
    if (hb && state.buildMode && !state.shopOpen) state.hotbar = Math.min(HOTBAR.length - 1, Number(hb[1]) - 1);
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
    if (state.shopOpen) {
        const nav = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
                      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] }[e.code];
        if (nav) { e.preventDefault(); moveShopCursor(nav[0], nav[1]); }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); shopSelect(state.shopCursor); }
    } else {
        if (e.code === 'Space') { e.preventDefault(); pressAction(); }
        if (e.code === 'Enter') pressStart();
    }
    if (e.code === 'KeyE' || (e.code === 'Escape' && state.shopOpen)) toggleShop();
    if (e.code === 'KeyC' && state.room === ROOM.PARADISE && !state.shopOpen) { /* handled by walking up to the table */ }
    if (e.code === 'KeyH' && canOpenShop() && !state.shopOpen) state.awardsOpen = !state.awardsOpen;
    if (e.code === 'Escape') state.awardsOpen = false;
    if (e.code === 'KeyN' && state.gamePhase === 'intro') startFromIntro(true);
    if (e.code === 'KeyG') dance();
    if (e.code === 'KeyF') fart();
    // Number keys in the shop: 1-8 skins, 9 Shield Bubble
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit && state.shopOpen) shopSelect(Number(digit[1]) - 1);
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
    initAudio();
    const p = canvasPos(e.clientX, e.clientY);
    if (handleTap(p.x, p.y)) return;
    // Build mode: click a spot near you to mine / place there
    if (state.buildMode && state.gamePhase === 'playing' && !menu && !state.shopOpen && Math.hypot(p.x - player.x, p.y - player.y) < BUILD_REACH) {
        buildAt(Math.floor(p.x / CELL), Math.floor(p.y / CELL), p.x, p.y);
    }
});

// ── GAME CONTROLLER (Xbox, PlayStation, Switch Pro… anything the browser maps as "standard") ──
const PAD = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, LT: 6, RT: 7, BACK: 8, START: 9, L3: 10, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const PAD_DEADZONE    = 0.3;   // ignore tiny stick wobbles
const PAD_AUTOFIRE    = 10;    // frames between shots while A is held
let   lastInput       = 'keyboard';   // 'keyboard' | 'touch' | 'pad' — picks which hints to show
let   padPrev         = [];
let   padHold         = 0;
const padMove         = { x: 0, y: 0 };

function pollGamepad() {
    padMove.x = padMove.y = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(pads).find(p => p && p.connected);
    if (!gp) { padPrev = []; return; }
    const held = gp.buttons.map(b => b.pressed);
    const was  = padPrev;
    padPrev = held;
    const pressed = i => held[i] && !was[i];
    if (held.some(Boolean) || Math.abs(gp.axes[0] || 0) > 0.5 || Math.abs(gp.axes[1] || 0) > 0.5) {
        lastInput = 'pad';
        initAudio();
    }

    if (pressed(PAD.BACK))  toggleMute();
    if (menu) {
        if (pressed(PAD.LEFT))  moveMenuCursor(-1, 0);
        if (pressed(PAD.RIGHT)) moveMenuCursor(1, 0);
        if (pressed(PAD.UP))    moveMenuCursor(0, -1);
        if (pressed(PAD.DOWN))  moveMenuCursor(0, 1);
        if (pressed(PAD.A))     menuSelect(menu.cursor);
        if (pressed(PAD.B) || pressed(PAD.Y)) menu = null;
        return;
    }
    if (pressed(PAD.B) && !state.shopOpen && !state.awardsOpen) { if (state.buildMode) nextBlock(); else useGadget(); }
    if (pressed(PAD.L3)) toggleBuild();
    if (pressed(PAD.LT)) dash();
    if (pressed(PAD.LB))    dance();
    if (pressed(PAD.RB))    fart();
    if (pressed(PAD.X) && state.gamePhase === 'intro') startFromIntro(true);
    if (pressed(PAD.X) && canOpenShop() && !state.shopOpen) state.awardsOpen = !state.awardsOpen;
    if (state.awardsOpen && pressed(PAD.B)) state.awardsOpen = false;
    if (pressed(PAD.START)) pressStart();
    if (pressed(PAD.Y) || (state.shopOpen && pressed(PAD.B))) toggleShop();

    if (state.shopOpen) {
        // D-pad / stick flicks move the shop cursor; A buys
        if (pressed(PAD.LEFT))  moveShopCursor(-1, 0);
        if (pressed(PAD.RIGHT)) moveShopCursor(1, 0);
        if (pressed(PAD.UP))    moveShopCursor(0, -1);
        if (pressed(PAD.DOWN))  moveShopCursor(0, 1);
        if (pressed(PAD.A))     shopSelect(state.shopCursor);
        return;
    }

    const fire = held[PAD.A] || held[PAD.RT];
    if (pressed(PAD.A) || pressed(PAD.RT)) { pressAction(); padHold = 0; }
    else if (fire && state.gamePhase === 'playing' && !state.won && !state.levelComplete && ++padHold % PAD_AUTOFIRE === 0) {
        pressAction();
    }

    let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (Math.abs(x) < PAD_DEADZONE) x = 0;
    if (Math.abs(y) < PAD_DEADZONE) y = 0;
    if (held[PAD.LEFT])  x = -1;
    if (held[PAD.RIGHT]) x = 1;
    if (held[PAD.UP])    y = -1;
    if (held[PAD.DOWN])  y = 1;
    padMove.x = x; padMove.y = y;
}

window.addEventListener('gamepadconnected', () => {
    lastInput = 'pad';
    spawnFloatText(400, 300, '🎮 Controller connected!', '#FFFFFF', 150);
});

// ── VIRTUAL TOUCH CONTROLS ────────────────────────────────────
let isTouchDevice = false;
const VJOY   = { x: 100, y: 490, baseR: 55, maxDist: 40 };
const VSHOOT = { x: 700, y: 490, r: 45 };
const TOUCH_AREA_MULTIPLIER  = 1.5;  // expand tap hit area beyond visible radius
const JOYSTICK_DEADZONE_RATIO = 0.2; // fraction of maxDist before movement starts
const vTouch = { joyId: null, joyDX: 0, joyDY: 0, joyOriX: 0, joyOriY: 0, shootId: null };

function canvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width  / rect.width),
        y: (clientY - rect.top)  * (canvas.height / rect.height),
    };
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    isTouchDevice = true;
    initAudio();
    lastInput = 'touch';
    for (const t of e.changedTouches) {
        const p = canvasPos(t.clientX, t.clientY);
        if (handleTap(p.x, p.y)) continue;
        if (vTouch.joyId === null && Math.hypot(p.x - VJOY.x, p.y - VJOY.y) < VJOY.baseR * TOUCH_AREA_MULTIPLIER) {
            vTouch.joyId = t.identifier; vTouch.joyOriX = p.x; vTouch.joyOriY = p.y;
            vTouch.joyDX = 0; vTouch.joyDY = 0;
        } else if (vTouch.shootId === null && Math.hypot(p.x - VSHOOT.x, p.y - VSHOOT.y) < VSHOOT.r * TOUCH_AREA_MULTIPLIER) {
            vTouch.shootId = t.identifier;
            pressAction();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== vTouch.joyId) continue;
        const p = canvasPos(t.clientX, t.clientY);
        const rawDX = p.x - vTouch.joyOriX, rawDY = p.y - vTouch.joyOriY;
        const dist = Math.hypot(rawDX, rawDY);
        const clamped = Math.min(dist, VJOY.maxDist);
        vTouch.joyDX = dist > 0 ? (rawDX / dist) * clamped : 0;
        vTouch.joyDY = dist > 0 ? (rawDY / dist) * clamped : 0;
    }
}, { passive: false });

function clearTouchId(id) {
    if (id === vTouch.joyId)   { vTouch.joyId = null; vTouch.joyDX = 0; vTouch.joyDY = 0; }
    if (id === vTouch.shootId) { vTouch.shootId = null; }
}
canvas.addEventListener('touchend',    e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });

// ── ENTITY FACTORIES ─────────────────────────────────────────
function makeDigSpots() {
    // One of each weapon, shuffled so every visit is a surprise
    const loot = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER];
    for (let i = loot.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [loot[i], loot[j]] = [loot[j], loot[i]];
    }
    // Only ONE dig spot hides the tunnel to the Underground Caves — nobody knows which
    const tunnel = Math.floor(Math.random() * DIG_SPOTS.length);
    return DIG_SPOTS.map((s, i) => ({ x: s.x, y: s.y, hits: 0, depth: 0, weapon: loot[i], tunnel: i === tunnel }));
}

function inAnyCave(x, y, pad = 0) {
    return HELL_CAVES.some(c => x >= c.x - pad && x <= c.x + c.w + pad && y >= c.y - pad && y <= c.y + c.h + pad);
}

function makeWorms() {
    const list = [];
    const n = LEVEL_CONFIGS[state.level - 1].worms;
    while (list.length < n) {
        const x = 80 + Math.random() * 640, y = 90 + Math.random() * 460;
        if (inAnyCave(x, y, 20) || Math.hypot(x - 100, y - 300) < 180) continue;   // not in caves, not on the entrance
        list.push({ type: 'worm', x, y, r: 15, hp: 3, maxHp: 3, alive: true, hitFlash: 0, frozen: 0,
                    hidden: true, wState: 'under', wTimer: WORM_UNDER_FRAMES * (0.5 + Math.random()), spit: WORM_SPIT_FRAMES });
    }
    return list;
}

function makeHell() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    return {
        digSpots: makeDigSpots(),
        foundMsg: null,   // { text, sub, color, timer } — floats up in the middle after digging
        enemies:  [],     // bad guys in Hell (mole monsters, lava worms, mini-devils)
        summonTimer: IMP_SUMMON_FRAMES,
        devil: {
            x: 660, y: 300, r: cfg.devilR, alive: true, shieldFlash: 0, frozen: 0,
            hp: cfg.devilHp, maxHp: cfg.devilHp,
            aiState: 'CHASE',
            wanderTarget: { x: 400, y: 300 },
            wanderWaitTimer: 0,
            shootTimer: cfg.devilShootRate,
            telegraphTimer: 0,
            isAboutToShoot: false,
        },
        coins: [],   // coins only come from beating bad guys
    };
}

function makeEnemy(type, x, y, dx, dy) {
    const hp = ENEMY_TYPES[type].hp;
    return { type, x, y, dx, dy, r: 16, hp, maxHp: hp, alive: true, hitFlash: 0, hopTimer: 0, frozen: 0,
             home: { x, y, dx, dy } };   // where to respawn for the next wave
}

function makeParadise() {
    const cfg = LEVEL_CONFIGS[state.level - 1];
    const enemies = [
        makeEnemy('fire',  200, 150,  1.2,  0.8),
        makeEnemy('fire',  550, 200, -0.9,  1.1),
        makeEnemy('fire',  350, 400,  1.0, -1.0),
        makeEnemy('ghost', 300, 250, -0.7,  0.9),
        makeEnemy('ghost', 600, 350,  0.8, -0.8),
        makeEnemy('bat',   150, 350,  2.0,  1.4),
        makeEnemy('slime', 450, 150,  0,    0),
    ];
    // Extra enemies for harder levels
    for (let i = 0; i < cfg.extraFireMonsters; i++) {
        enemies.push(makeEnemy('fire', 150 + i * 200, 100 + i * 80, 1.1 + i * 0.2, -0.9 - i * 0.15));
        enemies.push(makeEnemy('bat',  250 + i * 150, 450 - i * 60, -1.8 - i * 0.2, 1.2));
    }
    for (let i = 0; i < cfg.extraGhosts; i++) {
        enemies.push(makeEnemy('ghost', 450 + i * 150, 150 + i * 100, -0.8 - i * 0.2, 1.0 + i * 0.2));
        enemies.push(makeEnemy('slime', 200 + i * 250, 300 + i * 50, 0, 0));
    }
    // The King Slime only comes on Monster Night 3
    const king = makeEnemy('king', 400, 330, 0, 0);
    Object.assign(king, { r: 40, minNight: 3, coinDrop: 15 });
    enemies.push(king);
    // The Ghost King haunts Monster Night 2
    const ghostKing = makeEnemy('ghostking', 400, 250, 0, 0);
    Object.assign(ghostKing, { r: 34, minNight: 2, onlyNight: 2, coinDrop: 12, phase: 0 });
    enemies.push(ghostKing);
    // Minecraft monsters come out every Monster Night
    enemies.push(makeEnemy('zombie', 200, 400, 0, 0), makeEnemy('zombie', 600, 200, 0, 0), makeEnemy('creeper', 500, 450, 0, 0));
    // A robot army marches in on nights 2 and 3
    for (let i = 0; i < 4; i++) {
        const bot = makeEnemy('robot', 90 + i * 42, 140, 1.3, 0);
        Object.assign(bot, { r: 14, minNight: 2, march: true });

    }
    return {
        enemies,
        chests: [
            { x: 330, y: 478, w: 30, h: 24, opened: false },
            { x: 400, y: 478, w: 30, h: 24, opened: false },

        villagers: VILLAGERS.map(v => ({ ...v, tx: v.x, ty: v.y, walk: 0, face: 1 })),
        crops:     FARM_CROPS.map(c => ({ ...c, thirsty: false })),
        birthday:  Math.random() < 0.4 ? { id: VILLAGERS[Math.floor(Math.random() * VILLAGERS.length)].id, wished: false } : null,
        fishing:   { stage: 'idle', timer: 0 },   // 'idle' → 'waiting' → 'bite'
        quiet:     false,     // tonight is a quiet night (no monsters)
        lastQuiet: false,
        ambushers: [],        // monsters that popped up in the daytime
        ambushTimer: AMBUSH_FRAMES[0],
        weather:   'sun',     // 'sun' | 'rain' | 'snow'
        weatherTimer: WEATHER_FRAMES,
        rainbowTimer: 0,
        coins:  [],           // coins only come from beating monsters
        phase:  'day',        // 'day' → 'dusk' → 'night' → (chest opened) → 'day'
        timer:  DAY_FRAMES,
        apples: [],           // for the Mayor's apple-picking job
        speech: null,         // { npc, text, timer } — speech bubble over a townsperson
    };
}

function makeSecretRoom() {

function makeUnderground() {
    const enemies = [];
    for (let i = 0; i < 4; i++) {
        const x = 200 + Math.random() * 480, y = 100 + Math.random() * 400;
        enemies.push({ type: 'mole', x, y, alive: true, r: 15, hp: 5, maxHp: 5, hitFlash: 0, frozen: 0,

function gardenStage(i) {
    const t = state.garden[i];
    if (!t) return 0;                                    // empty
    return Math.min(3, 1 + Math.floor((Date.now() - t) / (GROW_MS / 2)));   // 1 seed, 2 sprout, 3 ready!
}

function nearHome(obj, r = 34) { return state.room === ROOM.HOUSE && Math.hypot(player.x - obj.x, player.y - obj.y) < r; }
function nearPot() { return state.room === ROOM.HOUSE ? GARDEN_POTS.findIndex(p => Math.hypot(player.x - p.x, player.y - p.y) < 26) : -1; }

// Things you can do at home with the main button
function tryHomeAction() {
    if (state.room !== ROOM.HOUSE) return false;
    if (nearHome(CATALOGUE)) { openMenu('📖 FURNITURE CATALOGUE', furnitureItems); return true; }
    if (nearHome(HOUSE_BED, 40)) {
        state.playerHp = fullHearts();
        spawnParticles(player.x, player.y, '#FF88AA', 12);
        showToast('Zzz… you had a lovely nap. All hearts back! ❤', '#FFB0C8');
        sfx('buy');
        return true;
    }
    const i = nearPot();
    if (i >= 0) {
        const stage = gardenStage(i), p = GARDEN_POTS[i];
        if (stage === 0) { state.garden[i] = Date.now(); spawnFloatText(p.x, p.y - 30, '🌱 Planted! Come back soon', '#88FF88', 70); sfx('dig'); }
        else if (stage < 3) spawnFloatText(p.x, p.y - 30, 'Still growing…', '#CCFFCC', 50);
        else {
            state.garden[i] = 0;
            const veg = ['🥕 Carrot', '🍓 Strawberry', '🍅 Tomato', '🌽 Corn'][i];
            if (state.playerHp < fullHearts()) { state.playerHp++; spawnFloatText(p.x, p.y - 30, `${veg}! +1 ❤`, '#FFAA66', 80); }
            else { addScore(20); spawnFloatText(p.x, p.y - 30, `${veg}! +20`, '#FFAA66', 80); }
            sfx('found'); giveAward('gardener');
        }
        return true;
    }
    return false;
}

function furnitureItems() {

}

    // Wallpaper wall with a skirting board
    g.fillStyle = '#F4E4C8'; g.fillRect(0, 46, 800, 90);

// ── SOUND & MUSIC ─────────────────────────────────────────────
// Everything is made with the Web Audio API — no sound files needed.
// Browsers only allow sound after a key press / tap, so initAudio() runs on input.
let audioCtx = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('lop_muted') === '1'; } catch (e) {}
const MUTE_BTN = { x: 26, y: 574, r: 16 };

function initAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx   = new AC();
    masterGain = audioCtx.createGain(); masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
    musicGain  = audioCtx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(masterGain);
    sfxGain    = audioCtx.createGain(); sfxGain.gain.value   = 0.6;  sfxGain.connect(masterGain);
    noiseBuf   = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

    muted = !muted;

    if (masterGain) masterGain.gain.value = muted ? 0 : 1;

// One beep: frequency (Hz), length (s), wave shape, volume, optional slide to another pitch
function tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0, dest = sfxGain) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + Math.max(0, delay);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.02);
}

// A burst of static (for crunches and explosions)
function noise(dur, vol = 0.2, filterFreq = 1200) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = filterFreq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t0); src.stop(t0 + dur);
}

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Schedules the next few notes a little ahead of time so the music never stutters
function musicTick() {
    if (!audioCtx || muted) return;
    const playing = state.gamePhase === 'playing' && !state.won && !state.levelComplete;
    const songKey = state.room === ROOM.PARADISE && paradise.phase !== 'day' ? 'night' : state.room;
    const song = playing ? SONGS[songKey] : null;
    if (!song) { musicRoom = null; return; }
    const now = audioCtx.currentTime;
    if (songKey !== musicRoom || nextNoteTime < now - 0.1) {
        musicRoom = songKey; musicStep = 0; nextNoteTime = now + 0.05;
    }
    const stepDur = 60 / song.bpm / 2;
    while (nextNoteTime < now + 0.2) {
        const i = musicStep % song.melody.length, delay = nextNoteTime - now;
        if (song.melody[i]) tone(midiToFreq(song.melody[i]), stepDur * 0.9, song.lead, 0.07, null, delay, musicGain);
        if (song.bass[i])   tone(midiToFreq(song.bass[i]),   stepDur * 1.8, 'triangle', 0.16, null, delay, musicGain);
        nextNoteTime += stepDur; musicStep++;
    }
}
setInterval(musicTick, 50);

function drawToast() {
    if (!toast) return;
    if (--toast.timer <= 0) { toast = null; return; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, toast.timer / 30);
    ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
    const w = ctx.measureText(toast.text).width + 30;
    ctx.fillStyle = 'rgba(15,10,30,0.88)'; ctx.fillRect(400 - w / 2, 76, w, 32);
    ctx.strokeStyle = toast.color; ctx.lineWidth = 2; ctx.strokeRect(400 - w / 2, 76, w, 32);
    ctx.fillStyle = toast.color; ctx.fillText(toast.text, 400, 98);
    ctx.restore();
}
