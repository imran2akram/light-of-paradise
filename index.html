// ── DRAW: PORTALS ─────────────────────────────────────────────
function portalPath(shape, x, y, r, spin) {
    ctx.beginPath();
    if (shape === 'circle') { ctx.arc(x, y, r, 0, Math.PI * 2); return; }
    // Pointy shapes: [number of points, inner radius ratio]
    const [n, inner] = { diamond: [4, 1], triangle: [3, 1], hexagon: [6, 1], star: [5, 0.5] }[shape];
    const pts = inner < 1 ? n * 2 : n;
    for (let i = 0; i < pts; i++) {
        const a  = spin - Math.PI / 2 + (i / pts) * Math.PI * 2;
        const rr = inner < 1 && i % 2 ? r * inner : r;
        ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
}

// The super-rare golden portal to the Secret Golden Room
function drawGoldenPortal() {
    if (!goldenPortal) return;
    const t = Date.now() / 1000, { x, y } = goldenPortal, r = PORTAL_R + 4 + Math.sin(t * 4) * 2;
    ctx.save();
    portalPath('star', x, y, r, t * 1.2);
    const grad = ctx.createRadialGradient(x, y, 2, x, y, r);
    grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(0.4, '#FFE066'); grad.addColorStop(1, '#B8860B');
    ctx.fillStyle = grad; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 35;
    ctx.fill();
    ctx.strokeStyle = '#FFF4B0'; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 5; k++) {
        const a = t * 3 + k * (Math.PI * 2 / 5);
        drawStar(x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10), 3.5, '#FFFFFF');
    }
    ctx.restore();
    ctx.fillStyle = '#FFE066'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
    ctx.fillText('✨ SECRET! ✨', x, y + PORTAL_R + 18);
}

function drawPortals() {
    drawGoldenPortal();
    const t = Date.now() / 1000;
    for (const p of PORTALS[state.room]) {
        // Colour keeps shifting — you never know where it goes!
        const hue  = (t * 60 + p.x + p.y) % 360;
        const spin = t * 0.6 + p.x;   // the whole shape slowly turns
        const r    = PORTAL_R + Math.sin(t * 3 + p.x) * 2;
        ctx.save();

        // Dark swirling middle
        portalPath(p.shape, p.x, p.y, r, spin);
        const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.35, `hsl(${hue}, 90%, 45%)`);
        grad.addColorStop(1, `hsl(${(hue + 120) % 360}, 90%, 15%)`);
        ctx.fillStyle = grad;
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = 25;
        ctx.fill();

        // Spiral arms spinning into the centre
        ctx.save();
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.clip();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `hsla(${(hue + 60) % 360}, 100%, 80%, 0.7)`;
        ctx.lineWidth = 2;
        for (let arm = 0; arm < 3; arm++) {
            ctx.beginPath();
            for (let k = 0; k <= 20; k++) {
                const a  = -t * 4 + arm * (Math.PI * 2 / 3) + k * 0.3;
                const rr = (k / 20) * r;
                ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
            }
            ctx.stroke();
        }
        ctx.restore();

        // Glowing outline
        portalPath(p.shape, p.x, p.y, r, spin);
        ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Sparkles orbiting the edge
        for (let k = 0; k < 3; k++) {
            const a = t * 2 + k * (Math.PI * 2 / 3) + p.y;
            drawStar(p.x + Math.cos(a) * (r + 7), p.y + Math.sin(a) * (r + 7), 2.5, '#FFFFFF');
        }
        ctx.restore();

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', p.x, p.y);
        ctx.textBaseline = 'alphabetic';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('MYSTERY', p.x, p.y + PORTAL_R + 14);
    }
}

// ── DRAW: VOID ────────────────────────────────────────────────
function drawVoid() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font      = 'bold 26px Arial'; ctx.textAlign = 'center';
    ctx.fillText('~ THE VOID ~', 400, 295);
    ctx.font      = '14px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText('Every portal is a mystery — where will it take you?', 400, 328);

    // Shield hint
    if (state.power !== POWER.NONE) {
        const shielded = state.power === POWER.RAINBOW ? 'EVERY MONSTER (not the Devil!)'
            : Object.keys(ENEMY_TYPES).filter(isShieldedAgainst).map(k => ENEMY_TYPES[k].name.toUpperCase() + 'S').join(' & ');
        ctx.fillStyle = WEAPON_INFO[state.power].color;
        ctx.font = 'bold 12px Arial';
        ctx.fillText(`🛡 ${WEAPON_INFO[state.power].label} SHIELD — protects you from ${shielded}`, 400, 360);
    }

    // Which weapon beats which bad guy
    const chart = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER].map(w => {
        const beats = Object.keys(ENEMY_TYPES).filter(k => ENEMY_TYPES[k].weakTo === w).map(k => ENEMY_TYPES[k].name + 's');
        const list = beats.length > 1 ? beats.slice(0, -1).join(', ') + ' & ' + beats[beats.length - 1] : beats[0];
        return `${WEAPON_INFO[w].icon} ${WEAPON_INFO[w].label} beats ${list}`;
    });
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.font = 'bold 12px Arial';
    ctx.fillText('WHAT BEATS WHAT (every weapon still does a little damage to everything)', 400, 446);
    ctx.font = '12px Arial';
    chart.forEach((line, i) => ctx.fillText(line, 400, 464 + i * 16));
    ctx.fillText('🌈 RAINBOW POWER beats everything!', 400, 464 + chart.length * 16);

    // Void enemies
    const t = Date.now() / 400;
    for (const e of voidRoom.enemies) {
        ctx.save();
        if (e.type === 'fire') {
            ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFAA00';
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2 + t;
                ctx.beginPath();
                ctx.arc(e.x + Math.cos(a) * e.r * 0.85, e.y + Math.sin(a) * e.r * 0.85, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r, Math.PI, 0);
            ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
            ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x,             e.y + e.r * 0.7);
            ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
            ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
            ctx.closePath(); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#330055';
            ctx.beginPath();
            ctx.arc(e.x - 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.arc(e.x + 4, e.y - 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Coins
    drawCoins(voidRoom.coins);

    // SHOP button (tap / click it, or press E / Y)
    if (!state.shopOpen) {
        const b = SHOP_BTN, pulse = state.coins > 0 ? 0.5 + 0.5 * Math.sin(Date.now() / 300) : 0;
        ctx.save();
        ctx.fillStyle = 'rgba(40,20,70,0.85)';
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 6 + pulse * 10;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const key = lastInput === 'pad' ? 'Y' : lastInput === 'touch' ? '' : 'E';
        ctx.fillText(`🛒 SHOP${key ? '  (' + key + ')' : ''}`, b.x + b.w / 2, b.y + b.h / 2 + 1);
        ctx.restore();
    }
}

// ── DRAW: HELL ────────────────────────────────────────────────
function drawHell() {
    const t = Date.now() / 500;

    // Caves (the rocks are painted into the background)
    for (const c of HELL_CAVES) {
        ctx.fillStyle   = 'rgba(200,140,90,0.6)';
        ctx.font        = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText('CAVE  (hide & dig here!)', c.x + c.w / 2, c.y + 22);
    }

    // Dig spots — dirt piles with weapons buried in layers
    for (const s of hell.digSpots) {
        ctx.save();
        if (s.depth > 0) {
            // Hole gets bigger and darker the deeper you dig
            const holeR = 8 + s.depth * 4;
            ctx.fillStyle = `rgba(0,0,0,${0.45 + s.depth * 0.18})`;
            ctx.beginPath(); ctx.ellipse(s.x, s.y + 6, holeR, holeR * 0.45, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(200,150,90,0.8)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(s.depth >= DIG_MAX_DEPTH ? 'TUNNEL ⬇ jump in!' : `DEPTH ${s.depth}/${DIG_MAX_DEPTH}`, s.x, s.y + 24);
            if (s.depth >= DIG_MAX_DEPTH) {
                // Swirling tunnel down to the Underground Caves
                ctx.strokeStyle = 'rgba(200,150,255,0.7)'; ctx.lineWidth = 2;
                ctx.beginPath();
                for (let k = 0; k <= 16; k++) {
                    const a = -Date.now() / 250 + k * 0.5, rr = (k / 16) * 18;
                    ctx.lineTo(s.x + Math.cos(a) * rr, s.y + 6 + Math.sin(a) * rr * 0.45);
                }
                ctx.stroke();
            }
        }
        if (s.depth < DIG_MAX_DEPTH) {
            // Dirt pile beside the hole shrinks a little with each dig
            const size = 1 - (s.hits / DIG_HITS_PER_LAYER[s.depth]) * 0.45;
            const px = s.depth > 0 ? s.x + 16 : s.x;
            ctx.fillStyle = '#6B3E1E';
            ctx.beginPath(); ctx.ellipse(px, s.y + 4, 18 * size, 10 * size, 0, Math.PI, 0); ctx.fill();
            ctx.fillStyle = '#8B5A2B';
            ctx.beginPath(); ctx.ellipse(px - 3, s.y + 1, 9 * size, 5 * size, 0, Math.PI, 0); ctx.fill();
            // Twinkle so kids can spot the treasure — rainbow sparkle on the last layer
            const sparkle = s.depth === 2 ? `hsl(${(Date.now() / 5) % 360}, 100%, 70%)` : '#FFFFAA';
            if (Math.sin(t * 2 + s.x) > 0.7) drawStar(px + 8 * size, s.y - 6 * size, 3, sparkle);
        }
        ctx.restore();
    }

    // "Dig here!" prompt when standing on a pile
    const digSpot = nearbyDigSpot();
    if (digSpot) {
        const verb = lastInput === 'pad' ? 'Press A' : lastInput === 'touch' ? 'Tap DIG' : 'Press SPACE';
        ctx.fillStyle = canDig() ? '#FFE08A' : '#FF8888';
        ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        ctx.fillText(!canDig() ? 'Beat the mole monster first!'
                   : digSpot.depth === 0 ? `${verb} to dig!` : `${verb} to dig deeper!`,
                   digSpot.x, digSpot.y - 22);
    }

    // Bad guys (mole monsters, …)
    for (const e of hell.enemies) {
        drawEnemy(e, t);
        if (!(e.emerge > 0) && !e.hidden) drawEnemyHp(e);
    }

    // "You found …!" message floating up
    if (hell.foundMsg) {
        const m = hell.foundMsg;
        const x = 400, y = 250 - (120 - m.timer) * 0.3;   // big, in the middle of the screen
        ctx.save();
        ctx.globalAlpha = Math.min(1, m.timer / 30);
        ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 12;
        ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText(m.text, x, y);
        if (m.sub) {
            ctx.fillStyle = m.sub.startsWith('Look out') ? '#FF6666' : '#FFE08A';
            ctx.shadowBlur = 6; ctx.font = 'bold 15px Arial';
            ctx.fillText(m.sub, x, y + 24);
        }
        ctx.restore();
    }

    // Devil
    const d = hell.devil;
    if (d.alive) {
        drawGroundShadow(d.x + 4, d.y + d.r + 4, d.r * 1.1, d.r * 0.3, 0.4);
        const telegraphing = d.telegraphTimer > 0;
        const flashOn      = telegraphing && Math.floor(Date.now() / 80) % 2 === 0;

        ctx.save();
        ctx.shadowColor = telegraphing ? '#FFFF00' : (d.shieldFlash > 0 ? '#FFFFFF' : '#FF0000');
        ctx.shadowBlur  = telegraphing ? 50 : (d.shieldFlash > 0 ? 40 : 20);

        // Body
        ctx.fillStyle = telegraphing ? (flashOn ? '#FFFF44' : '#FFFFFF')
                      : (d.shieldFlash > 0 ? '#FFFFFF' : '#880000');
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();

        // Horns
        ctx.fillStyle = telegraphing ? '#FFAA00' : (d.shieldFlash > 0 ? '#DDDDDD' : '#550000');
        [[d.x - 14, -1], [d.x + 14, 1]].forEach(([hx, dir]) => {
            ctx.beginPath();
            ctx.moveTo(hx, d.y - d.r + 2);
            ctx.lineTo(hx + dir * 6,  d.y - d.r - 20);
            ctx.lineTo(hx + dir * 14, d.y - d.r);
            ctx.fill();
        });

        // Eyes
        ctx.fillStyle = '#FFFF00';
        ctx.beginPath();
        ctx.arc(d.x - 9, d.y - 4, 6, 0, Math.PI * 2);
        ctx.arc(d.x + 9, d.y - 4, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(d.x - 9, d.y - 4, 3, 0, Math.PI * 2);
        ctx.arc(d.x + 9, d.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (d.frozen > 0) drawIceBlock(d.x, d.y, d.r * 0.85, d.frozen);

        // State label
        ctx.fillStyle = 'rgba(255,120,120,0.65)';
        ctx.font = '10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(d.aiState, d.x, d.y + d.r + 14);

        // HP bar (only shown when player has 3 crystals and can damage devil)
        if (state.lightCrystals >= 3) {
            const bw = 70, bh = 9;
            const bx = d.x - bw / 2, by = d.y - d.r - 30;
            ctx.fillStyle = '#400';
            ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = `hsl(${(d.hp / d.maxHp) * 120}, 100%, 45%)`;
            ctx.fillRect(bx, by, bw * (d.hp / d.maxHp), bh);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
            ctx.fillText(`${d.hp}/${d.maxHp}`, d.x, by + bh - 1);
        }

        // Crystal warning
        if (state.lightCrystals < 3 && d.shieldFlash > 0) {
            ctx.fillStyle = '#FFFF00';
            ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
            ctx.fillText('NEED ALL LIGHT CRYSTALS!', d.x, d.y - d.r - 14);
        }
    }

    // Coins
    drawCoins(hell.coins);

    // Cave timer warning
    if (isPlayerPhysicallyInCave() && state.caveTimer > 0) {
        const frac = state.caveTimer / CAVE_MAX_FRAMES;
        const secsLeft = Math.max(0, Math.ceil((CAVE_MAX_FRAMES - state.caveTimer) / 60));
        if (frac >= 0.5) {
            const flash = state.caveProtectionExpired ? (Math.floor(Date.now() / 200) % 2 === 0) : true;
            ctx.fillStyle = state.caveProtectionExpired
                ? `rgba(255,80,0,${flash ? 0.9 : 0.5})`
                : `rgba(255,220,50,${0.5 + frac * 0.5})`;
            ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            ctx.fillText(
                state.caveProtectionExpired ? '⚠ CAVE EXPIRED — LEAVE NOW!' : `Cave protection: ${secsLeft}s left`,
                400, 535
            );
        }
    }
}

// ── DRAW: BAD GUYS ────────────────────────────────────────────
function drawEnemy(e, t) {
    if (!e.hidden && !(e.emerge > 45)) {
        const flying = e.type === 'ghost' || e.type === 'bat' || e.type === 'imp';
        drawGroundShadow(e.x + 2, e.y + e.r + (flying ? 12 : 2), e.r * (flying ? 0.7 : 1), e.r * 0.3, flying ? 0.15 : 0.3);
    }
    ctx.save();
    if (e.type === 'fire') {
        ctx.fillStyle = '#FF6600'; ctx.shadowColor = '#FF4400'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA00';
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + t;
            ctx.beginPath();
            ctx.arc(e.x + Math.cos(a) * e.r * 0.9, e.y + Math.sin(a) * e.r * 0.9, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (e.type === 'ghost') {
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = '#CC88FF'; ctx.shadowColor = '#AA44FF'; ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, Math.PI, 0);
        ctx.lineTo(e.x + e.r,       e.y + e.r * 0.7);
        ctx.lineTo(e.x + e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x,             e.y + e.r * 0.7);
        ctx.lineTo(e.x - e.r * 0.5, e.y + e.r * 0.25);
        ctx.lineTo(e.x - e.r,       e.y + e.r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#330055';
        ctx.beginPath();
        ctx.arc(e.x - 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.arc(e.x + 5, e.y - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'bat') {
        // Flapping wings
        const flap = Math.sin(Date.now() / 60 + e.home.x) * 8;
        ctx.fillStyle = '#5A3A7A'; ctx.shadowColor = '#9966CC'; ctx.shadowBlur = 10;
        for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(e.x + side * 5, e.y - 2);
            ctx.lineTo(e.x + side * 24, e.y - 6 - flap);
            ctx.lineTo(e.x + side * 18, e.y + 4);
            ctx.lineTo(e.x + side * 11, e.y + 1);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#7A4A9A';
        ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();   // ears
        ctx.moveTo(e.x - 7, e.y - 5); ctx.lineTo(e.x - 5, e.y - 14); ctx.lineTo(e.x - 1, e.y - 7);
        ctx.moveTo(e.x + 7, e.y - 5); ctx.lineTo(e.x + 5, e.y - 14); ctx.lineTo(e.x + 1, e.y - 7);
        ctx.fill();
        ctx.fillStyle = '#FFEE00';
        ctx.beginPath();
        ctx.arc(e.x - 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.arc(e.x + 3.5, e.y - 1, 2.2, 0, Math.PI * 2);
        ctx.fill();
    } else if (e.type === 'worm') {
        if (e.hidden) {
            // Moving dirt bump — it shakes and glows just before popping up
            const shake = e.wState === 'rising' ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = '#5C3A1E';
            ctx.beginPath(); ctx.ellipse(e.x + shake, e.y + 6, 16, 7, 0, Math.PI, 0); ctx.fill();
            if (e.wState === 'rising') {
                ctx.strokeStyle = '#FF7700'; ctx.lineWidth = 2; ctx.shadowColor = '#FF5500'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(e.x - 8, e.y + 4); ctx.lineTo(e.x - 2, e.y); ctx.lineTo(e.x + 3, e.y + 4); ctx.lineTo(e.x + 9, e.y); ctx.stroke();
            }
        } else {
            // Lava worm sticking out of its hole
            const sway = Math.sin(Date.now() / 150 + e.x) * 3;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath(); ctx.ellipse(e.x, e.y + 10, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.shadowColor = '#FF5500'; ctx.shadowBlur = 14;
            [[0, 8, 11], [sway * 0.5, -4, 10], [sway, -16, 9]].forEach(([ox, oy, r], i) => {
                ctx.fillStyle = i % 2 ? '#FF7722' : '#CC3300';
                ctx.beginPath(); ctx.arc(e.x + ox, e.y + oy, r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FFEE00';   // glowing eyes
            ctx.beginPath(); ctx.arc(e.x + sway - 4, e.y - 18, 2.5, 0, Math.PI * 2); ctx.arc(e.x + sway + 4, e.y - 18, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#330000';   // mouth
            ctx.beginPath(); ctx.arc(e.x + sway, e.y - 12, 3, 0, Math.PI); ctx.fill();
        }
    } else if (e.type === 'imp') {
        ctx.globalAlpha = e.emerge > 0 ? 1 - e.emerge / 30 : 1;
        const flap = Math.sin(Date.now() / 70 + e.x) * 4;
        ctx.fillStyle = '#AA1111';   // little bat wings
        for (const side of [-1, 1]) {
            ctx.beginPath(); ctx.moveTo(e.x + side * 6, e.y - 2);
            ctx.lineTo(e.x + side * 18, e.y - 8 - flap); ctx.lineTo(e.x + side * 13, e.y + 4); ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#DD2222'; ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#660000';   // horns
        for (const side of [-1, 1]) {
            ctx.beginPath(); ctx.moveTo(e.x + side * 4, e.y - e.r + 2); ctx.lineTo(e.x + side * 7, e.y - e.r - 7); ctx.lineTo(e.x + side * 9, e.y - e.r + 3); ctx.fill();
        }
        ctx.strokeStyle = '#660000'; ctx.lineWidth = 2;   // pointy tail
        ctx.beginPath(); ctx.moveTo(e.x, e.y + e.r); ctx.quadraticCurveTo(e.x + 10, e.y + e.r + 8, e.x + 14, e.y + e.r + 2); ctx.stroke();
        ctx.fillStyle = '#FFEE00';
        ctx.beginPath(); ctx.arc(e.x - 4, e.y - 2, 2.5, 0, Math.PI * 2); ctx.arc(e.x + 4, e.y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'mole') {
        const rise = Math.max(0, 1 - (e.emerge || 0) / 45);   // 0 → 1 while climbing out
        const r = e.r * (0.4 + 0.6 * rise);
        ctx.globalAlpha = e.emerge > 45 ? 0 : 0.4 + 0.6 * rise;   // still deep underground: invisible
        ctx.fillStyle = '#5C3A1E';
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#E8A0A0';   // pink nose
        ctx.beginPath(); ctx.arc(e.x, e.y + r * 0.25, r * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF2222';   // angry red eyes
        ctx.beginPath();
        ctx.arc(e.x - r * 0.35, e.y - r * 0.25, r * 0.15, 0, Math.PI * 2);
        ctx.arc(e.x + r * 0.35, e.y - r * 0.25, r * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#D8C8A8'; ctx.lineWidth = 2;   // claws
        for (const side of [-1, 1]) {
            for (let k = -1; k <= 1; k++) {
                ctx.beginPath();
                ctx.moveTo(e.x + side * r * 0.8, e.y + r * 0.4 + k * 3);
                ctx.lineTo(e.x + side * r * 1.25, e.y + r * 0.55 + k * 4);
                ctx.stroke();
            }
        }
    } else if (e.type === 'slime' || e.type === 'king') {
        // Squishes flat while resting, stretches tall mid-hop
        const speed   = Math.hypot(e.dx, e.dy);
        const stretch = Math.min(1, speed / 4);
        const w = e.r * (1.2 - stretch * 0.3), h = e.r * (0.8 + stretch * 0.4);
        ctx.fillStyle = 'rgba(100,220,70,0.85)'; ctx.shadowColor = '#66DD44'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r - h, w, h, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(200,255,180,0.7)';   // shine
        ctx.beginPath(); ctx.ellipse(e.x - w * 0.4, e.y + e.r - h * 1.5, w * 0.2, h * 0.15, -0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#113311';
        ctx.beginPath();
        const eyeGap = e.r * 0.32, eyeR = Math.max(2, e.r * 0.18);
        ctx.arc(e.x - eyeGap, e.y + e.r - h * 1.1, eyeR, 0, Math.PI * 2);
        ctx.arc(e.x + eyeGap, e.y + e.r - h * 1.1, eyeR, 0, Math.PI * 2);
        ctx.fill();
        if (e.type === 'king') {
            // Golden crown
            const top = e.y + e.r - h * 2, cw = e.r * 0.9;
            ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(e.x - cw / 2, top + 4);
            for (let k = 0; k <= 4; k++) ctx.lineTo(e.x - cw / 2 + (cw / 4) * k, k % 2 ? top - 4 : top - 16);
            ctx.lineTo(e.x + cw / 2, top + 4);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#FF3355';
            ctx.beginPath(); ctx.arc(e.x, top - 2, 3, 0, Math.PI * 2); ctx.fill();
        }
    }
    ctx.restore();
    if (e.frozen > 0 && !e.hidden) drawIceBlock(e.x, e.y, e.r, e.frozen);
    // White flash when hit
    if (e.hitFlash > 0 && !(e.emerge > 0) && !e.hidden) {
        ctx.save();
        ctx.globalAlpha = e.hitFlash / 12;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// Frozen solid: a see-through ice block (flickers just before melting)
function drawIceBlock(x, y, r, framesLeft) {
    if (framesLeft < 30 && Math.floor(Date.now() / 80) % 2) return;
    ctx.save();
    ctx.fillStyle = 'rgba(160,220,255,0.45)';
    ctx.strokeStyle = 'rgba(230,250,255,0.9)'; ctx.lineWidth = 2;
    const s = r * 1.35;
    ctx.fillRect(x - s, y - s, s * 2, s * 2);
    ctx.strokeRect(x - s, y - s, s * 2, s * 2);
    ctx.beginPath();   // shine
    ctx.moveTo(x - s * 0.7, y - s * 0.2); ctx.lineTo(x - s * 0.2, y - s * 0.7);
    ctx.moveTo(x - s * 0.7, y + s * 0.2); ctx.lineTo(x + s * 0.2, y - s * 0.7);
    ctx.stroke();
    ctx.restore();
}

// Little health bar, only once a bad guy has been hurt
function drawEnemyHp(e) {
    if (e.hp >= e.maxHp) return;
    const bw = 30, bh = 4, bx = e.x - bw / 2, by = e.y - e.r - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = `hsl(${(e.hp / e.maxHp) * 120}, 100%, 45%)`;
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
}

// ── DRAW: PARADISE ────────────────────────────────────────────
// Sky tint for Paradise: darkens at dusk, deep blue at Monster Night (drawn before everything else)
function drawParadiseSky() {
    const P = paradise;
    const dark = P.phase === 'night' ? 1 : P.phase === 'dusk' ? 1 - P.timer / DUSK_FRAMES : 0;
    if (dark === 0) {
        ctx.fillStyle = 'rgba(255,240,190,0.06)';   // warm sunshine
        ctx.fillRect(0, 0, 800, 600);
        return;
    }
    ctx.fillStyle = `rgba(5,5,40,${0.6 * dark})`;
    ctx.fillRect(0, 0, 800, 600);
    ctx.save();
    ctx.globalAlpha = dark;
    ctx.fillStyle = '#FFFBE0'; ctx.shadowColor = '#FFFBE0'; ctx.shadowBlur = 30;   // moon
    ctx.beginPath(); ctx.arc(740, 110, 22, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(5,5,40,1)';
    ctx.beginPath(); ctx.arc(750, 104, 18, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 25; i++) {   // twinkling stars
        const sx = (i * 137) % 800, sy = 75 + (i * 71) % 90;
        if (Math.sin(Date.now() / 400 + i) > -0.3) drawStar(sx, sy, 2, '#FFFFFF');
    }
    ctx.restore();
}

function drawBuilding(b, night) {
    const w = 90, h = 55, x = b.x - w / 2, y = b.y - h / 2;
    drawGroundShadow(b.x + 10, y + h + 2, w * 0.6, 8, 0.3);
    ctx.save();
    ctx.fillStyle = b.wall;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;          // brick lines
    for (let row = 1; row < 6; row++) {
        ctx.beginPath(); ctx.moveTo(x, y + row * 9); ctx.lineTo(x + w, y + row * 9); ctx.stroke();
        for (let bx = x + (row % 2) * 9; bx < x + w; bx += 18) { ctx.beginPath(); ctx.moveTo(bx, y + row * 9 - 9); ctx.lineTo(bx, y + row * 9); ctx.stroke(); }
    }
    const shade = ctx.createLinearGradient(x, 0, x + w, 0);           // light from the left
    shade.addColorStop(0, 'rgba(255,255,255,0.12)'); shade.addColorStop(1, 'rgba(0,0,0,0.18)');
    ctx.fillStyle = shade; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = b.roof;
    ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(b.x, y - 32); ctx.lineTo(x + w + 8, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';                                // shady side of the roof
    ctx.beginPath(); ctx.moveTo(b.x, y - 32); ctx.lineTo(x + w + 8, y); ctx.lineTo(b.x, y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';                              // roof tiles
    for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x - 8 + k * 8, y - k * 8); ctx.lineTo(x + w + 8 - k * 8, y - k * 8); ctx.stroke(); }
    ctx.fillStyle = '#6B3E1E';                                  // door
    ctx.fillRect(b.x - 9, y + h - 26, 18, 26);
    ctx.fillStyle = night ? '#FFE070' : '#AADDFF';              // windows glow at night
    if (night) { ctx.shadowColor = '#FFE070'; ctx.shadowBlur = 12; }
    ctx.fillRect(x + 10, y + 12, 16, 14);
    ctx.fillRect(x + w - 26, y + 12, 16, 14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#222'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
    const label = b.id === 'house' ? (state.houseOwned ? 'YOUR HOUSE ❤' : 'FOR SALE') : b.name;
    ctx.fillText(label, b.x, y + 8);
    if (b.id === 'house' && !state.houseOwned) {                // price sign on a post
        ctx.fillStyle = '#6B3E1E'; ctx.fillRect(x - 22, y + 20, 3, 35);
        ctx.fillStyle = '#FFF'; ctx.fillRect(x - 40, y + 10, 38, 18);
        ctx.fillStyle = '#C00'; ctx.font = 'bold 9px Arial';
        ctx.fillText(`🪙${HOUSE_COST}`, x - 21, y + 23);
    }
    ctx.restore();
}

function drawNpc(n) {
    if (!n.coat) return;   // "home" is just the front door
    const bob = Math.sin(Date.now() / 350 + n.x) * 1.5, x = n.x, y = n.y + bob;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';                                         // shadow
    ctx.beginPath(); ctx.ellipse(x, n.y + 14, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = n.coat;                                                     // body
    ctx.fillRect(x - 9, y - 6, 18, 20);
    ctx.fillStyle = '#F2C49B';                                                  // head
    ctx.beginPath(); ctx.arc(x, y - 14, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 4, y - 16, 2, 2); ctx.fillRect(x + 2, y - 16, 2, 2);        // eyes
    ctx.fillRect(x - 2, y - 11, 4, 1);                                           // smile
    if (n.hat === 'doctor') {
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 7, y - 25, 14, 5);
        ctx.fillStyle = '#E03030'; ctx.fillRect(x - 1, y - 25, 2, 5); ctx.fillRect(x - 3, y - 23, 6, 2);
        ctx.fillStyle = '#E03030'; ctx.fillRect(x - 1, y - 2, 2, 8); ctx.fillRect(x - 4, y + 1, 8, 2);   // red cross
    } else if (n.hat === 'smith') {
        ctx.fillStyle = '#333'; ctx.fillRect(x - 8, y - 23, 16, 4);              // bandana
        ctx.fillStyle = '#888'; ctx.fillRect(x + 10, y - 4, 8, 5);               // hammer head
        ctx.fillStyle = '#6B3E1E'; ctx.fillRect(x + 13, y + 1, 2, 9);            // hammer handle
    } else if (n.hat === 'mayor') {
        ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 32, 12, 11); ctx.fillRect(x - 9, y - 22, 18, 2);   // top hat
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(x, y + 4, 2.5, 0, Math.PI * 2); ctx.fill();    // medal
    } else if (n.hat === 'seller') {
        ctx.fillStyle = '#AA6633'; ctx.fillRect(x - 8, y - 23, 16, 4); ctx.fillRect(x - 2, y - 21, 12, 2); // cap
        ctx.fillStyle = '#C00'; ctx.fillRect(x - 1, y - 5, 2, 9);                                          // tie
    }
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
    ctx.fillText(n.name, x, n.y + 26);
    ctx.restore();
}

function drawSpeech(n, text) {
    ctx.save();
    ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
    const w = ctx.measureText(text).width + 18;
    const bx = Math.max(8, Math.min(792 - w, n.x - w / 2)), by = n.y - 62;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.fillRect(bx, by, w, 24); ctx.strokeRect(bx, by, w, 24);
    ctx.beginPath(); ctx.moveTo(n.x - 6, by + 24); ctx.lineTo(n.x, by + 32); ctx.lineTo(n.x + 6, by + 24); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.fillText(text, bx + w / 2, by + 16);
    ctx.restore();
}

function drawParadise() {
    const t = Date.now() / 400;
    const P = paradise, night = P.phase !== 'day';

    for (const b of BUILDINGS) drawBuilding(b, night);

    if (!night) {
        // Townspeople, apples, speech and "talk" prompts (everyone hides indoors at night)
        for (const n of townNpcs()) drawNpc(n);
        for (const a of P.apples) {
            ctx.fillStyle = '#E02020';
            ctx.beginPath(); ctx.arc(a.x, a.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#33AA33'; ctx.fillRect(a.x - 1, a.y - 11, 4, 5);
        }
        const n = nearbyNpc();
        if (n && !(P.speech && P.speech.npc === n)) {
            const verb = lastInput === 'pad' ? 'A' : lastInput === 'touch' ? 'Tap TALK' : 'SPACE';
            drawSpeech(n, `${verb}: ${talkLabel(n)}`);
        }
        if (P.speech) drawSpeech(P.speech.npc, P.speech.text);
    }

    for (const e of roomEnemies()) {
        if (!e.alive) continue;
        drawEnemy(e, t);
        drawEnemyHp(e);
    }

    for (const c of P.chests) {
        if (!c.visible) continue;
        ctx.save();
        if (!c.opened) { ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 16; }
        ctx.fillStyle = c.opened ? '#5a3010' : '#8B4513';
        ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h);
        ctx.fillStyle = c.opened ? '#3a200a' : '#6B3410';
        ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h / 2);
        if (!c.opened) {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(c.x - 3, c.y - 4, 7, 7);
        } else {
            drawStar(c.x, c.y - 22, 11, '#FFD700');
        }
        ctx.restore();
    }

    // Status line: time of day / what to do
    const nightNum = state.paradiseClearCount + 1;
    let status, color = 'rgba(255,255,255,0.75)';
    if (state.lightCrystals >= 3)       status = '☀ Paradise Island is safe! Now go and beat the Devil!';
    else if (P.phase === 'day')         status = `☀ Daytime — Monster Night ${nightNum}/3 comes in ${Math.ceil(P.timer / 60)}s`;
    else if (P.phase === 'dusk')      { status = '🌙 MONSTER NIGHT IS COMING! Get ready!'; color = Math.floor(Date.now() / 200) % 2 ? '#FF6666' : '#FFFFFF'; }
    else if (allMonstersDefeated())   { status = '⭐ You did it! Open the chest to win a Light Crystal!'; color = '#FFD700'; }
    else { status = `🌙 MONSTER NIGHT ${nightNum}/3${nightNum === 3 ? ' — THE KING SLIME IS HERE!' : ''} — beat every monster!`; color = '#AABBFF'; }
    ctx.fillStyle = color; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
    ctx.fillText(status, 400, 544);

    // Current job
    if (state.job) {
        const j = state.job;
        ctx.fillStyle = 'rgba(255,230,150,0.85)'; ctx.font = '12px Arial';
        ctx.fillText(`📋 Job: ${j.text}${j.kind === 'apples' ? ` (${j.got}/${j.count})` : ''} — pays 🪙${j.pay}`, 400, 564);
    }

    // Coins
    drawCoins(P.coins);
}

// ── DRAW: BACKGROUNDS ─────────────────────────────────────────
// Each room's ground is painted once onto its own hidden canvas, then copied every frame.
// A seeded random number generator makes the scenery look the same every time.
function seededRandom(seed) {
    return () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

const bgCache = {};
function roomBackground(room) {
    if (!bgCache[room]) {
        const c = document.createElement('canvas');
        c.width = 800; c.height = 600;
        if (room === 'void') { c.width = 900; c.height = 700; }   // fog is bigger than the screen so it can drift
        const painters = { hell: paintHell, paradise: paintParadise, underground: paintUnderground, void: paintVoidFog };
        painters[room](c.getContext('2d'), seededRandom(room.length * 7919 + 13));
        bgCache[room] = c;
    }
    return bgCache[room];
}

function paintParadise(g, R) {
    g.fillStyle = '#3E8C38'; g.fillRect(0, 0, 800, 600);
    // Patchy grass colours
    for (let i = 0; i < 1400; i++) {
        g.fillStyle = `hsla(${95 + R() * 30}, ${40 + R() * 25}%, ${26 + R() * 16}%, 0.55)`;
        g.beginPath(); g.ellipse(R() * 800, R() * 600, 4 + R() * 12, 3 + R() * 7, R() * 3, 0, Math.PI * 2); g.fill();
    }
    // Grass blades
    g.lineWidth = 1;
    for (let i = 0; i < 3000; i++) {
        const x = R() * 800, y = R() * 600, h = 3 + R() * 5;
        g.strokeStyle = R() < 0.5 ? 'rgba(20,70,20,0.6)' : 'rgba(140,200,90,0.5)';
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - 0.5) * 3, y - h); g.stroke();
    }
    // Dirt paths from every door and portal to the town square
    const plaza = { x: 400, y: 330 };
    const ends = [...BUILDINGS.map(b => ({ x: b.x, y: b.y + 30 })), ...PORTALS.paradise, { x: 400, y: 480 }, { x: 200, y: 480 }, { x: 600, y: 480 }, { x: 700, y: 300 }];
    for (const [w, col] of [[30, '#9C8456'], [22, '#C9B07A']]) {
        g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
        for (const e of ends) { g.beginPath(); g.moveTo(plaza.x, plaza.y); g.quadraticCurveTo((plaza.x + e.x) / 2 + 30, (plaza.y + e.y) / 2, e.x, e.y); g.stroke(); }
        g.fillStyle = col; g.beginPath(); g.arc(plaza.x, plaza.y, w * 2.2, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 400; i++) {   // pebbles on the paths
        const e = ends[Math.floor(R() * ends.length)], k = R();
        g.fillStyle = R() < 0.5 ? 'rgba(120,100,70,0.7)' : 'rgba(230,215,180,0.7)';
        g.beginPath(); g.arc(plaza.x + (e.x - plaza.x) * k + (R() - 0.5) * 14, plaza.y + (e.y - plaza.y) * k + (R() - 0.5) * 14, 1 + R() * 1.5, 0, Math.PI * 2); g.fill();
    }
    // Flowers
    const petals = ['#FFFFFF', '#FFE44D', '#FF7FB0', '#B98CFF', '#FF6A4D'];
    for (let i = 0; i < 140; i++) {
        const x = R() * 800, y = 70 + R() * 490, col = petals[Math.floor(R() * petals.length)];
        g.fillStyle = col;
        for (let k = 0; k < 5; k++) { const a = k * 1.256; g.beginPath(); g.arc(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2, 1.8, 0, Math.PI * 2); g.fill(); }
        g.fillStyle = '#FFB300'; g.beginPath(); g.arc(x, y, 1.3, 0, Math.PI * 2); g.fill();
    }
    // Trees (kept away from buildings, portals and paths)
    for (const [x, y, r] of [[35, 150, 30], [770, 330, 34], [45, 470, 28], [300, 440, 24], [770, 520, 30], [480, 110, 22], [120, 330, 22]]) {
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(x + 8, y + r * 0.9, r * 0.9, r * 0.35, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#5A3A1E'; g.fillRect(x - 4, y, 8, r * 0.8);
        for (const [ox, oy, rr] of [[-r * 0.45, -r * 0.1, r * 0.7], [r * 0.45, -r * 0.1, r * 0.7], [0, -r * 0.55, r * 0.75]]) {
            const gr = g.createRadialGradient(x + ox - rr * 0.3, y + oy - rr * 0.3, rr * 0.1, x + ox, y + oy, rr);
            gr.addColorStop(0, '#6FCB55'); gr.addColorStop(1, '#1F5E1C');
            g.fillStyle = gr; g.beginPath(); g.arc(x + ox, y + oy, rr, 0, Math.PI * 2); g.fill();
        }
    }
    // Beach and sea along the bottom — it's an island!
    const sand = g.createLinearGradient(0, 566, 0, 588);
    sand.addColorStop(0, 'rgba(230,210,150,0)'); sand.addColorStop(0.4, '#E6D296'); sand.addColorStop(1, '#D8C080');
    g.fillStyle = sand; g.fillRect(0, 566, 800, 22);
    const sea = g.createLinearGradient(0, 586, 0, 600);
    sea.addColorStop(0, '#4FB3D9'); sea.addColorStop(1, '#1F6FA8');
    g.fillStyle = sea; g.fillRect(0, 586, 800, 14);
}

function paintHell(g, R) {
    const base = g.createRadialGradient(400, 320, 60, 400, 320, 520);
    base.addColorStop(0, '#3C0E06'); base.addColorStop(1, '#120302');
    g.fillStyle = base; g.fillRect(0, 0, 800, 600);
    // Cracked volcanic rock
    for (let i = 0; i < 700; i++) {
        g.fillStyle = `hsla(${8 + R() * 14}, ${35 + R() * 25}%, ${6 + R() * 14}%, 0.6)`;
        g.beginPath(); g.ellipse(R() * 800, R() * 600, 6 + R() * 22, 4 + R() * 12, R() * 3, 0, Math.PI * 2); g.fill();
    }
    // Glowing lava cracks
    for (let i = 0; i < 18; i++) {
        let x = R() * 800, y = 70 + R() * 530, a = R() * Math.PI * 2;
        const pts = [[x, y]];
        for (let k = 0; k < 5 + R() * 6; k++) {   // wanders a little, like a real crack
            a += (R() - 0.5) * 1.1;
            const step = 12 + R() * 14;
            x += Math.cos(a) * step; y += Math.sin(a) * step; pts.push([x, y]);
        }
        for (const [w, col, blur] of [[2.2, 'rgba(255,70,0,0.75)', 7], [0.8, 'rgba(255,215,130,0.8)', 0]]) {
            g.strokeStyle = col; g.lineWidth = w; g.shadowColor = '#FF3300'; g.shadowBlur = blur; g.lineJoin = 'round';
            g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
        }
    }
    g.shadowBlur = 0;
    // Lava pools
    for (const [x, y, rx, ry] of [[70, 555, 70, 34], [770, 190, 42, 60]]) {
        g.fillStyle = '#2A0A04'; g.beginPath(); g.ellipse(x, y, rx + 8, ry + 6, 0, 0, Math.PI * 2); g.fill();
        const lava = g.createRadialGradient(x - rx * 0.2, y - ry * 0.2, 4, x, y, Math.max(rx, ry));
        lava.addColorStop(0, '#FFF0A0'); lava.addColorStop(0.35, '#FFA020'); lava.addColorStop(1, '#B01E00');
        g.fillStyle = lava; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
    }
    // Rocky cave entrances (the dark caves you can hide in)
    HELL_CAVES.forEach((c, ci) => {
        const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
        const inside = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(c.w, c.h) * 0.7);
        inside.addColorStop(0, '#050201'); inside.addColorStop(1, '#1E0E06');
        g.fillStyle = inside;
        g.beginPath(); g.ellipse(cx, cy, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); g.fill();
        g.fillRect(c.x + 14, c.y + 8, c.w - 28, c.h - 16);
        // Boulders around the edge
        for (let k = 0; k < 46; k++) {
            const a = (k / 46) * Math.PI * 2, rr = 6 + R() * 9;
            const bx = cx + Math.cos(a) * (c.w / 2 + 2), by = cy + Math.sin(a) * (c.h / 2 + 2);
            const stone = g.createRadialGradient(bx - rr * 0.4, by - rr * 0.4, 1, bx, by, rr);
            stone.addColorStop(0, '#7A5A48'); stone.addColorStop(1, '#2E1E16');
            g.fillStyle = stone; g.beginPath(); g.arc(bx, by, rr, 0, Math.PI * 2); g.fill();
        }
    });
}

function paintUnderground(g, R) {
    g.fillStyle = '#1C130C'; g.fillRect(0, 0, 800, 600);
    for (let i = 0; i < 900; i++) {   // dirt and stone floor
        g.fillStyle = `hsla(${25 + R() * 15}, ${20 + R() * 20}%, ${8 + R() * 12}%, 0.7)`;
        g.beginPath(); g.ellipse(R() * 800, R() * 600, 3 + R() * 16, 2 + R() * 9, R() * 3, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 18; i++) {   // big boulders
        const x = R() * 800, y = 70 + R() * 530, r = 12 + R() * 22;
        const st = g.createRadialGradient(x - r * 0.4, y - r * 0.4, 2, x, y, r);
        st.addColorStop(0, '#5A4636'); st.addColorStop(1, '#1E140C');
        g.fillStyle = st; g.beginPath(); g.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 7; i++) {    // shiny puddles
        const x = R() * 800, y = 90 + R() * 480;
        g.fillStyle = 'rgba(60,90,120,0.35)'; g.beginPath(); g.ellipse(x, y, 20 + R() * 20, 6 + R() * 5, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(200,230,255,0.2)'; g.beginPath(); g.ellipse(x - 6, y - 2, 8, 2, 0, 0, Math.PI * 2); g.fill();
    }
    // Stalactites (top) and stalagmites (bottom)
    for (let x = 0; x < 800; x += 18 + R() * 26) {
        const h = 14 + R() * 30;
        g.fillStyle = '#3A2A1C';
        g.beginPath(); g.moveTo(x, 46); g.lineTo(x + 8, 46 + h); g.lineTo(x + 16, 46); g.fill();
        const h2 = 10 + R() * 22;
        g.beginPath(); g.moveTo(x + 4, 600); g.lineTo(x + 12, 600 - h2); g.lineTo(x + 20, 600); g.fill();
    }
}

// Soft fog clouds for the Void (drawn over its colour, drifting slowly)
function paintVoidFog(g, R) {
    for (let i = 0; i < 30; i++) {
        const x = R() * 900, y = R() * 700, r = 60 + R() * 140;
        const fog = g.createRadialGradient(x, y, 0, x, y, r);
        fog.addColorStop(0, `rgba(255,255,255,${0.08 + R() * 0.1})`); fog.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = fog; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
}

// Darker edges make everything feel more real
let vignetteCanvas = null;
function drawVignette() {
    if (!vignetteCanvas) {
        vignetteCanvas = document.createElement('canvas');
        vignetteCanvas.width = 800; vignetteCanvas.height = 600;
        const g = vignetteCanvas.getContext('2d');
        const v = g.createRadialGradient(400, 320, 240, 400, 320, 560);
        v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
        g.fillStyle = v; g.fillRect(0, 0, 800, 600);
    }
    ctx.drawImage(vignetteCanvas, 0, 0);
}

function drawRoomBackground() {
    const t = Date.now() / 1000;
    if (state.room === ROOM.VOID) {
        ctx.fillStyle = voidBgColor; ctx.fillRect(0, 0, 800, 600);
        ctx.drawImage(roomBackground('void'), -50 + Math.sin(t / 6) * 30, -50 + Math.cos(t / 8) * 15);
    } else if (state.room === ROOM.SECRET) {
        const gold = ctx.createRadialGradient(400, 300, 50, 400, 300, 500);
        gold.addColorStop(0, '#5A4210'); gold.addColorStop(1, '#1E1400');
        ctx.fillStyle = gold; ctx.fillRect(0, 0, 800, 600);
    } else {
        ctx.drawImage(roomBackground(state.room), 0, 0);
    }
    if (state.room === ROOM.HELL) {
        // Lava pools pulse, embers float up
        ctx.save();
        ctx.globalAlpha = 0.25 + Math.sin(t * 2) * 0.15;
        ctx.fillStyle = '#FFE070'; ctx.shadowColor = '#FF8800'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.ellipse(70, 555, 40, 18, 0, 0, Math.PI * 2); ctx.ellipse(770, 190, 22, 34, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        for (let i = 0; i < 24; i++) {
            const x = (i * 97 + Math.sin(t + i) * 20) % 800, y = 600 - ((t * 30 + i * 53) % 560);
            ctx.fillStyle = `rgba(255,${120 + (i % 5) * 25},40,${0.5 + 0.4 * Math.sin(t * 3 + i)})`;
            ctx.fillRect(x, y, 2, 2);
        }
    }
    if (state.room === ROOM.PARADISE) {
        // Waves washing up the beach
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 0; x <= 800; x += 10) ctx.lineTo(x, 587 + Math.sin(x / 30 + t * 2) * 2);
        ctx.stroke();
    }
}

// Soft shadow on the ground under something
function drawGroundShadow(x, y, rx, ry = rx * 0.35, alpha = 0.3) {
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

// ── DRAW: SECRET ROOMS ────────────────────────────────────────
function drawSecretRoom() {
    const t = Date.now() / 1000;
    // Golden glow and treasure piles
    const glow = ctx.createRadialGradient(400, 300, 30, 400, 300, 420);
    glow.addColorStop(0, 'rgba(255,215,0,0.35)'); glow.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, 800, 600);
    for (let i = 0; i < 12; i++) {
        const x = 60 + i * 62, y = 560 - (i % 3) * 8;
        ctx.fillStyle = i % 2 ? '#E8B830' : '#FFD700';
        ctx.beginPath(); ctx.ellipse(x, y, 34, 14, 0, Math.PI, 0); ctx.fill();
    }
    for (let i = 0; i < 20; i++) {
        if (Math.sin(t * 2 + i * 1.7) > 0.6) drawStar((i * 173) % 800, 70 + (i * 97) % 460, 3, '#FFF8C0');
    }
    ctx.fillStyle = '#FFE066'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
    ctx.fillText('You found the SECRET GOLDEN ROOM!', 400, 130);
    ctx.fillStyle = 'rgba(255,240,180,0.8)'; ctx.font = '13px Arial';
    ctx.fillText('Grab the treasures! The star portal takes you back out.', 400, 154);

    for (const tr of secretRoom.treasures) {
        if (tr.picked) continue;
        const bob = Math.sin(t * 3 + tr.x) * 4;
        // Pedestal
        ctx.fillStyle = '#C8A040'; ctx.fillRect(tr.x - 22, tr.y + 14, 44, 12);
        ctx.fillStyle = '#A08030'; ctx.fillRect(tr.x - 16, tr.y + 26, 32, 14);
        ctx.save();
        ctx.shadowColor = '#FFFFFF'; ctx.shadowBlur = 20;
        if (tr.kind === 'rainbow')    drawStar(tr.x, tr.y + bob, 16, `hsl(${(t * 200) % 360}, 100%, 60%)`);
        else if (tr.kind === 'heart') { ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                        ctx.fillStyle = '#FF3355'; ctx.fillText('❤', tr.x, tr.y + bob); }
        else                          drawStar(tr.x, tr.y + bob, 16, '#FFD700');
        ctx.restore();
        ctx.fillStyle = '#FFF4C0'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
        ctx.fillText({ rainbow: 'RAINBOW POWER', heart: 'SUPER HEART', star: 'GOLDEN STAR' }[tr.kind], tr.x, tr.y + 54);
    }
}

function drawUnderground() {
    const t = Date.now() / 1000;
    // Glowing mushrooms
    for (const m of underground.shrooms) {
        const c = `hsl(${m.h}, 90%, 60%)`;
        ctx.save();
        ctx.shadowColor = c; ctx.shadowBlur = 12;
        ctx.fillStyle = '#DDD'; ctx.fillRect(m.x - 1.5, m.y - 6, 3, 8);
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(m.x, m.y - 6, 6, Math.PI, 0); ctx.fill();
        ctx.restore();
    }
    // Gems to mine
    for (const g of underground.gems) {
        if (g.mined) continue;
        ctx.save();
        ctx.shadowColor = g.color; ctx.shadowBlur = 18 + Math.sin(t * 3 + g.x) * 6;
        ctx.fillStyle = g.color;
        const sz = 14 - g.hits * 2;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - sz * 1.4); ctx.lineTo(g.x + sz, g.y); ctx.lineTo(g.x, g.y + sz); ctx.lineTo(g.x - sz, g.y); ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.moveTo(g.x, g.y - sz * 1.4); ctx.lineTo(g.x + sz * 0.3, g.y - sz * 0.2); ctx.lineTo(g.x - sz * 0.5, g.y); ctx.closePath(); ctx.fill();
        ctx.restore();
    }
    for (const e of underground.enemies) {
        drawEnemy(e, t);
        if (!(e.emerge > 0) && !e.hidden) drawEnemyHp(e);
    }
    drawCoins(underground.coins);
}

// Dark caves: you can only see near your lantern (drawn on top of the room, under the HUD)
function drawCaveDarkness() {
    const flicker = Math.sin(Date.now() / 90) * 4;
    const dark = ctx.createRadialGradient(player.x, player.y, 50, player.x, player.y, 210 + flicker);
    dark.addColorStop(0, 'rgba(0,0,0,0)'); dark.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = dark; ctx.fillRect(0, 0, 800, 600);
    // Gems and portals still twinkle through the dark so you can find them
    for (const g of underground.gems) {
        if (!g.mined && Math.sin(Date.now() / 300 + g.x) > 0.3) drawStar(g.x, g.y - 4, 4, g.color);
    }
    for (const p of PORTALS.underground) {
        ctx.fillStyle = 'rgba(200,180,255,0.35)';
        ctx.beginPath(); ctx.arc(p.x, p.y, PORTAL_R, 0, Math.PI * 2); ctx.fill();
    }
    const gem = nearbyGem();
    if (gem) {
        ctx.fillStyle = '#FFE08A'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        const verb = lastInput === 'pad' ? 'Press A' : lastInput === 'touch' ? 'Tap DIG' : 'Press SPACE';
        ctx.fillText(`${verb} to mine the gem!`, gem.x, gem.y - 26);
    }
    ctx.fillStyle = 'rgba(255,220,150,0.6)'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillText('⛏ Mine the glowing gems — but watch out for moles and lava worms in the dark!', 400, 580);
}

// ── DRAW: PLAYER ──────────────────────────────────────────────
function drawPlayer() {
    const t = Date.now() / 400;

    // Ice aura
    if (state.power === POWER.ICE) {
        const pulse = 30 + Math.sin(t * 3) * 5;
        const alpha = 0.28 + 0.18 * Math.sin(t * 3);
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(100,180,255,${alpha})`;
        ctx.lineWidth   = 4;
        ctx.shadowColor = '#88CCFF'; ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.restore();
    }

    // Void healing radiance (pulsing golden glow when HP is not full)
    if (state.room === ROOM.VOID && state.playerHp < 3) {
        const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
        const r = 28 + pulse * 10;
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,215,0,${0.35 + pulse * 0.45})`;
        ctx.lineWidth   = 3;
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();
    }

    // Invincibility flicker
    if (state.playerInvincible > 0 && Math.floor(Date.now() / 80) % 2 === 0) return;

    const color = getPlayerColor();
    drawGroundShadow(player.x + 3, player.y + 19, 16, 5);
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    drawAvatar(player.x, player.y, player.w, color, AVATAR_STYLES[state.activeSkin]);
    ctx.restore();

    // Carrying something for a delivery job
    if (state.job && state.job.kind === 'deliver') {
        ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(state.job.item, player.x, player.y - 30 + Math.sin(Date.now() / 200) * 2);
        ctx.textBaseline = 'alphabetic';
    }

    // Shield Bubble
    if (state.bubble) {
        const wob = Math.sin(Date.now() / 200) * 2;
        ctx.save();
        ctx.beginPath(); ctx.arc(player.x, player.y, 27 + wob, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170,230,255,0.15)'; ctx.fill();
        ctx.strokeStyle = 'rgba(200,240,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(player.x - 9, player.y - 11, 5, 0, Math.PI * 2);   // shine
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
        ctx.restore();
    }
}

// Draws the player's square with the chosen skin style (also used for shop previews)
function drawAvatar(x, y, size, color, style) {
    const h = size / 2, k = size / 32;
    if (style === 'dragon') {
        // Little wings behind the body
        const flap = Math.sin(Date.now() / 150) * 4 * k;
        ctx.fillStyle = '#2E8B3E';
        for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(x + side * h, y - 6 * k);
            ctx.lineTo(x + side * (h + 12 * k), y - 14 * k - flap);
            ctx.lineTo(x + side * (h + 8 * k), y + 6 * k);
            ctx.closePath(); ctx.fill();
        }
    }
    ctx.fillStyle = color;
    ctx.fillRect(x - h, y - h, size, size);
    ctx.shadowBlur = 0;
    // Light from the top-left, shadow at the bottom-right — makes the square look solid
    const shade = ctx.createLinearGradient(x - h, y - h, x + h, y + h);
    shade.addColorStop(0, 'rgba(255,255,255,0.35)'); shade.addColorStop(0.5, 'rgba(255,255,255,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = shade; ctx.fillRect(x - h, y - h, size, size);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1, k);
    ctx.strokeRect(x - h, y - h, size, size);
    if (style === 'ninja') {
        ctx.fillStyle = '#DD2222';                                   // headband + tails
        ctx.fillRect(x - h, y - 12 * k, size, 5 * k);
        ctx.beginPath();
        ctx.moveTo(x + h, y - 11 * k); ctx.lineTo(x + h + 9 * k, y - 16 * k); ctx.lineTo(x + h + 7 * k, y - 8 * k);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FFFFFF';                                   // eyes through the mask slit
        ctx.fillRect(x - 10 * k, y - 4 * k, 6 * k, 3 * k);
        ctx.fillRect(x + 4 * k,  y - 4 * k, 6 * k, 3 * k);
    } else if (style === 'robot') {
        ctx.strokeStyle = '#666'; ctx.lineWidth = 2 * k;             // antenna
        ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x, y - h - 8 * k); ctx.stroke();
        ctx.fillStyle = Math.floor(Date.now() / 400) % 2 ? '#FF3333' : '#FFAAAA';
        ctx.beginPath(); ctx.arc(x, y - h - 9 * k, 3 * k, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#113';                                      // visor
        ctx.fillRect(x - 12 * k, y - 10 * k, 24 * k, 9 * k);
        ctx.fillStyle = '#33EEFF';
        ctx.fillRect(x - 9 * k, y - 8 * k, 5 * k, 5 * k);
        ctx.fillRect(x + 4 * k, y - 8 * k, 5 * k, 5 * k);
        ctx.fillStyle = '#555';                                      // mouth grill
        for (let i = -1; i <= 1; i++) ctx.fillRect(x + i * 5 * k - 1.5 * k, y + 5 * k, 3 * k, 6 * k);
    } else if (style === 'dragon') {
        ctx.fillStyle = '#FFAA22';                                   // head spikes
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(x + i * 9 * k - 4 * k, y - h); ctx.lineTo(x + i * 9 * k, y - h - 8 * k); ctx.lineTo(x + i * 9 * k + 4 * k, y - h);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#FFEE33';                                   // eyes with slit pupils
        ctx.fillRect(x - 10 * k, y - 8 * k, 6 * k, 6 * k);
        ctx.fillRect(x + 4 * k,  y - 8 * k, 6 * k, 6 * k);
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 8 * k, y - 8 * k, 2 * k, 6 * k);
        ctx.fillRect(x + 6 * k, y - 8 * k, 2 * k, 6 * k);
        ctx.fillRect(x - 5 * k, y + 6 * k, 2 * k, 2 * k);            // nostrils
        ctx.fillRect(x + 3 * k, y + 6 * k, 2 * k, 2 * k);
    } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 9 * k, y - 7 * k, 5 * k, 5 * k);
        ctx.fillRect(x + 4 * k, y - 7 * k, 5 * k, 5 * k);
    }
}

// Draws a pet (also used for the shop previews). s = size scale, face = 1 left / -1 right
function drawPetShape(id, x, y, s = 1, face = 1) {
    const t = Date.now();
    ctx.save();
    ctx.translate(x, y); ctx.scale(s * face, s);
    if (id === 'puppy') {
        ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 3;   // wagging tail
        ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(15, -7 + Math.sin(t / 60) * 4); ctx.stroke();
        ctx.fillStyle = '#C8904A';
        ctx.beginPath(); ctx.ellipse(2, 0, 10, 7, 0, 0, Math.PI * 2); ctx.fill();   // body
        ctx.fillRect(-6, 4, 3, 5); ctx.fillRect(6, 4, 3, 5);                       // legs
        ctx.beginPath(); ctx.arc(-9, -6, 7, 0, Math.PI * 2); ctx.fill();            // head
        ctx.fillStyle = '#6B3E1E';
        ctx.beginPath(); ctx.ellipse(-12, -8, 3, 6, 0.4, 0, Math.PI * 2); ctx.ellipse(-5, -9, 3, 6, -0.4, 0, Math.PI * 2); ctx.fill();   // floppy ears
        ctx.fillStyle = '#000';
        ctx.fillRect(-11, -8, 2, 2); ctx.beginPath(); ctx.arc(-15, -5, 1.8, 0, Math.PI * 2); ctx.fill();   // eye + nose
    } else if (id === 'kitten') {
        ctx.strokeStyle = '#E07A1A'; ctx.lineWidth = 3;   // curly tail
        ctx.beginPath(); ctx.moveTo(9, 0); ctx.quadraticCurveTo(18, -4, 14, -12 + Math.sin(t / 150) * 2); ctx.stroke();
        ctx.fillStyle = '#FF9933';
        ctx.beginPath(); ctx.ellipse(2, 1, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(-5, 4, 3, 5); ctx.fillRect(5, 4, 3, 5);
        ctx.beginPath(); ctx.arc(-8, -5, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(-13, -15); ctx.lineTo(-9, -10); ctx.moveTo(-7, -10); ctx.lineTo(-3, -15); ctx.lineTo(-2, -8); ctx.fill();   // ears
        ctx.fillStyle = '#000'; ctx.fillRect(-11, -7, 2, 2); ctx.fillRect(-6, -7, 2, 2);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 0.8;   // whiskers
        ctx.beginPath(); ctx.moveTo(-10, -3); ctx.lineTo(-17, -4); ctx.moveTo(-10, -2); ctx.lineTo(-17, -1); ctx.stroke();
    } else if (id === 'owl') {
        const flap = Math.sin(t / 90) * 5;
        ctx.translate(0, Math.sin(t / 300) * 2 - 6);   // hovers
        ctx.fillStyle = '#7A5A3A';
        ctx.beginPath(); ctx.moveTo(-7, -2); ctx.lineTo(-16, -6 - flap); ctx.lineTo(-8, 6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(7, -2); ctx.lineTo(16, -6 - flap); ctx.lineTo(8, 6); ctx.fill();
        ctx.fillStyle = '#9A7A5A';
        ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(-7, -14); ctx.lineTo(-3, -10); ctx.moveTo(8, -8); ctx.lineTo(7, -14); ctx.lineTo(3, -10); ctx.fill();   // ear tufts
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(-4, -4, 4, 0, Math.PI * 2); ctx.arc(4, -4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-4, -4, 2, 0, Math.PI * 2); ctx.arc(4, -4, 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA22';
        ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(2, 0); ctx.lineTo(0, 4); ctx.fill();   // beak
    } else if (id === 'dragon') {
        const flap = Math.sin(t / 100) * 4;
        ctx.fillStyle = '#2E8B3E';
        ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(8, -16 - flap); ctx.lineTo(12, -3); ctx.fill();   // wing
        ctx.strokeStyle = '#44BB55'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(9, 2); ctx.quadraticCurveTo(16, 4, 18, -2); ctx.stroke();           // tail
        ctx.fillStyle = '#44BB55';
        ctx.beginPath(); ctx.ellipse(2, 1, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFCC66';
        ctx.beginPath(); ctx.ellipse(1, 4, 6, 3, 0, 0, Math.PI * 2); ctx.fill();                        // belly
        ctx.fillStyle = '#44BB55';
        ctx.beginPath(); ctx.arc(-9, -5, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFAA22';
        ctx.beginPath(); ctx.moveTo(-10, -11); ctx.lineTo(-8, -16); ctx.lineTo(-6, -11); ctx.fill();    // horn
        ctx.fillStyle = '#FFEE33'; ctx.fillRect(-12, -7, 3, 3);
        ctx.fillStyle = '#000'; ctx.fillRect(-11, -7, 1, 3);
    }
    ctx.restore();
}

function drawPet() {
    if (state.activePet < 0 || state.gamePhase !== 'playing') return;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(pet.x, pet.y + 10, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    drawPetShape(PETS[state.activePet].id, pet.x, pet.y, 1, pet.face);
}

// ── DRAW: PROJECTILES ─────────────────────────────────────────
function drawProjectiles() {
    for (const p of projectiles) {
        ctx.save();
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// Zig-zag chain-lightning bolts
function drawBolts() {
    for (const b of bolts) {
        ctx.save();
        ctx.globalAlpha = b.life / 12;
        ctx.strokeStyle = Math.random() < 0.5 ? '#FFFFFF' : '#FFE033';
        ctx.shadowColor = '#FFE033'; ctx.shadowBlur = 14; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
        const len = Math.hypot(b.x2 - b.x1, b.y2 - b.y1) || 1;
        const nx = -(b.y2 - b.y1) / len, ny = (b.x2 - b.x1) / len;
        for (let k = 1; k < 6; k++) {
            const j = (Math.random() - 0.5) * 18;
            ctx.lineTo(b.x1 + (b.x2 - b.x1) * k / 6 + nx * j, b.y1 + (b.y2 - b.y1) * k / 6 + ny * j);
        }
        ctx.lineTo(b.x2, b.y2); ctx.stroke();
        ctx.restore();
    }
}

function drawHeartPickups() {
    for (const h of heartPickups) {
        if (h.life < 120 && Math.floor(Date.now() / 120) % 2) continue;   // blinks before vanishing
        ctx.save();
        ctx.font = '18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FF3355'; ctx.shadowColor = '#FF3355'; ctx.shadowBlur = 10;
        ctx.fillText('❤', h.x, h.y + Math.sin(Date.now() / 200 + h.x) * 3);
        ctx.restore();
    }
}

function drawEnemyProjectiles() {
    for (const p of enemyProjectiles) {
        ctx.save();
        ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

// ── DRAW: PARTICLES ───────────────────────────────────────────
function drawParticles() {
    for (const p of particles) {
        const a = p.life / p.maxLife;
        ctx.save();
        ctx.globalAlpha = a;
        if (p.confetti) {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.cw / 2, -p.ch / 2, p.cw, p.ch);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.r * a), 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }
}

function drawFloatTexts() {
    for (const f of floatTexts) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, f.life / 20);
        ctx.fillStyle = f.color; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
    }
}

// ── DRAW: HUD ─────────────────────────────────────────────────
function drawHUD() {
    // Taller HUD when ammo bar is shown
    const hudH = (state.power !== POWER.NONE && state.room !== ROOM.VOID) ? 68 : 46;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, 800, hudH);

    // Light Crystals
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 17px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`Crystals: ${state.lightCrystals}/3`, 14, 28);
    for (let i = 0; i < 3; i++) {
        drawStar(210 + i * 28, 23, i < state.lightCrystals ? 11 : 7,
            i < state.lightCrystals ? '#FFD700' : '#333');
    }

    // HP hearts
    ctx.font = '18px Arial'; ctx.textAlign = 'center';
    let hearts = '';
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    for (let i = 0; i < maxHp; i++) hearts += i < state.playerHp ? '❤' : '♡';
    ctx.fillStyle = '#FF4444';
    ctx.fillText(hearts, 400, 20);

    // Room name + Level
    const names = { void: 'THE VOID', hell: 'HELL', paradise: 'PARADISE ISLAND', secret: '✨ SECRET GOLDEN ROOM ✨', underground: 'UNDERGROUND CAVES' };
    const cfg    = LEVEL_CONFIGS[state.level - 1];
    const lvlLabel = cfg.isBoss ? `LEVEL ${state.level} — BOSS!` : `LEVEL ${state.level}`;
    ctx.fillStyle = cfg.isBoss ? 'rgba(255,100,50,0.85)' : 'rgba(255,255,255,0.5)';
    ctx.font = cfg.isBoss ? 'bold 11px Arial' : '11px Arial';
    ctx.fillText(`${names[state.room]} · ${lvlLabel}`, 400, 38);

    // Power
    ctx.fillStyle = state.power === POWER.RAINBOW ? getPlayerColor()
                  : state.power === POWER.NONE    ? '#888' : WEAPON_INFO[state.power].color;
    ctx.font = 'bold 17px Arial'; ctx.textAlign = 'right';
    ctx.fillText(`Power: ${state.power === POWER.NONE ? '' : WEAPON_INFO[state.power].icon + ' '}${powerName()}`, 786, 28);

    // ── AMMO BAR ──────────────────────────────────────────────
    if (state.power !== POWER.NONE && state.room !== ROOM.VOID) {
        const bx = 14, by = 54, bh = 10, bw = 130;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);

        if (state.ammoReloading) {
            const pct = 1 - state.ammoReloadTimer / LEVEL_CONFIGS[state.level - 1].reloadFrames;
            ctx.fillStyle = '#FF8800';
            ctx.fillRect(bx, by, bw * pct, bh);
            ctx.fillStyle = '#FFA500';
            ctx.font = 'bold 9px Arial'; ctx.textAlign = 'left';
            const secsLeft = Math.ceil(state.ammoReloadTimer / 60);
            ctx.fillText(`RELOADING… ${secsLeft}s`, bx + 2, by + bh - 1);
        } else {
            const bulletW = Math.floor(bw / state.ammoMax) - 2;
            for (let i = 0; i < state.ammoMax; i++) {
                ctx.fillStyle = i < state.ammo ? '#4FC3F7' : '#333';
                ctx.fillRect(bx + i * (bulletW + 2), by, bulletW, bh);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '9px Arial'; ctx.textAlign = 'left';
            ctx.fillText(`AMMO ${state.ammo}/${state.ammoMax}`, bx + 2, by + bh - 1);
        }
    }

    // ── COINS ─────────────────────────────────────────────────
    ctx.save();
    ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFAA00'; ctx.shadowBlur = 6;
    ctx.font = 'bold 14px Arial'; ctx.textAlign = 'left';
    ctx.fillText(`🪙 ${state.coins}`, 14, 46);
    ctx.restore();

    // ── SCORE ─────────────────────────────────────────────────
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = 'bold 12px Arial'; ctx.textAlign = 'right';
    ctx.fillText(`Score ${state.score}   ·   Best 🏆 ${highScore}`, 786, 46);

    // ── MUTE BUTTON (M) ───────────────────────────────────────
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    ctx.font = '15px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFF';
    ctx.fillText(muted ? '🔇' : '🔊', MUTE_BTN.x, MUTE_BTN.y + 1);
    ctx.restore();
}

// ── DRAW: RAINBOW BACKGROUND ──────────────────────────────────
function drawRainbowBg() {
    const t    = Date.now() / 2200;
    const grad = ctx.createLinearGradient(0, 0, 800, 600);
    grad.addColorStop(0,    `hsl(${(t * 60)       % 360}, 85%, 12%)`);
    grad.addColorStop(0.25, `hsl(${(t * 60 + 90)  % 360}, 85%, 12%)`);
    grad.addColorStop(0.5,  `hsl(${(t * 60 + 180) % 360}, 85%, 12%)`);
    grad.addColorStop(0.75, `hsl(${(t * 60 + 270) % 360}, 85%, 12%)`);
    grad.addColorStop(1,    `hsl(${(t * 60 + 360) % 360}, 85%, 12%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 600);
}

function drawEndHint() {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillText(lastInput === 'pad' ? 'or press START' : lastInput === 'touch' ? 'tap the button' : 'or press ENTER', 400, 494);
}

function drawScoreLine(y) {

    ctx.fillText(`Score: ${state.score}    Best: ${highScore}`, 400, y);

        ctx.font = 'bold 15px Arial';

}

// ── DRAW: LEVEL COMPLETE ──────────────────────────────────────
function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.60)';
    ctx.fillRect(0, 0, 800, 600);

    const cfg = LEVEL_CONFIGS[state.level - 1];
    ctx.save();
    ctx.shadowColor = '#4FC3F7'; ctx.shadowBlur = 50;
    ctx.fillStyle   = '#4FC3F7';
    ctx.font = 'bold 52px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${state.level} COMPLETE!`, 400, 195);
    ctx.restore();
    drawScoreLine(228);

    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '22px Arial'; ctx.textAlign = 'center';
    const nextCfg = LEVEL_CONFIGS[state.level];   // next level config
    const bossMsg  = nextCfg && nextCfg.isBoss ? '  ⚠ BOSS LEVEL NEXT!' : '';
    ctx.fillText(`Get ready for Level ${state.level + 1}…${bossMsg}`, 400, 282);
    ctx.restore();

    // Difficulty preview
    if (nextCfg) {
        ctx.fillStyle = 'rgba(255,200,100,0.8)';
        ctx.font = '15px Arial'; ctx.textAlign = 'center';
        const hints = [];
        if (nextCfg.ammoMax < cfg.ammoMax)           hints.push(`Ammo: ${nextCfg.ammoMax} bullets`);
        if (nextCfg.reloadFrames > cfg.reloadFrames) hints.push(`Reload: ${(nextCfg.reloadFrames/60).toFixed(0)}s`);
        if (nextCfg.devilHp > cfg.devilHp)           hints.push(`Boss HP: ${nextCfg.devilHp}`);
        if (nextCfg.playerMaxHp < cfg.playerMaxHp)   hints.push(`Lives: ${nextCfg.playerMaxHp}`);
        if (hints.length) ctx.fillText('Next level: ' + hints.join('  |  '), 400, 312);
    }

    // Orbiting stars
    const t = Date.now() / 300;
    for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + t;
        drawStar(400 + Math.cos(a) * 110, 370 + Math.sin(a) * 42,
            14 + Math.sin(t + i) * 4, '#4FC3F7');
    }

    // Next Level button
    ctx.save();
    ctx.shadowColor = '#4FC3F7'; ctx.shadowBlur = 20;
    ctx.fillStyle   = '#0a2840';
    ctx.fillRect(300, 420, 200, 55);
    ctx.strokeStyle = '#4FC3F7'; ctx.lineWidth = 2;
    ctx.strokeRect(300, 420, 200, 55);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Next Level  ▶', 400, 454);
    ctx.restore();
    drawEndHint();
}
