<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Light of Paradise</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        canvas { display: block; border: 2px solid #333; cursor: pointer; max-width: 100%; max-height: 100vh; height: auto; touch-action: none; }

        #videoOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            transition: opacity 0.9s ease;
        }
        #introVideo {
            max-width: 100%; max-height: 90vh;
            display: block;
        }
        #skipHint {
            position: absolute; bottom: 28px;
            color: rgba(255,255,255,0.5);
            font-size: 13px; font-family: Arial, sans-serif;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 0.5; }
            50%      { opacity: 1;   }
        }
    </style>
</head>
<body>
<div id="videoOverlay">
    <video id="introVideo" src="Light of paradise opening.mp4" autoplay muted playsinline></video>
    <div id="skipHint">Press SPACE, click, or tap to skip</div>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width  = 800;

// ── VIDEO INTRO ───────────────────────────────────────────────
let voidBgColor = '#a0a0a0'; // light grey, darker than the white player

(function setupVideoIntro() {
    const overlay = document.getElementById('videoOverlay');
    const video   = document.getElementById('introVideo');
    let dismissed = false;

    function captureLastFrameColor() {
        try {
            const oc   = document.createElement('canvas');
            oc.width   = video.videoWidth  || 640;
            oc.height  = video.videoHeight || 360;
            const octx = oc.getContext('2d');
            octx.drawImage(video, 0, 0, oc.width, oc.height);
            // Sample a 5×5 grid across the frame
            let r = 0, g = 0, b = 0, n = 0;
            for (let sx = 0.1; sx <= 0.95; sx += 0.2) {
                for (let sy = 0.1; sy <= 0.95; sy += 0.2) {
                    const d = octx.getImageData(
                        Math.floor(sx * oc.width),
                        Math.floor(sy * oc.height), 1, 1).data;
                    r += d[0]; g += d[1]; b += d[2]; n++;
                }
            }
            // Darken the average so it works as a subtle game background
            r = Math.floor(r / n * 0.32);
            g = Math.floor(g / n * 0.32);
            b = Math.floor(b / n * 0.32);
            voidBgColor = `rgb(${r},${g},${b})`;
        } catch (e) { /* keep default if CORS/decode fails */ }
    }

    function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.style.opacity = '0';
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    }

    video.addEventListener('ended',   dismiss);
    overlay.addEventListener('click',      dismiss);
    overlay.addEventListener('touchstart', e => { e.preventDefault(); dismiss(); }, { passive: false });
    document.addEventListener('keydown', function onKey(e) {
        if (e.code === 'Space') { e.preventDefault(); dismiss(); document.removeEventListener('keydown', onKey); }
    });

    // Fallback: if video fails to load/play, still dismiss after a short wait
    video.addEventListener('error', () => setTimeout(dismiss, 100));
})();

// ── STATE ────────────────────────────────────────────────────
let state = {
    room:               ROOM.VOID,
    lightCrystals:      0,
    power:              POWER.NONE,
    powerTier:          1,         // 1 normal · 2 super · 3 rainbow (deeper digs = higher tier)
    won:                false,
    levelComplete:      false,     // true when current level beaten (but more levels remain)
    screenShake:        0,
    playerFlash:        0,
    gamePhase:          'intro',   // 'intro' | 'playing'
    playerHp:           3,
    playerInvincible:   0,
    confettiSpawned:    false,
    paradiseClearCount: 0,         // how many crystals collected (0–3)
    voidHealTimer:      0,         // counts frames toward next +1 HP heal in Void
    // Level / progression
    level:              1,
    // Ammo
    ammo:               5,
    ammoMax:            5,
    ammoReloading:      false,
    ammoReloadTimer:    0,
    // Cave timer
    caveTimer:          0,
    caveProtectionExpired: false,
    // Coins & shop
    coins:              0,
    shopOpen:           false,
    shopCursor:         0,         // highlighted shop item (for controllers)
    unlockedSkins:      [true, ...Array(AVATAR_COLORS.length - 1).fill(false)],
    activeSkin:         0,
    bubble:             false,     // Shield Bubble from the shop — blocks one hit
    // Paradise Island town
    job:                null,      // current job from the Mayor (a copy of a JOBS entry + progress)
    houseOwned:         false,
    ammoBonus:          0,         // extra ammo from the Blacksmith
    // Pets
    ownedPets:          PETS.map(() => false),
    activePet:          -1,        // index into PETS, -1 = no pet
    // Score
    score:              0,
    newBest:            false,     // beat the high score this game
};

// ── PLAYER ───────────────────────────────────────────────────
const player = { x: 400, y: 300, w: 32, h: 32 };

// ── INPUT ────────────────────────────────────────────────────
// Keyboard, mouse, touch and game controllers all end up calling the same few actions.
const keys = {};

// Shop layout (shared by drawing and by tap / click hit-testing)
const SHOP       = { X: 110, Y: 150, W: 580, H: 300 };
const SHOP_SLOTS = 13;                                       // 0-7 skins, 8 Shield Bubble, 9-12 pets
const SHOP_CLOSE = { x: SHOP.X + SHOP.W - 20, y: SHOP.Y + 20, r: 13 };
const SHOP_BTN   = { x: 340, y: 392, w: 120, h: 32 };        // on-screen SHOP button in the Void
const END_BTN    = { x: 300, y: 420, w: 200, h: 55 };        // Next Level / Play Again button

function shopSlotRect(i) {
    if (i < 8) {
        const cx = SHOP.X + 46 + i * 70, cy = SHOP.Y + 118;
        return { x: cx - 26, y: cy - 26, w: 52, h: 70, cx, cy };
    }
    const j = i - 8, x = SHOP.X + 22 + j * 108;
    return { x, y: SHOP.Y + 180, w: 100, h: 106, cx: x + 50, cy: SHOP.Y + 212 };
}

// Arrow keys / D-pad in the shop: left-right along a row, up-down between rows
function moveShopCursor(dx, dy) {
    let c = state.shopCursor;
    const top = c < 8;
    if (dx) c = top ? (c + dx + 8) % 8 : 8 + ((c - 8 + dx + 5) % 5);
    if (dy > 0 && top)  c = 8 + Math.round(c * 4 / 7);
    if (dy < 0 && !top) c = Math.round((c - 8) * 7 / 4);
    state.shopCursor = c;
}

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function canOpenShop() {
    return state.gamePhase === 'playing' && state.room === ROOM.VOID && !state.won && !state.levelComplete;
}
function toggleShop() {
    if (state.shopOpen) state.shopOpen = false;
    else if (canOpenShop()) state.shopOpen = true;
}

// Buy or wear a shop item: 0-7 skins, 8 Shield Bubble, 9-12 pets
function shopSelect(i) {
    state.shopCursor = i;
    if (i >= 9) {
        const j = i - 9;
        if (state.ownedPets[j]) {
            state.activePet = j;
        } else if (state.coins >= PETS[j].cost) {
            state.coins -= PETS[j].cost;
            state.ownedPets[j] = true;
            state.activePet = j;
            placePetBesidePlayer();
            spawnParticles(player.x, player.y, '#FFD700', 10);
            sfx('win');
        }
        return;
    }
    if (i === 8) {
        if (!state.bubble && state.coins >= BUBBLE_COST) {
            state.coins -= BUBBLE_COST;
            state.bubble = true;
            sfx('buy');
        }
        return;
    }
    if (state.unlockedSkins[i]) {
        state.activeSkin = i;
    } else if (state.coins >= AVATAR_UNLOCK_COST[i]) {
        state.coins -= AVATAR_UNLOCK_COST[i];
        state.unlockedSkins[i] = true;
        state.activeSkin = i;
        spawnParticles(player.x, player.y, AVATAR_COLORS[i], 8);
        sfx('buy');
    }
}

// The main button: Space, A on a controller, or the on-screen SHOOT / DIG button
function pressAction() {
    if (state.gamePhase === 'intro') state.gamePhase = 'playing';
    else if (state.levelComplete)   advanceLevel();
    else if (!tryDig() && !tryTalk()) shoot();
}

// Enter / Start: begin, next level, or play again
function pressStart() {
    if (state.gamePhase === 'intro') state.gamePhase = 'playing';
    else if (state.levelComplete)   advanceLevel();
    else if (state.won)             resetGame();
}

// A tap or click at canvas position (x, y). Returns true if it hit a button.
function handleTap(x, y) {
    if (Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) < MUTE_BTN.r * 1.5) { toggleMute(); return true; }
    if (state.gamePhase === 'intro') { state.gamePhase = 'playing'; return true; }
    if ((state.won || state.levelComplete) && inRect(x, y, END_BTN)) { pressStart(); return true; }
    if (state.shopOpen) {
        if (Math.hypot(x - SHOP_CLOSE.x, y - SHOP_CLOSE.y) < SHOP_CLOSE.r * 1.6) { state.shopOpen = false; return true; }
        for (let i = 0; i < SHOP_SLOTS; i++) {
            if (inRect(x, y, shopSlotRect(i))) { shopSelect(i); return true; }
        }
        return inRect(x, y, { x: SHOP.X, y: SHOP.Y, w: SHOP.W, h: SHOP.H });   // taps on the panel do nothing else
    }
    if (canOpenShop() && inRect(x, y, SHOP_BTN)) { state.shopOpen = true; return true; }
    return false;
}

document.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    lastInput = 'keyboard';
    if (e.code === 'KeyM') toggleMute();
    if (state.shopOpen) {
        const nav = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
                      ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] }[e.code];
        if (nav) { e.preventDefault(); moveShopCursor(nav[0], nav[1]); }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); shopSelect(state.shopCursor); }
    } else {
        if (e.code === 'Space') { e.preventDefault(); pressAction(); }
        if (e.code === 'Enter') pressStart();
    }
    if (e.code === 'KeyE' || (e.code === 'Escape' && state.shopOpen)) toggleShop();
    // Number keys in the shop: 1-8 skins, 9 Shield Bubble
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit && state.shopOpen) shopSelect(Number(digit[1]) - 1);
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
    initAudio();
    const p = canvasPos(e.clientX, e.clientY);
    handleTap(p.x, p.y);
});

// ── GAME CONTROLLER (Xbox, PlayStation, Switch Pro… anything the browser maps as "standard") ──
const PAD = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, LT: 6, RT: 7, BACK: 8, START: 9, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const PAD_DEADZONE    = 0.3;   // ignore tiny stick wobbles
const PAD_AUTOFIRE    = 10;    // frames between shots while A is held
let   lastInput       = 'keyboard';   // 'keyboard' | 'touch' | 'pad' — picks which hints to show
let   padPrev         = [];
let   padHold         = 0;
const padMove         = { x: 0, y: 0 };

function pollGamepad() {
    padMove.x = padMove.y = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(pads).find(p => p && p.connected);
    if (!gp) { padPrev = []; return; }
    const held = gp.buttons.map(b => b.pressed);
    const was  = padPrev;
    padPrev = held;
    const pressed = i => held[i] && !was[i];
    if (held.some(Boolean) || Math.abs(gp.axes[0] || 0) > 0.5 || Math.abs(gp.axes[1] || 0) > 0.5) {
        lastInput = 'pad';
        initAudio();
    }

    if (pressed(PAD.BACK))  toggleMute();
    if (pressed(PAD.START)) pressStart();
    if (pressed(PAD.Y) || (state.shopOpen && pressed(PAD.B))) toggleShop();

    if (state.shopOpen) {
        // D-pad / stick flicks move the shop cursor; A buys
        if (pressed(PAD.LEFT))  moveShopCursor(-1, 0);
        if (pressed(PAD.RIGHT)) moveShopCursor(1, 0);
        if (pressed(PAD.UP))    moveShopCursor(0, -1);
        if (pressed(PAD.DOWN))  moveShopCursor(0, 1);
        if (pressed(PAD.A))     shopSelect(state.shopCursor);
        return;
    }

    const fire = held[PAD.A] || held[PAD.RT];
    if (pressed(PAD.A) || pressed(PAD.RT)) { pressAction(); padHold = 0; }
    else if (fire && state.gamePhase === 'playing' && !state.won && !state.levelComplete && ++padHold % PAD_AUTOFIRE === 0) {
        pressAction();
    }

    let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (Math.abs(x) < PAD_DEADZONE) x = 0;
    if (Math.abs(y) < PAD_DEADZONE) y = 0;
    if (held[PAD.LEFT])  x = -1;
    if (held[PAD.RIGHT]) x = 1;
    if (held[PAD.UP])    y = -1;
    if (held[PAD.DOWN])  y = 1;
    padMove.x = x; padMove.y = y;
}

window.addEventListener('gamepadconnected', () => {
    lastInput = 'pad';
    spawnFloatText(400, 300, '🎮 Controller connected!', '#FFFFFF', 150);
});

// ── VIRTUAL TOUCH CONTROLS ────────────────────────────────────
let isTouchDevice = false;
const VJOY   = { x: 100, y: 490, baseR: 55, maxDist: 40 };
const VSHOOT = { x: 700, y: 490, r: 45 };
const TOUCH_AREA_MULTIPLIER  = 1.5;  // expand tap hit area beyond visible radius
const JOYSTICK_DEADZONE_RATIO = 0.2; // fraction of maxDist before movement starts
const vTouch = { joyId: null, joyDX: 0, joyDY: 0, joyOriX: 0, joyOriY: 0, shootId: null };

function canvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width  / rect.width),
        y: (clientY - rect.top)  * (canvas.height / rect.height),
    };
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    isTouchDevice = true;
    initAudio();
    lastInput = 'touch';
    for (const t of e.changedTouches) {
        const p = canvasPos(t.clientX, t.clientY);
        if (handleTap(p.x, p.y)) continue;
        if (vTouch.joyId === null && Math.hypot(p.x - VJOY.x, p.y - VJOY.y) < VJOY.baseR * TOUCH_AREA_MULTIPLIER) {
            vTouch.joyId = t.identifier; vTouch.joyOriX = p.x; vTouch.joyOriY = p.y;
            vTouch.joyDX = 0; vTouch.joyDY = 0;
        } else if (vTouch.shootId === null && Math.hypot(p.x - VSHOOT.x, p.y - VSHOOT.y) < VSHOOT.r * TOUCH_AREA_MULTIPLIER) {
            vTouch.shootId = t.identifier;
            pressAction();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== vTouch.joyId) continue;
        const p = canvasPos(t.clientX, t.clientY);
        const rawDX = p.x - vTouch.joyOriX, rawDY = p.y - vTouch.joyOriY;
        const dist = Math.hypot(rawDX, rawDY);
        const clamped = Math.min(dist, VJOY.maxDist);
        vTouch.joyDX = dist > 0 ? (rawDX / dist) * clamped : 0;
        vTouch.joyDY = dist > 0 ? (rawDY / dist) * clamped : 0;
    }
}, { passive: false });

function clearTouchId(id) {
    if (id === vTouch.joyId)   { vTouch.joyId = null; vTouch.joyDX = 0; vTouch.joyDY = 0; }
    if (id === vTouch.shootId) { vTouch.shootId = null; }
}
canvas.addEventListener('touchend',    e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); for (const t of e.changedTouches) clearTouchId(t.identifier); }, { passive: false });

function makeDigSpots() {
    // One of each weapon, shuffled so every visit is a surprise
    const loot = [POWER.ICE, POWER.BRIMSTONE, POWER.LIGHTNING, POWER.WATER];
    for (let i = loot.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [loot[i], loot[j]] = [loot[j], loot[i]];
    }
    return DIG_SPOTS.map((s, i) => ({ x: s.x, y: s.y, hits: 0, depth: 0, weapon: loot[i] }));
}

function inAnyCave(x, y, pad = 0) {
    return HELL_CAVES.some(c => x >= c.x - pad && x <= c.x + c.w + pad && y >= c.y - pad && y <= c.y + c.h + pad);
}

function makeWorms() {
    const list = [];
    const n = LEVEL_CONFIGS[state.level - 1].worms;
    while (list.length < n) {
        const x = 80 + Math.random() * 640, y = 90 + Math.random() * 460;
        if (inAnyCave(x, y, 20) || Math.hypot(x - 100, y - 300) < 180) continue;   // not in caves, not on the entrance
        list.push({ type: 'worm', x, y, r: 15, hp: 3, maxHp: 3, alive: true, hitFlash: 0, frozen: 0,
                    hidden: true, wState: 'under', wTimer: WORM_UNDER_FRAMES * (0.5 + Math.random()), spit: WORM_SPIT_FRAMES });
    }
    return list;
}

let audioCtx = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;

function initAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx   = new AC();
    masterGain = audioCtx.createGain(); masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
    musicGain  = audioCtx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(masterGain);
    sfxGain    = audioCtx.createGain(); sfxGain.gain.value   = 0.6;  sfxGain.connect(masterGain);
    noiseBuf   = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('lop_muted', muted ? '1' : '0'); } catch (e) {}
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

// One beep: frequency (Hz), length (s), wave shape, volume, optional slide to another pitch
function tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0, dest = sfxGain) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + Math.max(0, delay);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.02);
}

// A burst of static (for crunches and explosions)
function noise(dur, vol = 0.2, filterFreq = 1200) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = filterFreq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t0); src.stop(t0 + dur);
}

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Schedules the next few notes a little ahead of time so the music never stutters
function musicTick() {
    if (!audioCtx || muted) return;
    const playing = state.gamePhase === 'playing' && !state.won && !state.levelComplete;
    const songKey = state.room === ROOM.PARADISE && paradise.phase !== 'day' ? 'night' : state.room;
    const song = playing ? SONGS[songKey] : null;
    if (!song) { musicRoom = null; return; }
    const now = audioCtx.currentTime;
    if (songKey !== musicRoom || nextNoteTime < now - 0.1) {
        musicRoom = songKey; musicStep = 0; nextNoteTime = now + 0.05;
    }
    const stepDur = 60 / song.bpm / 2;
    while (nextNoteTime < now + 0.2) {
        const i = musicStep % song.melody.length, delay = nextNoteTime - now;
        if (song.melody[i]) tone(midiToFreq(song.melody[i]), stepDur * 0.9, song.lead, 0.07, null, delay, musicGain);
        if (song.bass[i])   tone(midiToFreq(song.bass[i]),   stepDur * 1.8, 'triangle', 0.16, null, delay, musicGain);
        nextNoteTime += stepDur; musicStep++;
    }
}
setInterval(musicTick, 50);

    if (state.room !== ROOM.HELL) return false;
    if (state.caveProtectionExpired) return false;
    return HELL_CAVES.some(c =>
        player.x >= c.x && player.x <= c.x + c.w &&
        player.y >= c.y && player.y <= c.y + c.h
    );
}

}

function allMonstersDefeated() {
    return paradise.enemies.every(e => !e.alive);
}

function getPlayerColor() {
    if (state.playerFlash > 0) return '#FFFF00';
    if (state.power === POWER.RAINBOW)   return `hsl(${(Date.now() / 5) % 360}, 100%, 60%)`;
    if (state.power !== POWER.NONE)      return WEAPON_INFO[state.power].color;
    return AVATAR_COLORS[state.activeSkin];
}

function damagePlayer() {
    if (state.playerInvincible > 0) return;
    if (state.bubble) {
        // Shield Bubble pops instead of losing a heart
        state.bubble = false;
        state.playerInvincible = 60;
        spawnParticles(player.x, player.y, '#AEE8FF', 12);
        spawnFloatText(player.x, player.y - 30, 'POP!', '#AEE8FF');
        sfx('pop');
        return;
    }
    sfx('hurt');
    state.playerHp--;
    state.playerInvincible = 90;
    triggerShake(14);
    spawnParticles(player.x, player.y, '#FF4444', 8);
    if (state.playerHp <= 0) respawnPlayer();
}

function respawnPlayer() {
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    state.power           = POWER.NONE;
    state.powerTier       = 1;
    state.playerHp        = maxHp;
    state.playerInvincible = 120;
    changeRoom(ROOM.VOID);
}

function resetGame() {
    const cfg = LEVEL_CONFIGS[0];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'intro', playerHp: cfg.playerMaxHp, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        level: 1,
        ammo: cfg.ammoMax, ammoMax: cfg.ammoMax, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        coins: 0, shopOpen: false,
        unlockedSkins: [true, ...Array(AVATAR_COLORS.length - 1).fill(false)], activeSkin: 0,
        bubble: false, score: 0, newBest: false,
        job: null, houseOwned: false, ammoBonus: 0,
        ownedPets: PETS.map(() => false), activePet: -1,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

function advanceLevel() {
    if (state.level >= MAX_LEVELS) {
        // True final win — game complete
        state.won = true;
        state.levelComplete = false;
        if (!state.confettiSpawned) { state.confettiSpawned = true; spawnConfetti(); }
        return;
    }
    state.level++;
    const cfg = LEVEL_CONFIGS[state.level - 1];
    Object.assign(state, {
        room: ROOM.VOID, lightCrystals: 0, power: POWER.NONE, powerTier: 1,
        won: false, levelComplete: false, screenShake: 0, playerFlash: 0,
        gamePhase: 'playing', playerHp: cfg.playerMaxHp, playerInvincible: 0,
        confettiSpawned: false, paradiseClearCount: 0, voidHealTimer: 0,
        ammo: cfg.ammoMax + state.ammoBonus, ammoMax: cfg.ammoMax + state.ammoBonus, ammoReloading: false, ammoReloadTimer: 0,
        caveTimer: 0, caveProtectionExpired: false,
        shopOpen: false, job: null,
    });
    player.x = 400; player.y = 300;
    hell             = makeHell();
    paradise         = makeParadise();
    voidRoom         = makeVoidRoom();
    projectiles      = [];
    enemyProjectiles = [];
    particles        = [];
    floatTexts       = [];
    heartPickups     = [];
    bolts            = [];
}

// ── ROOM CHANGE ───────────────────────────────────────────────
function respawnParadiseWave() {
    const night = state.paradiseClearCount + 1;
    paradise.enemies = paradise.enemies.filter(e => !e.temp);   // King Slime's little slimes
    for (const e of paradise.enemies) {
        Object.assign(e, { alive: (e.minNight || 1) <= night, hp: e.maxHp, hitFlash: 0, hopTimer: 0, frozen: 0,
                           x: e.home.x, y: e.home.y, dx: e.home.dx, dy: e.home.dy });
    }
}

function changeRoom(dest) {
    if (state.gamePhase === 'playing') sfx('portal');
    state.room = dest;
    state.shopOpen = false;   // close shop when changing rooms
    projectiles      = [];
    enemyProjectiles = [];
    heartPickups     = [];
    bolts            = [];
    if (dest === ROOM.VOID)     { player.x = 400; player.y = 300; }
    if (dest === ROOM.HELL)     {
        player.x = 100; player.y = 300;
        // Weapons are buried again (in new places) each visit
        hell.digSpots = makeDigSpots();
        hell.foundMsg = null;
        hell.enemies  = makeWorms();
        hell.summonTimer = IMP_SUMMON_FRAMES;
    }
    if (dest === ROOM.PARADISE) {
        player.x = 700; player.y = 300;
    }
    if (dest === ROOM.SECRET)      { player.x = 400; player.y = 420; secretRoom = makeSecretRoom(); }
    if (dest === ROOM.UNDERGROUND) { player.x = 100; player.y = 300; underground = makeUnderground(); }
    goldenPortal = MAIN_ROOMS.includes(dest) && Math.random() < SECRET_PORTAL_CHANCE
        ? { ...GOLDEN_PORTAL_SPOTS[dest] } : null;
    placePetBesidePlayer();
}

// ── UPDATE: PLAYER ────────────────────────────────────────────
function updatePlayer() {
    if (state.won || state.levelComplete || state.gamePhase !== 'playing') return;

    const spd = state.room === ROOM.PARADISE ? BASE_SPEED * 1.2 : BASE_SPEED;
    let dx = 0, dy = 0;
    if (!state.shopOpen) {
        if (keys['ArrowLeft']  || keys['KeyA']) dx -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
        if (keys['ArrowUp']    || keys['KeyW']) dy -= 1;
        if (keys['ArrowDown']  || keys['KeyS']) dy += 1;
        // Virtual joystick
        const deadzone = VJOY.maxDist * JOYSTICK_DEADZONE_RATIO;
        if (vTouch.joyDX < -deadzone) dx -= 1;
        if (vTouch.joyDX >  deadzone) dx += 1;
        if (vTouch.joyDY < -deadzone) dy -= 1;
        if (vTouch.joyDY >  deadzone) dy += 1;
        // Controller stick (analog — push a little to walk slowly)
        dx += padMove.x; dy += padMove.y;
    }
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }   // diagonals aren't faster
    dx *= spd; dy *= spd;

    player.x = Math.max(18, Math.min(canvas.width  - 18, player.x + dx));
    player.y = Math.max(52, Math.min(canvas.height - 18, player.y + dy));

    for (const p of PORTALS[state.room]) {
        if (Math.hypot(player.x - p.x, player.y - p.y) < PORTAL_R * 0.75) {
            changeRoom(randomDoorDestination());
            return;
        }
    }
    if (goldenPortal && Math.hypot(player.x - goldenPortal.x, player.y - goldenPortal.y) < PORTAL_R * 0.75) {
        sfx('win');
        changeRoom(ROOM.SECRET);
        return;
    }
    // A dig spot dug to the bottom becomes a tunnel (step off it first, then jump in)
    if (state.room === ROOM.HELL) {
        for (const s of hell.digSpots) {
            if (s.depth < DIG_MAX_DEPTH) continue;
            const d = Math.hypot(player.x - s.x, player.y - s.y);
            if (d > 30) s.tunnelReady = true;
            else if (s.tunnelReady && d < 14) { changeRoom(ROOM.UNDERGROUND); return; }
        }
    }

    if (state.playerFlash     > 0) state.playerFlash--;
    if (state.playerInvincible > 0) state.playerInvincible--;

    // ── CAVE TIMER ─────────────────────────────────────────────
    if (isPlayerPhysicallyInCave()) {
        state.caveTimer++;
        if (state.caveTimer >= CAVE_MAX_FRAMES) {
            state.caveProtectionExpired = true;
        }
    } else {
        // Reset when player leaves the cave
        if (state.caveTimer > 0) {
            state.caveTimer = 0;
            state.caveProtectionExpired = false;
        }
    }

    // Brimstone spark trail
    if (state.power === POWER.BRIMSTONE && Math.random() < 0.5) {
        particles.push({
            x: player.x + (Math.random() - 0.5) * 14,
            y: player.y + (Math.random() - 0.5) * 14,
            dx: (Math.random() - 0.5) * 1.5,
            dy: (Math.random() - 0.5) * 1.5,
            life: 14, maxLife: 14,
            color: Math.random() < 0.5 ? '#FF4422' : '#FF8800',
            r: 2 + Math.random() * 2,
        });
    }
}

// ── UPDATE: ENEMIES ───────────────────────────────────────────
function weaponDamage(power, enemyType) {
    if (power === POWER.RAINBOW || ENEMY_TYPES[enemyType].weakTo === power) return DAMAGE_STRONG;
    return DAMAGE_WEAK;
}

// Your weapon shields you from the bad guys it's strong against (never the Devil)
function isShieldedAgainst(enemyType) {
    if (state.power === POWER.NONE || !ENEMY_TYPES[enemyType]) return false;
    return weaponDamage(state.power, enemyType) === DAMAGE_STRONG;
}

// Hurts a bad guy; returns true if it was defeated
function hitEnemy(e, power) {
    const dmg = weaponDamage(power, e.type);
    e.hp -= dmg;
    e.hitFlash = 8;
    spawnFloatText(e.x, e.y - e.r - 8, dmg === DAMAGE_STRONG ? `-${dmg} SUPER HIT!` : `-${dmg}`,
                   dmg === DAMAGE_STRONG ? '#FFEE44' : '#FFFFFF');
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, dmg === DAMAGE_STRONG ? 10 : 4);
    if (e.hp > 0) { sfx(dmg === DAMAGE_STRONG ? 'superHit' : 'hit'); return false; }
    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 16);
    triggerShake();
    sfx('defeat');
    addScore(e.type === 'mole' ? 15 : 10);
    return true;
}

// The bad guys in the room you're in
function roomEnemies() {
    if (state.room === ROOM.PARADISE) return paradise.phase === 'night' && state.lightCrystals < 3 ? paradise.enemies : [];
    if (state.room === ROOM.HELL)        return hell.enemies;
    if (state.room === ROOM.UNDERGROUND) return underground.enemies;
    return [];
}

// Bad guys you can shoot right now (not defeated, not still climbing out of the ground)
function targetableEnemies() {
    return roomEnemies().filter(e => e.alive && !(e.emerge > 0) && !e.hidden);
}

function roomCoins() {
    if (state.room === ROOM.PARADISE) return paradise.coins;
    if (state.room === ROOM.HELL)        return hell.coins;
    if (state.room === ROOM.UNDERGROUND) return underground.coins;
    return voidRoom.coins;
}

// Reward for beating a bad guy: a coin, and sometimes a heart
function dropLoot(e) {
    const count = e.coinDrop || COINS_PER_KILL;
    for (let i = 0; i < count; i++) {
        roomCoins().push({
            x: Math.max(30, Math.min(770, e.x + (Math.random() - 0.5) * 16 * count)),
            y: Math.max(70, Math.min(570, e.y + (Math.random() - 0.5) * 16 * count)),
            picked: false,
        });
    }
    if (Math.random() < HEART_DROP_CHANCE) heartPickups.push({ x: e.x + 12, y: e.y, life: 600 });
}

// Every hit knocks little slimes off the King Slime
function kingSplit(k, count) {
    for (let i = 0; i < count; i++) {
        if (paradise.enemies.filter(e => e.temp && e.alive).length >= KING_MAX_MINIS) return;
        const a = Math.random() * Math.PI * 2;
        const m = makeEnemy('slime', k.x + Math.cos(a) * k.r, k.y + Math.sin(a) * k.r, Math.cos(a) * 4, Math.sin(a) * 4);
        Object.assign(m, { r: 10, hp: 1, maxHp: 1, temp: true, hopTimer: 40, coinDrop: 1 });
        paradise.enemies.push(m);
    }
}

// Hit a bad guy with a weapon: damage, freeze (ICE), chain (LIGHTNING), loot when defeated
function damageEnemy(e, power, chained = false) {
    // Pick the lightning jump targets before anything dies
    const jumps = power === POWER.LIGHTNING && !chained
        ? targetableEnemies()
            .filter(o => o !== e && Math.hypot(o.x - e.x, o.y - e.y) < CHAIN_RANGE)
            .sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))
            .slice(0, CHAIN_JUMPS)
        : [];

    if (hitEnemy(e, power)) {
        e.alive = false;
        dropLoot(e);
    } else if (power === POWER.ICE) {
        if (!e.frozen) sfx('freeze');
        e.frozen = FREEZE_FRAMES;
    }

    if (e.type === 'king') kingSplit(e, e.alive ? 1 : 3);

    let from = e;
    for (const o of jumps) {
        bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, life: 12 });
        from = o;
        damageEnemy(o, power, true);
    }
    if (jumps.length) sfx('zap');
}

// The Devil calls in Mini-Devils to help him
function updateDevilMinions() {
    const d = hell.devil;
    if (state.room !== ROOM.HELL || !d.alive || d.frozen > 0) return;
    if (--hell.summonTimer > 0) return;
    hell.summonTimer = IMP_SUMMON_FRAMES;
    const imps = hell.enemies.filter(e => e.type === 'imp' && e.alive).length;
    if (imps >= LEVEL_CONFIGS[state.level - 1].maxImps) return;
    hell.enemies.push({ type: 'imp', x: d.x + (Math.random() - 0.5) * 60, y: d.y + d.r + 10, r: 11, hp: 3, maxHp: 3,
                        alive: true, hitFlash: 0, frozen: 0, emerge: 30, dx: 0, dy: 0 });
    spawnParticles(d.x, d.y + d.r, '#FF2200', 12);
    spawnFloatText(d.x, d.y - d.r - 20, 'COME, MY MINIONS!', '#FF4444', 80);
    if (Date.now() - lastDevilLaugh > 3000) { lastDevilLaugh = Date.now(); sfx('laugh'); }
}

// Moves every bad guy in the room and hurts the player on touch
function updateRoomEnemies() {
    for (const e of roomEnemies()) {
        if (!e.alive) continue;
        if (e.emerge > 0) {
            e.emerge--;
            if (Math.random() < 0.4) spawnParticles(e.x, e.y + 8, '#6B3E1E', 1);
            continue;
        }
        if (e.hitFlash > 0) e.hitFlash--;
        if (e.frozen > 0) { e.frozen--; continue; }   // frozen solid: can't move or hurt you
        moveEnemy(e);
        if (!e.hidden && state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
            Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
            damagePlayer();
        }
    }
    // Defeated bad guys in Hell and the Underground don't come back
    hell.enemies        = hell.enemies.filter(e => e.alive);
    underground.enemies = underground.enemies.filter(e => e.alive);
}

function moveEnemy(e) {
    if (e.type === 'worm') {
        if (--e.wTimer <= 0) {
            if (e.wState === 'under')      { e.wState = 'rising'; e.wTimer = WORM_RISE_FRAMES; }
            else if (e.wState === 'rising') { e.wState = 'up'; e.wTimer = WORM_UP_FRAMES; e.hidden = false; e.spit = 30;
                                              spawnParticles(e.x, e.y, '#FF6600', 12); sfx('worm'); }
            else                            { e.wState = 'under'; e.wTimer = WORM_UNDER_FRAMES; e.hidden = true;
                                              spawnParticles(e.x, e.y, '#6B3E1E', 8); }
        }
        if (e.wState === 'under') {
            // Tunnels toward the player — but never into the caves
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            const nx = e.x + Math.cos(a) * 1.2, ny = e.y + Math.sin(a) * 1.2;
            if (state.room !== ROOM.HELL || !inAnyCave(nx, ny, 20)) { e.x = nx; e.y = ny; }
            if (Math.random() < 0.3) spawnParticles(e.x, e.y + 6, '#6B3E1E', 1);
        } else if (e.wState === 'up' && --e.spit <= 0) {
            e.spit = WORM_SPIT_FRAMES;
            if (!isPlayerInCave()) {
                const a = Math.atan2(player.y - e.y, player.x - e.x);
                enemyProjectiles.push({ x: e.x, y: e.y - 14, dx: Math.cos(a) * 4, dy: Math.sin(a) * 4,
                                        color: '#FF5500', life: 120, r: 6, enemyType: 'worm' });
            }
        }
        return;   // worms don't bounce around
    }
    if (e.type === 'imp') {
        if (isPlayerInCave()) {
            // Can't see you in the cave — flutters about
            e.x += e.dx; e.y += e.dy;
            if (Math.random() < 0.02) { const a = Math.random() * Math.PI * 2; e.dx = Math.cos(a) * 1.2; e.dy = Math.sin(a) * 1.2; }
        } else {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(a) * 1.8; e.y += Math.sin(a) * 1.8;
        }
    } else if (e.type === 'mole') {
        // Chases the player — even inside caves (they live underground!)
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed;
        e.y += Math.sin(a) * e.speed;
    } else if (e.type === 'fire') {
        e.x += e.dx; e.y += e.dy;
    } else if (e.type === 'ghost') {
        // Drifts slowly toward the player
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * 0.5 + e.dx * 0.25;
        e.y += Math.sin(a) * 0.5 + e.dy * 0.25;
    } else if (e.type === 'bat') {
        // Fast and flappy — zig-zags up and down
        e.x += e.dx;
        e.y += e.dy + Math.sin(Date.now() / 120 + e.home.x) * 1.8;
    } else if (e.type === 'slime' || e.type === 'king') {
        // Sits still, then hops toward the player (the King is slower and heavier)
        if (--e.hopTimer <= 0) {
            const king = e.type === 'king';
            e.hopTimer = king ? 100 : 70;
            sfx(king ? 'bigBoing' : 'boing');
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.dx = Math.cos(a) * (king ? 3 : 4); e.dy = Math.sin(a) * (king ? 3 : 4);
        }
        e.x += e.dx; e.y += e.dy;
        e.dx *= 0.92; e.dy *= 0.92;
    }
    if (e.x < 60 || e.x > 740) e.dx *= -1;
    if (e.y < 60 || e.y > 540) e.dy *= -1;
    e.x = Math.max(40, Math.min(760, e.x));
    e.y = Math.max(60, Math.min(560, e.y));
}

function updateEnemies() {
    if (state.won || state.levelComplete) return;

    // ── VOID enemies ──────────────────────────────────────────
    if (state.room === ROOM.VOID) {
        for (const e of voidRoom.enemies) {
            e.x += e.dx; e.y += e.dy;
            if (e.x < 60 || e.x > 740) e.dx *= -1;
            if (e.y < 60 || e.y > 540) e.dy *= -1;
            // Contact damage (shielded by matching power)
            if (state.playerInvincible === 0 && !isShieldedAgainst(e.type) &&
                Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
                damagePlayer();
            }
            // Shoot at player periodically
            e.shootTimer--;
            if (e.shootTimer <= 0) {
                e.shootTimer = 100 + Math.floor(Math.random() * 60);
                const a = Math.atan2(player.y - e.y, player.x - e.x);
                enemyProjectiles.push({
                    x: e.x, y: e.y,
                    dx: Math.cos(a) * 3.5, dy: Math.sin(a) * 3.5,
                    color: e.type === 'fire' ? '#FF6600' : '#CC88FF',
                    life: 140, r: 6,
                    enemyType: e.type,
                });
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        // After all 3 crystals are collected paradise is peaceful — no more enemies
        if (state.lightCrystals >= 3) return;

        // Show only the current night's chest once all the monsters are beaten
        if (paradise.phase === 'night' && allMonstersDefeated() && state.paradiseClearCount < 3) {
            paradise.chests[state.paradiseClearCount].visible = true;
        }
    }

    if (state.room === ROOM.HELL) {
        const d = hell.devil;
        if (!d.alive) return;
        if (d.shieldFlash > 0) d.shieldFlash--;
        if (d.frozen > 0) { d.frozen--; return; }   // frozen by ICE

        const cfg = LEVEL_CONFIGS[state.level - 1];

        if (d.telegraphTimer > 0) {
            // Frozen while telegraphing
            d.telegraphTimer--;
            if (d.telegraphTimer === 0 && d.isAboutToShoot) {
                // Only fire if the player is still visible (not hiding in a cave)
                if (!isPlayerInCave()) {
                    const a = Math.atan2(player.y - d.y, player.x - d.x);
                    const shotsPerFire = cfg.devilShotsPerFire;
                    const spreadAngle = shotsPerFire > 1 ? 0.25 : 0;
                    for (let s = 0; s < shotsPerFire; s++) {
                        const offset = shotsPerFire > 1 ? (s - (shotsPerFire - 1) / 2) * spreadAngle : 0;
                        enemyProjectiles.push({
                            x: d.x, y: d.y,
                            dx: Math.cos(a + offset) * DEVIL_BULLET_SPEED, dy: Math.sin(a + offset) * DEVIL_BULLET_SPEED,
                            color: '#FF6600', life: 130, r: cfg.isBoss ? 9 : 7,
                        });
                    }
                    // Scary laugh — not every shot, or it gets annoying
                    if (Date.now() - lastDevilLaugh > 6000) { lastDevilLaugh = Date.now(); sfx('laugh'); }
                }
                d.isAboutToShoot = false;
            }
        } else {
            const inCave = isPlayerInCave();

            if (inCave) {
                d.aiState = 'WANDER';
                if (d.wanderWaitTimer > 0) {
                    d.wanderWaitTimer--;
                } else {
                    const dist = Math.hypot(d.wanderTarget.x - d.x, d.wanderTarget.y - d.y);
                    if (dist < 14) {
                        // Arrived — telegraph, then pick new spot after wait
                        d.telegraphTimer  = 30;
                        d.wanderWaitTimer = 120; // 2 s
                        d.wanderTarget = {
                            x: 80 + Math.random() * 640,
                            y: 80 + Math.random() * 440,
                        };
                    } else {
                        const a = Math.atan2(d.wanderTarget.y - d.y, d.wanderTarget.x - d.x);
                        d.x = Math.max(50, Math.min(750, d.x + Math.cos(a) * 1.6));
                        d.y = Math.max(50, Math.min(550, d.y + Math.sin(a) * 1.6));
                    }
                }
            } else {
                d.aiState = 'CHASE';
                const a = Math.atan2(player.y - d.y, player.x - d.x);
                d.x = Math.max(60, Math.min(740, d.x + Math.cos(a) * cfg.devilSpeed));
                d.y = Math.max(60, Math.min(540, d.y + Math.sin(a) * cfg.devilSpeed));
                if (state.playerInvincible === 0 &&
                    Math.hypot(d.x - player.x, d.y - player.y) < d.r + 16) {
                    damagePlayer();
                }

                // Periodic shooting — only while player is visible (CHASE mode)
                d.shootTimer--;
                if (d.shootTimer <= 0) {
                    d.shootTimer     = cfg.devilShootRate;
                    d.telegraphTimer = 30;
                    d.isAboutToShoot = true;
                }
            }
        }
    }
}

// ── UPDATE: ENEMY PROJECTILES ─────────────────────────────────
function updateEnemyProjectiles() {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const p = enemyProjectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            enemyProjectiles.splice(i, 1); continue;
        }
        if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + 16) {
            if (!isShieldedAgainst(p.enemyType)) {
                if (state.playerInvincible === 0) damagePlayer();
            }
            // Blocked projectiles vanish with a small spark
            spawnParticles(p.x, p.y, p.color, 4);
            enemyProjectiles.splice(i, 1);
        }
    }
}

// ── UPDATE: SHOOTING ──────────────────────────────────────────
function shoot() {
    if (state.won || state.levelComplete || state.power === POWER.NONE || state.room === ROOM.VOID) return;
    if (state.ammoReloading || state.ammo <= 0) return;

    const enemies = [];
    enemies.push(...targetableEnemies());
    if (state.room === ROOM.HELL && hell.devil.alive) enemies.push(hell.devil);
    if (!enemies.length) return;

    const target = enemies.reduce((best, e) => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        return d < best.dist ? { en: e, dist: d } : best;
    }, { en: null, dist: Infinity }).en;

    if (!target) return;
    const a = Math.atan2(target.y - player.y, target.x - player.x);
    const w     = WEAPON_INFO[state.power];
    const color = state.power === POWER.RAINBOW ? `hsl(${Math.random() * 360}, 100%, 60%)` : w.color;
    // SUPER and RAINBOW weapons fire 3 shots in a spread for the same ammo
    const spread = state.powerTier >= 2 ? [-0.2, 0, 0.2] : [0];
    for (const off of spread) {
        projectiles.push({ x: player.x, y: player.y, dx: Math.cos(a + off) * w.speed, dy: Math.sin(a + off) * w.speed,
            color, power: state.power, life: 90, r: w.size });
    }

    sfx('shoot');
    state.ammo--;
    if (state.ammo <= 0) {
        state.ammoReloading = true;
        state.ammoReloadTimer = LEVEL_CONFIGS[state.level - 1].reloadFrames;
    }
}

// ── UPDATE: AMMO RELOAD ───────────────────────────────────────
function updateAmmo() {
    if (!state.ammoReloading) return;
    state.ammoReloadTimer--;
    if (state.ammoReloadTimer <= 0) {
        state.ammoReloading  = false;
        state.ammo           = state.ammoMax;
    }
}

// ── UPDATE: PROJECTILES & HITS ────────────────────────────────
function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.dx; p.y += p.dy;
        p.life--;
        if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) {
            projectiles.splice(i, 1); continue;
        }

        let hit = false;

        for (const e of targetableEnemies()) {
            if (Math.hypot(p.x - e.x, p.y - e.y) >= e.r + p.r) continue;
            damageEnemy(e, p.power);
            hit = true; break;
        }

        if (!hit && state.room === ROOM.HELL) {
            const d = hell.devil;
            if (d.alive && Math.hypot(p.x - d.x, p.y - d.y) < d.r + p.r) {
                if (p.power === POWER.ICE) d.frozen = DEVIL_FREEZE_FRAMES;
                if (state.lightCrystals >= 3) {
                    d.hp--;
                    sfx('hit');
                    addScore(5);
                    d.shieldFlash = 15;
                    spawnParticles(d.x, d.y, '#FF4400', 8);
                    triggerShake(8);
                    if (d.hp <= 0) {
                        d.alive = false;
                        sfx('defeat');
                        addScore(100);
                        spawnParticles(d.x, d.y, '#880000', 20);
                        triggerShake(20);
                        if (state.level < MAX_LEVELS) {
                            state.levelComplete = true;
                        } else {
                            state.won = true;
                        }
                    }
                } else {
                    d.shieldFlash = 25;
                    sfx('hit');
                    spawnParticles(d.x, d.y, '#FFFFFF', 6);
                    triggerShake(6);
                }
                hit = true;
            }
        }

        if (hit) projectiles.splice(i, 1);
    }
}

// ── UPDATE: DIGGING ───────────────────────────────────────────
// Returns the dig spot the player is standing on (if it still has layers left)
function nearbyDigSpot() {
    if (state.room !== ROOM.HELL) return null;
    return hell.digSpots.find(s =>
        s.depth < DIG_MAX_DEPTH && Math.hypot(player.x - s.x, player.y - s.y) < DIG_RANGE
    ) || null;
}

// You can't dig while a mole monster is out — Space / the button shoots it instead
function canDig() {
    return !hell.enemies.some(e => e.alive && e.type === 'mole');
}

function powerName(power = state.power, tier = state.powerTier) {
    if (power === POWER.NONE)    return 'None';
    if (power === POWER.RAINBOW) return 'Rainbow';
    return tier >= 2 ? `Super ${power}` : power;
}

function spawnMole(s) {
    // Pops out a little way from the player so it doesn't hit them straight away
    const a = Math.random() * Math.PI * 2;
    hell.enemies.push({
        type: 'mole', x: s.x + Math.cos(a) * 45, y: s.y + Math.sin(a) * 45, alive: true,
        r: 13 + s.depth * 2, hp: s.depth * 2 + 1, maxHp: s.depth * 2 + 1, hitFlash: 0, frozen: 0,
        speed: 0.8 + s.depth * 0.25,
        emerge: 45,   // frames spent climbing out (harmless while emerging)
    });
}

function nearbyGem() {
    if (state.room !== ROOM.UNDERGROUND) return null;
    return underground.gems.find(g => !g.mined && Math.hypot(player.x - g.x, player.y - g.y) < 30) || null;
}

// Mining a gem in the Underground Caves: a few hits, then +1 heart and points
function tryMine() {
    const gem = nearbyGem();
    if (!gem) return false;
    gem.hits++;
    sfx('dig');
    spawnParticles(gem.x, gem.y, gem.color, 5);
    if (gem.hits >= GEM_HITS) {
        gem.mined = true;
        const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
        if (state.playerHp < maxHp) state.playerHp++;
        addScore(50);
        spawnFloatText(gem.x, gem.y - 26, '💎 +50  +1 ❤', gem.color, 90);
        spawnParticles(gem.x, gem.y, gem.color, 16);
        sfx('found');
    }
    return true;
}

// Returns true if the player dug (so Space / the button doesn't also shoot)
function tryDig() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    if (tryMine()) return true;
    const s = nearbyDigSpot();
    if (!s || !canDig()) return false;
    s.hits++;
    sfx('dig');
    spawnParticles(s.x, s.y, '#8B5A2B', 6);
    triggerShake(3);
    if (s.hits < DIG_HITS_PER_LAYER[s.depth]) return true;

    // Broke through a layer!
    s.hits = 0;
    s.depth++;
    const tier   = s.depth;
    const weapon = tier === 3 ? POWER.RAINBOW : s.weapon;
    const color  = WEAPON_INFO[weapon].color;
    const name   = (tier === 2 ? 'SUPER ' : '') + WEAPON_INFO[weapon].label;
    let text;
    if (state.power !== POWER.NONE && tier < state.powerTier) {
        text = `Found ${name} — yours is better!`;
    } else {
        state.power     = weapon;
        state.powerTier = tier;
        state.playerFlash = 25;
        text = tier === 3 ? `LEGENDARY! ${name}!` : tier === 2 ? `RARE! ${name}!` : `You found ${name}!`;
    }
    spawnParticles(s.x, s.y, color, 10 + tier * 6);
    triggerShake(6 + tier * 2);
    sfx('found');
    addScore(5 * tier);

    let sub = s.depth < DIG_MAX_DEPTH ? 'Keep digging for something rarer…' : '';
    if (Math.random() < DIG_MOLE_CHANCE[s.depth - 1]) {
        spawnMole(s);
        sub = 'Look out — a MOLE MONSTER!';
    }
    hell.foundMsg = { text, sub, color, timer: 120 };
    return true;
}

function updateDigging() {
    if (hell.foundMsg && --hell.foundMsg.timer <= 0) hell.foundMsg = null;
}

// ── UPDATE: PET ───────────────────────────────────────────────
const pet = { x: 370, y: 320, cooldown: 0, healTimer: 0, face: 1 };

function placePetBesidePlayer() {
    pet.x = player.x - 28; pet.y = player.y + 16; pet.cooldown = 30;
}

function updatePet() {
    if (state.activePet < 0 || state.gamePhase !== 'playing' || state.won || state.levelComplete) return;
    const info = PETS[state.activePet];
    if (pet.cooldown > 0) pet.cooldown--;

    // Nearest bad guy close to YOU (pets don't wander off across the map)
    let target = null, best = info.range;
    for (const e of targetableEnemies()) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < best) { best = d; target = e; }
    }

    // Where the pet wants to be: next to you, or chasing something
    let goal = { x: player.x - 28 * pet.face, y: player.y + 16 };
    if (info.id === 'puppy') {
        // Fetch! Runs to coins near you and picks them up
        const coin = roomCoins().find(c => !c.picked && Math.hypot(c.x - player.x, c.y - player.y) < 220);
        if (coin) {
            goal = coin;
            if (Math.hypot(coin.x - pet.x, coin.y - pet.y) < 16) { coin.picked = true; collectCoin(); }
        } else if (target) goal = target;
    } else if (info.id === 'kitten' && target) {
        goal = target;
    }

    const dx = goal.x - pet.x, dy = goal.y - pet.y, dist = Math.hypot(dx, dy);
    if (dist > 4) {
        const spd = Math.min(info.speed * (dist > 150 ? 2 : 1), dist);   // hurries to catch up
        pet.x += dx / dist * spd; pet.y += dy / dist * spd;
        if (Math.abs(dx) > 1) pet.face = dx > 0 ? -1 : 1;
    }
    pet.x = Math.max(12, Math.min(788, pet.x));
    pet.y = Math.max(56, Math.min(588, pet.y));

    // Attacks — every pet does a little damage (1), except its own element's strong hits
    if (target && pet.cooldown === 0) {
        if (info.id === 'puppy' || info.id === 'kitten') {
            if (Math.hypot(target.x - pet.x, target.y - pet.y) < target.r + 12) {
                pet.cooldown = info.cooldown;
                spawnParticles(target.x, target.y, '#FFFFFF', 4);
                sfx(info.id === 'puppy' ? 'bark' : 'meow');
                damageEnemy(target, POWER.NONE);
            }
        } else {
            // Owl zaps with lightning feathers, Dragon breathes fireballs
            pet.cooldown = info.cooldown;
            const power = info.id === 'owl' ? POWER.LIGHTNING : POWER.BRIMSTONE;
            const a = Math.atan2(target.y - pet.y, target.x - pet.x);
            projectiles.push({ x: pet.x, y: pet.y, dx: Math.cos(a) * 8, dy: Math.sin(a) * 8,
                               color: WEAPON_INFO[power].color, power, life: 60, r: 5, fromPet: true });
            sfx(info.id === 'owl' ? 'hoot' : 'shoot');
        }
    }

    // The Owl heals you now and then
    if (info.id === 'owl') {
        const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
        if (state.playerHp < maxHp && ++pet.healTimer >= OWL_HEAL_FRAMES) {
            pet.healTimer = 0;
            state.playerHp++;
            spawnFloatText(player.x, player.y - 30, '+1 ❤ from Owl!', '#FF88AA', 70);
            spawnParticles(player.x, player.y, '#FF88AA', 10);
            sfx('buy');
        }
    }
}

// ── UPDATE: PARADISE TOWN ─────────────────────────────────────
function townNpcs() {
    return NPCS.filter(n => n.id === 'home' ? state.houseOwned : n.id === 'seller' ? !state.houseOwned : true);
}

// The townsperson you're standing next to (only in the daytime — at night they hide indoors)
function nearbyNpc() {
    if (state.room !== ROOM.PARADISE || paradise.phase !== 'day') return null;
    return townNpcs().find(n => Math.hypot(player.x - n.x, player.y - n.y) < TALK_RANGE) || null;
}

// What pressing the button will do, shown above the townsperson
function talkLabel(n) {
    const job = state.job, maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    if (job && job.kind === 'deliver' && job.to === n.id) return `Deliver ${job.item}`;
    if (n.id === 'doctor') return state.playerHp < maxHp ? `Heal (🪙${HEAL_COST})` : 'Talk';
    if (n.id === 'smith')  return state.ammoBonus < AMMO_UPGRADE_COST.length ? `+1 Ammo (🪙${AMMO_UPGRADE_COST[state.ammoBonus]})` : 'Talk';
    if (n.id === 'mayor')  return !job ? 'Get a job' : (job.kind === 'apples' && job.got >= job.count) ? 'Get paid!' : 'Talk';
    if (n.id === 'seller') return `Buy house (🪙${HOUSE_COST})`;
    return 'Rest (free heal)';
}

function say(n, text) {
    paradise.speech = { npc: n, text, timer: 170 };
}

function payJob(n) {
    const job = state.job;
    state.coins += job.pay;
    addScore(job.pay * 2);
    spawnFloatText(player.x, player.y - 30, `+🪙${job.pay}`, '#FFD700', 70);
    say(n, `Thank you! Here's 🪙${job.pay}!`);
    state.job = null;
    sfx('buy');
}

function talkTo(n) {
    const job = state.job, maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    if (job && job.kind === 'deliver' && job.to === n.id) { payJob(n); return; }

    if (n.id === 'doctor') {
        if (state.playerHp >= maxHp)       say(n, 'You look healthy to me!');
        else if (state.coins < HEAL_COST)  say(n, `Healing costs 🪙${HEAL_COST}. Come back soon!`);
        else {
            state.coins -= HEAL_COST;
            state.playerHp = maxHp;
            spawnParticles(player.x, player.y, '#FF6688', 12);
            say(n, 'All better! ❤');
            sfx('buy');
        }
    } else if (n.id === 'smith') {
        const cost = AMMO_UPGRADE_COST[state.ammoBonus];
        if (cost === undefined)       say(n, 'Your ammo bag is the biggest there is!');
        else if (state.coins < cost)  say(n, `A bigger ammo bag costs 🪙${cost}.`);
        else {
            state.coins -= cost;
            state.ammoBonus++;
            state.ammoMax++;
            state.ammo = state.ammoMax;
            spawnParticles(player.x, player.y, '#FFAA33', 12);
            say(n, `CLANG! +1 AMMO — now you carry ${state.ammoMax}!`);
            sfx('found');
        }
    } else if (n.id === 'mayor') {
        if (!job) {
            const choices = JOBS.filter(j => !(j.to === 'seller' && state.houseOwned));
            state.job = { ...choices[Math.floor(Math.random() * choices.length)], got: 0 };
            if (state.job.kind === 'apples') {
                paradise.apples = [];
                for (let i = 0; i < state.job.count; i++) {
                    paradise.apples.push({ x: 80 + Math.random() * 640, y: 300 + Math.random() * 150 });
                }
            }
            say(n, `Job: ${state.job.text}! I'll pay 🪙${state.job.pay}.`);
            sfx('coin');
        } else if (job.kind === 'apples' && job.got >= job.count) {
            payJob(n);
        } else {
            say(n, job.kind === 'apples' ? `Apples: ${job.got}/${job.count}. Keep looking!` : `Don't forget: ${job.text}!`);
        }
    } else if (n.id === 'seller') {
        if (state.coins < HOUSE_COST) say(n, `This lovely house costs 🪙${HOUSE_COST}!`);
        else {
            state.coins -= HOUSE_COST;
            state.houseOwned = true;
            addScore(100);
            spawnConfettiAt(560, 360);
            say(NPCS.find(m => m.id === 'home'), 'It\'s YOUR house now! 🏠 Rest here any time.');
            sfx('win');
        }
    } else if (n.id === 'home') {
        state.playerHp = maxHp;
        spawnParticles(player.x, player.y, '#FF6688', 12);
        say(n, 'Zzz… all rested! ❤');
        sfx('buy');
    }
}

// Returns true if the player talked to someone (so the button doesn't also shoot)
function tryTalk() {
    if (state.gamePhase !== 'playing' || state.won || state.levelComplete) return false;
    const n = nearbyNpc();
    if (!n) return false;
    talkTo(n);
    return true;
}

function updateTown() {
    const P = paradise;
    if (P.speech && --P.speech.timer <= 0) P.speech = null;
    if (state.room !== ROOM.PARADISE) return;

    // Apple picking
    if (P.phase === 'day' && state.job && state.job.kind === 'apples') {
        for (let i = P.apples.length - 1; i >= 0; i--) {
            const a = P.apples[i];
            if (Math.hypot(player.x - a.x, player.y - a.y) > 22) continue;
            P.apples.splice(i, 1);
            state.job.got++;
            spawnFloatText(a.x, a.y - 16, `🍎 ${state.job.got}/${state.job.count}`, '#FF6666');
            sfx('coin');
        }
    }

    // Day → dusk → Monster Night (after all 3 crystals, Paradise stays peaceful)
    if (state.lightCrystals >= 3) return;
    if (P.phase === 'day' && --P.timer <= 0) {
        P.phase = 'dusk'; P.timer = DUSK_FRAMES;
        P.speech = null;
        sfx('nightfall');
    } else if (P.phase === 'dusk' && --P.timer <= 0) {
        P.phase = 'night';
        respawnParadiseWave();
        sfx('laugh');
    }
}

// ── UPDATE: PICKUPS ───────────────────────────────────────────
function checkPickups() {
    if (state.won || state.levelComplete) return;

    // Secret Golden Room treasures
    if (state.room === ROOM.SECRET) {
        for (const tr of secretRoom.treasures) {
            if (tr.picked || Math.hypot(player.x - tr.x, player.y - tr.y) > 26) continue;
            tr.picked = true;
            const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
            let text;
            if (tr.kind === 'rainbow') {
                state.power = POWER.RAINBOW; state.powerTier = 3;
                text = '🌈 RAINBOW POWER!';
            } else if (tr.kind === 'heart') {
                state.playerHp = maxHp; state.bubble = true;
                text = '❤ Full hearts + a Shield Bubble!';
            } else if (!state.unlockedSkins[4]) {
                state.unlockedSkins[4] = true; state.activeSkin = 4;
                text = '⭐ You unlocked the GOLD skin!';
            } else {
                addScore(300);
                text = '⭐ +300 points!';
            }
            spawnFloatText(tr.x, tr.y - 30, text, '#FFE066', 120);
            spawnParticles(tr.x, tr.y, '#FFD700', 18);
            triggerShake(6);
            sfx('found');
        }
    }

    // Hearts dropped by bad guys
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        const h = heartPickups[i];
        if (Math.hypot(player.x - h.x, player.y - h.y) > 22) continue;
        heartPickups.splice(i, 1);
        const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
        if (state.playerHp < maxHp) { state.playerHp++; spawnFloatText(player.x, player.y - 28, '+1 ❤', '#FF6688'); }
        else                        { addScore(10);     spawnFloatText(player.x, player.y - 28, '+10',   '#FFFFFF'); }
        spawnParticles(h.x, h.y, '#FF6688', 8);
        sfx('buy');
    }

    if (state.room === ROOM.HELL) {
        // Coins in Hell
        for (const coin of hell.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.PARADISE) {
        const idx = state.paradiseClearCount;
        if (idx < 3) {
            const c = paradise.chests[idx];
            if (!c.opened && c.visible &&
                Math.abs(player.x - c.x) < 28 && Math.abs(player.y - c.y) < 28) {
                c.opened = true;
                sfx('found');
                addScore(50);
                state.lightCrystals++;
                state.paradiseClearCount++;
                state.playerFlash = 35;
                triggerShake(14);
                spawnParticles(c.x, c.y, '#FFD700', 14);
                // Morning comes!
                paradise.phase = 'day';
                paradise.timer = DAY_FRAMES;
            }
        }
        // Coins in Paradise
        for (const coin of paradise.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }

    if (state.room === ROOM.VOID) {
        // Coins in Void
        for (const coin of voidRoom.coins) {
            if (!coin.picked && Math.hypot(player.x - coin.x, player.y - coin.y) < 22) {
                coin.picked = true;
                collectCoin();
            }
        }
    }
}

function collectCoin() {
    state.coins++;
    sfx('coin');
    addScore(1);
    spawnParticles(player.x, player.y, '#FFD700', 5);
}

// ── UPDATE: VOID HEALING ──────────────────────────────────────
function updateVoidHealing() {
    const maxHp = LEVEL_CONFIGS[state.level - 1].playerMaxHp;
    if (state.room !== ROOM.VOID || state.playerHp >= maxHp) {
        state.voidHealTimer = 0;
        return;
    }
    state.voidHealTimer++;
    if (state.voidHealTimer >= 300) {   // 300 frames ≈ 5 seconds at 60 fps
        state.playerHp = Math.min(maxHp, state.playerHp + 1);
        state.voidHealTimer = 0;
        state.playerFlash = 25;
        spawnParticles(player.x, player.y, '#FFD700', 8);
    }
}

// ── UPDATE: PARTICLES ─────────────────────────────────────────
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x  += p.dx; p.y  += p.dy;
        p.dx *= 0.92; p.dy *= 0.92;
        if (p.confetti) {
            p.dy       += 0.09;
            p.rotation += p.rotSpeed;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
        if (--bolts[i].life <= 0) bolts.splice(i, 1);
    }
    for (let i = heartPickups.length - 1; i >= 0; i--) {
        if (--heartPickups[i].life <= 0) heartPickups.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        floatTexts[i].y -= 0.8;
        if (--floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }
}

// ── DRAW HELPERS ──────────────────────────────────────────────
function drawStar(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const b = ((i * 4 + 2) * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(a) * r,          y + Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(b) * (r * 0.4),  y + Math.sin(b) * (r * 0.4));
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawCoins(coinList) {
    const t = Date.now() / 300;
    for (const c of coinList) {
        if (c.picked) continue;
        ctx.save();
        ctx.fillStyle   = '#FFD700';
        ctx.shadowColor = '#FFAA00';
        ctx.shadowBlur  = 8 + Math.sin(t + c.x) * 4;
        ctx.beginPath();
        ctx.arc(c.x, c.y + Math.sin(t + c.x * 0.1) * 3, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF8';
        ctx.beginPath();
        ctx.arc(c.x - 2, c.y - 2 + Math.sin(t + c.x * 0.1) * 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}
